name: Android TeleBirr evidence-only release

on:
  workflow_dispatch:
    inputs:
      deployment_target:
        description: Select the exact protected environment and APK trust target
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      confirm_deployment_target:
        description: Type the selected deployment target again
        required: true
        type: string
      confirm_main_commit_sha:
        description: Type the exact full reviewed main commit SHA
        required: true
        type: string
      phone_mode:
        description: Select no-money rehearsal or paid receipt observation upload (neither credits Players)
        required: true
        default: no_money
        type: choice
        options:
          - no_money
          - paid_observation
      confirm_evidence_only_phone_mode:
        description: Type build-evidence-only-no-money or build-evidence-only-paid-observation for the selected mode
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-telebirr-evidence-release-${{ inputs.deployment_target }}
  cancel-in-progress: false

jobs:
  build-evidence-release:
    name: Build signed evidence-only APK
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ${{ inputs.deployment_target }}
    permissions:
      contents: read
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Require current main and exact evidence-only phone-mode confirmation
        shell: bash
        env:
          DEPLOYMENT_TARGET: ${{ inputs.deployment_target }}
          CONFIRMED_DEPLOYMENT_TARGET: ${{ inputs.confirm_deployment_target }}
          CONFIRMED_MAIN_COMMIT_SHA: ${{ inputs.confirm_main_commit_sha }}
          CONFIRMED_EVIDENCE_ONLY: ${{ inputs.confirm_evidence_only_phone_mode }}
          PHONE_MODE: ${{ inputs.phone_mode }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$DEPLOYMENT_TARGET" == 'staging' || "$DEPLOYMENT_TARGET" == 'production' ]]
          [[ "$CONFIRMED_DEPLOYMENT_TARGET" == "$DEPLOYMENT_TARGET" ]]
          [[ "$CONFIRMED_MAIN_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CONFIRMED_MAIN_COMMIT_SHA" == "$GITHUB_SHA" ]]
          [[ "$PHONE_MODE" == 'no_money' || "$PHONE_MODE" == 'paid_observation' ]]
          if [[ "$PHONE_MODE" == 'paid_observation' ]]; then
            [[ "$DEPLOYMENT_TARGET" == 'production' ]]
            [[ "$CONFIRMED_EVIDENCE_ONLY" == 'build-evidence-only-paid-observation' ]]
          else
            [[ "$CONFIRMED_EVIDENCE_ONLY" == 'build-evidence-only-no-money' ]]
          fi

      - name: Set up Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '8.11.1'

      - name: Decode and verify release-only protected inputs
        id: protected
        shell: bash
        env:
          DEPLOYMENT_TARGET: ${{ inputs.deployment_target }}
          ANDROID_KEY_ALIAS: ${{ vars.ANDROID_TELEBIRR_SIGNING_KEY_ALIAS }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_TELEBIRR_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_TELEBIRR_SIGNING_CERT_SHA256 }}
          ASSIGNMENT_SIGNER_KEY_ID: ${{ vars.TELEBIRR_ASSIGNMENT_SIGNER_KEY_ID }}
          ASSIGNMENT_SIGNER_SPKI_BASE64: ${{ vars.TELEBIRR_ASSIGNMENT_SIGNER_PUBLIC_SPKI_BASE64 }}
          ASSIGNMENT_SIGNER_SPKI_SHA256: ${{ vars.TELEBIRR_ASSIGNMENT_SIGNER_PUBLIC_SPKI_SHA256 }}
          BRIDGE_SIGNER_KEY_ID: ${{ vars.TELEBIRR_BRIDGE_SERVER_SIGNER_KEY_ID }}
          BRIDGE_SIGNER_SPKI_BASE64: ${{ vars.TELEBIRR_BRIDGE_SERVER_SIGNER_PUBLIC_SPKI_BASE64 }}
          BRIDGE_SIGNER_SPKI_SHA256: ${{ vars.TELEBIRR_BRIDGE_SERVER_SIGNER_PUBLIC_SPKI_SHA256 }}
          ROUTINE_RECEIPT_SIGNER_SPKI_BASE64: ${{ vars.TELEBIRR_ROUTINE_RECEIPT_SIGNER_PUBLIC_SPKI_BASE64 }}
          ROUTINE_RECEIPT_SIGNER_SPKI_SHA256: ${{ vars.TELEBIRR_ROUTINE_RECEIPT_SIGNER_PUBLIC_SPKI_SHA256 }}
          ROUTINE_RECEIPT_SIGNER_VALID_FROM: ${{ vars.TELEBIRR_ROUTINE_RECEIPT_SIGNER_VALID_FROM }}
          ROUTINE_RECEIPT_SIGNER_VALID_UNTIL: ${{ vars.TELEBIRR_ROUTINE_RECEIPT_SIGNER_VALID_UNTIL }}
          ROUTINE_LOOKUP_SIGNER_SPKI_BASE64URL: ${{ vars.TELEBIRR_ROUTINE_LOOKUP_SIGNER_PUBLIC_SPKI_BASE64URL }}
          ROUTINE_LOOKUP_SIGNER_SPKI_SHA256: ${{ vars.TELEBIRR_ROUTINE_LOOKUP_SIGNER_PUBLIC_SPKI_SHA256 }}
          ROUTINE_LOOKUP_SIGNER_VALID_FROM: ${{ vars.TELEBIRR_ROUTINE_LOOKUP_SIGNER_VALID_FROM }}
          ROUTINE_LOOKUP_SIGNER_VALID_UNTIL: ${{ vars.TELEBIRR_ROUTINE_LOOKUP_SIGNER_VALID_UNTIL }}
        run: |
          set -euo pipefail
          [[ "$ANDROID_KEY_ALIAS" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{7,127}$ ]]
          [[ "$ANDROID_SIGNING_CERT_SHA256" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$ASSIGNMENT_SIGNER_KEY_ID" =~ ^[A-Za-z0-9][A-Za-z0-9_-]{7,127}$ ]]
          [[ "$BRIDGE_SIGNER_KEY_ID" =~ ^[A-Za-z0-9][A-Za-z0-9_-]{7,127}$ ]]
          [[ "$ASSIGNMENT_SIGNER_KEY_ID" == "telebirr-assignment-$DEPLOYMENT_TARGET-v1" ]]
          [[ "$BRIDGE_SIGNER_KEY_ID" == "telebirr-bridge-$DEPLOYMENT_TARGET-v1" ]]
          [[ "$ASSIGNMENT_SIGNER_KEY_ID" != "$BRIDGE_SIGNER_KEY_ID" ]]
          [[ "$ASSIGNMENT_SIGNER_SPKI_SHA256" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$BRIDGE_SIGNER_SPKI_SHA256" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$ASSIGNMENT_SIGNER_SPKI_SHA256" != "$BRIDGE_SIGNER_SPKI_SHA256" ]]
          [[ "$ROUTINE_RECEIPT_SIGNER_SPKI_SHA256" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$ROUTINE_RECEIPT_SIGNER_SPKI_SHA256" != "$ASSIGNMENT_SIGNER_SPKI_SHA256" ]]
          [[ "$ROUTINE_RECEIPT_SIGNER_SPKI_SHA256" != "$BRIDGE_SIGNER_SPKI_SHA256" ]]
          [[ "$ROUTINE_RECEIPT_SIGNER_VALID_FROM" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z$ ]]
          [[ "$ROUTINE_RECEIPT_SIGNER_VALID_UNTIL" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z$ ]]
          [[ -n "$ANDROID_KEYSTORE_BASE64" ]]

          protected="$RUNNER_TEMP/fetanagent-android-telebirr-evidence"
          [[ ! -e "$protected" && ! -L "$protected" ]]
          umask 077
          install -d -m 0700 "$protected"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$protected/release.p12"
          printf '%s' "$ASSIGNMENT_SIGNER_SPKI_BASE64" | base64 --decode > "$protected/assignment.spki.der"
          printf '%s' "$BRIDGE_SIGNER_SPKI_BASE64" | base64 --decode > "$protected/bridge.spki.der"
          printf '%s' "$ROUTINE_RECEIPT_SIGNER_SPKI_BASE64" | base64 --decode > "$protected/routine-receipt.spki.der"
          if [[ "$DEPLOYMENT_TARGET" == 'production' ]]; then
            [[ "$ROUTINE_LOOKUP_SIGNER_SPKI_SHA256" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ "$ROUTINE_LOOKUP_SIGNER_SPKI_SHA256" != "$ROUTINE_RECEIPT_SIGNER_SPKI_SHA256" ]]
            [[ "$ROUTINE_LOOKUP_SIGNER_SPKI_SHA256" != "$ASSIGNMENT_SIGNER_SPKI_SHA256" ]]
            [[ "$ROUTINE_LOOKUP_SIGNER_SPKI_SHA256" != "$BRIDGE_SIGNER_SPKI_SHA256" ]]
            node --input-type=module --eval '
              import { writeFileSync } from "node:fs";
              const encoded = process.env.ROUTINE_LOOKUP_SIGNER_SPKI_BASE64URL;
              if (!/^[A-Za-z0-9_-]{122}$/u.test(encoded ?? "")) process.exit(1);
              const bytes = Buffer.from(encoded, "base64url");
              if (bytes.length !== 91 || bytes.toString("base64url") !== encoded) process.exit(1);
              writeFileSync(process.argv[1], bytes, { flag: "wx", mode: 0o600 });
            ' "$protected/routine-lookup.spki.der"
          fi
          chmod 0600 "$protected"/*
          [[ -s "$protected/release.p12" ]]
          [[ "$(stat -c %s "$protected/assignment.spki.der")" -eq 91 ]]
          [[ "$(stat -c %s "$protected/bridge.spki.der")" -eq 91 ]]
          [[ "$(stat -c %s "$protected/routine-receipt.spki.der")" -eq 91 ]]
          [[ "sha256:$(sha256sum "$protected/assignment.spki.der" | cut -d ' ' -f 1)" == "$ASSIGNMENT_SIGNER_SPKI_SHA256" ]]
          [[ "sha256:$(sha256sum "$protected/bridge.spki.der" | cut -d ' ' -f 1)" == "$BRIDGE_SIGNER_SPKI_SHA256" ]]
          [[ "sha256:$(sha256sum "$protected/routine-receipt.spki.der" | cut -d ' ' -f 1)" == "$ROUTINE_RECEIPT_SIGNER_SPKI_SHA256" ]]
          if [[ "$DEPLOYMENT_TARGET" == 'production' ]]; then
            [[ "sha256:$(sha256sum "$protected/routine-lookup.spki.der" | cut -d ' ' -f 1)" == "$ROUTINE_LOOKUP_SIGNER_SPKI_SHA256" ]]
          fi
          echo "protected=$protected" >> "$GITHUB_OUTPUT"

      - name: Test, lint, and build the signed evidence-only APK
        working-directory: android/telebirr-verifier
        shell: bash
        env:
          FETANAGENT_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_TELEBIRR_SIGNING_KEY_PASSWORD }}
          FETANAGENT_ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_TELEBIRR_SIGNING_STORE_PASSWORD }}
          ROUTINE_RECEIPT_SIGNER_VALID_FROM: ${{ vars.TELEBIRR_ROUTINE_RECEIPT_SIGNER_VALID_FROM }}
          ROUTINE_RECEIPT_SIGNER_VALID_UNTIL: ${{ vars.TELEBIRR_ROUTINE_RECEIPT_SIGNER_VALID_UNTIL }}
          ROUTINE_LOOKUP_SIGNER_VALID_FROM: ${{ vars.TELEBIRR_ROUTINE_LOOKUP_SIGNER_VALID_FROM }}
          ROUTINE_LOOKUP_SIGNER_VALID_UNTIL: ${{ vars.TELEBIRR_ROUTINE_LOOKUP_SIGNER_VALID_UNTIL }}
          DEPLOYMENT_TARGET: ${{ inputs.deployment_target }}
          PHONE_MODE: ${{ inputs.phone_mode }}
        run: |
          set -euo pipefail
          protected='${{ steps.protected.outputs.protected }}'
          routine_args=()
          if [[ "$DEPLOYMENT_TARGET" == 'production' ]]; then
            routine_args=(
              -PfetanagentRoutineLookupSignerSpkiFile="$protected/routine-lookup.spki.der"
              -PfetanagentRoutineLookupSignerValidFrom="$ROUTINE_LOOKUP_SIGNER_VALID_FROM"
              -PfetanagentRoutineLookupSignerValidUntil="$ROUTINE_LOOKUP_SIGNER_VALID_UNTIL"
            )
          fi
          if [[ "$PHONE_MODE" == 'paid_observation' ]]; then
            routine_args+=( -PfetanagentRoutinePaidPhoneEnabled=true )
          fi
          gradle --no-daemon --stacktrace \
            -PfetanagentVerifierRuntimeMode=evidence_only \
            -PfetanagentVerifierDeploymentTarget='${{ inputs.deployment_target }}' \
            -PfetanagentVerifierServerSignerKeyId='${{ vars.TELEBIRR_BRIDGE_SERVER_SIGNER_KEY_ID }}' \
            -PfetanagentVerifierServerSignerSpkiFile="$protected/bridge.spki.der" \
            -PfetanagentVerifierAssignmentSignerKeyId='${{ vars.TELEBIRR_ASSIGNMENT_SIGNER_KEY_ID }}' \
            -PfetanagentVerifierAssignmentSignerSpkiFile="$protected/assignment.spki.der" \
            -PfetanagentRoutineReceiptSignerSpkiFile="$protected/routine-receipt.spki.der" \
            -PfetanagentRoutineReceiptSignerValidFrom="$ROUTINE_RECEIPT_SIGNER_VALID_FROM" \
            -PfetanagentRoutineReceiptSignerValidUntil="$ROUTINE_RECEIPT_SIGNER_VALID_UNTIL" \
            "${routine_args[@]}" \
            -PfetanagentVerifierSigningStoreFile="$protected/release.p12" \
            -PfetanagentVerifierSigningKeyAlias='${{ vars.ANDROID_TELEBIRR_SIGNING_KEY_ALIAS }}' \
            -PfetanagentVerifierSigningCertSha256='${{ vars.ANDROID_TELEBIRR_SIGNING_CERT_SHA256 }}' \
            clean testDebugUnitTest lintDebug assembleRelease
          test -s app/build/outputs/apk/release/app-release.apk
          test ! -e app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Verify evidence-only bindings, signature, and release digest
        id: artifact
        working-directory: android/telebirr-verifier
        shell: bash
        env:
          DEPLOYMENT_TARGET: ${{ inputs.deployment_target }}
          PHONE_MODE: ${{ inputs.phone_mode }}
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_TELEBIRR_SIGNING_CERT_SHA256 }}
          ASSIGNMENT_SIGNER_KEY_ID: ${{ vars.TELEBIRR_ASSIGNMENT_SIGNER_KEY_ID }}
          BRIDGE_SIGNER_KEY_ID: ${{ vars.TELEBIRR_BRIDGE_SERVER_SIGNER_KEY_ID }}
          ROUTINE_RECEIPT_SIGNER_SPKI_SHA256: ${{ vars.TELEBIRR_ROUTINE_RECEIPT_SIGNER_PUBLIC_SPKI_SHA256 }}
          ROUTINE_LOOKUP_SIGNER_SPKI_SHA256: ${{ vars.TELEBIRR_ROUTINE_LOOKUP_SIGNER_PUBLIC_SPKI_SHA256 }}
        run: |
          set -euo pipefail
          build_config='app/build/generated/source/buildConfig/release/com/fetanagent/telebirrverifier/BuildConfig.java'
          test -f "$build_config"
          grep -Fq 'VERIFIER_ENABLED = true' "$build_config"
          grep -Fq "VERIFIER_DEPLOYMENT_TARGET = \"$DEPLOYMENT_TARGET\"" "$build_config"
          grep -Fq 'VERIFIER_RUNTIME_MODE = "evidence_only"' "$build_config"
          if [[ "$DEPLOYMENT_TARGET" == 'production' ]]; then
            grep -Fq 'ROUTINE_NO_MONEY_ENABLED = true' "$build_config"
            grep -Fq 'ROUTINE_LOOKUP_SIGNER_KEY_ID = "telebirr-routine-lookup-production-v1"' "$build_config"
            grep -Fq "ROUTINE_LOOKUP_SIGNER_PUBLIC_KEY_SPKI_SHA256 = \"$ROUTINE_LOOKUP_SIGNER_SPKI_SHA256\"" "$build_config"
            if [[ "$PHONE_MODE" == 'paid_observation' ]]; then
              grep -Fq 'VERSION_NAME = "0.5.20-routine-paid-burst"' "$build_config"
              grep -Fq 'VERSION_CODE = 25' "$build_config"
              grep -Fq 'ROUTINE_PAID_ENABLED = true' "$build_config"
            else
              grep -Fq 'VERSION_NAME = "0.5.17-routine-no-money"' "$build_config"
              grep -Fq 'ROUTINE_PAID_ENABLED = false' "$build_config"
            fi
          else
            grep -Fq 'VERSION_NAME = "0.5.15-evidence-only"' "$build_config"
            grep -Fq 'ROUTINE_NO_MONEY_ENABLED = false' "$build_config"
            grep -Fq 'ROUTINE_PAID_ENABLED = false' "$build_config"
          fi
          grep -Fq "SERVER_SIGNER_KEY_ID = \"$BRIDGE_SIGNER_KEY_ID\"" "$build_config"
          grep -Fq "ASSIGNMENT_SIGNER_KEY_ID = \"$ASSIGNMENT_SIGNER_KEY_ID\"" "$build_config"
          grep -Fq "ROUTINE_RECEIPT_SIGNER_KEY_ID = \"telebirr-routine-enrollment-$DEPLOYMENT_TARGET-v1\"" "$build_config"
          grep -Fq "ROUTINE_RECEIPT_SIGNER_PUBLIC_KEY_SPKI_SHA256 = \"$ROUTINE_RECEIPT_SIGNER_SPKI_SHA256\"" "$build_config"

          mapfile -t apksigners < <(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V)
          [[ "${#apksigners[@]}" -ge 1 ]]
          apksigner="${apksigners[-1]}"
          certificate_hex="${ANDROID_SIGNING_CERT_SHA256#sha256:}"
          signature_report="$($apksigner verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk)"
          grep -Fq 'Verified using v1 scheme (JAR signing): false' <<<"$signature_report"
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' <<<"$signature_report"
          grep -Fq 'Number of signers: 1' <<<"$signature_report"
          grep -Fqi "V2 Signer: certificate SHA-256 digest: $certificate_hex" <<<"$signature_report"

          artifact_dir="$RUNNER_TEMP/fetanagent-android-telebirr-evidence-artifact"
          [[ ! -e "$artifact_dir" && ! -L "$artifact_dir" ]]
          install -d -m 0700 "$artifact_dir"
          if [[ "$DEPLOYMENT_TARGET" == 'production' ]]; then
            if [[ "$PHONE_MODE" == 'paid_observation' ]]; then
              artifact_name='FetanAgent-TeleBirr-Verifier-0.5.20-production-routine-paid-burst.apk'
            else
              artifact_name='FetanAgent-TeleBirr-Verifier-0.5.17-production-routine-no-money.apk'
            fi
          else
            artifact_name="FetanAgent-TeleBirr-Verifier-0.5.15-$DEPLOYMENT_TARGET-evidence-only.apk"
          fi
          install -m 0600 app/build/outputs/apk/release/app-release.apk "$artifact_dir/$artifact_name"
          (
            cd "$artifact_dir"
            sha256sum "$artifact_name" > "$artifact_name.sha256"
          )
          echo "artifact_dir=$artifact_dir" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo 'Signed evidence-only APK verified. Settlement, execution, and money movement remain disabled.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed evidence-only release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fetanagent-telebirr-${{ inputs.deployment_target }}-evidence-only-${{ github.sha }}
          path: |
            ${{ steps.artifact.outputs.artifact_dir }}/${{ steps.artifact.outputs.artifact_name }}
            ${{ steps.artifact.outputs.artifact_dir }}/${{ steps.artifact.outputs.artifact_name }}.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Remove runner-local protected material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for candidate in \
            "$RUNNER_TEMP/fetanagent-android-telebirr-evidence" \
            "$RUNNER_TEMP/fetanagent-android-telebirr-evidence-artifact"; do
            if [[ -e "$candidate" || -L "$candidate" ]]; then
              [[ -d "$candidate" && ! -L "$candidate" ]]
              [[ "$(realpath -- "$candidate")" == "$candidate" ]]
              rm -f -- "$candidate"/*
              rmdir -- "$candidate"
            fi
          done
