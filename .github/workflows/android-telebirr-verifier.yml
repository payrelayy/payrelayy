name: Android TeleBirr verifier

on:
  pull_request:
    paths:
      - android/telebirr-verifier/**
      - .github/workflows/android-telebirr-verifier.yml
  push:
    branches:
      - main
    paths:
      - android/telebirr-verifier/**
      - .github/workflows/android-telebirr-verifier.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-telebirr-verifier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit test and assemble inert APK
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '8.11.1'

      - name: Verify protocols, encrypted queue, and APK assembly
        working-directory: android/telebirr-verifier
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Prove the CI artifact remains inert
        working-directory: android/telebirr-verifier
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'buildConfigField("boolean", "VERIFIER_ENABLED", "false")' app/build.gradle.kts
          grep -Fq 'versionName = "0.3.0-device-bridge-inert"' app/build.gradle.kts
          ! grep -R -E '(https://|service_role|SUPABASE_|DATABASE_URL)' app/src/main --include='*.kt' --include='*.xml'
