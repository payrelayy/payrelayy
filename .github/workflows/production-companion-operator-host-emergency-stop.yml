name: Stop and inspect production companion operator host

on:
  workflow_dispatch:
    inputs:
      confirm_main_commit_sha:
        description: Exact reviewed main commit
        required: true
        type: string
      confirm_operation:
        description: Type STOP LEFTOVER COMPANION OPERATOR HOST
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fetanagent-production-companion-operator-session
  cancel-in-progress: false

jobs:
  stop:
    name: Stop only the existing protected operator host
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: production
    permissions:
      contents: read
      actions: read
    env:
      CONFIRMED_COMMIT: ${{ inputs.confirm_main_commit_sha }}
      CONFIRMED_OPERATION: ${{ inputs.confirm_operation }}
    steps:
      - name: Check out exact main without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Require exact passing main and stop-only operation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$CONFIRMED_COMMIT" == "$GITHUB_SHA" ]]
          [[ "$CONFIRMED_OPERATION" == 'STOP LEFTOVER COMPANION OPERATOR HOST' ]]
          node infra/operations/require-production-ci.mjs

      - name: Stop and inspect exact protected host without a request
        shell: bash
        env:
          PRODUCTION_VM_HOST: ${{ secrets.PRODUCTION_VM_HOST }}
          PRODUCTION_VM_KNOWN_HOSTS: ${{ secrets.PRODUCTION_VM_KNOWN_HOSTS }}
          PRODUCTION_VM_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_VM_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$PRODUCTION_VM_HOST" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]
          [[ -n "$PRODUCTION_VM_KNOWN_HOSTS" && -n "$PRODUCTION_VM_SSH_PRIVATE_KEY" ]]
          revision="$(sed -nE 's/^  PRODUCTION_OPERATOR_IMAGE_REVISION: ([0-9a-f]{40})$/\1/p' \
            .github/workflows/production-companion-operator-session.yml)"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          protected="$RUNNER_TEMP/production-companion-operator-host-emergency-stop"
          install -d -m 0700 "$protected"
          cleanup() {
            local status=$?
            trap - EXIT
            if [[ -d "$protected" && ! -L "$protected" &&
                  "$(realpath -- "$protected")" == "$protected" ]]; then
              rm -f -- "$protected/deploy-key" "$protected/known-hosts"
              rmdir -- "$protected" || status=1
            else
              status=1
            fi
            exit "$status"
          }
          trap cleanup EXIT
          printf '%s\n' "$PRODUCTION_VM_SSH_PRIVATE_KEY" >"$protected/deploy-key"
          printf '%s\n' "$PRODUCTION_VM_KNOWN_HOSTS" >"$protected/known-hosts"
          chmod 0600 "$protected/deploy-key" "$protected/known-hosts"
          ssh-keygen -y -f "$protected/deploy-key" >/dev/null
          ssh-keygen -F "$PRODUCTION_VM_HOST" -f "$protected/known-hosts" >/dev/null
          ssh_opts=(-F /dev/null -i "$protected/deploy-key" -o BatchMode=yes
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$protected/known-hosts"
            -o ConnectTimeout=8 -o ConnectionAttempts=1
            -o ServerAliveInterval=5 -o ServerAliveCountMax=1)
          remote="fetanagent-admin@$PRODUCTION_VM_HOST"
          launcher='/usr/local/sbin/fetanagent-production-operator-host-launch'
          timeout --signal=TERM --kill-after=5s 45s ssh "${ssh_opts[@]}" "$remote" \
            "sudo -n '$launcher' stop '$revision'" \
            | grep -Fx 'protected_operator_listener_stopped' >/dev/null
          ssh "${ssh_opts[@]}" "$remote" \
            "sudo -n '$launcher' inspect '$revision'" \
            | grep -Fx 'protected_operator_image_ready_dormant' >/dev/null
          echo 'The exact operator host is stopped and dormant. No request, job, approval, or financial switch was changed.' >>"$GITHUB_STEP_SUMMARY"
