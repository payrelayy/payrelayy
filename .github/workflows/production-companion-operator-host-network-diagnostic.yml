name: Diagnose production companion operator host network

on:
  workflow_dispatch:
    inputs:
      confirm_main_commit_sha:
        description: Exact reviewed main commit
        required: true
        type: string
      confirm_operation:
        description: Type DIAGNOSE COMPANION OPERATOR HOST NETWORK
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fetanagent-production-companion-operator-host-network-diagnostic
  cancel-in-progress: false

jobs:
  inspect:
    name: Read-only direct database TCP probe from operator VM
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: production
    permissions:
      contents: read
      actions: read
    env:
      CONFIRMED_COMMIT: ${{ inputs.confirm_main_commit_sha }}
      CONFIRMED_OPERATION: ${{ inputs.confirm_operation }}
    steps:
      - name: Check out exact main without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Require exact passing main and read-only operation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$CONFIRMED_COMMIT" == "$GITHUB_SHA" ]]
          [[ "$CONFIRMED_OPERATION" == 'DIAGNOSE COMPANION OPERATOR HOST NETWORK' ]]
          node infra/operations/require-production-ci.mjs

      - name: Probe DNS, TCP, and PostgreSQL TLS without credentials or SQL
        shell: bash
        env:
          PRODUCTION_VM_HOST: ${{ secrets.PRODUCTION_VM_HOST }}
          PRODUCTION_VM_KNOWN_HOSTS: ${{ secrets.PRODUCTION_VM_KNOWN_HOSTS }}
          PRODUCTION_VM_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_VM_SSH_PRIVATE_KEY }}
          SUPABASE_CA_CERTIFICATE_PEM: ${{ secrets.SUPABASE_CA_CERTIFICATE_PEM }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$PRODUCTION_VM_HOST" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]
          [[ -n "$PRODUCTION_VM_KNOWN_HOSTS" && -n "$PRODUCTION_VM_SSH_PRIVATE_KEY" &&
            -n "$SUPABASE_CA_CERTIFICATE_PEM" ]]
          direct_host="$(sed -nE "s/^const DIRECT_HOST = '([^']+)';$/\1/p" \
            packages/agent-platform-companion-operator-host/src/launch-document.ts)"
          [[ "$direct_host" =~ ^db\.[a-z0-9]{20}\.supabase\.co$ ]]
          protected="$RUNNER_TEMP/production-companion-operator-host-network"
          install -d -m 0700 "$protected"
          cleanup() {
            local status=$?
            trap - EXIT
            if [[ -d "$protected" && ! -L "$protected" &&
                  "$(realpath -- "$protected")" == "$protected" ]]; then
              rm -f -- "$protected/deploy-key" "$protected/known-hosts"
              rmdir -- "$protected" || status=1
            else
              status=1
            fi
            exit "$status"
          }
          trap cleanup EXIT
          printf '%s\n' "$PRODUCTION_VM_SSH_PRIVATE_KEY" >"$protected/deploy-key"
          printf '%s\n' "$PRODUCTION_VM_KNOWN_HOSTS" >"$protected/known-hosts"
          chmod 0600 "$protected/deploy-key" "$protected/known-hosts"
          ssh-keygen -y -f "$protected/deploy-key" >/dev/null
          ssh-keygen -F "$PRODUCTION_VM_HOST" -f "$protected/known-hosts" >/dev/null
          ssh_opts=(-F /dev/null -i "$protected/deploy-key" -o BatchMode=yes
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$protected/known-hosts"
            -o ConnectTimeout=8 -o ConnectionAttempts=1)
          if ! result="$({
            printf 'host = "%s"\n' "$direct_host"
            printf 'import base64\nca_pem = base64.b64decode("%s").decode("ascii")\n' \
              "$(printf '%s' "$SUPABASE_CA_CERTIFICATE_PEM" | base64 -w0)"
            cat infra/operations/probe-protected-host-network.py
          } | timeout 20s ssh "${ssh_opts[@]}" \
            "fetanagent-admin@$PRODUCTION_VM_HOST" 'python3 -' 2>/dev/null)"; then
            echo '::error::Read-only protected host network probe unavailable.' >&2
            exit 1
          fi
          [[ "$(printf '%s\n' "$result" | wc -l)" -eq 4 ]]
          grep -Eq '^dns_a=(present|absent)$' <<<"$result"
          grep -Eq '^dns_aaaa=(present|absent)$' <<<"$result"
          grep -Eq '^direct_ipv6_tcp=(reachable|not_attempted|timeout|network_unreachable|host_unreachable|refused|other_failure)$' <<<"$result"
          grep -Eq '^direct_tls=(verified|not_attempted|not_offered|certificate_rejected|handshake_failed|timeout|transport_or_ca_failure)$' <<<"$result"
          printf '%s\n' "$result"
          printf '%s\n' "$result" >>"$GITHUB_STEP_SUMMARY"
          echo 'No database credential, SQL, operator request, pilot, queue job, financial switch, or production service was changed.' >>"$GITHUB_STEP_SUMMARY"
