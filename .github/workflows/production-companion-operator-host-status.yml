name: Inspect dormant production companion operator host

on:
  workflow_dispatch:
    inputs:
      confirm_main_commit_sha:
        description: Exact reviewed main commit
        required: true
        type: string
      confirm_operation:
        description: Type INSPECT DORMANT COMPANION OPERATOR HOST
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fetanagent-production-companion-operator-host-status
  cancel-in-progress: false

jobs:
  inspect:
    name: Inspect only the installed, stopped operator image
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: production
    permissions:
      contents: read
      actions: read
    env:
      CONFIRMED_COMMIT: ${{ inputs.confirm_main_commit_sha }}
      CONFIRMED_OPERATION: ${{ inputs.confirm_operation }}
    steps:
      - name: Check out exact main without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Require exact passing main and read-only operation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$CONFIRMED_COMMIT" == "$GITHUB_SHA" ]]
          [[ "$CONFIRMED_OPERATION" == 'INSPECT DORMANT COMPANION OPERATOR HOST' ]]
          node infra/operations/require-production-ci.mjs

      - name: Inspect exact stopped host without opening a session
        shell: bash
        env:
          PRODUCTION_VM_HOST: ${{ secrets.PRODUCTION_VM_HOST }}
          PRODUCTION_VM_KNOWN_HOSTS: ${{ secrets.PRODUCTION_VM_KNOWN_HOSTS }}
          PRODUCTION_VM_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_VM_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$PRODUCTION_VM_HOST" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]
          [[ -n "$PRODUCTION_VM_KNOWN_HOSTS" && -n "$PRODUCTION_VM_SSH_PRIVATE_KEY" ]]
          revision="$(sed -nE 's/^  PRODUCTION_OPERATOR_IMAGE_REVISION: ([0-9a-f]{40})$/\1/p' \
            .github/workflows/production-companion-operator-session.yml)"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          protected="$RUNNER_TEMP/production-companion-operator-host-status"
          install -d -m 0700 "$protected"
          cleanup() {
            local status=$?
            trap - EXIT
            if [[ -d "$protected" && ! -L "$protected" &&
                  "$(realpath -- "$protected")" == "$protected" ]]; then
              rm -f -- "$protected/deploy-key" "$protected/known-hosts"
              rmdir -- "$protected" || status=1
            else
              status=1
            fi
            exit "$status"
          }
          trap cleanup EXIT
          printf '%s\n' "$PRODUCTION_VM_SSH_PRIVATE_KEY" >"$protected/deploy-key"
          printf '%s\n' "$PRODUCTION_VM_KNOWN_HOSTS" >"$protected/known-hosts"
          chmod 0600 "$protected/deploy-key" "$protected/known-hosts"
          ssh-keygen -y -f "$protected/deploy-key" >/dev/null
          ssh-keygen -F "$PRODUCTION_VM_HOST" -f "$protected/known-hosts" >/dev/null
          ssh_opts=(-F /dev/null -i "$protected/deploy-key" -o BatchMode=yes
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$protected/known-hosts"
            -o ConnectTimeout=8 -o ConnectionAttempts=1
            -o ServerAliveInterval=5 -o ServerAliveCountMax=1)
          remote="fetanagent-admin@$PRODUCTION_VM_HOST"
          if ! ssh "${ssh_opts[@]}" "$remote" \
            "sudo -n /usr/local/sbin/fetanagent-production-operator-host-launch inspect '$revision'" \
            | grep -Fx 'protected_operator_image_ready_dormant' >/dev/null; then
            ssh "${ssh_opts[@]}" "$remote" 'bash -s' <<'REMOTE' | tee -a "$GITHUB_STEP_SUMMARY"
          set -euo pipefail
          if command -v ss >/dev/null 2>&1; then
            if [[ -n "$(ss -H -ltn '( sport = :743 )' 2>/dev/null)" ]]; then
              echo 'operator_listener=listening'
            else
              echo 'operator_listener=closed'
            fi
          else
            echo 'operator_listener=unavailable'
          fi
          if systemctl is-active --quiet docker; then
            echo 'docker_service=active'
          else
            echo 'docker_service=not_active'
          fi
          if docker info >/dev/null 2>&1; then
            echo 'docker_inspection=available'
            if docker container inspect fetanagent-protected-operator-host >/dev/null 2>&1; then
              echo 'operator_container=present'
            else
              echo 'operator_container=absent'
            fi
            if docker image inspect fetanagent-protected-operator-host:ci >/dev/null 2>&1; then
              echo 'operator_image=present'
            else
              echo 'operator_image=absent'
            fi
          else
            echo 'docker_inspection=unavailable'
            echo 'operator_container=unavailable'
            echo 'operator_image=unavailable'
          fi
          installed=/usr/local/sbin/fetanagent-production-operator-host-launch
          if [[ ! -L "$installed" && -f "$installed" &&
            "$(stat --format='%u:%g:%a:%h' "$installed" 2>/dev/null)" == '0:0:700:1' ]]; then
            echo 'launcher_file=exact'
          else
            echo 'launcher_file=not_exact'
          fi
          REMOTE
            echo '::error::The protected operator host is not proven dormant; no session or job was started.' >&2
            exit 1
          fi
          echo 'The exact production operator image is installed and dormant. No request, listener, credential, queue job, or financial switch was changed.' >>"$GITHUB_STEP_SUMMARY"
