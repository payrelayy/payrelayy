name: One-use production companion operator session

on:
  workflow_dispatch:
    inputs:
      confirm_main_commit_sha:
        description: Exact reviewed main commit
        required: true
        type: string
      confirm_operation:
        description: Type OPEN ONE OWNER-APPROVED COMPANION SESSION
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fetanagent-production-companion-operator-session
  cancel-in-progress: false

env:
  PRODUCTION_PROJECT_REF: xzztugbgtulptnbpoelr
  PRODUCTION_DATABASE_POOLER_HOST: aws-0-eu-west-1.pooler.supabase.com
  PRODUCTION_OPERATOR_IMAGE_REVISION: 6de148955722a0f7ce6994c272c56ea6dacf27c7
  PRODUCTION_COMPANION_RELEASE_TAG: windows-companion-v0.1.17

jobs:
  validate:
    name: Require exact reviewed main
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CONFIRMED_COMMIT: ${{ inputs.confirm_main_commit_sha }}
      CONFIRMED_OPERATION: ${{ inputs.confirm_operation }}
    steps:
      - name: Refuse another revision or operation
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$CONFIRMED_COMMIT" == "$GITHUB_SHA" ]]
          [[ "$CONFIRMED_OPERATION" == 'OPEN ONE OWNER-APPROVED COMPANION SESSION' ]]

  session:
    name: Open one protected session and independently stop it
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 135
    environment: production
    permissions:
      contents: read
      actions: read
      attestations: read
    steps:
      - name: Check out exact main without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Require exact passing main CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: node infra/operations/require-production-ci.mjs

      - name: Recheck one-use request, open and stop protected host
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_VM_HOST: ${{ secrets.PRODUCTION_VM_HOST }}
          PRODUCTION_VM_KNOWN_HOSTS: ${{ secrets.PRODUCTION_VM_KNOWN_HOSTS }}
          PRODUCTION_VM_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_VM_SSH_PRIVATE_KEY }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_CA_CERTIFICATE_PEM: ${{ secrets.SUPABASE_CA_CERTIFICATE_PEM }}
          PGHOST: ${{ env.PRODUCTION_DATABASE_POOLER_HOST }}
          PGUSER: postgres.${{ env.PRODUCTION_PROJECT_REF }}
          PGDATABASE: postgres
          PGSSLMODE: verify-full
          PGCONNECT_TIMEOUT: '5'
          PGSERVICEFILE: /dev/null
          PGPASSFILE: /dev/null
        run: |
          set -euo pipefail
          stage='input_validation'
          trap 'echo "::error::The protected operator session stopped during ${stage}; no identifiers were logged." >&2' ERR
          umask 077
          [[ "$PRODUCTION_VM_HOST" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]
          [[ -n "$SUPABASE_DB_PASSWORD" && -n "$SUPABASE_CA_CERTIFICATE_PEM" ]]
          [[ -n "$PRODUCTION_VM_KNOWN_HOSTS" && -n "$PRODUCTION_VM_SSH_PRIVATE_KEY" ]]
          stage='private_input_staging'
          protected="$RUNNER_TEMP/production-companion-operator-session"
          install -d -m 0700 "$protected"
          attempted=0
          preparation_started=0
          remote="fetanagent-admin@$PRODUCTION_VM_HOST"
          launcher='/usr/local/sbin/fetanagent-production-operator-host-launch'
          archive_name=''
          ssh_opts=(-F /dev/null -i "$protected/deploy-key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$protected/known-hosts")
          cleanup() {
            local status=$?
            trap - EXIT INT TERM
            if [[ "$attempted" == 1 ]]; then
              timeout --signal=TERM --kill-after=5s 45s ssh "${ssh_opts[@]}" "$remote" \
                "sudo -n '$launcher' stop '$PRODUCTION_OPERATOR_IMAGE_REVISION'" >/dev/null 2>&1 || {
                  echo '::error::The protected operator host stop needs reconciliation.' >&2
                  status=1
                }
            fi
            if [[ "$preparation_started" == 1 ]]; then
              PGPORT=5432 PGOPTIONS='' PGSSLROOTCERT="$protected/supabase-ca.crt" \
                PGPASSWORD="$SUPABASE_DB_PASSWORD" PRODUCTION_PROJECT_REF="$PRODUCTION_PROJECT_REF" \
                timeout --signal=TERM --kill-after=5s 105s psql -X --quiet \
                  --file=infra/sql/production-companion-execution-emergency-disable.sql \
                  >/dev/null 2>&1 || {
                    echo '::error::Independent companion credential revocation needs reconciliation.' >&2
                    status=1
                  }
            fi
            if [[ "$protected" == "$RUNNER_TEMP/production-companion-operator-session" && \
                  -d "$protected" && ! -L "$protected" && \
                  "$(realpath -- "$protected")" == "$protected" ]]; then
              rm -f -- "$protected/deploy-key" "$protected/known-hosts" "$protected/supabase-ca.crt"
              if [[ "$archive_name" =~ ^FetanAgent-Windows-Companion-[0-9a-f]{12}\.zip$ ]]; then
                rm -f -- "$protected/$archive_name" "$protected/$archive_name.sha256"
              fi
              rmdir -- "$protected" || status=1
            else
              status=1
            fi
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          printf '%s\n' "$PRODUCTION_VM_SSH_PRIVATE_KEY" >"$protected/deploy-key"
          printf '%s\n' "$PRODUCTION_VM_KNOWN_HOSTS" >"$protected/known-hosts"
          printf '%s\n' "$SUPABASE_CA_CERTIFICATE_PEM" >"$protected/supabase-ca.crt"
          chmod 0600 "$protected/deploy-key" "$protected/known-hosts" "$protected/supabase-ca.crt"
          openssl x509 -in "$protected/supabase-ca.crt" -noout -checkend 0 >/dev/null
          stage='published_release_metadata'
          export PGSSLMODE=verify-full PGSSLROOTCERT="$protected/supabase-ca.crt"
          export PGPASSWORD="$SUPABASE_DB_PASSWORD" PGPORT=5432

          stage='release_view'
          release_info="$(gh release view "$PRODUCTION_COMPANION_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,assets)"
          stage='release_tag_ref'
          tag_info="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$PRODUCTION_COMPANION_RELEASE_TAG")"
          stage='release_tag_peel'
          release_sha=''
          for depth in 1 2 3; do
            object_type="$(jq -r '.object.type' <<<"$tag_info")"
            object_sha="$(jq -r '.object.sha' <<<"$tag_info")"
            [[ "$object_sha" =~ ^[0-9a-f]{40}$ ]]
            if [[ "$object_type" == 'commit' ]]; then
              release_sha="$object_sha"
              break
            fi
            [[ "$object_type" == 'tag' ]]
            tag_info="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha")"
          done
          [[ "$release_sha" =~ ^[0-9a-f]{40}$ ]]
          archive_name="FetanAgent-Windows-Companion-${release_sha:0:12}.zip"
          stage='release_asset_manifest'
          jq -e --arg tag "$PRODUCTION_COMPANION_RELEASE_TAG" --arg archive "$archive_name" '
            .tagName == $tag and .isDraft == false and .isPrerelease == false and
            (.assets | length) == 4 and
            ([.assets[].name] | sort) ==
              ([$archive, ($archive + ".sha256"),
                "FetanAgent-Windows-Companion.zip",
                "FetanAgent-Windows-Companion.zip.sha256"] | sort)
          ' <<<"$release_info" >/dev/null
          stage='release_archive_download'
          gh release download "$PRODUCTION_COMPANION_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" --pattern "$archive_name" \
            --output "$protected/$archive_name" >/dev/null
          stage='release_checksum_download'
          gh release download "$PRODUCTION_COMPANION_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" --pattern "$archive_name.sha256" \
            --output "$protected/$archive_name.sha256" >/dev/null
          stage='release_archive_hash'
          archive_hash="$(sha256sum "$protected/$archive_name" | cut -d' ' -f1)"
          archive_digest="sha256:$archive_hash"
          stage='release_named_digest'
          [[ "$(jq -r --arg name "$archive_name" '.assets[] | select(.name == $name) | .digest' <<<"$release_info")" == "$archive_digest" ]]
          stage='release_stable_digest'
          [[ "$(jq -r '.assets[] | select(.name == "FetanAgent-Windows-Companion.zip") | .digest' <<<"$release_info")" == "$archive_digest" ]]
          stage='release_checksum_text'
          checksum_line="$archive_hash  $archive_name"
          if ! cmp -s "$protected/$archive_name.sha256" <(printf '%s' "$checksum_line") &&
             ! cmp -s "$protected/$archive_name.sha256" <(printf '%s\n' "$checksum_line") &&
             ! cmp -s "$protected/$archive_name.sha256" <(printf '%s\r\n' "$checksum_line"); then
            echo '::error::The immutable companion checksum asset is malformed.' >&2
            exit 1
          fi
          stage='published_release_attestation'
          gh attestation verify "$protected/$archive_name" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/windows-companion-package.yml" \
            --source-ref "refs/tags/$PRODUCTION_COMPANION_RELEASE_TAG" \
            --source-digest "$release_sha" --deny-self-hosted-runners \
            --format json >/dev/null
          package_root="FetanAgent-Windows-Companion-${release_sha:0:12}"
          [[ "$(unzip -p "$protected/$archive_name" "$package_root/RELEASE_SHA")" == "$release_sha" ]]
          tree_digest="$(unzip -p "$protected/$archive_name" "$package_root/INSTALLATION_TREE_SHA256")"
          [[ "$tree_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          export PRODUCTION_COMPANION_RELEASE_SHA="$release_sha"
          export PRODUCTION_COMPANION_ARCHIVE_SHA256="$archive_digest"
          export PRODUCTION_COMPANION_INSTALLATION_TREE_SHA256="$tree_digest"
          stage='one_use_request_key'
          PRODUCTION_COMPANION_EXECUTION_REQUEST_KEY="$(node -e 'process.stdout.write(require("node:crypto").randomUUID())')"
          [[ "$PRODUCTION_COMPANION_EXECUTION_REQUEST_KEY" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]
          export PRODUCTION_COMPANION_EXECUTION_REQUEST_KEY
          stage='one_use_request_preparation'
          preparation_started=1
          prepared="$(PGOPTIONS='' timeout --signal=TERM --kill-after=5s 40s \
            psql -X --quiet --tuples-only --no-align \
              --file=infra/sql/production-companion-operator-session-prepare.sql)"
          if [[ "$prepared" != 'ready' ]]; then
            echo '::error::The exact one-use activation request could not be prepared.' >&2
            exit 1
          fi
          stage='one_use_request_preflight'
          export PGOPTIONS='-c default_transaction_read_only=on'
          ready="$(timeout --signal=TERM --kill-after=5s 30s psql -X --quiet --tuples-only \
            --no-align --file=infra/sql/production-companion-operator-session-preflight.sql)"
          if [[ "$ready" != 'ready' ]]; then
            echo '::error::The one-use request or production execution boundary is not ready.' >&2
            exit 1
          fi
          stage='protected_host_inspection'
          ssh "${ssh_opts[@]}" "$remote" \
            "sudo -n '$launcher' inspect '$PRODUCTION_OPERATOR_IMAGE_REVISION'" \
            | grep -Fx 'protected_operator_image_ready_dormant' >/dev/null

          attempted=1
          stage='protected_host_session'
          node infra/operations/render-production-operator-launch.mjs | \
            timeout --signal=TERM --kill-after=10s 126m ssh "${ssh_opts[@]}" "$remote" \
              "sudo -n '$launcher' run '$PRODUCTION_OPERATOR_IMAGE_REVISION'"
          echo '::notice::The one-use protected operator session ended; independent stop and revocation are running.'
