name: Observe production live TeleBirr network retry binding

on:
  workflow_dispatch:
    inputs:
      confirm_main_commit_sha:
        description: Type the exact full reviewed main commit SHA
        required: true
        type: string
      confirm_operation:
        description: Type OBSERVE LIVE TELEBIRR NETWORK RETRY BINDING - READ ONLY
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fetanagent-production-live-telebirr-network-binding-observe
  cancel-in-progress: false

env:
  PRODUCTION_PROJECT_REF: xzztugbgtulptnbpoelr
  PRODUCTION_DATABASE_POOLER_HOST: aws-0-eu-west-1.pooler.supabase.com
  PRODUCTION_DATABASE_ADMIN_POOLER_PORT: '6543'

jobs:
  validate:
    name: Validate the exact read-only observation authorization
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CONFIRMED_COMMIT: ${{ inputs.confirm_main_commit_sha }}
      CONFIRMED_OPERATION: ${{ inputs.confirm_operation }}
    steps:
      - name: Require main, exact commit, and read-only phrase
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$CONFIRMED_COMMIT" == "$GITHUB_SHA" ]]
          [[ "$CONFIRMED_OPERATION" == \
             'OBSERVE LIVE TELEBIRR NETWORK RETRY BINDING - READ ONLY' ]]

  observe:
    name: Inspect only redacted recovery state
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    environment: production
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out the exact production observer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Require exact passing main CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: node infra/operations/require-production-ci.mjs

      - name: Observe the recent recovered retry without mutation
        shell: bash
        env:
          SUPABASE_CA_CERTIFICATE_PEM: ${{ secrets.SUPABASE_CA_CERTIFICATE_PEM }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGHOST: ${{ env.PRODUCTION_DATABASE_POOLER_HOST }}
          PGPORT: ${{ env.PRODUCTION_DATABASE_ADMIN_POOLER_PORT }}
          PGDATABASE: postgres
          PGUSER: postgres.${{ env.PRODUCTION_PROJECT_REF }}
          PGSSLMODE: verify-full
          PGCONNECT_TIMEOUT: '5'
          PGSERVICEFILE: /dev/null
          PGPASSFILE: /dev/null
        run: |
          set -euo pipefail
          umask 077
          [[ -n "$PGPASSWORD" && -n "$SUPABASE_CA_CERTIFICATE_PEM" ]]

          protected="$RUNNER_TEMP/production-live-telebirr-network-binding-observe"
          install -d -m 0700 "$protected"
          cleanup() {
            local status=$?
            trap - EXIT INT TERM
            if [[ "$protected" == \
                    "$RUNNER_TEMP/production-live-telebirr-network-binding-observe" &&
                  -d "$protected" && ! -L "$protected" &&
                  "$(realpath -- "$protected")" == "$protected" ]]; then
              find "$protected" -mindepth 1 -maxdepth 1 -type f -delete
              rmdir -- "$protected"
            else
              echo '::error::The runner-local protected directory failed its cleanup boundary.' >&2
              status=1
            fi
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          printf '%s\n' "$SUPABASE_CA_CERTIFICATE_PEM" >"$protected/supabase-ca.crt"
          chmod 0600 "$protected/supabase-ca.crt"
          openssl x509 -in "$protected/supabase-ca.crt" -noout -checkend 0 >/dev/null
          export PGSSLROOTCERT="$protected/supabase-ca.crt"

          observer_result="$(
            timeout --signal=TERM --kill-after=5s 30s \
              psql -X --quiet --tuples-only --no-align \
                --file=infra/sql/production-live-telebirr-network-binding-observe.sql
          )"
          jq -e '
            .schemaVersion == 1 and
            .operation == "live_telebirr_network_binding_observe" and
            .deploymentTarget == "production" and
            (.verificationState | IN(
              "waiting", "queued", "review_required", "definite_reject", "expired", "invalid"
            )) and
            (.diagnosis | IN(
              "invalid",
              "queued",
              "terminal_non_settlement",
              "trusted_evidence_quarantined",
              "trusted_verifier_login_unavailable",
              "trusted_verifier_session_unavailable",
              "staged_evidence_unconsumed",
              "device_evidence_missing",
              "verification_expired",
              "verification_waiting"
            )) and
            (.outcomeReasonCode | IN("pending", "exact_proof_match", "non_match", "invalid")) and
            (.trustedVerifierLoginState | IN("bounded", "disabled", "unsafe", "missing")) and
            ([
              .recentRecoveryTargets,
              .targetCount,
              .attempts,
              .expiredAttempts,
              .activeAttempts,
              .lastAttemptNumber,
              .assignmentTranscripts,
              .assignmentDeliveries,
              .deviceEvidence,
              .observations,
              .outcomes,
              .reservations,
              .settlementReceipts,
              .evidenceQuarantines,
              .eligibleEvidenceNow,
              .evidenceStagedBeforeExpiry,
              .evidenceWithTenSecondLead,
              .depositExecutionJobs,
              .queuedDepositJobs,
              .trustedVerifierSessions,
              .unexpectedVerifierSessions,
              .kemerBetLoginRoles,
              .kemerBetSessions
            ] | all(type == "number" and . >= 0 and . <= 100)) and
            (.remainingSeconds | type == "number" and . >= 0 and . <= 300) and
            (.minimumEvidenceLeadSeconds | type == "number" and . >= 0 and . <= 300) and
            ([
              .contiguousAttempts,
              .depositExecutionSwitchDisabled,
              .financialAuthorityActive,
              .verificationBoundaryLive,
              .executionEnabled,
              .readOnly,
              .moneyMoved
            ] | all(type == "boolean"))
          ' <<<"$observer_result" >/dev/null

          redacted_result="$(jq '{
            verificationState,
            diagnosis,
            outcomeReasonCode,
            recentRecoveryTargets,
            targetCount,
            remainingSeconds,
            attempts,
            expiredAttempts,
            activeAttempts,
            lastAttemptNumber,
            contiguousAttempts,
            assignmentTranscripts,
            assignmentDeliveries,
            deviceEvidence,
            observations,
            outcomes,
            reservations,
            settlementReceipts,
            evidenceQuarantines,
            eligibleEvidenceNow,
            evidenceStagedBeforeExpiry,
            evidenceWithTenSecondLead,
            minimumEvidenceLeadSeconds,
            depositExecutionJobs,
            queuedDepositJobs,
            depositExecutionSwitchDisabled,
            trustedVerifierLoginState,
            trustedVerifierSessions,
            unexpectedVerifierSessions,
            financialAuthorityActive,
            verificationBoundaryLive,
            kemerBetLoginRoles,
            kemerBetSessions,
            executionEnabled,
            readOnly,
            moneyMoved
          }' <<<"$observer_result")"
          printf '%s\n' "$redacted_result" | tee -a "$GITHUB_STEP_SUMMARY"

          jq -e '
            .readOnly == true and
            .moneyMoved == false and
            .kemerBetLoginRoles == 0 and
            .kemerBetSessions == 0 and
            .executionEnabled == false
          ' <<<"$observer_result" >/dev/null

          state="$(jq -r '.verificationState' <<<"$observer_result")"
          if [[ "$state" == 'invalid' ]]; then
            echo '::error::The redacted recovery observer found an invalid production state.' >&2
            exit 1
          fi
          echo "::notice::The redacted recovery observer completed with state ${state}; KemerBet execution remains disabled."
