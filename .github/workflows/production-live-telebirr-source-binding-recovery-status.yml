name: Observe reviewed production TeleBirr source-binding recovery

on:
  workflow_dispatch:
    inputs:
      confirm_production_project_ref:
        description: Type the exact production Supabase project ref
        required: true
        type: string
      confirm_main_commit_sha:
        description: Type the exact full reviewed main commit SHA
        required: true
        type: string
      confirm_verification_job_id:
        description: Type the exact reviewed verification-job UUID
        required: true
        type: string
      confirm_retry_request_key:
        description: Type the exact reviewed source-binding retry UUIDv4
        required: true
        type: string
      confirm_operation:
        description: Type OBSERVE REVIEWED TELEBIRR SOURCE BINDING - READ ONLY
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fetanagent-production-live-telebirr-source-binding-recovery-status
  cancel-in-progress: false

env:
  PRODUCTION_PROJECT_REF: xzztugbgtulptnbpoelr
  PRODUCTION_DATABASE_POOLER_HOST: aws-0-eu-west-1.pooler.supabase.com
  PRODUCTION_DATABASE_ADMIN_POOLER_PORT: '6543'

jobs:
  validate:
    name: Validate the exact read-only status request
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CONFIRMED_PROJECT: ${{ inputs.confirm_production_project_ref }}
      CONFIRMED_COMMIT: ${{ inputs.confirm_main_commit_sha }}
      CONFIRMED_JOB: ${{ inputs.confirm_verification_job_id }}
      CONFIRMED_REQUEST: ${{ inputs.confirm_retry_request_key }}
      CONFIRMED_OPERATION: ${{ inputs.confirm_operation }}
    steps:
      - name: Require main and the exact read-only phrase
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$CONFIRMED_COMMIT" == "$GITHUB_SHA" ]]
          [[ "$CONFIRMED_PROJECT" == "$PRODUCTION_PROJECT_REF" ]]
          uuid='^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
          uuid_v4='^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
          [[ "$CONFIRMED_JOB" =~ $uuid ]]
          [[ "$CONFIRMED_REQUEST" =~ $uuid_v4 ]]
          [[ "$CONFIRMED_OPERATION" == \
             'OBSERVE REVIEWED TELEBIRR SOURCE BINDING - READ ONLY' ]]

  observe:
    name: Read the redacted recovery status
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out the exact production operation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Require exact passing main CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: node infra/operations/require-production-ci.mjs

      - name: Observe the append-only recovery without changing it
        shell: bash
        env:
          SUPABASE_CA_CERTIFICATE_PEM: ${{ secrets.SUPABASE_CA_CERTIFICATE_PEM }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGHOST: ${{ env.PRODUCTION_DATABASE_POOLER_HOST }}
          PGPORT: ${{ env.PRODUCTION_DATABASE_ADMIN_POOLER_PORT }}
          PGDATABASE: postgres
          PGUSER: postgres.${{ env.PRODUCTION_PROJECT_REF }}
          PGSSLMODE: verify-full
          PGCONNECT_TIMEOUT: '5'
          PGSERVICEFILE: /dev/null
          PGPASSFILE: /dev/null
          TARGET_VERIFICATION_JOB_ID: ${{ inputs.confirm_verification_job_id }}
          SOURCE_BINDING_RETRY_REQUEST_KEY: ${{ inputs.confirm_retry_request_key }}
        run: |
          set -euo pipefail
          umask 077
          [[ -n "$PGPASSWORD" && -n "$SUPABASE_CA_CERTIFICATE_PEM" ]]

          protected="$RUNNER_TEMP/production-live-telebirr-source-binding-recovery-status"
          install -d -m 0700 "$protected"
          cleanup() {
            local status=$?
            trap - EXIT INT TERM
            if [[ "$protected" == \
                    "$RUNNER_TEMP/production-live-telebirr-source-binding-recovery-status" &&
                  -d "$protected" && ! -L "$protected" &&
                  "$(realpath -- "$protected")" == "$protected" ]]; then
              find "$protected" -mindepth 1 -maxdepth 1 -type f -delete
              rmdir -- "$protected"
            else
              echo '::error::The runner-local protected directory failed its cleanup boundary.' >&2
              status=1
            fi
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          printf '%s\n' "$SUPABASE_CA_CERTIFICATE_PEM" >"$protected/supabase-ca.crt"
          chmod 0600 "$protected/supabase-ca.crt"
          openssl x509 -in "$protected/supabase-ca.crt" -noout -checkend 0 >/dev/null
          export PGSSLROOTCERT="$protected/supabase-ca.crt"

          observer_result="$(
            timeout --signal=TERM --kill-after=5s 30s \
              psql -X --quiet --tuples-only --no-align \
                --file=infra/sql/production-live-telebirr-source-binding-recovery-status.sql
          )"
          jq -e '
            .schemaVersion == 1 and
            .operation == "live_telebirr_source_binding_recovery_status" and
            .deploymentTarget == "production" and
            (.verificationState | IN(
              "waiting", "queued", "review_required", "definite_reject", "expired", "invalid"
            )) and
            (.executionEnabled | type == "boolean") and
            .readOnly == true and
            .moneyMoved == false
          ' <<<"$observer_result" >/dev/null

          redacted_result="$(jq '{
            verificationState, outcomeReasonCode, remainingSeconds,
            targetCount, attempts, assignmentTranscripts, assignmentDeliveries,
            deviceEvidence, observations, outcomes, sourceBindingRetries,
            sourceBindingRetryClosures, authorityConsumptions, reservations,
            settlementReceipts, settlementDocuments, depositExecutionJobs,
            queuedDepositJobs, trustedVerifierSessions, financialSwitchesLive,
            financialSwitchesDisabled, kemerBetLoginRoles, kemerBetSessions,
            executionEnabled, readOnly, moneyMoved
          }' <<<"$observer_result")"
          printf '%s\n' "$redacted_result" | tee -a "$GITHUB_STEP_SUMMARY"

          jq -e '
            ([
              .targetCount, .remainingSeconds, .attempts,
              .assignmentTranscripts, .assignmentDeliveries, .deviceEvidence,
              .observations, .outcomes, .sourceBindingRetries,
              .sourceBindingRetryClosures, .authorityConsumptions,
              .reservations, .settlementReceipts, .settlementDocuments,
              .depositExecutionJobs, .queuedDepositJobs,
              .trustedVerifierSessions, .financialSwitchesLive,
              .financialSwitchesDisabled, .kemerBetLoginRoles, .kemerBetSessions
            ] | all(type == "number" and . >= 0 and . <= 16)) and
            .financialSwitchesLive == 0 and
            .financialSwitchesDisabled == 7 and
            .kemerBetLoginRoles == 0 and
            .kemerBetSessions == 0 and
            .executionEnabled == false and
            .readOnly == true and
            .moneyMoved == false
          ' <<<"$observer_result" >/dev/null

          state="$(jq -r '.verificationState' <<<"$observer_result")"
          echo "::notice::The redacted source-binding recovery observer completed with state ${state}; all financial execution remains disabled."
