name: Recover production receiver SMS deposits after incident

on:
  workflow_dispatch:
    inputs:
      confirm_production_project_ref:
        description: Exact production Supabase project ref
        required: true
        type: string
      confirm_main_commit_sha:
        description: Exact reviewed and deployed main commit SHA
        required: true
        type: string
      recovery_step:
        description: Run exactly one guarded recovery step
        required: true
        type: choice
        options:
          - stop_sms_route
          - retire_receipt_logins
          - activate_sms_deposits
      confirm_owner_auth_user_id:
        description: Current authorizing Owner auth-user UUID; required only to activate
        required: false
        type: string
      confirm_operation:
        description: Type the exact phrase for the selected step
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fetanagent-production-runtime
  cancel-in-progress: false

env:
  PRODUCTION_PROJECT_REF: xzztugbgtulptnbpoelr
  PRODUCTION_DATABASE_POOLER_HOST: aws-0-eu-west-1.pooler.supabase.com
  PRODUCTION_DATABASE_ADMIN_POOLER_PORT: '6543'

jobs:
  validate:
    name: Require exact main and one reviewed recovery step
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CONFIRMED_PROJECT: ${{ inputs.confirm_production_project_ref }}
      CONFIRMED_COMMIT: ${{ inputs.confirm_main_commit_sha }}
      RECOVERY_STEP: ${{ inputs.recovery_step }}
      CONFIRMED_OWNER: ${{ inputs.confirm_owner_auth_user_id }}
      CONFIRMED_OPERATION: ${{ inputs.confirm_operation }}
    steps:
      - name: Reject another project, revision, identity or operation
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$CONFIRMED_COMMIT" == "$GITHUB_SHA" ]]
          [[ "$CONFIRMED_PROJECT" == "$PRODUCTION_PROJECT_REF" ]]
          case "$RECOVERY_STEP:$CONFIRMED_OPERATION" in
            'stop_sms_route:STOP SMS ROUTE FOR INCIDENT RECOVERY')
              [[ -z "$CONFIRMED_OWNER" ]] ;;
            'retire_receipt_logins:RETIRE RECEIPT LOGINS FOR SMS RECOVERY')
              [[ -z "$CONFIRMED_OWNER" ]] ;;
            'activate_sms_deposits:ENABLE LIVE SMS DEPOSITS WITH CBE')
              [[ "$CONFIRMED_OWNER" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]] ;;
            *) exit 1 ;;
          esac

  recover:
    name: Run one guarded production database operation
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out reviewed main without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Require passing exact-main production CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: node infra/operations/require-production-ci.mjs

      - name: Perform the selected one-use recovery step
        shell: bash
        env:
          RECOVERY_STEP: ${{ inputs.recovery_step }}
          FETANAGENT_ROUTINE_OWNER_AUTH_USER_ID: ${{ inputs.confirm_owner_auth_user_id }}
          SUPABASE_CA_CERTIFICATE_PEM: ${{ secrets.SUPABASE_CA_CERTIFICATE_PEM }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGHOST: ${{ env.PRODUCTION_DATABASE_POOLER_HOST }}
          PGPORT: ${{ env.PRODUCTION_DATABASE_ADMIN_POOLER_PORT }}
          PGDATABASE: postgres
          PGUSER: postgres.${{ env.PRODUCTION_PROJECT_REF }}
          PGSSLMODE: verify-full
          PGCONNECT_TIMEOUT: '5'
          PGAPPNAME: fetanagent_receiver_sms_incident_recovery
          PGSERVICEFILE: /dev/null
          PGPASSFILE: /dev/null
          PGOPTIONS: ''
        run: |
          set -euo pipefail
          umask 077
          [[ -n "$PGPASSWORD" && -n "$SUPABASE_CA_CERTIFICATE_PEM" ]]
          protected="$(mktemp -d "$RUNNER_TEMP/receiver-sms-recovery.XXXXXX")"
          cleanup() {
            local status=$?
            trap - EXIT INT TERM
            if [[ -d "$protected" && ! -L "$protected" &&
                  "$(realpath -- "$protected")" == "$protected" ]]; then
              rm -f -- "$protected/ca.crt" "$protected/result.out" "$protected/result.err"
              rmdir -- "$protected" || status=1
            else
              status=1
            fi
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          printf '%s\n' "$SUPABASE_CA_CERTIFICATE_PEM" >"$protected/ca.crt"
          chmod 0600 "$protected/ca.crt"
          openssl x509 -in "$protected/ca.crt" -noout -checkend 0 >/dev/null
          export PGSSLROOTCERT="$protected/ca.crt"
          FETANAGENT_RECEIVER_SMS_RECOVERY_REQUEST_KEY="$(node -e 'process.stdout.write(require("node:crypto").randomUUID())')"
          export FETANAGENT_RECEIVER_SMS_RECOVERY_REQUEST_KEY
          case "$RECOVERY_STEP" in
            stop_sms_route)
              script=infra/sql/production-receiver-sms-incident-stop.sql
              operation=receiver_sms_incident_stop ;;
            retire_receipt_logins)
              script=infra/sql/production-receiver-sms-incident-retire-receipt-logins.sql
              operation=receiver_sms_incident_retire_receipt_logins ;;
            activate_sms_deposits)
              script=infra/sql/production-receiver-sms-incident-activate.sql
              operation=receiver_sms_incident_activate ;;
            *) exit 1 ;;
          esac
          if ! timeout --signal=TERM --kill-after=5s 60s \
            psql -X --quiet --tuples-only --no-align --file="$script" \
              >"$protected/result.out" 2>"$protected/result.err"; then
            echo '::error::The guarded SMS recovery step failed; SQL output was withheld.' >&2
            exit 1
          fi
          jq -se --arg operation "$operation" '
            length == 1 and .[0].operation == $operation and
            .[0].deploymentTarget == "production" and
            (if $operation == "receiver_sms_incident_stop" then
              .[0].financialGatesDisabled == true and
              .[0].smsRouteDisabled == true and .[0].historyPreserved == true
            elif $operation == "receiver_sms_incident_retire_receipt_logins" then
              .[0].rolesDisabled == 3 and .[0].financialGatesDisabled == true and
              .[0].historyPreserved == true
            else
              .[0].moneyCapable == true and .[0].livePaymentPerformed == false and
              .[0].cbeMode == "live" and .[0].freshCutover == true
            end)
          ' "$protected/result.out" >/dev/null || {
            echo '::error::The guarded SMS recovery result was not exact.' >&2
            exit 1
          }
          case "$RECOVERY_STEP" in
            stop_sms_route)
              echo 'SMS route and all seven payment switches are stopped. Payment history is retained.' >>"$GITHUB_STEP_SUMMARY" ;;
            retire_receipt_logins)
              echo 'Three receipt login roles are retired. SMS and payment history are retained; gates remain off.' >>"$GITHUB_STEP_SUMMARY" ;;
            activate_sms_deposits)
              echo 'Signed SMS intake for both providers and the idle worker passed the database guards. Three payment switches are live with a fresh cutover; no test payment or credit was made.' >>"$GITHUB_STEP_SUMMARY" ;;
          esac
