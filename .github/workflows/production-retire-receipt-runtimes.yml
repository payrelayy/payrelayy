name: Retire production receipt verification logins

on:
  workflow_dispatch:
    inputs:
      confirm_production_project_ref:
        description: Type the exact production Supabase project ref
        required: true
        type: string
      confirm_main_commit_sha:
        description: Type the exact full reviewed main commit SHA
        required: true
        type: string
      confirm_operation:
        description: Type RETIRE OLD RECEIPT RUNTIMES
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fetanagent-production-runtime
  cancel-in-progress: false

env:
  PRODUCTION_PROJECT_REF: xzztugbgtulptnbpoelr
  PRODUCTION_DATABASE_POOLER_HOST: aws-0-eu-west-1.pooler.supabase.com
  PRODUCTION_DATABASE_ADMIN_POOLER_PORT: '6543'

jobs:
  validate:
    name: Require reviewed main and explicit retirement
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reject a different project, revision, or operation
        shell: bash
        env:
          CONFIRMED_PROJECT: ${{ inputs.confirm_production_project_ref }}
          CONFIRMED_COMMIT: ${{ inputs.confirm_main_commit_sha }}
          CONFIRMED_OPERATION: ${{ inputs.confirm_operation }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$CONFIRMED_COMMIT" == "$GITHUB_SHA" ]]
          [[ "$CONFIRMED_PROJECT" == "$PRODUCTION_PROJECT_REF" ]]
          [[ "$CONFIRMED_OPERATION" == 'RETIRE OLD RECEIPT RUNTIMES' ]]

  retire:
    name: Disable only old receipt runtime logins
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out reviewed main without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js for exact-main CI and request ID
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Require passing exact-main production CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: node infra/operations/require-production-ci.mjs

      - name: Retire receipt logins without changing deposits
        shell: bash
        env:
          SUPABASE_CA_CERTIFICATE_PEM: ${{ secrets.SUPABASE_CA_CERTIFICATE_PEM }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGHOST: ${{ env.PRODUCTION_DATABASE_POOLER_HOST }}
          PGPORT: ${{ env.PRODUCTION_DATABASE_ADMIN_POOLER_PORT }}
          PGDATABASE: postgres
          PGUSER: postgres.${{ env.PRODUCTION_PROJECT_REF }}
          PGSSLMODE: verify-full
          PGCONNECT_TIMEOUT: '5'
          PGAPPNAME: fetanagent_retire_receipt_runtimes
          PGSERVICEFILE: /dev/null
          PGPASSFILE: /dev/null
          PGOPTIONS: ''
        run: |
          set -euo pipefail
          umask 077
          [[ -n "$PGPASSWORD" && -n "$SUPABASE_CA_CERTIFICATE_PEM" ]]
          protected="$(mktemp -d "$RUNNER_TEMP/receipt-retirement.XXXXXX")"
          cleanup() {
            local status=$?
            trap - EXIT INT TERM
            if [[ -d "$protected" && ! -L "$protected" &&
                  "$(realpath -- "$protected")" == "$protected" ]]; then
              rm -f -- "$protected/ca.crt" "$protected/result.out" "$protected/result.err"
              rmdir -- "$protected" || status=1
            else
              status=1
            fi
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          printf '%s\n' "$SUPABASE_CA_CERTIFICATE_PEM" >"$protected/ca.crt"
          chmod 0600 "$protected/ca.crt"
          openssl x509 -in "$protected/ca.crt" -noout -checkend 0 >/dev/null
          export PGSSLROOTCERT="$protected/ca.crt"
          FETANAGENT_RECEIPT_RETIREMENT_REQUEST_KEY="$(node -e 'process.stdout.write(require("node:crypto").randomUUID())')"
          export FETANAGENT_RECEIPT_RETIREMENT_REQUEST_KEY
          if ! timeout --signal=TERM --kill-after=5s 60s \
              psql -X --quiet --tuples-only --no-align \
                --file=infra/sql/production-retire-receipt-runtimes.sql \
                >"$protected/result.out" 2>"$protected/result.err"; then
            echo '::error::Receipt runtime retirement failed; SQL output was withheld.' >&2
            exit 1
          fi
          jq -se 'length == 1 and .[0].operation == "retire_receipt_runtimes" and
            .[0].deploymentTarget == "production" and .[0].rolesDisabled == 3 and
            .[0].smsRouteChanged == false and .[0].financialSwitchChanged == false' \
            "$protected/result.out" >/dev/null
          echo 'Three old receipt verification logins retired. SMS collection and all seven financial switches were unchanged.' >>"$GITHUB_STEP_SUMMARY"
