name: Activate production routine-deposit transport (deposits off)

on:
  workflow_dispatch:
    inputs:
      confirm_production_project_ref:
        description: Type the exact production Supabase project ref
        required: true
        type: string
      confirm_main_commit_sha:
        description: Type the exact full reviewed main commit SHA
        required: true
        type: string
      confirm_owner_auth_user_id:
        description: Current authorizing Owner auth-user UUID
        required: true
        type: string
      confirm_companion_certificate_id:
        description: Current paired Windows companion certificate UUID
        required: true
        type: string
      confirm_operation:
        description: Type ACTIVATE ROUTINE TRANSPORT - DEPOSITS OFF
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fetanagent-production-runtime
  cancel-in-progress: false

env:
  PRODUCTION_PROJECT_REF: xzztugbgtulptnbpoelr
  PRODUCTION_DATABASE_POOLER_HOST: aws-0-eu-west-1.pooler.supabase.com
  PRODUCTION_DATABASE_ADMIN_POOLER_PORT: '6543'

jobs:
  validate:
    name: Require exact reviewed main and no-money operation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CONFIRMED_PROJECT: ${{ inputs.confirm_production_project_ref }}
      CONFIRMED_COMMIT: ${{ inputs.confirm_main_commit_sha }}
      CONFIRMED_OWNER: ${{ inputs.confirm_owner_auth_user_id }}
      CONFIRMED_CERTIFICATE: ${{ inputs.confirm_companion_certificate_id }}
      CONFIRMED_OPERATION: ${{ inputs.confirm_operation }}
    steps:
      - name: Reject another project, revision, identity, or operation
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$CONFIRMED_COMMIT" == "$GITHUB_SHA" ]]
          [[ "$CONFIRMED_PROJECT" == "$PRODUCTION_PROJECT_REF" ]]
          [[ "$CONFIRMED_OWNER" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]
          [[ "$CONFIRMED_CERTIFICATE" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]
          [[ "$CONFIRMED_OPERATION" == 'ACTIVATE ROUTINE TRANSPORT - DEPOSITS OFF' ]]

  activate:
    name: Provision only the isolated execution login
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out exact reviewed main without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Require passing exact-main production CI before secrets
        env:
          GH_TOKEN: ${{ github.token }}
        run: node infra/operations/require-production-ci.mjs

      - name: Activate transport with all financial switches disabled
        shell: bash
        env:
          FETANAGENT_ROUTINE_OWNER_AUTH_USER_ID: ${{ inputs.confirm_owner_auth_user_id }}
          FETANAGENT_ROUTINE_COMPANION_CERTIFICATE_ID: ${{ inputs.confirm_companion_certificate_id }}
          FETANAGENT_ROUTINE_RUNTIME_PASSWORD: ${{ secrets.ROUTINE_DEPOSIT_RUNTIME_PASSWORD_ACTIVATION }}
          SUPABASE_CA_CERTIFICATE_PEM: ${{ secrets.SUPABASE_CA_CERTIFICATE_PEM }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGHOST: ${{ env.PRODUCTION_DATABASE_POOLER_HOST }}
          PGPORT: ${{ env.PRODUCTION_DATABASE_ADMIN_POOLER_PORT }}
          PGDATABASE: postgres
          PGUSER: postgres.${{ env.PRODUCTION_PROJECT_REF }}
          PGSSLMODE: verify-full
          PGCONNECT_TIMEOUT: '5'
          PGAPPNAME: fetanagent_routine_deposit_transport_activation
          PGSERVICEFILE: /dev/null
          PGPASSFILE: /dev/null
          PGOPTIONS: ''
        run: |
          set -euo pipefail
          umask 077
          [[ -n "$PGPASSWORD" && -n "$SUPABASE_CA_CERTIFICATE_PEM" ]]
          [[ "$FETANAGENT_ROUTINE_RUNTIME_PASSWORD" =~ ^[0-9a-f]{64}$ ]]

          protected="$RUNNER_TEMP/production-routine-deposit-activation"
          install -d -m 0700 "$protected"
          cleanup() {
            local status=$?
            trap - EXIT INT TERM
            if [[ "$protected" == "$RUNNER_TEMP/production-routine-deposit-activation" && \
                  -d "$protected" && ! -L "$protected" && \
                  "$(realpath -- "$protected")" == "$protected" ]]; then
              rm -f -- "$protected/supabase-ca.crt" "$protected/activation.out" "$protected/activation.err"
              rmdir -- "$protected" || status=1
            else
              status=1
            fi
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          printf '%s\n' "$SUPABASE_CA_CERTIFICATE_PEM" >"$protected/supabase-ca.crt"
          chmod 0600 "$protected/supabase-ca.crt"
          openssl x509 -in "$protected/supabase-ca.crt" -noout -checkend 0 >/dev/null
          export PGSSLROOTCERT="$protected/supabase-ca.crt"
          FETANAGENT_ROUTINE_ACTIVATION_REQUEST_KEY="$(node -e 'process.stdout.write(require("node:crypto").randomUUID())')"
          export FETANAGENT_ROUTINE_ACTIVATION_REQUEST_KEY

          if ! timeout --signal=TERM --kill-after=5s 60s \
              psql -X --quiet --tuples-only --no-align \
                --file=infra/sql/production-routine-deposit-activate.sql \
                >"$protected/activation.out" 2>"$protected/activation.err"; then
            echo '::error::The guarded production transport activation failed; no secret or SQL output was published.' >&2
            exit 1
          fi
          jq -se '
            length == 1 and
            .[0].operation == "routine_deposit_activate" and
            .[0].deploymentTarget == "production" and
            .[0].runtimeLogin == "active" and
            .[0].livePaymentPerformed == false
          ' "$protected/activation.out" >/dev/null || {
            echo '::error::The guarded activation response was not the expected no-payment result.' >&2
            exit 1
          }
          echo 'Routine execution transport login provisioned. The activation required all deposit switches disabled and performed no Player credit.' >>"$GITHUB_STEP_SUMMARY"
