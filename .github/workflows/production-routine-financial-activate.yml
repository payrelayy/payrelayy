name: Activate production routine TeleBirr financial gates

on:
  workflow_dispatch:
    inputs:
      confirm_production_project_ref:
        description: Type the exact production Supabase project ref
        required: true
        type: string
      confirm_main_commit_sha:
        description: Type the exact full reviewed main commit SHA (deploy it before activation)
        required: true
        type: string
      confirm_owner_auth_user_id:
        description: Current authorizing Owner auth-user UUID
        required: true
        type: string
      confirm_operation:
        description: Type ENABLE LIVE ROUTINE TELEBIRR DEPOSITS
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fetanagent-production-runtime
  cancel-in-progress: false

env:
  PRODUCTION_PROJECT_REF: xzztugbgtulptnbpoelr
  PRODUCTION_DATABASE_POOLER_HOST: aws-0-eu-west-1.pooler.supabase.com
  PRODUCTION_DATABASE_ADMIN_POOLER_PORT: '6543'

jobs:
  validate:
    name: Require exact reviewed main and explicit live action
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CONFIRMED_PROJECT: ${{ inputs.confirm_production_project_ref }}
      CONFIRMED_COMMIT: ${{ inputs.confirm_main_commit_sha }}
      CONFIRMED_OWNER: ${{ inputs.confirm_owner_auth_user_id }}
      CONFIRMED_OPERATION: ${{ inputs.confirm_operation }}
    steps:
      - name: Reject another project, revision, identity, or operation
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$CONFIRMED_COMMIT" == "$GITHUB_SHA" ]]
          [[ "$CONFIRMED_PROJECT" == "$PRODUCTION_PROJECT_REF" ]]
          [[ "$CONFIRMED_OWNER" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]
          [[ "$CONFIRMED_OPERATION" == 'ENABLE LIVE ROUTINE TELEBIRR DEPOSITS' ]]

  activate:
    name: Enable only the two shared deposit switches
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out reviewed main without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Require passing exact-main production CI before secrets
        env:
          GH_TOKEN: ${{ github.token }}
        run: node infra/operations/require-production-ci.mjs

      - name: Activate reviewed routine financial gates
        shell: bash
        env:
          FETANAGENT_ROUTINE_OWNER_AUTH_USER_ID: ${{ inputs.confirm_owner_auth_user_id }}
          SUPABASE_CA_CERTIFICATE_PEM: ${{ secrets.SUPABASE_CA_CERTIFICATE_PEM }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGHOST: ${{ env.PRODUCTION_DATABASE_POOLER_HOST }}
          PGPORT: ${{ env.PRODUCTION_DATABASE_ADMIN_POOLER_PORT }}
          PGDATABASE: postgres
          PGUSER: postgres.${{ env.PRODUCTION_PROJECT_REF }}
          PGSSLMODE: verify-full
          PGCONNECT_TIMEOUT: '5'
          PGAPPNAME: fetanagent_routine_financial_activation
          PGSERVICEFILE: /dev/null
          PGPASSFILE: /dev/null
          PGOPTIONS: ''
        run: |
          set -euo pipefail
          umask 077
          [[ -n "$PGPASSWORD" && -n "$SUPABASE_CA_CERTIFICATE_PEM" ]]
          protected="$(mktemp -d "$RUNNER_TEMP/routine-financial.XXXXXX")"
          cleanup() {
            local status=$?
            trap - EXIT INT TERM
            if [[ -d "$protected" && ! -L "$protected" &&
                  "$(realpath -- "$protected")" == "$protected" ]]; then
              rm -f -- "$protected/ca.crt" "$protected/activation.out" "$protected/activation.err"
              rmdir -- "$protected" || status=1
            else
              status=1
            fi
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          printf '%s\n' "$SUPABASE_CA_CERTIFICATE_PEM" >"$protected/ca.crt"
          chmod 0600 "$protected/ca.crt"
          openssl x509 -in "$protected/ca.crt" -noout -checkend 0 >/dev/null
          export PGSSLROOTCERT="$protected/ca.crt"
          FETANAGENT_ROUTINE_FINANCIAL_REQUEST_KEY="$(node -e 'process.stdout.write(require("node:crypto").randomUUID())')"
          export FETANAGENT_ROUTINE_FINANCIAL_REQUEST_KEY
          if ! timeout --signal=TERM --kill-after=5s 60s \
              psql -X --quiet --tuples-only --no-align \
                --file=infra/sql/production-routine-financial-activate.sql \
                >"$protected/activation.out" 2>"$protected/activation.err"; then
            echo '::error::The guarded financial activation failed; no SQL output was published.' >&2
            exit 1
          fi
          jq -se '
            length == 1 and
            .[0].operation == "routine_telebirr_financial_activate" and
            .[0].deploymentTarget == "production" and
            .[0].moneyCapable == true and
            .[0].livePaymentPerformed == false and
            .[0].legacyPilotEnabled == false and
            .[0].cbeEnabled == false
          ' "$protected/activation.out" >/dev/null || {
            echo '::error::The guarded activation response was not exact.' >&2
            exit 1
          }
          echo 'Live routine TeleBirr intake and serial execution gates enabled; no test payment or Player credit was performed by this workflow.' >>"$GITHUB_STEP_SUMMARY"
