name: Production application runtime

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Build only, deploy the guarded production runtime, inspect, or stop
        required: true
        default: plan
        type: choice
        options:
          - plan
          - deploy-inert
          - status
          - stop
      confirm_production_project_ref:
        description: Type the exact production Supabase project ref
        required: true
        type: string
      confirm_main_commit_sha:
        description: Type the exact full reviewed main commit SHA
        required: true
        type: string
      confirm_droplet_id:
        description: Type the exact production DigitalOcean droplet ID
        required: true
        type: string
      confirm_operation:
        description: Type the exact confirmation phrase for the selected production operation
        required: true
        type: string
      confirm_telebirr_pilot_revision_id:
        description: For a live or shadow deploy type the exact active TeleBirr pilot UUID; otherwise type not-applicable
        required: true
        type: string
      confirm_telebirr_activation_epoch:
        description: For a live-authority deploy type the exact TeleBirr activation epoch; otherwise type not-applicable
        required: true
        type: string
      confirm_routine_deposit_transport:
        description: Expected signed Windows routine bridge transport after an inert deploy
        required: true
        default: disabled
        type: choice
        options:
          - disabled
          - enabled
      confirm_financial_switch_profile:
        description: Exact expected production payment switches during this release
        required: true
        default: disabled
        type: choice
        options:
          - disabled
          - cbe-live-v1
          - cbe-stopped-v1
      confirm_database_route:
        description: Pooler normally; direct over pinned SSH only for stopped SMS recovery
        required: true
        default: pooler
        type: choice
        options:
          - pooler
          - direct

permissions:
  contents: read

concurrency:
  group: fetanagent-production-runtime
  cancel-in-progress: false

env:
  STAGING_PROJECT_REF: spzpiyxheappsfyswewl
  PRODUCTION_PROJECT_REF: xzztugbgtulptnbpoelr
  PRODUCTION_DROPLET_ID: '593344964'
  PRODUCTION_DATABASE_POOLER_HOST: aws-0-eu-west-1.pooler.supabase.com
  PRODUCTION_DATABASE_DIRECT_HOST: db.xzztugbgtulptnbpoelr.supabase.co
  # Normal deploys use Supavisor. Stopped SMS recovery may use the direct IPv6
  # database via a pinned SSH tunnel for runner SQL and direct host for VM runtimes.
  PRODUCTION_DATABASE_ADMIN_POOLER_PORT: '6543'
  CUSTOMER_WEB_RUNTIME_ROLE: fetanagent_customer_web_runtime
  OWNER_RUNTIME_ROLE: fetanagent_owner_control_runtime
  PLAYER_ACTION_RUNTIME_ROLE: fetanagent_player_actions_runtime
  ASSIGNMENT_RUNTIME_ROLE: fetanagent_telebirr_assignment_broker_runtime

jobs:
  validate-target:
    name: Validate exact production target
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require main and the exact production operation
        shell: bash
        env:
          CONFIRMED_COMMIT: ${{ inputs.confirm_main_commit_sha }}
          CONFIRMED_DROPLET: ${{ inputs.confirm_droplet_id }}
          CONFIRMED_OPERATION: ${{ inputs.confirm_operation }}
          CONFIRMED_PROJECT: ${{ inputs.confirm_production_project_ref }}
          CONFIRMED_TELEBIRR_PILOT: ${{ inputs.confirm_telebirr_pilot_revision_id }}
          CONFIRMED_TELEBIRR_EPOCH: ${{ inputs.confirm_telebirr_activation_epoch }}
          CONFIRMED_ROUTINE_TRANSPORT: ${{ inputs.confirm_routine_deposit_transport }}
          CONFIRMED_FINANCIAL_PROFILE: ${{ inputs.confirm_financial_switch_profile }}
          CONFIRMED_DATABASE_ROUTE: ${{ inputs.confirm_database_route }}
          REQUESTED_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$CONFIRMED_COMMIT" == "$GITHUB_SHA" ]]
          [[ "$CONFIRMED_PROJECT" == "$PRODUCTION_PROJECT_REF" ]]
          [[ "$CONFIRMED_PROJECT" != "$STAGING_PROJECT_REF" ]]
          [[ "$CONFIRMED_DROPLET" == "$PRODUCTION_DROPLET_ID" ]]
          [[ "$CONFIRMED_ROUTINE_TRANSPORT" == 'disabled' ||
            "$CONFIRMED_ROUTINE_TRANSPORT" == 'enabled' ]]
          [[ "$CONFIRMED_FINANCIAL_PROFILE" == 'disabled' ||
            "$CONFIRMED_FINANCIAL_PROFILE" == 'cbe-live-v1' ||
            "$CONFIRMED_FINANCIAL_PROFILE" == 'cbe-stopped-v1' ]]
          if [[ "$REQUESTED_MODE" != 'deploy-inert' ]]; then
            [[ "$CONFIRMED_ROUTINE_TRANSPORT" == 'disabled' ]]
            [[ "$CONFIRMED_FINANCIAL_PROFILE" == 'disabled' ]]
          fi
          if [[ "$CONFIRMED_FINANCIAL_PROFILE" == 'cbe-live-v1' ||
                "$CONFIRMED_FINANCIAL_PROFILE" == 'cbe-stopped-v1' ]]; then
            [[ "$REQUESTED_MODE" == 'deploy-inert' ]]
            [[ "$CONFIRMED_ROUTINE_TRANSPORT" == 'enabled' ]]
            [[ "$CONFIRMED_DATABASE_ROUTE" == 'pooler' ]]
          fi
          case "$CONFIRMED_DATABASE_ROUTE" in
            pooler) ;;
            direct) [[ "$REQUESTED_MODE" == 'deploy-inert' ]] ;;
            *) exit 1 ;;
          esac
          if [[ "$CONFIRMED_FINANCIAL_PROFILE" == 'cbe-live-v1' ]]; then
            [[ "$CONFIRMED_OPERATION" == 'DEPLOY SCREENSHOT READER WITH CBE LIVE' ]] || {
              echo '::error::The CBE-live release confirmation is not exact.'
              exit 1
            }
          elif [[ "$CONFIRMED_FINANCIAL_PROFILE" == 'cbe-stopped-v1' ]]; then
            [[ "$CONFIRMED_OPERATION" == 'DEPLOY CBE STOPPED COMPANION REPAIR' ]] || {
              echo '::error::The CBE-stopped release confirmation is not exact.'
              exit 1
            }
          else
          case "$REQUESTED_MODE:$CONFIRMED_OPERATION" in
            'plan:PLAN PRODUCTION RUNTIME'|\
            'deploy-inert:DEPLOY INERT PRODUCTION RUNTIME'|\
            'status:STATUS PRODUCTION RUNTIME'|\
            'stop:STOP PRODUCTION RUNTIME') ;;
            *)
              echo '::error::The operation confirmation does not match the selected production mode.'
              exit 1
              ;;
          esac
          fi
          if [[ "$REQUESTED_MODE" == 'deploy' ]]; then
            [[ "$CONFIRMED_TELEBIRR_PILOT" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]
            [[ "$CONFIRMED_TELEBIRR_EPOCH" =~ ^[1-9][0-9]{0,17}$ ]]
          elif [[ "$REQUESTED_MODE" == 'deploy-shadow' || "$REQUESTED_MODE" == 'deploy-shadow-intake' ]]; then
            [[ "$CONFIRMED_TELEBIRR_PILOT" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]
            [[ "$CONFIRMED_TELEBIRR_EPOCH" == 'not-applicable' ]]
          else
            [[ "$CONFIRMED_TELEBIRR_PILOT" == 'not-applicable' ]]
            [[ "$CONFIRMED_TELEBIRR_EPOCH" == 'not-applicable' ]]
          fi

  validate-ci:
    name: Require exact production commit CI
    if: inputs.mode == 'deploy' || inputs.mode == 'deploy-shadow' || inputs.mode == 'deploy-shadow-intake' || inputs.mode == 'deploy-inert'
    needs: validate-target
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - name: Check out the exact CI gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Require the commit-bound runtime operation
        shell: bash
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          REQUESTED_TELEBIRR_PILOT: ${{ inputs.confirm_telebirr_pilot_revision_id }}
          REQUESTED_TELEBIRR_EPOCH: ${{ inputs.confirm_telebirr_activation_epoch }}
        run: |
          set -euo pipefail
          shadow_release_mode="$(<infra/production-shadow-release-mode)"
          pilot_binding="$(<infra/production-telebirr-pilot-binding)"
          operational_promotion_binding="$(<infra/production-telebirr-operational-promotion.sha256)"
          [[ "$pilot_binding" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]
          [[ "$operational_promotion_binding" =~ ^[0-9a-f]{64}$ ]]
          if [[ "$REQUESTED_MODE" == 'deploy' ]]; then
            expected_operational_binding="$(printf '%s:%s' "$REQUESTED_TELEBIRR_PILOT" "$REQUESTED_TELEBIRR_EPOCH" | sha256sum | cut -d ' ' -f 1)"
            if [[ "$operational_promotion_binding" != "$expected_operational_binding" ]]; then
              echo '::error::This exact production commit is not bound to the requested operational pilot and epoch.'
              exit 1
            fi
          fi
          case "$REQUESTED_MODE:$shadow_release_mode" in
            'deploy:receiver-review'|\
            'deploy:shadow-intake'|\
            'deploy-shadow:receiver-review'|\
            'deploy-shadow-intake:shadow-intake'|\
            'deploy-inert:receiver-review'|\
            'deploy-inert:shadow-intake') ;;
            *)
              echo '::error::This exact production commit is not bound to the requested shadow operation.'
              exit 1
              ;;
          esac
          case "$REQUESTED_MODE" in
            deploy|deploy-shadow|deploy-shadow-intake)
              if [[ "$REQUESTED_TELEBIRR_PILOT" != "$pilot_binding" ]]; then
                echo '::error::This exact production commit is not bound to the requested TeleBirr pilot.'
                exit 1
              fi
              ;;
            deploy-inert)
              [[ "$REQUESTED_TELEBIRR_PILOT" == 'not-applicable' ]]
              ;;
          esac

      - name: Require latest passing main push CI before building
        env:
          GH_TOKEN: ${{ github.token }}
        run: node infra/operations/require-production-ci.mjs

  build:
    name: Build sealed production images
    if: >-
      always() && !cancelled() && needs.validate-target.result == 'success' &&
      (inputs.mode == 'plan' ||
      ((inputs.mode == 'deploy' || inputs.mode == 'deploy-shadow' || inputs.mode == 'deploy-shadow-intake' || inputs.mode == 'deploy-inert') &&
      needs.validate-ci.result == 'success'))
    needs: [validate-target, validate-ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Verify production contracts
        shell: bash
        run: |
          set -euo pipefail
          node infra/verify-production-runtime.mjs
          bash -n infra/operations/fetanagent-production-deploy-helper.sh
          bash -n infra/operations/fetanagent-production-deploy-helper-v2.sh
          bash -n infra/operations/fetanagent-production-v2-screenshot-helper-rotation-v1.sh
          bash -n infra/operations/fetanagent-production-v2-cbe-stopped-helper-rotation-v2.sh
          bash -n infra/operations/psql-over-production-direct-tunnel.sh

      - name: Build commit-labelled images without runtime secrets
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_SHA:0:12}"
          for target in admin customer-web api bot telebirr-assignment-broker telebirr-device-state-broker telebirr-device-bridge companion-device-bridge gateway; do
            case "$target" in
              admin) image='owner-control' ;;
              *) image="$target" ;;
            esac
            docker build --pull=false --target "$target" \
              --build-arg "VCS_REF=$GITHUB_SHA" -t "fetanagent-$image:$tag" .
            [[ "$(docker image inspect "fetanagent-$image:$tag" \
              --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" == "$GITHUB_SHA" ]]
          done

      - name: Save sealed image bundle
        if: inputs.mode == 'deploy' || inputs.mode == 'deploy-shadow' || inputs.mode == 'deploy-shadow-intake' || inputs.mode == 'deploy-inert'
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_SHA:0:12}"
          docker save --output "$RUNNER_TEMP/fetanagent-production-images.tar" \
            "fetanagent-owner-control:$tag" \
            "fetanagent-customer-web:$tag" \
            "fetanagent-api:$tag" \
            "fetanagent-bot:$tag" \
            "fetanagent-telebirr-assignment-broker:$tag" \
            "fetanagent-telebirr-device-state-broker:$tag" \
            "fetanagent-telebirr-device-bridge:$tag" \
            "fetanagent-companion-device-bridge:$tag" \
            "fetanagent-gateway:$tag"

      - name: Upload sealed image bundle
        if: inputs.mode == 'deploy' || inputs.mode == 'deploy-shadow' || inputs.mode == 'deploy-shadow-intake' || inputs.mode == 'deploy-inert'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fetanagent-production-images-${{ github.sha }}
          path: ${{ runner.temp }}/fetanagent-production-images.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  deploy:
    name: Deploy continuous production runtime
    if: inputs.mode == 'deploy' || inputs.mode == 'deploy-shadow' || inputs.mode == 'deploy-shadow-intake' || inputs.mode == 'deploy-inert'
    needs: [validate-target, validate-ci, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: production
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - name: Check out deployment contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Recheck the commit-bound runtime operation
        shell: bash
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          REQUESTED_TELEBIRR_PILOT: ${{ inputs.confirm_telebirr_pilot_revision_id }}
          REQUESTED_TELEBIRR_EPOCH: ${{ inputs.confirm_telebirr_activation_epoch }}
        run: |
          set -euo pipefail
          shadow_release_mode="$(<infra/production-shadow-release-mode)"
          pilot_binding="$(<infra/production-telebirr-pilot-binding)"
          operational_promotion_binding="$(<infra/production-telebirr-operational-promotion.sha256)"
          [[ "$pilot_binding" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]
          [[ "$operational_promotion_binding" =~ ^[0-9a-f]{64}$ ]]
          if [[ "$REQUESTED_MODE" == 'deploy' ]]; then
            expected_operational_binding="$(printf '%s:%s' "$REQUESTED_TELEBIRR_PILOT" "$REQUESTED_TELEBIRR_EPOCH" | sha256sum | cut -d ' ' -f 1)"
            if [[ "$operational_promotion_binding" != "$expected_operational_binding" ]]; then
              echo '::error::This exact production commit is not bound to the requested operational pilot and epoch.'
              exit 1
            fi
          fi
          case "$REQUESTED_MODE:$shadow_release_mode" in
            'deploy:receiver-review'|\
            'deploy:shadow-intake'|\
            'deploy-shadow:receiver-review'|\
            'deploy-shadow-intake:shadow-intake'|\
            'deploy-inert:receiver-review'|\
            'deploy-inert:shadow-intake') ;;
            *)
              echo '::error::This exact production commit is not bound to the requested shadow operation.'
              exit 1
              ;;
          esac
          case "$REQUESTED_MODE" in
            deploy|deploy-shadow|deploy-shadow-intake)
              if [[ "$REQUESTED_TELEBIRR_PILOT" != "$pilot_binding" ]]; then
                echo '::error::This exact production commit is not bound to the requested TeleBirr pilot.'
                exit 1
              fi
              ;;
            deploy-inert)
              [[ "$REQUESTED_TELEBIRR_PILOT" == 'not-applicable' ]]
              ;;
          esac

      - name: Recheck latest main push CI before production secrets
        env:
          GH_TOKEN: ${{ github.token }}
        run: node infra/operations/require-production-ci.mjs

      - name: Download sealed image bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fetanagent-production-images-${{ github.sha }}
          path: ${{ runner.temp }}/release

      - name: Prepare protected deployment bundle
        id: protected
        shell: bash
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          REQUESTED_DATABASE_ROUTE: ${{ inputs.confirm_database_route }}
          API_TELEGRAM_ACTION_SEMANTIC_HMAC_SECRET: ${{ secrets.API_TELEGRAM_ACTION_SEMANTIC_HMAC_SECRET }}
          API_TELEGRAM_CAPABILITY_HMAC_SECRET: ${{ secrets.API_TELEGRAM_CAPABILITY_HMAC_SECRET }}
          API_TELEGRAM_PLAYER_ACTION_PAYLOAD_HMAC_SECRET: ${{ secrets.API_TELEGRAM_PLAYER_ACTION_PAYLOAD_HMAC_SECRET }}
          BOT_TO_API_ACTION_HMAC_SECRET: ${{ secrets.BOT_TO_API_ACTION_HMAC_SECRET }}
          CBE_DEPOSIT_REFERENCE_ENCRYPTION_SECRET: ${{ secrets.CBE_DEPOSIT_REFERENCE_ENCRYPTION_SECRET }}
          CBE_DEPOSIT_REFERENCE_FINGERPRINT_SECRET: ${{ secrets.CBE_DEPOSIT_REFERENCE_FINGERPRINT_SECRET }}
          CBE_DEPOSIT_REFERENCE_KEY_PROFILE_V1_JSON: ${{ vars.CBE_DEPOSIT_REFERENCE_KEY_PROFILE_V1_JSON }}
          COMPANION_DEVICE_BRIDGE_RUNTIME_PASSWORD: ${{ secrets.COMPANION_DEVICE_BRIDGE_RUNTIME_PASSWORD }}
          COMPANION_SERVER_SIGNER_PKCS8_BASE64: ${{ secrets.COMPANION_SERVER_SIGNER_PKCS8_BASE64 }}
          COMPANION_SERVER_SIGNER_ID: ${{ vars.COMPANION_SERVER_SIGNER_ID }}
          COMPANION_SERVER_SIGNER_KEY_ID: ${{ vars.COMPANION_SERVER_SIGNER_KEY_ID }}
          COMPANION_SERVER_SIGNER_PUBLIC_SPKI_BASE64: ${{ vars.COMPANION_SERVER_SIGNER_PUBLIC_SPKI_BASE64 }}
          COMPANION_SERVER_SIGNER_PUBLIC_SPKI_BASE64URL: ${{ vars.COMPANION_SERVER_SIGNER_PUBLIC_SPKI_BASE64URL }}
          COMPANION_SERVER_SIGNER_PUBLIC_SPKI_SHA256: ${{ vars.COMPANION_SERVER_SIGNER_PUBLIC_SPKI_SHA256 }}
          COMPANION_DEVICE_BRIDGE_RUNTIME_MANIFEST_V2_BASE64: ${{ vars.COMPANION_DEVICE_BRIDGE_RUNTIME_MANIFEST_V2_BASE64 }}
          CUSTOMER_WEB_RATE_LIMIT_HMAC_SECRET: ${{ secrets.CUSTOMER_WEB_RATE_LIMIT_HMAC_SECRET }}
          CUSTOMER_WEB_RUNTIME_PASSWORD: ${{ secrets.CUSTOMER_WEB_RUNTIME_PASSWORD }}
          DEPOSIT_PROOF_REFERENCE_ENCRYPTION_MASTER_SECRET: ${{ secrets.DEPOSIT_PROOF_REFERENCE_ENCRYPTION_MASTER_SECRET }}
          DEPOSIT_PROOF_REFERENCE_FINGERPRINT_MASTER_SECRET: ${{ secrets.DEPOSIT_PROOF_REFERENCE_FINGERPRINT_MASTER_SECRET }}
          OWNER_CBE_BIRR_LOOKUP_ENCRYPTION_MASTER_SECRET: ${{ secrets.OWNER_CBE_BIRR_LOOKUP_ENCRYPTION_MASTER_SECRET }}
          OWNER_CBE_BIRR_LOOKUP_FINGERPRINT_MASTER_SECRET: ${{ secrets.OWNER_CBE_BIRR_LOOKUP_FINGERPRINT_MASTER_SECRET }}
          OWNER_CBE_BIRR_LOOKUP_PROFILE_V2_JSON: ${{ vars.OWNER_CBE_BIRR_LOOKUP_PROFILE_V2_JSON }}
          DEPOSIT_PROOF_REFERENCE_PROFILE_V2_JSON: ${{ vars.DEPOSIT_PROOF_REFERENCE_PROFILE_V2_JSON }}
          OWNER_CONTROL_RUNTIME_PASSWORD: ${{ secrets.OWNER_CONTROL_RUNTIME_PASSWORD }}
          OWNER_ROUTINE_ENROLLMENT_SIGNER_PKCS8_BASE64URL: ${{ secrets.OWNER_ROUTINE_ENROLLMENT_SIGNER_PKCS8_BASE64URL }}
          ROUTINE_NO_MONEY_RUNTIME_PASSWORD: ${{ secrets.ROUTINE_NO_MONEY_RUNTIME_PASSWORD }}
          ROUTINE_PAID_POLL_RUNTIME_PASSWORD: ${{ secrets.ROUTINE_PAID_POLL_RUNTIME_PASSWORD }}
          ROUTINE_PAID_SETTLEMENT_RUNTIME_PASSWORD: ${{ secrets.ROUTINE_PAID_SETTLEMENT_RUNTIME_PASSWORD }}
          RECEIVER_SMS_INGEST_RUNTIME_PASSWORD: ${{ secrets.RECEIVER_SMS_INGEST_RUNTIME_PASSWORD }}
          RECEIVER_SMS_SETTLEMENT_RUNTIME_PASSWORD: ${{ secrets.RECEIVER_SMS_SETTLEMENT_RUNTIME_PASSWORD }}
          PLAYER_ACTION_RUNTIME_PASSWORD: ${{ secrets.PLAYER_ACTION_RUNTIME_PASSWORD }}
          PRODUCTION_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PRODUCTION_SUPABASE_PUBLISHABLE_KEY }}
          PRODUCTION_TELEGRAM_BOT_TOKEN: ${{ secrets.PRODUCTION_TELEGRAM_BOT_TOKEN }}
          PRODUCTION_SCREENSHOT_MODEL_ACCESS_KEY: ${{ secrets.PRODUCTION_SCREENSHOT_MODEL_ACCESS_KEY }}
          PRODUCTION_TELEGRAM_BOT_TOKEN_SHA256: ${{ vars.PRODUCTION_TELEGRAM_BOT_TOKEN_SHA256 }}
          PRODUCTION_VM_HOST: ${{ secrets.PRODUCTION_VM_HOST }}
          PRODUCTION_VM_KNOWN_HOSTS: ${{ secrets.PRODUCTION_VM_KNOWN_HOSTS }}
          PRODUCTION_VM_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_VM_SSH_PRIVATE_KEY }}
          SUPABASE_CA_CERTIFICATE_PEM: ${{ secrets.SUPABASE_CA_CERTIFICATE_PEM }}
          TELEBIRR_ASSIGNMENT_SIGNER_ID: ${{ vars.TELEBIRR_ASSIGNMENT_SIGNER_ID }}
          TELEBIRR_ASSIGNMENT_SIGNER_PKCS8_BASE64: ${{ secrets.TELEBIRR_ASSIGNMENT_SIGNER_PKCS8_BASE64 }}
          TELEBIRR_ASSIGNMENT_SIGNER_PUBLIC_SPKI_BASE64: ${{ vars.TELEBIRR_ASSIGNMENT_SIGNER_PUBLIC_SPKI_BASE64 }}
          TELEBIRR_ASSIGNMENT_SIGNER_PUBLIC_SPKI_SHA256: ${{ vars.TELEBIRR_ASSIGNMENT_SIGNER_PUBLIC_SPKI_SHA256 }}
          TELEBIRR_ASSIGNMENT_BROKER_RUNTIME_PASSWORD: ${{ secrets.TELEBIRR_ASSIGNMENT_BROKER_RUNTIME_PASSWORD }}
          TELEBIRR_ASSIGNMENT_SIGNER_KEY_ID: ${{ vars.TELEBIRR_ASSIGNMENT_SIGNER_KEY_ID }}
          TELEBIRR_BRIDGE_SERVER_SIGNER_KEY_ID: ${{ vars.TELEBIRR_BRIDGE_SERVER_SIGNER_KEY_ID }}
          TELEBIRR_BRIDGE_SERVER_SIGNER_PKCS8_BASE64: ${{ secrets.TELEBIRR_BRIDGE_SERVER_SIGNER_PKCS8_BASE64 }}
          TELEBIRR_BRIDGE_SERVER_SIGNER_PUBLIC_SPKI_BASE64: ${{ vars.TELEBIRR_BRIDGE_SERVER_SIGNER_PUBLIC_SPKI_BASE64 }}
          TELEBIRR_BRIDGE_SERVER_SIGNER_PUBLIC_SPKI_SHA256: ${{ vars.TELEBIRR_BRIDGE_SERVER_SIGNER_PUBLIC_SPKI_SHA256 }}
          TELEBIRR_DEVICE_BRIDGE_RUNTIME_MANIFEST_V1_BASE64: ${{ vars.TELEBIRR_DEVICE_BRIDGE_RUNTIME_MANIFEST_V1_BASE64 }}
          TELEBIRR_ROUTINE_RECEIPT_SIGNER_PUBLIC_SPKI_SHA256: ${{ vars.TELEBIRR_ROUTINE_RECEIPT_SIGNER_PUBLIC_SPKI_SHA256 }}
          TELEBIRR_ROUTINE_LOOKUP_SIGNER_ID: ${{ vars.TELEBIRR_ROUTINE_LOOKUP_SIGNER_ID }}
          TELEBIRR_ROUTINE_LOOKUP_SIGNER_PKCS8_BASE64URL: ${{ secrets.TELEBIRR_ROUTINE_LOOKUP_SIGNER_PKCS8_BASE64URL }}
          TELEBIRR_ROUTINE_LOOKUP_SIGNER_PUBLIC_SPKI_BASE64URL: ${{ vars.TELEBIRR_ROUTINE_LOOKUP_SIGNER_PUBLIC_SPKI_BASE64URL }}
          TELEBIRR_ROUTINE_LOOKUP_SIGNER_PUBLIC_SPKI_SHA256: ${{ vars.TELEBIRR_ROUTINE_LOOKUP_SIGNER_PUBLIC_SPKI_SHA256 }}
          TELEBIRR_ROUTINE_LOOKUP_SIGNER_VALID_FROM: ${{ vars.TELEBIRR_ROUTINE_LOOKUP_SIGNER_VALID_FROM }}
          TELEBIRR_ROUTINE_LOOKUP_SIGNER_VALID_UNTIL: ${{ vars.TELEBIRR_ROUTINE_LOOKUP_SIGNER_VALID_UNTIL }}
          TELEBIRR_DEVICE_STATE_RUNTIME_PASSWORD: ${{ secrets.TELEBIRR_DEVICE_STATE_RUNTIME_PASSWORD }}
        run: |
          set -euo pipefail
          secret_dir="$RUNNER_TEMP/production-protected"
          install -d -m 0700 "$secret_dir"
          umask 077

          case "$REQUESTED_MODE" in
            deploy)
              runtime_deployment_mode='operational'
              shadow_overlay_source='infra/compose.production.shadow-review.yaml'
              ;;
            deploy-shadow)
              runtime_deployment_mode='shadow-review'
              shadow_overlay_source='infra/compose.production.shadow-review.yaml'
              ;;
            deploy-shadow-intake)
              runtime_deployment_mode='shadow-review'
              shadow_overlay_source='infra/compose.production.shadow-intake.yaml'
              ;;
            deploy-inert)
              runtime_deployment_mode='inert-maintenance'
              shadow_overlay_source='infra/compose.production.shadow-review.yaml'
              ;;
            *)
              echo '::error::A deployment bundle may be prepared only for a deployment mode.'
              exit 1
              ;;
          esac
          sms_mode=false
          if [[ "$REQUESTED_MODE" == 'deploy-inert' ]] &&
            grep -Fq "INTERNAL_RECEIVER_SMS_BROKER_ENABLED: 'true'" \
              infra/compose.production.inert-maintenance.yaml; then
            sms_mode=true
          fi
          echo "sms_mode=$sms_mode" >>"$GITHUB_OUTPUT"
          if [[ "$REQUESTED_MODE" == 'deploy-inert' && "$sms_mode" != true ]]; then
            echo '::error::Only the receiver SMS production overlay may be deployed.' >&2
            exit 1
          fi
          runtime_database_host="$PRODUCTION_DATABASE_POOLER_HOST"
          runtime_role_suffix=".$PRODUCTION_PROJECT_REF"
          if [[ "$REQUESTED_DATABASE_ROUTE" == 'direct' ]]; then
            [[ "$REQUESTED_MODE" == 'deploy-inert' && "$sms_mode" == true ]]
            [[ "$PRODUCTION_DATABASE_DIRECT_HOST" == "db.$PRODUCTION_PROJECT_REF.supabase.co" ]]
            runtime_database_host="$PRODUCTION_DATABASE_DIRECT_HOST"
            runtime_role_suffix=''
          else
            [[ "$REQUESTED_DATABASE_ROUTE" == 'pooler' ]]
          fi
          printf '%s\n' "$runtime_deployment_mode" >"$RUNNER_TEMP/release/runtime-deployment-mode"
          install -m 0600 -- "$shadow_overlay_source" \
            "$RUNNER_TEMP/release/compose.production.shadow-review.yaml"
          cmp --silent -- "$shadow_overlay_source" \
            "$RUNNER_TEMP/release/compose.production.shadow-review.yaml"
          chmod 0600 "$RUNNER_TEMP/release/runtime-deployment-mode"

          values=(
            "$API_TELEGRAM_ACTION_SEMANTIC_HMAC_SECRET"
            "$API_TELEGRAM_CAPABILITY_HMAC_SECRET"
            "$API_TELEGRAM_PLAYER_ACTION_PAYLOAD_HMAC_SECRET"
            "$BOT_TO_API_ACTION_HMAC_SECRET"
            "$CBE_DEPOSIT_REFERENCE_ENCRYPTION_SECRET"
            "$CBE_DEPOSIT_REFERENCE_FINGERPRINT_SECRET"
            "$COMPANION_DEVICE_BRIDGE_RUNTIME_PASSWORD"
            "$CUSTOMER_WEB_RATE_LIMIT_HMAC_SECRET"
            "$CUSTOMER_WEB_RUNTIME_PASSWORD"
            "$DEPOSIT_PROOF_REFERENCE_ENCRYPTION_MASTER_SECRET"
            "$DEPOSIT_PROOF_REFERENCE_FINGERPRINT_MASTER_SECRET"
            "$OWNER_CBE_BIRR_LOOKUP_ENCRYPTION_MASTER_SECRET"
            "$OWNER_CBE_BIRR_LOOKUP_FINGERPRINT_MASTER_SECRET"
            "$OWNER_CONTROL_RUNTIME_PASSWORD"
            "$PLAYER_ACTION_RUNTIME_PASSWORD"
            "$TELEBIRR_ASSIGNMENT_BROKER_RUNTIME_PASSWORD"
            "$TELEBIRR_DEVICE_STATE_RUNTIME_PASSWORD"
          )
          for value in "${values[@]}"; do [[ "$value" =~ ^[0-9a-f]{64}$ ]]; done
          [[ "$(printf '%s\n' "${values[@]}" | sort -u | wc -l)" -eq "${#values[@]}" ]]
          if [[ "$REQUESTED_MODE" == 'deploy-inert' && "$sms_mode" != true ]]; then
            [[ "$ROUTINE_NO_MONEY_RUNTIME_PASSWORD" =~ ^[0-9a-f]{64}$ ]]
            [[ "$ROUTINE_PAID_POLL_RUNTIME_PASSWORD" =~ ^[0-9a-f]{64}$ ]]
            [[ "$ROUTINE_PAID_SETTLEMENT_RUNTIME_PASSWORD" =~ ^[0-9a-f]{64}$ ]]
            [[ "$ROUTINE_PAID_POLL_RUNTIME_PASSWORD" != "$ROUTINE_NO_MONEY_RUNTIME_PASSWORD" ]]
            [[ "$ROUTINE_PAID_SETTLEMENT_RUNTIME_PASSWORD" != "$ROUTINE_NO_MONEY_RUNTIME_PASSWORD" ]]
            [[ "$ROUTINE_PAID_SETTLEMENT_RUNTIME_PASSWORD" != "$ROUTINE_PAID_POLL_RUNTIME_PASSWORD" ]]
            [[ ! " ${values[*]} " == *" $ROUTINE_NO_MONEY_RUNTIME_PASSWORD "* ]]
            [[ ! " ${values[*]} " == *" $ROUTINE_PAID_POLL_RUNTIME_PASSWORD "* ]]
            [[ ! " ${values[*]} " == *" $ROUTINE_PAID_SETTLEMENT_RUNTIME_PASSWORD "* ]]
          fi
          if [[ "$sms_mode" == true ]]; then
            [[ "$RECEIVER_SMS_INGEST_RUNTIME_PASSWORD" =~ ^[0-9a-f]{64}$ ]]
            [[ "$RECEIVER_SMS_SETTLEMENT_RUNTIME_PASSWORD" =~ ^[0-9a-f]{64}$ ]]
            [[ "$RECEIVER_SMS_INGEST_RUNTIME_PASSWORD" != "$RECEIVER_SMS_SETTLEMENT_RUNTIME_PASSWORD" ]]
            [[ ! " ${values[*]} " == *" $RECEIVER_SMS_INGEST_RUNTIME_PASSWORD "* ]]
            [[ ! " ${values[*]} " == *" $RECEIVER_SMS_SETTLEMENT_RUNTIME_PASSWORD "* ]]
          fi
          [[ "$PRODUCTION_SUPABASE_PUBLISHABLE_KEY" =~ ^sb_publishable_[A-Za-z0-9_-]{20,256}$ ]]
          [[ "$PRODUCTION_SCREENSHOT_MODEL_ACCESS_KEY" =~ ^[A-Za-z0-9_-]{40,256}$ ]]
          [[ "$PRODUCTION_VM_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ -n "$PRODUCTION_VM_KNOWN_HOSTS" && -n "$PRODUCTION_VM_SSH_PRIVATE_KEY" ]]
          [[ "$TELEBIRR_ASSIGNMENT_SIGNER_KEY_ID" == 'telebirr-assignment-production-v1' ]]
          [[ "$TELEBIRR_ASSIGNMENT_SIGNER_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]
          [[ "$TELEBIRR_BRIDGE_SERVER_SIGNER_KEY_ID" == 'telebirr-bridge-production-v1' ]]
          [[ "$TELEBIRR_ASSIGNMENT_SIGNER_PUBLIC_SPKI_SHA256" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$TELEBIRR_BRIDGE_SERVER_SIGNER_PUBLIC_SPKI_SHA256" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$TELEBIRR_ASSIGNMENT_SIGNER_PUBLIC_SPKI_SHA256" != "$TELEBIRR_BRIDGE_SERVER_SIGNER_PUBLIC_SPKI_SHA256" ]]

          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          function verifyProfile(encoded, version, fields, secrets, purpose) {
            const profile = JSON.parse(encoded);
            const names = [...fields, 'version', ...(purpose ? ['purpose'] : [])].sort().join(',');
            if (Object.keys(profile).sort().join(',') !== names || profile.version !== version) throw new Error('invalid key profile');
            if (purpose && profile.purpose !== purpose) throw new Error('invalid key profile purpose');
            for (let index = 0; index < fields.length; index += 1) {
              const actual = `sha256:${createHash('sha256').update(Buffer.from(secrets[index], 'hex')).digest('hex')}`;
              if (profile[fields[index]] !== actual) throw new Error('key profile fingerprint mismatch');
            }
            if (profile[fields[0]] === profile[fields[1]]) throw new Error('key profile identities are not distinct');
          }
          verifyProfile(process.env.CBE_DEPOSIT_REFERENCE_KEY_PROFILE_V1_JSON, 1,
            ['encryptionKeyFingerprint', 'fingerprintKeyFingerprint'],
            [process.env.CBE_DEPOSIT_REFERENCE_ENCRYPTION_SECRET, process.env.CBE_DEPOSIT_REFERENCE_FINGERPRINT_SECRET]);
          verifyProfile(process.env.DEPOSIT_PROOF_REFERENCE_PROFILE_V2_JSON, 2,
            ['encryptionMasterFingerprint', 'fingerprintMasterFingerprint'],
            [process.env.DEPOSIT_PROOF_REFERENCE_ENCRYPTION_MASTER_SECRET, process.env.DEPOSIT_PROOF_REFERENCE_FINGERPRINT_MASTER_SECRET]);
          verifyProfile(process.env.OWNER_CBE_BIRR_LOOKUP_PROFILE_V2_JSON, 2,
            ['encryptionMasterFingerprint', 'fingerprintMasterFingerprint'],
            [process.env.OWNER_CBE_BIRR_LOOKUP_ENCRYPTION_MASTER_SECRET, process.env.OWNER_CBE_BIRR_LOOKUP_FINGERPRINT_MASTER_SECRET],
            'cbe_birr_receiver_lookup');
          const token = process.env.PRODUCTION_TELEGRAM_BOT_TOKEN;
          if (!/^[0-9]{8,12}:[A-Za-z0-9_-]{35,}$/u.test(token)) throw new Error('invalid Telegram token');
          const digest = `sha256:${createHash('sha256').update(token).digest('hex')}`;
          if (digest !== process.env.PRODUCTION_TELEGRAM_BOT_TOKEN_SHA256) throw new Error('Telegram token fingerprint mismatch');
          NODE

          printf '%s\n' "$PRODUCTION_VM_SSH_PRIVATE_KEY" >"$secret_dir/deploy-key"
          printf '%s\n' "$PRODUCTION_VM_KNOWN_HOSTS" >"$secret_dir/known-hosts"
          printf '%s\n' "$SUPABASE_CA_CERTIFICATE_PEM" >"$secret_dir/supabase-ca.crt"
          printf '%s' "$TELEBIRR_ASSIGNMENT_SIGNER_PKCS8_BASE64" | base64 --decode >"$secret_dir/telebirr-assignment-signer.pkcs8.der"
          printf '%s' "$TELEBIRR_ASSIGNMENT_SIGNER_PUBLIC_SPKI_BASE64" | base64 --decode >"$secret_dir/telebirr-assignment.spki.der"
          printf '%s' "$TELEBIRR_BRIDGE_SERVER_SIGNER_PKCS8_BASE64" | base64 --decode >"$secret_dir/telebirr-bridge-server-signer.pkcs8.der"
          printf '%s' "$TELEBIRR_BRIDGE_SERVER_SIGNER_PUBLIC_SPKI_BASE64" | base64 --decode >"$secret_dir/telebirr-bridge.spki.der"
          printf '%s' "$TELEBIRR_DEVICE_BRIDGE_RUNTIME_MANIFEST_V1_BASE64" | base64 --decode >"$secret_dir/telebirr-bridge-runtime-manifest.v1.json"
          SECRET_DIR="$secret_dir" node --input-type=module <<'NODE'
          import { createHash, createPrivateKey, createPublicKey } from 'node:crypto';
          import { writeFileSync } from 'node:fs';

          const encoded = process.env.OWNER_ROUTINE_ENROLLMENT_SIGNER_PKCS8_BASE64URL;
          const expectedDigest = process.env.TELEBIRR_ROUTINE_RECEIPT_SIGNER_PUBLIC_SPKI_SHA256;
          if (!/^[A-Za-z0-9_-]{150,1024}$/u.test(encoded ?? '') ||
              !/^sha256:[0-9a-f]{64}$/u.test(expectedDigest ?? '') ||
              Buffer.from(encoded, 'base64url').toString('base64url') !== encoded) {
            throw new Error('The dedicated routine receipt signer is absent or malformed.');
          }
          const privateKey = createPrivateKey({ key: Buffer.from(encoded, 'base64url'), format: 'der', type: 'pkcs8' });
          if (privateKey.asymmetricKeyType !== 'ec' || privateKey.asymmetricKeyDetails?.namedCurve !== 'prime256v1') {
            throw new Error('The dedicated routine receipt signer is not P-256.');
          }
          const publicSpki = createPublicKey(privateKey).export({ format: 'der', type: 'spki' });
          const actualDigest = `sha256:${createHash('sha256').update(publicSpki).digest('hex')}`;
          if (publicSpki.length !== 91 || actualDigest !== expectedDigest ||
              actualDigest === process.env.TELEBIRR_ASSIGNMENT_SIGNER_PUBLIC_SPKI_SHA256 ||
              actualDigest === process.env.TELEBIRR_BRIDGE_SERVER_SIGNER_PUBLIC_SPKI_SHA256) {
            throw new Error('The dedicated routine receipt signer does not match its independent public key.');
          }
          writeFileSync(`${process.env.SECRET_DIR}/owner-routine-enrollment-signer-pkcs8`, encoded, { mode: 0o600 });
          NODE
          printf 'postgresql://%s:%s@%s:5432/postgres?sslmode=verify-full\n' \
            "$OWNER_RUNTIME_ROLE$runtime_role_suffix" "$OWNER_CONTROL_RUNTIME_PASSWORD" "$runtime_database_host" >"$secret_dir/owner-database-url"
          printf 'postgresql://%s:%s@%s:5432/postgres?sslmode=verify-full\n' \
            "$CUSTOMER_WEB_RUNTIME_ROLE$runtime_role_suffix" "$CUSTOMER_WEB_RUNTIME_PASSWORD" "$runtime_database_host" >"$secret_dir/customer-web-database-url"
          printf 'postgresql://%s:%s@%s:5432/postgres?sslmode=verify-full\n' \
            "$PLAYER_ACTION_RUNTIME_ROLE$runtime_role_suffix" "$PLAYER_ACTION_RUNTIME_PASSWORD" "$runtime_database_host" >"$secret_dir/player-action-database-url"
          printf 'postgresql://%s:%s@%s:5432/postgres?sslmode=verify-full' \
            "$ASSIGNMENT_RUNTIME_ROLE$runtime_role_suffix" "$TELEBIRR_ASSIGNMENT_BROKER_RUNTIME_PASSWORD" "$runtime_database_host" >"$secret_dir/telebirr-assignment-database-url"
          printf 'postgresql://%s:%s@%s:5432/postgres?sslmode=verify-full' \
            "fetanagent_telebirr_device_state_runtime$runtime_role_suffix" "$TELEBIRR_DEVICE_STATE_RUNTIME_PASSWORD" "$runtime_database_host" >"$secret_dir/telebirr-device-state-database-url"
          printf '%s\n' "$PRODUCTION_SUPABASE_PUBLISHABLE_KEY" >"$secret_dir/publishable-key"
          printf '%s\n' "$CUSTOMER_WEB_RATE_LIMIT_HMAC_SECRET" >"$secret_dir/customer-web-rate-limit-hmac"
          printf '%s\n' "$BOT_TO_API_ACTION_HMAC_SECRET" >"$secret_dir/api-action-transport-hmac"
          printf '%s\n' "$BOT_TO_API_ACTION_HMAC_SECRET" >"$secret_dir/bot-action-transport-hmac"
          printf '%s\n' "$API_TELEGRAM_PLAYER_ACTION_PAYLOAD_HMAC_SECRET" >"$secret_dir/api-action-payload-hmac"
          printf '%s\n' "$API_TELEGRAM_CAPABILITY_HMAC_SECRET" >"$secret_dir/api-action-capability-hmac"
          printf '%s\n' "$API_TELEGRAM_ACTION_SEMANTIC_HMAC_SECRET" >"$secret_dir/api-action-semantic-hmac"
          printf '%s\n' "$CBE_DEPOSIT_REFERENCE_ENCRYPTION_SECRET" >"$secret_dir/cbe-deposit-reference-encryption-key"
          printf '%s\n' "$CBE_DEPOSIT_REFERENCE_FINGERPRINT_SECRET" >"$secret_dir/cbe-deposit-reference-fingerprint-key"
          printf '%s\n' "$CBE_DEPOSIT_REFERENCE_KEY_PROFILE_V1_JSON" >"$secret_dir/cbe-deposit-reference-key-profile.v1.json"
          printf '%s\n' "$DEPOSIT_PROOF_REFERENCE_ENCRYPTION_MASTER_SECRET" >"$secret_dir/deposit-proof-reference-encryption-master"
          printf '%s\n' "$DEPOSIT_PROOF_REFERENCE_FINGERPRINT_MASTER_SECRET" >"$secret_dir/deposit-proof-reference-fingerprint-master"
          printf '%s\n' "$DEPOSIT_PROOF_REFERENCE_PROFILE_V2_JSON" >"$secret_dir/deposit-proof-reference-profile.v2.json"
          printf '%s\n' "$OWNER_CBE_BIRR_LOOKUP_ENCRYPTION_MASTER_SECRET" >"$secret_dir/owner-cbe-birr-lookup-encryption-master"
          printf '%s\n' "$OWNER_CBE_BIRR_LOOKUP_FINGERPRINT_MASTER_SECRET" >"$secret_dir/owner-cbe-birr-lookup-fingerprint-master"
          printf '%s\n' "$OWNER_CBE_BIRR_LOOKUP_PROFILE_V2_JSON" >"$secret_dir/owner-cbe-birr-receiver-lookup-profile.v2.json"
          telebirr_reference_opening_key_id="$(
            node infra/operations/derive-telebirr-reference-opening-key.mjs \
              "$secret_dir/deposit-proof-reference-encryption-master" \
              "$secret_dir/telebirr-reference-opening-key.v1.json"
          )"
          [[ "$telebirr_reference_opening_key_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          if [[ "$REQUESTED_MODE" == 'deploy-inert' && "$sms_mode" != true ]]; then
            SECRET_DIR="$secret_dir" node --input-type=module <<'NODE'
          import { createHash, createPrivateKey, createPublicKey } from 'node:crypto';
          import { writeFileSync } from 'node:fs';
          const env = process.env;
          const id = env.TELEBIRR_ROUTINE_LOOKUP_SIGNER_ID;
          const encoded = env.TELEBIRR_ROUTINE_LOOKUP_SIGNER_PKCS8_BASE64URL;
          const expectedSpki = env.TELEBIRR_ROUTINE_LOOKUP_SIGNER_PUBLIC_SPKI_BASE64URL;
          const expectedDigest = env.TELEBIRR_ROUTINE_LOOKUP_SIGNER_PUBLIC_SPKI_SHA256;
          const from = env.TELEBIRR_ROUTINE_LOOKUP_SIGNER_VALID_FROM;
          const until = env.TELEBIRR_ROUTINE_LOOKUP_SIGNER_VALID_UNTIL;
          const utc = /^\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d\.\d{3}Z$/u;
          if (!/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/u.test(id ?? '') ||
              !/^[A-Za-z0-9_-]{150,1024}$/u.test(encoded ?? '') ||
              !/^[A-Za-z0-9_-]{122}$/u.test(expectedSpki ?? '') ||
              !/^sha256:[0-9a-f]{64}$/u.test(expectedDigest ?? '') ||
              !utc.test(from ?? '') || !utc.test(until ?? '') ||
              Date.parse(from) > Date.now() || Date.parse(until) < Date.now() + 10 * 60_000 ||
              Date.parse(until) - Date.parse(from) > 30 * 86_400_000) throw new Error('Routine lookup trust unavailable.');
          const der = Buffer.from(encoded, 'base64url');
          if (der.toString('base64url') !== encoded) throw new Error('Routine lookup key noncanonical.');
          const privateKey = createPrivateKey({ key: der, format: 'der', type: 'pkcs8' });
          const canonical = Buffer.from(privateKey.export({ format: 'der', type: 'pkcs8' }));
          const spki = Buffer.from(createPublicKey(privateKey).export({ format: 'der', type: 'spki' }));
          const digest = `sha256:${createHash('sha256').update(spki).digest('hex')}`;
          if (privateKey.asymmetricKeyType !== 'ec' || privateKey.asymmetricKeyDetails?.namedCurve !== 'prime256v1' ||
              !canonical.equals(der) || spki.length !== 91 || spki.toString('base64url') !== expectedSpki ||
              digest !== expectedDigest ||
              [env.TELEBIRR_ASSIGNMENT_SIGNER_PUBLIC_SPKI_SHA256,
               env.TELEBIRR_BRIDGE_SERVER_SIGNER_PUBLIC_SPKI_SHA256,
               env.TELEBIRR_ROUTINE_RECEIPT_SIGNER_PUBLIC_SPKI_SHA256].includes(digest)) {
            throw new Error('Routine lookup signer mismatch.');
          }
          const root = env.SECRET_DIR;
          writeFileSync(`${root}/routine-no-money-lookup-signer.pkcs8.der`, der, { mode: 0o600, flag: 'wx' });
          writeFileSync(`${root}/routine-no-money-lookup-signer.v1.json`, JSON.stringify({
            contractVersion: 1, providerCode: 'telebirr', assignmentSignerId: id,
            keyId: 'telebirr-routine-lookup-production-v1', publicKeySpkiSha256: digest,
          }), { mode: 0o600, flag: 'wx' });
          der.fill(0);
          canonical.fill(0);
          spki.fill(0);
          NODE
            printf 'postgresql://%s:%s@%s:5432/postgres?sslmode=verify-full' \
              "fetanagent_routine_telebirr_no_money_runtime$runtime_role_suffix" \
              "$ROUTINE_NO_MONEY_RUNTIME_PASSWORD" "$runtime_database_host" \
              >"$secret_dir/routine-no-money-database-url"
            printf 'postgresql://%s:%s@%s:5432/postgres?sslmode=verify-full' \
              "fetanagent_routine_telebirr_paid_poll_runtime$runtime_role_suffix" \
              "$ROUTINE_PAID_POLL_RUNTIME_PASSWORD" "$runtime_database_host" \
              >"$secret_dir/routine-paid-poll-database-url"
            printf 'postgresql://%s:%s@%s:5432/postgres?sslmode=verify-full' \
              "fetanagent_routine_telebirr_paid_settlement_runtime$runtime_role_suffix" \
              "$ROUTINE_PAID_SETTLEMENT_RUNTIME_PASSWORD" "$runtime_database_host" \
              >"$secret_dir/routine-paid-settlement-database-url"
          fi
          if [[ "$sms_mode" == true ]]; then
            printf 'postgresql://%s:%s@%s:5432/postgres?sslmode=verify-full' \
              "fetanagent_receiver_sms_ingest_runtime$runtime_role_suffix" \
              "$RECEIVER_SMS_INGEST_RUNTIME_PASSWORD" "$runtime_database_host" \
              >"$secret_dir/receiver-sms-ingest-database-url"
            printf 'postgresql://%s:%s@%s:5432/postgres?sslmode=verify-full' \
              "fetanagent_receiver_sms_settlement_runtime$runtime_role_suffix" \
              "$RECEIVER_SMS_SETTLEMENT_RUNTIME_PASSWORD" "$runtime_database_host" \
              >"$secret_dir/receiver-sms-settlement-database-url"
          fi
          printf '%s\n' "$PRODUCTION_TELEGRAM_BOT_TOKEN" >"$secret_dir/bot-token"
          printf '%s\n' "$PRODUCTION_SCREENSHOT_MODEL_ACCESS_KEY" >"$secret_dir/bot-screenshot-reference-model-access-key"
          printf '%s\n' "$TELEBIRR_ASSIGNMENT_SIGNER_KEY_ID" >"$secret_dir/telebirr-assignment-signer-key-id"
          chmod 0600 "$secret_dir"/*
          openssl x509 -in "$secret_dir/supabase-ca.crt" -noout -checkend 0 >/dev/null
          ssh-keygen -y -f "$secret_dir/deploy-key" >/dev/null
          ssh-keygen -F "$PRODUCTION_VM_HOST" -f "$secret_dir/known-hosts" >/dev/null
          [[ "$(stat --format='%s' "$secret_dir/telebirr-assignment.spki.der")" -eq 91 ]]
          [[ "$(stat --format='%s' "$secret_dir/telebirr-bridge.spki.der")" -eq 91 ]]
          [[ "sha256:$(sha256sum "$secret_dir/telebirr-assignment.spki.der" | cut -d ' ' -f 1)" == "$TELEBIRR_ASSIGNMENT_SIGNER_PUBLIC_SPKI_SHA256" ]]
          [[ "sha256:$(sha256sum "$secret_dir/telebirr-bridge.spki.der" | cut -d ' ' -f 1)" == "$TELEBIRR_BRIDGE_SERVER_SIGNER_PUBLIC_SPKI_SHA256" ]]
          openssl pkey -inform DER -in "$secret_dir/telebirr-assignment-signer.pkcs8.der" -check -noout >/dev/null 2>&1
          openssl pkey -inform DER -in "$secret_dir/telebirr-assignment-signer.pkcs8.der" -pubout -outform DER \
            -out "$secret_dir/telebirr-assignment-derived.spki.der" >/dev/null 2>&1
          cmp --silent "$secret_dir/telebirr-assignment.spki.der" "$secret_dir/telebirr-assignment-derived.spki.der"
          openssl pkey -inform DER -in "$secret_dir/telebirr-bridge-server-signer.pkcs8.der" -check -noout >/dev/null 2>&1
          openssl pkey -inform DER -in "$secret_dir/telebirr-bridge-server-signer.pkcs8.der" -pubout -outform DER \
            -out "$secret_dir/telebirr-bridge-derived.spki.der" >/dev/null 2>&1
          cmp --silent "$secret_dir/telebirr-bridge.spki.der" "$secret_dir/telebirr-bridge-derived.spki.der"
          jq -e \
            --arg bridge_key_id "$TELEBIRR_BRIDGE_SERVER_SIGNER_KEY_ID" \
            --arg bridge_digest "$TELEBIRR_BRIDGE_SERVER_SIGNER_PUBLIC_SPKI_SHA256" \
            --arg assignment_digest "$TELEBIRR_ASSIGNMENT_SIGNER_PUBLIC_SPKI_SHA256" \
            'type == "object" and
             keys == ["assignmentSigningPublicKeySpkiSha256", "contractVersion", "providerCode", "serverSignerKeyId", "serverSigningPublicKeySpkiSha256"] and
             .contractVersion == 1 and .providerCode == "telebirr" and
             .serverSignerKeyId == $bridge_key_id and
             .serverSigningPublicKeySpkiSha256 == $bridge_digest and
             .assignmentSigningPublicKeySpkiSha256 == $assignment_digest' \
            "$secret_dir/telebirr-bridge-runtime-manifest.v1.json" >/dev/null
          jq -e --arg key "$telebirr_reference_opening_key_id" '
              type == "object" and
              keys_unsorted == ["contractVersion", "providerCode", "purpose", "keyVersion", "keyId", "keyHex"] and
              .contractVersion == 1 and .providerCode == "telebirr" and
              .purpose == "deposit-proof-reference-opening" and .keyVersion == 2 and .keyId == $key and
              (.keyHex | test("^[0-9a-f]{64}$"))
            ' "$secret_dir/telebirr-reference-opening-key.v1.json" >/dev/null
          node --input-type=module --eval '
            import { readFileSync } from "node:fs";
            const text = readFileSync(process.argv[1], "utf8");
            const parsed = JSON.parse(text);
            if (JSON.stringify(parsed) !== text || /[\0\r\n]/u.test(text)) process.exit(1);
          ' "$secret_dir/telebirr-reference-opening-key.v1.json"
          rm -f -- "$secret_dir/telebirr-assignment-derived.spki.der" \
            "$secret_dir/telebirr-bridge.spki.der" "$secret_dir/telebirr-bridge-derived.spki.der"
          PRODUCTION_DATABASE_ROUTE="$REQUESTED_DATABASE_ROUTE" \
            node infra/operations/prepare-production-companion-bundle.mjs "$secret_dir"
          helper_sha="$(sha256sum infra/operations/fetanagent-production-deploy-helper-v2.sh | cut -d ' ' -f 1)"
          bundle_bytes="$(stat --format='%s' "$RUNNER_TEMP/release/fetanagent-production-images.tar")"
          [[ "$bundle_bytes" =~ ^[1-9][0-9]*$ ]]
          echo "secret_dir=$secret_dir" >>"$GITHUB_OUTPUT"
          echo "helper_sha=$helper_sha" >>"$GITHUB_OUTPUT"
          echo "bundle_bytes=$bundle_bytes" >>"$GITHUB_OUTPUT"
          echo "vm_host=$PRODUCTION_VM_HOST" >>"$GITHUB_OUTPUT"
          echo "telebirr_reference_opening_key_id=$telebirr_reference_opening_key_id" >>"$GITHUB_OUTPUT"

      - name: Verify the stopped direct database route before any production SQL
        if: inputs.confirm_database_route == 'direct'
        shell: bash
        env:
          SECRET_DIR: ${{ steps.protected.outputs.secret_dir }}
          VM_HOST: ${{ steps.protected.outputs.vm_host }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGDATABASE: postgres
          PGSSLMODE: verify-full
          PGSSLROOTCERT: ${{ steps.protected.outputs.secret_dir }}/supabase-ca.crt
          PGCONNECT_TIMEOUT: '5'
          PGOPTIONS: -c default_transaction_read_only=on
          PGSERVICEFILE: /dev/null
          PGPASSFILE: /dev/null
        run: |
          set -euo pipefail
          [[ '${{ inputs.mode }}' == 'deploy-inert' && '${{ steps.protected.outputs.sms_mode }}' == 'true' ]]
          [[ "$PRODUCTION_DATABASE_DIRECT_HOST" == "db.$PRODUCTION_PROJECT_REF.supabase.co" ]]
          install -m 0700 infra/operations/psql-over-production-direct-tunnel.sh "$SECRET_DIR/psql"
          export FETANAGENT_DIRECT_DB_ROUTE=stopped-sms-recovery
          export FETANAGENT_DIRECT_DB_PROJECT_REF="$PRODUCTION_PROJECT_REF"
          export FETANAGENT_DIRECT_DB_HOST="$PRODUCTION_DATABASE_DIRECT_HOST"
          export FETANAGENT_DIRECT_DB_SSH_HOST="$VM_HOST"
          export FETANAGENT_DIRECT_DB_KEY="$SECRET_DIR/deploy-key"
          export FETANAGENT_DIRECT_DB_KNOWN_HOSTS="$SECRET_DIR/known-hosts"
          ssh_opts=(-F /dev/null -i "$SECRET_DIR/deploy-key" -o BatchMode=yes
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$SECRET_DIR/known-hosts")
          host_state="$(ssh "${ssh_opts[@]}" "fetanagent-admin@$VM_HOST" \
            "sudo -n /usr/local/sbin/fetanagent-production-deploy-helper-v2 verify '${{ steps.protected.outputs.helper_sha }}' && sudo -n /usr/local/sbin/fetanagent-production-deploy-helper-v2 current-state")"
          [[ "$host_state" == 'absent' ]]
          result="$("$SECRET_DIR/psql" -X -q -A -t -v ON_ERROR_STOP=1 -c \
            "select case when current_user = 'postgres' and not pg_catalog.pg_is_in_recovery() and \
              (select ssl from pg_catalog.pg_stat_ssl where pid = pg_catalog.pg_backend_pid()) \
              then 1 else 0 end")"
          [[ "$result" == '1' ]]
          for name in FETANAGENT_DIRECT_DB_ROUTE FETANAGENT_DIRECT_DB_PROJECT_REF \
            FETANAGENT_DIRECT_DB_HOST FETANAGENT_DIRECT_DB_SSH_HOST \
            FETANAGENT_DIRECT_DB_KEY FETANAGENT_DIRECT_DB_KNOWN_HOSTS; do
            printf '%s=%s\n' "$name" "${!name}" >>"$GITHUB_ENV"
          done
          printf '%s\n' "$SECRET_DIR" >>"$GITHUB_PATH"
          echo 'TLS-verified direct administrator route ready; no production row or service changed.' >>"$GITHUB_STEP_SUMMARY"

      - name: Prove the exact production payment boundary
        if: inputs.mode == 'deploy-inert'
        id: payment_profile
        shell: bash
        env:
          CONFIRMED_FINANCIAL_PROFILE: ${{ inputs.confirm_financial_switch_profile }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGHOST: ${{ env.PRODUCTION_DATABASE_POOLER_HOST }}
          PGPORT: ${{ env.PRODUCTION_DATABASE_ADMIN_POOLER_PORT }}
          PGDATABASE: postgres
          PGUSER: postgres.${{ env.PRODUCTION_PROJECT_REF }}
          PGSSLMODE: verify-full
          PGSSLROOTCERT: ${{ steps.protected.outputs.secret_dir }}/supabase-ca.crt
          PGCONNECT_TIMEOUT: '5'
          PGAPPNAME: fetanagent_production_inert_runtime_preflight
          PGSERVICEFILE: /dev/null
          PGPASSFILE: /dev/null
        run: |
          set -euo pipefail
          case "$CONFIRMED_FINANCIAL_PROFILE" in
            disabled) preflight=infra/sql/production-inert-runtime-preflight.sql ;;
            cbe-live-v1) preflight=infra/sql/production-cbe-live-runtime-preflight.sql ;;
            cbe-stopped-v1) preflight=infra/sql/production-cbe-stopped-runtime-preflight.sql ;;
            *) exit 1 ;;
          esac
          psql -X --file="$preflight" >/dev/null
          fingerprint="$(psql -X -q -A -t -v ON_ERROR_STOP=1 \
            --file=infra/sql/production-financial-switch-fingerprint.sql)"
          [[ "$fingerprint" =~ ^[0-9a-f]{32}$ ]]
          echo "fingerprint=$fingerprint" >>"$GITHUB_OUTPUT"

      - name: Record existing routine review login states for exact rollback
        if: inputs.mode == 'deploy-inert' && steps.protected.outputs.sms_mode != 'true'
        id: routine_previous_logins
        shell: bash
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGHOST: ${{ env.PRODUCTION_DATABASE_POOLER_HOST }}
          PGPORT: ${{ env.PRODUCTION_DATABASE_ADMIN_POOLER_PORT }}
          PGDATABASE: postgres
          PGUSER: postgres.${{ env.PRODUCTION_PROJECT_REF }}
          PGSSLMODE: verify-full
          PGSSLROOTCERT: ${{ steps.protected.outputs.secret_dir }}/supabase-ca.crt
          PGCONNECT_TIMEOUT: '5'
          PGAPPNAME: fetanagent_routine_previous_logins
          PGSERVICEFILE: /dev/null
          PGPASSFILE: /dev/null
        run: |
          set -euo pipefail
          previous="$(psql -X -q -A -t -v ON_ERROR_STOP=1 -c "
            select string_agg(role.rolcanlogin::text, ',' order by role.rolname)
            from pg_catalog.pg_roles role
            where role.rolname in (
              'fetanagent_routine_telebirr_no_money_runtime',
              'fetanagent_routine_telebirr_paid_poll_runtime',
              'fetanagent_routine_telebirr_paid_settlement_runtime'
            )")"
          [[ "$previous" =~ ^(true|false),(true|false),(true|false)$ ]]
          # Alphabetical role order: no-money, paid-poll, paid-settlement.
          IFS=, read -r no_money paid_poll paid_settlement <<<"$previous"
          printf 'no_money=%s\npaid_poll=%s\npaid_settlement=%s\n' \
            "$no_money" "$paid_poll" "$paid_settlement" >>"$GITHUB_OUTPUT"

      - name: Activate the separate no-money phone review login
        if: inputs.mode == 'deploy-inert' && steps.protected.outputs.sms_mode != 'true'
        id: routine_review_activation
        shell: bash
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGHOST: ${{ env.PRODUCTION_DATABASE_POOLER_HOST }}
          PGPORT: ${{ env.PRODUCTION_DATABASE_ADMIN_POOLER_PORT }}
          PGDATABASE: postgres
          PGUSER: postgres.${{ env.PRODUCTION_PROJECT_REF }}
          PGSSLMODE: verify-full
          PGSSLROOTCERT: ${{ steps.protected.outputs.secret_dir }}/supabase-ca.crt
          PGCONNECT_TIMEOUT: '5'
          PGAPPNAME: fetanagent_routine_no_money_activation
          PGSERVICEFILE: /dev/null
          PGPASSFILE: /dev/null
          ROUTINE_NO_MONEY_RUNTIME_PASSWORD: ${{ secrets.ROUTINE_NO_MONEY_RUNTIME_PASSWORD }}
          TELEBIRR_ROUTINE_LOOKUP_SIGNER_ID: ${{ vars.TELEBIRR_ROUTINE_LOOKUP_SIGNER_ID }}
          TELEBIRR_ROUTINE_LOOKUP_SIGNER_PUBLIC_SPKI_SHA256: ${{ vars.TELEBIRR_ROUTINE_LOOKUP_SIGNER_PUBLIC_SPKI_SHA256 }}
          TELEBIRR_ROUTINE_LOOKUP_SIGNER_VALID_FROM: ${{ vars.TELEBIRR_ROUTINE_LOOKUP_SIGNER_VALID_FROM }}
          TELEBIRR_ROUTINE_LOOKUP_SIGNER_VALID_UNTIL: ${{ vars.TELEBIRR_ROUTINE_LOOKUP_SIGNER_VALID_UNTIL }}
        run: |
          set -euo pipefail
          echo 'attempted=true' >>"$GITHUB_OUTPUT"
          psql -X \
            -v signer_id="$TELEBIRR_ROUTINE_LOOKUP_SIGNER_ID" \
            -v public_spki_digest="$TELEBIRR_ROUTINE_LOOKUP_SIGNER_PUBLIC_SPKI_SHA256" \
            -v valid_from="$TELEBIRR_ROUTINE_LOOKUP_SIGNER_VALID_FROM" \
            -v valid_until="$TELEBIRR_ROUTINE_LOOKUP_SIGNER_VALID_UNTIL" \
            -v runtime_password="$ROUTINE_NO_MONEY_RUNTIME_PASSWORD" \
            --file=infra/sql/production-routine-no-money-activate.sql >/dev/null

      - name: Activate the separate review-only paid observation login
        if: inputs.mode == 'deploy-inert' && steps.protected.outputs.sms_mode != 'true'
        id: routine_paid_activation
        shell: bash
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGHOST: ${{ env.PRODUCTION_DATABASE_POOLER_HOST }}
          PGPORT: ${{ env.PRODUCTION_DATABASE_ADMIN_POOLER_PORT }}
          PGDATABASE: postgres
          PGUSER: postgres.${{ env.PRODUCTION_PROJECT_REF }}
          PGSSLMODE: verify-full
          PGSSLROOTCERT: ${{ steps.protected.outputs.secret_dir }}/supabase-ca.crt
          PGCONNECT_TIMEOUT: '5'
          PGAPPNAME: fetanagent_routine_paid_observation_activation
          PGSERVICEFILE: /dev/null
          PGPASSFILE: /dev/null
          ROUTINE_PAID_POLL_RUNTIME_PASSWORD: ${{ secrets.ROUTINE_PAID_POLL_RUNTIME_PASSWORD }}
          TELEBIRR_ROUTINE_LOOKUP_SIGNER_VALID_UNTIL: ${{ vars.TELEBIRR_ROUTINE_LOOKUP_SIGNER_VALID_UNTIL }}
        run: |
          set -euo pipefail
          echo 'attempted=true' >>"$GITHUB_OUTPUT"
          psql -X \
            -v runtime_password="$ROUTINE_PAID_POLL_RUNTIME_PASSWORD" \
            -v valid_until="$TELEBIRR_ROUTINE_LOOKUP_SIGNER_VALID_UNTIL" \
            --file=infra/sql/production-routine-paid-poll-activate.sql >/dev/null

      - name: Activate the isolated paid settlement login with deposits disabled
        if: inputs.mode == 'deploy-inert' && steps.protected.outputs.sms_mode != 'true'
        id: routine_paid_settlement_activation
        shell: bash
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGHOST: ${{ env.PRODUCTION_DATABASE_POOLER_HOST }}
          PGPORT: ${{ env.PRODUCTION_DATABASE_ADMIN_POOLER_PORT }}
          PGDATABASE: postgres
          PGUSER: postgres.${{ env.PRODUCTION_PROJECT_REF }}
          PGSSLMODE: verify-full
          PGSSLROOTCERT: ${{ steps.protected.outputs.secret_dir }}/supabase-ca.crt
          PGCONNECT_TIMEOUT: '5'
          PGAPPNAME: fetanagent_routine_paid_settlement_activation
          PGSERVICEFILE: /dev/null
          PGPASSFILE: /dev/null
          ROUTINE_PAID_SETTLEMENT_RUNTIME_PASSWORD: ${{ secrets.ROUTINE_PAID_SETTLEMENT_RUNTIME_PASSWORD }}
          TELEBIRR_ROUTINE_LOOKUP_SIGNER_VALID_UNTIL: ${{ vars.TELEBIRR_ROUTINE_LOOKUP_SIGNER_VALID_UNTIL }}
        run: |
          set -euo pipefail
          echo 'attempted=true' >>"$GITHUB_OUTPUT"
          psql -X \
            -v runtime_password="$ROUTINE_PAID_SETTLEMENT_RUNTIME_PASSWORD" \
            -v valid_until="$TELEBIRR_ROUTINE_LOOKUP_SIGNER_VALID_UNTIL" \
            --file=infra/sql/production-routine-paid-settlement-activate.sql >/dev/null

      - name: Record the exact previous SMS grants and login state
        if: inputs.mode == 'deploy-inert' && steps.protected.outputs.sms_mode == 'true'
        id: sms_previous
        shell: bash
        env:
          CONFIRMED_FINANCIAL_PROFILE: ${{ inputs.confirm_financial_switch_profile }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGHOST: ${{ env.PRODUCTION_DATABASE_POOLER_HOST }}
          PGPORT: ${{ env.PRODUCTION_DATABASE_ADMIN_POOLER_PORT }}
          PGDATABASE: postgres
          PGUSER: postgres.${{ env.PRODUCTION_PROJECT_REF }}
          PGSSLMODE: verify-full
          PGSSLROOTCERT: ${{ steps.protected.outputs.secret_dir }}/supabase-ca.crt
          PGCONNECT_TIMEOUT: '5'
          PGSERVICEFILE: /dev/null
          PGPASSFILE: /dev/null
        run: |
          set -euo pipefail
          state="$(psql -X -q -A -t -v ON_ERROR_STOP=1 -c "
            select
              (select rolcanlogin from pg_catalog.pg_roles where rolname = 'fetanagent_receiver_sms_ingest_runtime')::text || ',' ||
              (select rolcanlogin from pg_catalog.pg_roles where rolname = 'fetanagent_receiver_sms_settlement_runtime')::text || ',' ||
              pg_catalog.has_function_privilege('fetanagent_player_actions_runtime',
                'app.capture_telegram_receiver_sms_candidate(uuid,text,text,text,text,text,smallint,smallint,text)', 'EXECUTE')::text || ',' ||
              pg_catalog.has_function_privilege('fetanagent_owner_control_runtime',
                'app.list_owner_receiver_sms_old_payments(uuid,integer)', 'EXECUTE')::text || ',' ||
              pg_catalog.has_function_privilege('fetanagent_owner_control_runtime',
                'app.decide_owner_receiver_sms_old_payment(uuid,uuid,text)', 'EXECUTE')::text")"
          case "$state" in
            false,false,false,false,false) echo 'state=disabled' >>"$GITHUB_OUTPUT" ;;
            true,true,true,true,true) echo 'state=enabled' >>"$GITHUB_OUTPUT" ;;
            *) echo '::error::The SMS grants and logins are in a mixed state.'; exit 1 ;;
          esac
          if [[ "$CONFIRMED_FINANCIAL_PROFILE" == 'cbe-live-v1' ||
                "$CONFIRMED_FINANCIAL_PROFILE" == 'cbe-stopped-v1' ]]; then
            [[ "$state" == 'true,true,true,true,true' ]] || {
              echo '::error::The guarded CBE release requires existing SMS grants and logins.'
              exit 1
            }
          fi

      - name: Activate exact SMS grants and short-lived runtime logins
        if: inputs.mode == 'deploy-inert' && steps.protected.outputs.sms_mode == 'true' && inputs.confirm_financial_switch_profile == 'disabled'
        id: sms_activation
        shell: bash
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGHOST: ${{ env.PRODUCTION_DATABASE_POOLER_HOST }}
          PGPORT: ${{ env.PRODUCTION_DATABASE_ADMIN_POOLER_PORT }}
          PGDATABASE: postgres
          PGUSER: postgres.${{ env.PRODUCTION_PROJECT_REF }}
          PGSSLMODE: verify-full
          PGSSLROOTCERT: ${{ steps.protected.outputs.secret_dir }}/supabase-ca.crt
          PGCONNECT_TIMEOUT: '5'
          PGSERVICEFILE: /dev/null
          PGPASSFILE: /dev/null
          RECEIVER_SMS_INGEST_RUNTIME_PASSWORD: ${{ secrets.RECEIVER_SMS_INGEST_RUNTIME_PASSWORD }}
          RECEIVER_SMS_SETTLEMENT_RUNTIME_PASSWORD: ${{ secrets.RECEIVER_SMS_SETTLEMENT_RUNTIME_PASSWORD }}
        run: |
          set -euo pipefail
          echo 'attempted=true' >>"$GITHUB_OUTPUT"
          valid_until="$(date -u -d '+29 days' '+%Y-%m-%dT%H:%M:%SZ')"
          psql -X \
            -v ingest_password="$RECEIVER_SMS_INGEST_RUNTIME_PASSWORD" \
            -v settlement_password="$RECEIVER_SMS_SETTLEMENT_RUNTIME_PASSWORD" \
            -v valid_until="$valid_until" \
            --file=infra/sql/production-receiver-sms-runtimes-activate.sql >/dev/null

      - name: Build the exact active production TeleBirr assignment manifest
        if: inputs.mode == 'deploy'
        shell: bash
        env:
          SECRET_DIR: ${{ steps.protected.outputs.secret_dir }}
          PILOT_REVISION_ID: ${{ inputs.confirm_telebirr_pilot_revision_id }}
          ACTIVATION_EPOCH: ${{ inputs.confirm_telebirr_activation_epoch }}
          TELEBIRR_ASSIGNMENT_SIGNER_ID: ${{ vars.TELEBIRR_ASSIGNMENT_SIGNER_ID }}
          TELEBIRR_ASSIGNMENT_SIGNER_KEY_ID: ${{ vars.TELEBIRR_ASSIGNMENT_SIGNER_KEY_ID }}
          TELEBIRR_ASSIGNMENT_SIGNER_PUBLIC_SPKI_SHA256: ${{ vars.TELEBIRR_ASSIGNMENT_SIGNER_PUBLIC_SPKI_SHA256 }}
          TELEBIRR_REFERENCE_OPENING_KEY_ID: ${{ steps.protected.outputs.telebirr_reference_opening_key_id }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGHOST: ${{ env.PRODUCTION_DATABASE_POOLER_HOST }}
          PGPORT: ${{ env.PRODUCTION_DATABASE_ADMIN_POOLER_PORT }}
          PGDATABASE: postgres
          PGUSER: postgres.${{ env.PRODUCTION_PROJECT_REF }}
          PGSSLMODE: verify-full
          PGSSLROOTCERT: ${{ steps.protected.outputs.secret_dir }}/supabase-ca.crt
          PGCONNECT_TIMEOUT: '5'
          PGAPPNAME: fetanagent_production_telebirr_assignment_manifest
          PGSERVICEFILE: /dev/null
          PGPASSFILE: /dev/null
        run: |
          set -euo pipefail
          runtime_input="$SECRET_DIR/telebirr-assignment-runtime-input.json"
          partial_input="$runtime_input.partial"
          runtime_input_ready=false
          for attempt in 1 2 3 4; do
            rm -f -- "$partial_input"
            if psql -X --quiet --tuples-only --no-align \
              --set=pilot_revision_id="$PILOT_REVISION_ID" \
              --set=activation_epoch="$ACTIVATION_EPOCH" \
              --set=assignment_signer_id="$TELEBIRR_ASSIGNMENT_SIGNER_ID" \
              --set=assignment_signer_key_id="$TELEBIRR_ASSIGNMENT_SIGNER_KEY_ID" \
              --set=assignment_signer_public_spki_sha256="$TELEBIRR_ASSIGNMENT_SIGNER_PUBLIC_SPKI_SHA256" \
              --file=infra/sql/production-telebirr-assignment-runtime-input.sql \
              >"$partial_input" 2>/dev/null && [[ -s "$partial_input" ]]; then
              chmod 0600 "$partial_input"
              mv -- "$partial_input" "$runtime_input"
              runtime_input_ready=true
              break
            fi
            [[ "$attempt" -lt 4 ]] || break
            sleep "$((attempt * 2))"
          done
          if [[ "$runtime_input_ready" != true ]]; then
            rm -f -- "$partial_input"
            echo '::error::The active production TeleBirr assignment binding is unavailable.'
            exit 1
          fi
          node infra/build-telebirr-assignment-runtime-manifest.mjs \
            "$runtime_input" \
            "$SECRET_DIR/telebirr-assignment-runtime-manifest.v1.json"
          rm -f -- "$runtime_input"

      - name: Build the exact no-money production TeleBirr shadow assignment manifest
        if: inputs.mode == 'deploy-shadow' || inputs.mode == 'deploy-shadow-intake'
        shell: bash
        env:
          SECRET_DIR: ${{ steps.protected.outputs.secret_dir }}
          PILOT_REVISION_ID: ${{ inputs.confirm_telebirr_pilot_revision_id }}
          TELEBIRR_ASSIGNMENT_SIGNER_ID: ${{ vars.TELEBIRR_ASSIGNMENT_SIGNER_ID }}
          TELEBIRR_ASSIGNMENT_SIGNER_KEY_ID: ${{ vars.TELEBIRR_ASSIGNMENT_SIGNER_KEY_ID }}
          TELEBIRR_ASSIGNMENT_SIGNER_PUBLIC_SPKI_SHA256: ${{ vars.TELEBIRR_ASSIGNMENT_SIGNER_PUBLIC_SPKI_SHA256 }}
          TELEBIRR_REFERENCE_OPENING_KEY_ID: ${{ steps.protected.outputs.telebirr_reference_opening_key_id }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGHOST: ${{ env.PRODUCTION_DATABASE_POOLER_HOST }}
          PGPORT: ${{ env.PRODUCTION_DATABASE_ADMIN_POOLER_PORT }}
          PGDATABASE: postgres
          PGUSER: postgres.${{ env.PRODUCTION_PROJECT_REF }}
          PGSSLMODE: verify-full
          PGSSLROOTCERT: ${{ steps.protected.outputs.secret_dir }}/supabase-ca.crt
          PGCONNECT_TIMEOUT: '5'
          PGAPPNAME: fetanagent_production_telebirr_shadow_assignment_manifest
          PGSERVICEFILE: /dev/null
          PGPASSFILE: /dev/null
        run: |
          set -euo pipefail
          runtime_input="$SECRET_DIR/telebirr-assignment-runtime-input.json"
          partial_input="$runtime_input.partial"
          runtime_input_ready=false
          for attempt in 1 2 3 4; do
            rm -f -- "$partial_input"
            if psql -X --quiet --tuples-only --no-align \
              --set=pilot_revision_id="$PILOT_REVISION_ID" \
              --set=assignment_signer_id="$TELEBIRR_ASSIGNMENT_SIGNER_ID" \
              --set=assignment_signer_key_id="$TELEBIRR_ASSIGNMENT_SIGNER_KEY_ID" \
              --set=assignment_signer_public_spki_sha256="$TELEBIRR_ASSIGNMENT_SIGNER_PUBLIC_SPKI_SHA256" \
              --file=infra/sql/production-telebirr-shadow-assignment-runtime-input.sql \
              >"$partial_input" 2>/dev/null && [[ -s "$partial_input" ]]; then
              chmod 0600 "$partial_input"
              mv -- "$partial_input" "$runtime_input"
              runtime_input_ready=true
              break
            fi
            [[ "$attempt" -lt 4 ]] || break
            sleep "$((attempt * 2))"
          done
          if [[ "$runtime_input_ready" != true ]]; then
            rm -f -- "$partial_input"
            echo '::error::The no-money production TeleBirr shadow assignment binding is unavailable.'
            exit 1
          fi
          node infra/build-telebirr-assignment-runtime-manifest.mjs \
            "$runtime_input" \
            "$SECRET_DIR/telebirr-assignment-runtime-manifest.v1.json"
          rm -f -- "$runtime_input"

      - name: Verify Telegram identity without exposing the token
        shell: bash
        env:
          PRODUCTION_TELEGRAM_BOT_TOKEN: ${{ secrets.PRODUCTION_TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --max-time 15 \
            "https://api.telegram.org/bot${PRODUCTION_TELEGRAM_BOT_TOKEN}/getMe")"
          jq -e '.ok == true and .result.is_bot == true and (.result.username | ascii_downcase) == "fetanagentbot"' \
            <<<"$response" >/dev/null

      - name: Verify restricted server boundary and storage
        id: boundary
        shell: bash
        env:
          CONFIRMED_FINANCIAL_PROFILE: ${{ inputs.confirm_financial_switch_profile }}
          SECRET_DIR: ${{ steps.protected.outputs.secret_dir }}
          VM_HOST: ${{ steps.protected.outputs.vm_host }}
        run: |
          set -euo pipefail
          ssh_opts=(-F /dev/null -i "$SECRET_DIR/deploy-key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SECRET_DIR/known-hosts")
          remote="fetanagent-admin@$VM_HOST"
          helper='/usr/local/sbin/fetanagent-production-deploy-helper-v2'
          runtime_deployment_mode="$(<"$RUNNER_TEMP/release/runtime-deployment-mode")"
          case "$runtime_deployment_mode" in
            operational|shadow-review|inert-maintenance) ;;
            *) echo '::error::The sealed runtime deployment mode is invalid.'; exit 1 ;;
          esac
          current_state="$(ssh "${ssh_opts[@]}" "$remote" \
            "id -u | grep -vx 0 >/dev/null && id -un | grep -Fx fetanagent-admin >/dev/null && sudo -n '$helper' verify '${{ steps.protected.outputs.helper_sha }}' && sudo -n '$helper' check-release-mode '$GITHUB_SHA' '$runtime_deployment_mode' && sudo -n '$helper' preflight '${{ steps.protected.outputs.bundle_bytes }}' && sudo -n '$helper' current-state")"
          [[ "$current_state" == 'present' || "$current_state" == 'absent' ]]
          if [[ "$CONFIRMED_FINANCIAL_PROFILE" == 'cbe-live-v1' ||
                "$CONFIRMED_FINANCIAL_PROFILE" == 'cbe-stopped-v1' ]]; then
            [[ "$current_state" == 'present' ]] || {
              echo '::error::The guarded CBE release requires the reviewed running predecessor.'
              exit 1
            }
            ssh "${ssh_opts[@]}" "$remote" \
              "sudo -n '$helper' status '5c7943a96e4d895aaf5401680fabc6e1dd51a60b'"
          fi
          if [[ '${{ inputs.confirm_database_route }}' == 'direct' ]]; then
            [[ "$current_state" == 'absent' ]] || {
              echo '::error::Direct database recovery is allowed only for stopped production.' >&2
              exit 1
            }
          fi
          echo "current_state=$current_state" >>"$GITHUB_OUTPUT"

      - name: Restore only stopped SMS app credentials before cold deployment
        if: inputs.mode == 'deploy-inert' && steps.protected.outputs.sms_mode == 'true' && steps.boundary.outputs.current_state == 'absent'
        id: stopped_recovery
        shell: bash
        env:
          PRODUCTION_PROJECT_REF: ${{ env.PRODUCTION_PROJECT_REF }}
          CUSTOMER_WEB_RUNTIME_PASSWORD: ${{ secrets.CUSTOMER_WEB_RUNTIME_PASSWORD }}
          OWNER_CONTROL_RUNTIME_PASSWORD: ${{ secrets.OWNER_CONTROL_RUNTIME_PASSWORD }}
          PLAYER_ACTION_RUNTIME_PASSWORD: ${{ secrets.PLAYER_ACTION_RUNTIME_PASSWORD }}
          TELEBIRR_ASSIGNMENT_BROKER_RUNTIME_PASSWORD: ${{ secrets.TELEBIRR_ASSIGNMENT_BROKER_RUNTIME_PASSWORD }}
          TELEBIRR_DEVICE_STATE_RUNTIME_PASSWORD: ${{ secrets.TELEBIRR_DEVICE_STATE_RUNTIME_PASSWORD }}
          COMPANION_DEVICE_BRIDGE_RUNTIME_PASSWORD: ${{ secrets.COMPANION_DEVICE_BRIDGE_RUNTIME_PASSWORD }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGHOST: ${{ env.PRODUCTION_DATABASE_POOLER_HOST }}
          PGPORT: ${{ env.PRODUCTION_DATABASE_ADMIN_POOLER_PORT }}
          PGDATABASE: postgres
          PGUSER: postgres.${{ env.PRODUCTION_PROJECT_REF }}
          PGSSLMODE: verify-full
          PGSSLROOTCERT: ${{ steps.protected.outputs.secret_dir }}/supabase-ca.crt
          PGCONNECT_TIMEOUT: '5'
          PGAPPNAME: fetanagent_stopped_sms_runtime_restore
          PGSERVICEFILE: /dev/null
          PGPASSFILE: /dev/null
        run: |
          set -euo pipefail
          echo 'attempted=true' >>"$GITHUB_OUTPUT"
          psql -X --quiet --file=infra/sql/production-stopped-sms-runtime-restore.sql >/dev/null
          psql -X --quiet --file=infra/sql/production-companion-bridge-runtime-enable-continuous.sql >/dev/null

      - name: Verify the existing continuous least-privilege production credentials
        id: provision
        shell: bash
        env:
          TELEBIRR_ASSIGNMENT_BROKER_RUNTIME_PASSWORD: ${{ secrets.TELEBIRR_ASSIGNMENT_BROKER_RUNTIME_PASSWORD }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGHOST: ${{ env.PRODUCTION_DATABASE_POOLER_HOST }}
          PGPORT: ${{ env.PRODUCTION_DATABASE_ADMIN_POOLER_PORT }}
          PGDATABASE: postgres
          PGUSER: postgres.${{ env.PRODUCTION_PROJECT_REF }}
          PGSSLMODE: verify-full
          PGSSLROOTCERT: ${{ steps.protected.outputs.secret_dir }}/supabase-ca.crt
          PGSERVICEFILE: /dev/null
          PGPASSFILE: /dev/null
        run: |
          set -euo pipefail
          psql_with_connection_retry() {
            local attempt status=2
            for attempt in 1 2 3 4; do
              if psql "$@"; then
                return 0
              else
                status=$?
              fi
              # psql exit 2 is a connection failure. SQL or catalog failures keep their distinct
              # non-2 status and fail immediately rather than replaying a rejected operation.
              [[ "$status" -eq 2 && "$attempt" -lt 4 ]] || return "$status"
              sleep "$((attempt * 2))"
            done
            return "$status"
          }
          echo 'attempted=true' >>"$GITHUB_OUTPUT"
          companion_previous_login="$(psql_with_connection_retry -X -Atc "select rolcanlogin from pg_catalog.pg_roles where rolname = 'fetanagent_companion_device_bridge_runtime'")"
          [[ "$companion_previous_login" == 't' ]]
          echo "companion_previous_login=$companion_previous_login" >>"$GITHUB_OUTPUT"
          runtime_catalog_ready="$(psql_with_connection_retry -X -Atc "
            select count(*) = 5 and pg_catalog.bool_and(
              rolcanlogin and not rolinherit and not rolsuper and not rolcreatedb
              and not rolcreaterole and not rolreplication and not rolbypassrls
              and rolvaliduntil = 'infinity'::timestamptz
            )
            from pg_catalog.pg_roles
            where rolname in (
              'fetanagent_customer_web_runtime',
              'fetanagent_owner_control_runtime',
              'fetanagent_player_actions_runtime',
              'fetanagent_telebirr_assignment_broker_runtime',
              'fetanagent_telebirr_device_state_runtime'
            )")"
          [[ "$runtime_catalog_ready" == 't' ]]
          retired_catalog_ready="$(psql_with_connection_retry -X -Atc "
            select count(*) = 4 and pg_catalog.bool_and(not rolcanlogin)
            from pg_catalog.pg_roles
            where rolname in (
              'fetanagent_beta_admission_runtime',
              'fetanagent_routine_telebirr_no_money_runtime',
              'fetanagent_routine_telebirr_paid_poll_runtime',
              'fetanagent_routine_telebirr_paid_settlement_runtime'
            )")"
          [[ "$retired_catalog_ready" == 't' ]]

          # The assignment role intentionally has CONNECTION LIMIT 1, and the healthy current
          # broker owns that session. Opening a second session here would reject every rolling
          # deployment even when the protected credential is exact. Compare the supplied secret
          # with PostgreSQL's SCRAM verifier through the bounded administrator connection instead.
          umask 077
          assignment_verifier="$RUNNER_TEMP/telebirr-assignment-runtime.scram"
          trap 'rm -f -- "$assignment_verifier"' EXIT
          psql_with_connection_retry -X -Atc "
            select rolpassword
            from pg_catalog.pg_authid
            where rolname = 'fetanagent_telebirr_assignment_broker_runtime'
              and rolcanlogin
              and rolconnlimit = 1
              and rolvaliduntil = 'infinity'::timestamptz
          " >"$assignment_verifier"
          chmod 0600 "$assignment_verifier"
          POSTGRES_SCRAM_SECRET="$TELEBIRR_ASSIGNMENT_BROKER_RUNTIME_PASSWORD" \
            node infra/operations/verify-postgres-scram-secret.mjs "$assignment_verifier"
          rm -f -- "$assignment_verifier"
          trap - EXIT

      - name: Transfer and install the sealed release
        shell: bash
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          SECRET_DIR: ${{ steps.protected.outputs.secret_dir }}
          VM_HOST: ${{ steps.protected.outputs.vm_host }}
        run: |
          set -euo pipefail
          ssh_opts=(-F /dev/null -i "$SECRET_DIR/deploy-key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SECRET_DIR/known-hosts")
          remote="fetanagent-admin@$VM_HOST"
          helper='/usr/local/sbin/fetanagent-production-deploy-helper-v2'
          incoming="/tmp/fetanagent-production-$GITHUB_SHA"
          ssh "${ssh_opts[@]}" "$remote" \
            "sudo -n '$helper' verify '${{ steps.protected.outputs.helper_sha }}' && sudo -n '$helper' prepare-incoming '$GITHUB_SHA'"
          transfer_files=(
            "$RUNNER_TEMP/release/fetanagent-production-images.tar" \
            "$RUNNER_TEMP/release/runtime-deployment-mode" \
            infra/compose.production.yaml \
            infra/compose.production.companion-execution-v2.yaml \
            infra/compose.production.routine-deposits.yaml \
            "$RUNNER_TEMP/release/compose.production.shadow-review.yaml" \
            infra/compose.production.inert-maintenance.yaml \
            "$SECRET_DIR"/{companion-device-database-url,companion-bridge-server-signer.pkcs8.der,companion-bridge-runtime-manifest.v2.json,companion-bridge-runtime-manifest.v3.json} \
            "$SECRET_DIR"/{api-action-capability-hmac,api-action-payload-hmac,api-action-semantic-hmac,api-action-transport-hmac,bot-action-transport-hmac,bot-token,cbe-deposit-reference-encryption-key,cbe-deposit-reference-fingerprint-key,cbe-deposit-reference-key-profile.v1.json,customer-web-database-url,customer-web-rate-limit-hmac,deposit-proof-reference-encryption-master,deposit-proof-reference-fingerprint-master,deposit-proof-reference-profile.v2.json,owner-cbe-birr-lookup-encryption-master,owner-cbe-birr-lookup-fingerprint-master,owner-cbe-birr-receiver-lookup-profile.v2.json,owner-database-url,owner-routine-enrollment-signer-pkcs8,player-action-database-url,publishable-key,supabase-ca.crt,telebirr-assignment-signer-key-id,telebirr-assignment.spki.der,telebirr-bridge-runtime-manifest.v1.json,telebirr-bridge-server-signer.pkcs8.der,telebirr-device-state-database-url}
            "$SECRET_DIR"/bot-screenshot-reference-model-access-key
          )
          case "$REQUESTED_MODE" in
            deploy|deploy-shadow|deploy-shadow-intake)
              transfer_files+=(
                "$SECRET_DIR"/telebirr-assignment-database-url
                "$SECRET_DIR"/telebirr-assignment-runtime-manifest.v1.json
                "$SECRET_DIR"/telebirr-assignment-signer.pkcs8.der
                "$SECRET_DIR"/telebirr-reference-opening-key.v1.json
              )
              ;;
            deploy-inert)
              if [[ '${{ steps.protected.outputs.sms_mode }}' == 'true' ]]; then
                transfer_files+=(
                  "$SECRET_DIR"/receiver-sms-ingest-database-url
                  "$SECRET_DIR"/receiver-sms-settlement-database-url
                )
              else
                transfer_files+=(
                  "$SECRET_DIR"/routine-no-money-database-url
                  "$SECRET_DIR"/routine-paid-poll-database-url
                  "$SECRET_DIR"/routine-paid-settlement-database-url
                  "$SECRET_DIR"/routine-no-money-lookup-signer.pkcs8.der
                  "$SECRET_DIR"/routine-no-money-lookup-signer.v1.json
                  "$SECRET_DIR"/telebirr-reference-opening-key.v1.json
                )
              fi
              ;;
            *)
              echo '::error::The release transfer mode is not a deployment mode.'
              exit 1
              ;;
          esac
          scp "${ssh_opts[@]}" "${transfer_files[@]}" "$remote:$incoming/"
          ssh "${ssh_opts[@]}" "$remote" \
            "sudo -n '$helper' verify '${{ steps.protected.outputs.helper_sha }}' && sudo -n '$helper' install '$GITHUB_SHA' '${GITHUB_SHA:0:12}' '$incoming'"

      - name: Recheck guarded CBE payment state before activation
        if: inputs.mode == 'deploy-inert' && (inputs.confirm_financial_switch_profile == 'cbe-live-v1' || inputs.confirm_financial_switch_profile == 'cbe-stopped-v1')
        shell: bash
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGHOST: ${{ env.PRODUCTION_DATABASE_POOLER_HOST }}
          PGPORT: ${{ env.PRODUCTION_DATABASE_ADMIN_POOLER_PORT }}
          PGDATABASE: postgres
          PGUSER: postgres.${{ env.PRODUCTION_PROJECT_REF }}
          PGSSLMODE: verify-full
          PGSSLROOTCERT: ${{ steps.protected.outputs.secret_dir }}/supabase-ca.crt
          PGCONNECT_TIMEOUT: '5'
          PGAPPNAME: fetanagent_cbe_live_pre_activation
          PGSERVICEFILE: /dev/null
          PGPASSFILE: /dev/null
          SECRET_DIR: ${{ steps.protected.outputs.secret_dir }}
          VM_HOST: ${{ steps.protected.outputs.vm_host }}
          CONFIRMED_FINANCIAL_PROFILE: ${{ inputs.confirm_financial_switch_profile }}
        run: |
          set -euo pipefail
          case "$CONFIRMED_FINANCIAL_PROFILE" in
            cbe-live-v1) preflight=infra/sql/production-cbe-live-runtime-preflight.sql ;;
            cbe-stopped-v1) preflight=infra/sql/production-cbe-stopped-runtime-preflight.sql ;;
            *) exit 1 ;;
          esac
          psql -X --file="$preflight" >/dev/null
          psql -X --file=infra/sql/production-cbe-live-cutover-idle.sql >/dev/null
          fingerprint="$(psql -X -q -A -t -v ON_ERROR_STOP=1 \
            --file=infra/sql/production-financial-switch-fingerprint.sql)"
          [[ "$fingerprint" == '${{ steps.payment_profile.outputs.fingerprint }}' ]]
          ssh_opts=(-F /dev/null -i "$SECRET_DIR/deploy-key" -o BatchMode=yes
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$SECRET_DIR/known-hosts")
          ssh "${ssh_opts[@]}" "fetanagent-admin@$VM_HOST" \
            "sudo -n /usr/local/sbin/fetanagent-production-deploy-helper-v2 verify '${{ steps.protected.outputs.helper_sha }}' && sudo -n /usr/local/sbin/fetanagent-production-deploy-helper-v2 status '5c7943a96e4d895aaf5401680fabc6e1dd51a60b'"

      - name: Atomically activate production and switch the public edge
        id: activate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRMED_FINANCIAL_PROFILE: ${{ inputs.confirm_financial_switch_profile }}
          SECRET_DIR: ${{ steps.protected.outputs.secret_dir }}
          VM_HOST: ${{ steps.protected.outputs.vm_host }}
        run: |
          set -euo pipefail
          node infra/operations/require-production-ci.mjs
          ssh_opts=(-F /dev/null -i "$SECRET_DIR/deploy-key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SECRET_DIR/known-hosts")
          echo 'attempted=true' >>"$GITHUB_OUTPUT"
          if [[ "$CONFIRMED_FINANCIAL_PROFILE" == 'cbe-live-v1' ||
                "$CONFIRMED_FINANCIAL_PROFILE" == 'cbe-stopped-v1' ]]; then
            ssh "${ssh_opts[@]}" "fetanagent-admin@$VM_HOST" \
              "sudo -n /usr/local/sbin/fetanagent-production-deploy-helper-v2 verify '${{ steps.protected.outputs.helper_sha }}' && sudo -n /usr/local/sbin/fetanagent-production-deploy-helper-v2 activate '$GITHUB_SHA' carry-routine-marker"
          else
            ssh "${ssh_opts[@]}" "fetanagent-admin@$VM_HOST" \
              "sudo -n /usr/local/sbin/fetanagent-production-deploy-helper-v2 verify '${{ steps.protected.outputs.helper_sha }}' && sudo -n /usr/local/sbin/fetanagent-production-deploy-helper-v2 activate '$GITHUB_SHA'"
          fi
          echo 'completed=true' >>"$GITHUB_OUTPUT"

      - name: Verify live public production services
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..18}; do
            owner="$(curl --fail --silent --show-error --proto '=https' --tlsv1.2 --max-time 10 https://owner.fetanagent.com/owner || true)"
            customer="$(curl --fail --silent --show-error --proto '=https' --tlsv1.2 --max-time 10 https://fetanagent.com/sign-in || true)"
            pairing_status="$(curl --http1.1 --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --max-time 10 --request POST \
              --header 'Content-Type: application/vnd.fetanagent.telebirr-device-bridge+json' \
              --data '{}' https://device.fetanagent.com/v1/telebirr/device/enrollments:pair || true)"
            if grep -Fq 'Private production control' <<<"$owner" && \
              grep -Fq '<title>Sign in · FetanAgent</title>' <<<"$customer" && \
              [[ "$pairing_status" == '401' ]]; then
              exit 0
            fi
            sleep 5
          done
          echo '::error::The public production HTTPS smoke did not pass within 90 seconds.'
          exit 1

      - name: Verify requested signed Windows routine transport
        if: inputs.mode == 'deploy-inert'
        shell: bash
        env:
          REQUESTED_ROUTINE_TRANSPORT: ${{ inputs.confirm_routine_deposit_transport }}
        run: |
          set -euo pipefail
          case "$REQUESTED_ROUTINE_TRANSPORT" in
            disabled) expected_status=503 ;;
            enabled) expected_status=400 ;;
            *) exit 1 ;;
          esac
          status="$(curl --http1.1 --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --proto '=https' --tlsv1.2 --max-time 8 --request POST \
            --header 'Content-Type: application/vnd.fetanagent.companion-device-bridge+json' \
            --header 'Accept: application/vnd.fetanagent.companion-device-bridge+json' \
            --data '{}' https://device.fetanagent.com/v3/companion/device/routine-deposits:command)"
          [[ "$status" == "$expected_status" ]] || {
            echo '::error::The signed Windows routine route does not match the reviewed transport state.'
            exit 1
          }

      - name: Verify the payment switches remained unchanged
        if: inputs.mode == 'deploy-inert'
        shell: bash
        env:
          CONFIRMED_FINANCIAL_PROFILE: ${{ inputs.confirm_financial_switch_profile }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGHOST: ${{ env.PRODUCTION_DATABASE_POOLER_HOST }}
          PGPORT: ${{ env.PRODUCTION_DATABASE_ADMIN_POOLER_PORT }}
          PGDATABASE: postgres
          PGUSER: postgres.${{ env.PRODUCTION_PROJECT_REF }}
          PGSSLMODE: verify-full
          PGSSLROOTCERT: ${{ steps.protected.outputs.secret_dir }}/supabase-ca.crt
          PGCONNECT_TIMEOUT: '5'
          PGAPPNAME: fetanagent_production_payment_postflight
          PGSERVICEFILE: /dev/null
          PGPASSFILE: /dev/null
        run: |
          set -euo pipefail
          case "$CONFIRMED_FINANCIAL_PROFILE" in
            disabled) preflight=infra/sql/production-inert-runtime-preflight.sql ;;
            cbe-live-v1) preflight=infra/sql/production-cbe-live-runtime-preflight.sql ;;
            cbe-stopped-v1) preflight=infra/sql/production-cbe-stopped-runtime-preflight.sql ;;
            *) exit 1 ;;
          esac
          psql -X --file="$preflight" >/dev/null
          fingerprint="$(psql -X -q -A -t -v ON_ERROR_STOP=1 \
            --file=infra/sql/production-financial-switch-fingerprint.sql)"
          [[ "$fingerprint" == '${{ steps.payment_profile.outputs.fingerprint }}' ]] || {
            echo '::error::The production payment switch fingerprint changed during deployment.'
            exit 1
          }

      - name: Attest and finalize the production cutover
        shell: bash
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          CONFIRMED_FINANCIAL_PROFILE: ${{ inputs.confirm_financial_switch_profile }}
          SECRET_DIR: ${{ steps.protected.outputs.secret_dir }}
          VM_HOST: ${{ steps.protected.outputs.vm_host }}
        run: |
          set -euo pipefail
          ssh_opts=(-F /dev/null -i "$SECRET_DIR/deploy-key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SECRET_DIR/known-hosts")
          remote="fetanagent-admin@$VM_HOST"
          helper='/usr/local/sbin/fetanagent-production-deploy-helper-v2'
          ssh "${ssh_opts[@]}" "$remote" \
            "sudo -n '$helper' verify '${{ steps.protected.outputs.helper_sha }}' && sudo -n '$helper' status '$GITHUB_SHA' && sudo -n '$helper' finalize '$GITHUB_SHA'"
          if [[ "$REQUESTED_MODE" == 'deploy-inert' && "$CONFIRMED_FINANCIAL_PROFILE" == 'cbe-live-v1' ]]; then
            echo 'Production screenshot reference reading is deployed with the existing CBE Birr payment switches and signed receiver SMS route preserved. TeleBirr authority remains disabled. No test payment was made.' >>"$GITHUB_STEP_SUMMARY"
          elif [[ "$REQUESTED_MODE" == 'deploy-inert' && "$CONFIRMED_FINANCIAL_PROFILE" == 'cbe-stopped-v1' ]]; then
            echo 'Production Companion repair is deployed with the independent CBE switch preserved and both shared payment gates disabled. No payment or Player credit was attempted.' >>"$GITHUB_STEP_SUMMARY"
          elif [[ "$REQUESTED_MODE" == 'deploy-inert' && '${{ steps.protected.outputs.sms_mode }}' == 'true' ]]; then
            echo 'Production web, Telegram, and receiving-phone SMS transport are deployed. The SMS database route and all seven financial switches remain disabled; no SMS claim, job, or Player credit can start.' >>"$GITHUB_STEP_SUMMARY"
          elif [[ "$REQUESTED_MODE" == 'deploy-inert' ]]; then
            echo 'Production web, Telegram, and paired-phone receipt observation transport are live. The separate paid-review login may stage signed observations but cannot create payment claims, jobs, or Player credits. All seven financial switches remain disabled.' >>"$GITHUB_STEP_SUMMARY"
          elif [[ "$REQUESTED_MODE" == 'deploy-shadow' ]]; then
            echo 'Production web and Telegram are live in receiver-review-only mode. The exact pilot-bound destination may be reviewed, proof submission is unavailable, every financial/provider switch remains disabled, and no trusted TeleBirr activation epoch exists.' >>"$GITHUB_STEP_SUMMARY"
          elif [[ "$REQUESTED_MODE" == 'deploy-shadow-intake' ]]; then
            echo 'Production web, Telegram, and the pilot-bound Android evidence transport are live in no-money shadow-intake mode. Receiver disclosure is disabled, proof submissions can create only advisory shadow work, every financial/provider switch remains disabled, and no trusted TeleBirr activation epoch exists.' >>"$GITHUB_STEP_SUMMARY"
          else
            echo 'Production web, Telegram, and the pilot-bound Android evidence transport are live; this deployment changes no database financial switch, and assignment leasing remains bound to the exact active pilot epoch.' >>"$GITHUB_STEP_SUMMARY"
          fi
          echo 'The independently signed Windows companion production pairing and read-only transport is live on the production database.' >>"$GITHUB_STEP_SUMMARY"

      - name: Roll back a failed production activation
        if: always() && (failure() || cancelled()) && (steps.provision.outputs.attempted == 'true' || steps.stopped_recovery.outputs.attempted == 'true')
        shell: bash
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGHOST: ${{ env.PRODUCTION_DATABASE_POOLER_HOST }}
          PGPORT: ${{ env.PRODUCTION_DATABASE_ADMIN_POOLER_PORT }}
          PGDATABASE: postgres
          PGUSER: postgres.${{ env.PRODUCTION_PROJECT_REF }}
          PGSSLMODE: verify-full
          PGSSLROOTCERT: ${{ steps.protected.outputs.secret_dir }}/supabase-ca.crt
          PGSERVICEFILE: /dev/null
          PGPASSFILE: /dev/null
          SECRET_DIR: ${{ steps.protected.outputs.secret_dir }}
          VM_HOST: ${{ steps.protected.outputs.vm_host }}
          PREVIOUS_PRODUCTION_STATE: ${{ steps.boundary.outputs.current_state }}
          ACTIVATION_ATTEMPTED: ${{ steps.activate.outputs.attempted }}
          COMPANION_PREVIOUS_LOGIN: ${{ steps.provision.outputs.companion_previous_login }}
        run: |
          set +e
          rollback_status=0
          database_status=0
          if [[ -n "$SECRET_DIR" && -n "$VM_HOST" ]]; then
            recovery="sudo -n /usr/local/sbin/fetanagent-production-deploy-helper-v2 cleanup-incoming '$GITHUB_SHA'"
            if [[ "$ACTIVATION_ATTEMPTED" == 'true' ]]; then
              recovery="sudo -n /usr/local/sbin/fetanagent-production-deploy-helper-v2 rollback '$GITHUB_SHA' && $recovery"
            fi
            ssh -F /dev/null -i "$SECRET_DIR/deploy-key" -o BatchMode=yes -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SECRET_DIR/known-hosts" \
              "fetanagent-admin@$VM_HOST" "$recovery" || rollback_status=$?
          else
            rollback_status=1
          fi
          if [[ "$PREVIOUS_PRODUCTION_STATE" == 'absent' ]]; then
            psql -X --file=infra/sql/production-nonfinancial-runtimes-disable.sql || database_status=$?
          elif [[ "$PREVIOUS_PRODUCTION_STATE" != 'present' ]]; then
            database_status=1
          fi
          if [[ "$COMPANION_PREVIOUS_LOGIN" == 'f' ]]; then
            psql -X --file=infra/sql/production-companion-runtime-disable.sql || database_status=$?
          fi
          [[ "$rollback_status" -eq 0 && "$database_status" -eq 0 ]]

      - name: Disable no-money phone review after failed deployment
        if: always() && (failure() || cancelled()) && steps.routine_review_activation.outputs.attempted == 'true' && steps.routine_previous_logins.outputs.no_money == 'false'
        shell: bash
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGHOST: ${{ env.PRODUCTION_DATABASE_POOLER_HOST }}
          PGPORT: ${{ env.PRODUCTION_DATABASE_ADMIN_POOLER_PORT }}
          PGDATABASE: postgres
          PGUSER: postgres.${{ env.PRODUCTION_PROJECT_REF }}
          PGSSLMODE: verify-full
          PGSSLROOTCERT: ${{ steps.protected.outputs.secret_dir }}/supabase-ca.crt
          PGCONNECT_TIMEOUT: '5'
          PGAPPNAME: fetanagent_routine_no_money_failed_deployment_disable
          PGSERVICEFILE: /dev/null
          PGPASSFILE: /dev/null
        run: psql -X --file=infra/sql/production-routine-no-money-disable.sql >/dev/null

      - name: Disable paid phone observation after failed deployment
        if: always() && (failure() || cancelled()) && steps.routine_paid_activation.outputs.attempted == 'true' && steps.routine_previous_logins.outputs.paid_poll == 'false'
        shell: bash
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGHOST: ${{ env.PRODUCTION_DATABASE_POOLER_HOST }}
          PGPORT: ${{ env.PRODUCTION_DATABASE_ADMIN_POOLER_PORT }}
          PGDATABASE: postgres
          PGUSER: postgres.${{ env.PRODUCTION_PROJECT_REF }}
          PGSSLMODE: verify-full
          PGSSLROOTCERT: ${{ steps.protected.outputs.secret_dir }}/supabase-ca.crt
          PGCONNECT_TIMEOUT: '5'
          PGAPPNAME: fetanagent_routine_paid_failed_deployment_disable
          PGSERVICEFILE: /dev/null
          PGPASSFILE: /dev/null
        run: psql -X --file=infra/sql/production-routine-paid-poll-disable.sql >/dev/null

      - name: Disable paid settlement after failed deployment
        if: always() && (failure() || cancelled()) && steps.routine_paid_settlement_activation.outputs.attempted == 'true' && steps.routine_previous_logins.outputs.paid_settlement == 'false'
        shell: bash
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGHOST: ${{ env.PRODUCTION_DATABASE_POOLER_HOST }}
          PGPORT: ${{ env.PRODUCTION_DATABASE_ADMIN_POOLER_PORT }}
          PGDATABASE: postgres
          PGUSER: postgres.${{ env.PRODUCTION_PROJECT_REF }}
          PGSSLMODE: verify-full
          PGSSLROOTCERT: ${{ steps.protected.outputs.secret_dir }}/supabase-ca.crt
          PGCONNECT_TIMEOUT: '5'
          PGAPPNAME: fetanagent_routine_paid_settlement_failed_deployment_disable
          PGSERVICEFILE: /dev/null
          PGPASSFILE: /dev/null
        run: psql -X --file=infra/sql/production-routine-paid-settlement-disable.sql >/dev/null

      - name: Restore disabled SMS grants and logins after failed first deployment
        if: always() && (failure() || cancelled()) && steps.sms_activation.outputs.attempted == 'true' && steps.sms_previous.outputs.state == 'disabled'
        shell: bash
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGHOST: ${{ env.PRODUCTION_DATABASE_POOLER_HOST }}
          PGPORT: ${{ env.PRODUCTION_DATABASE_ADMIN_POOLER_PORT }}
          PGDATABASE: postgres
          PGUSER: postgres.${{ env.PRODUCTION_PROJECT_REF }}
          PGSSLMODE: verify-full
          PGSSLROOTCERT: ${{ steps.protected.outputs.secret_dir }}/supabase-ca.crt
          PGCONNECT_TIMEOUT: '5'
          PGSERVICEFILE: /dev/null
          PGPASSFILE: /dev/null
        run: psql -X --file=infra/sql/production-receiver-sms-runtimes-disable.sql >/dev/null

  operate:
    name: Inspect or stop production runtime
    if: inputs.mode == 'status' || inputs.mode == 'stop'
    needs: validate-target
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    steps:
      - name: Check out the exact operations contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare protected connection
        id: connection
        shell: bash
        env:
          PRODUCTION_VM_HOST: ${{ secrets.PRODUCTION_VM_HOST }}
          PRODUCTION_VM_KNOWN_HOSTS: ${{ secrets.PRODUCTION_VM_KNOWN_HOSTS }}
          PRODUCTION_VM_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_VM_SSH_PRIVATE_KEY }}
          SUPABASE_CA_CERTIFICATE_PEM: ${{ secrets.SUPABASE_CA_CERTIFICATE_PEM }}
        run: |
          set -euo pipefail
          protected="$RUNNER_TEMP/production-connection"
          install -d -m 0700 "$protected"
          umask 077
          printf '%s\n' "$PRODUCTION_VM_SSH_PRIVATE_KEY" >"$protected/deploy-key"
          printf '%s\n' "$PRODUCTION_VM_KNOWN_HOSTS" >"$protected/known-hosts"
          printf '%s\n' "$SUPABASE_CA_CERTIFICATE_PEM" >"$protected/supabase-ca.crt"
          chmod 0600 "$protected"/*
          [[ "$PRODUCTION_VM_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          ssh-keygen -y -f "$protected/deploy-key" >/dev/null
          ssh-keygen -F "$PRODUCTION_VM_HOST" -f "$protected/known-hosts" >/dev/null
          openssl x509 -in "$protected/supabase-ca.crt" -noout -checkend 0 >/dev/null
          echo "protected=$protected" >>"$GITHUB_OUTPUT"
          echo "vm_host=$PRODUCTION_VM_HOST" >>"$GITHUB_OUTPUT"
          echo "helper_sha=$(sha256sum infra/operations/fetanagent-production-deploy-helper-v2.sh | cut -d ' ' -f 1)" >>"$GITHUB_OUTPUT"

      - name: Inspect exact live production release
        if: inputs.mode == 'status'
        shell: bash
        run: |
          set -euo pipefail
          ssh -F /dev/null -i '${{ steps.connection.outputs.protected }}/deploy-key' -o BatchMode=yes \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile='${{ steps.connection.outputs.protected }}/known-hosts' \
            'fetanagent-admin@${{ steps.connection.outputs.vm_host }}' \
            "sudo -n /usr/local/sbin/fetanagent-production-deploy-helper-v2 verify '${{ steps.connection.outputs.helper_sha }}' && sudo -n /usr/local/sbin/fetanagent-production-deploy-helper-v2 status '$GITHUB_SHA'"

      - name: Stop production and disable all application logins
        if: inputs.mode == 'stop'
        shell: bash
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGHOST: ${{ env.PRODUCTION_DATABASE_POOLER_HOST }}
          PGPORT: ${{ env.PRODUCTION_DATABASE_ADMIN_POOLER_PORT }}
          PGDATABASE: postgres
          PGUSER: postgres.${{ env.PRODUCTION_PROJECT_REF }}
          PGSSLMODE: verify-full
          PGSSLROOTCERT: ${{ steps.connection.outputs.protected }}/supabase-ca.crt
          PGSERVICEFILE: /dev/null
          PGPASSFILE: /dev/null
        run: |
          set -euo pipefail
          ssh -F /dev/null -i '${{ steps.connection.outputs.protected }}/deploy-key' -o BatchMode=yes \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile='${{ steps.connection.outputs.protected }}/known-hosts' \
            'fetanagent-admin@${{ steps.connection.outputs.vm_host }}' \
            "sudo -n /usr/local/sbin/fetanagent-production-deploy-helper-v2 verify '${{ steps.connection.outputs.helper_sha }}' && sudo -n /usr/local/sbin/fetanagent-production-deploy-helper-v2 stop"
          psql -X --file=infra/sql/production-nonfinancial-runtimes-disable.sql
          psql -X --file=infra/sql/production-routine-no-money-disable.sql
          psql -X --file=infra/sql/production-routine-paid-poll-disable.sql
          psql -X --file=infra/sql/production-routine-paid-settlement-disable.sql
          psql -X --file=infra/sql/production-receiver-sms-runtimes-stop.sql
