name: Recover production TeleBirr shadow authority deadline

on:
  workflow_dispatch:
    inputs:
      confirm_production_project_ref:
        description: Type the exact production Supabase project ref
        required: true
        type: string
      confirm_main_commit_sha:
        description: Type the exact full reviewed main commit SHA
        required: true
        type: string
      confirm_pilot_revision_id:
        description: Type the exact armed dry-run pilot UUID
        required: true
        type: string
      confirm_source_shadow_proof_request_id:
        description: Type the exact immutable quarantined source proof UUID
        required: true
        type: string
      confirm_retry_request_key:
        description: Type one fresh UUIDv4 for the append-only retry ledger
        required: true
        type: string
      confirm_operation:
        description: Type RECOVER TELEBIRR SHADOW AUTHORITY DEADLINE - 12H NO MONEY
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fetanagent-production-telebirr-shadow-authority-deadline-recovery
  cancel-in-progress: false

env:
  PRODUCTION_PROJECT_REF: xzztugbgtulptnbpoelr
  PRODUCTION_DATABASE_POOLER_HOST: aws-0-eu-west-1.pooler.supabase.com
  PRODUCTION_DATABASE_ADMIN_POOLER_PORT: '6543'

jobs:
  validate:
    name: Validate exact append-only no-money recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CONFIRMED_PROJECT: ${{ inputs.confirm_production_project_ref }}
      CONFIRMED_COMMIT: ${{ inputs.confirm_main_commit_sha }}
      CONFIRMED_PILOT: ${{ inputs.confirm_pilot_revision_id }}
      CONFIRMED_PROOF: ${{ inputs.confirm_source_shadow_proof_request_id }}
      CONFIRMED_REQUEST: ${{ inputs.confirm_retry_request_key }}
      CONFIRMED_OPERATION: ${{ inputs.confirm_operation }}
    steps:
      - name: Require main, exact identifiers, and twelve-hour no-money phrase
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$CONFIRMED_COMMIT" == "$GITHUB_SHA" ]]
          [[ "$CONFIRMED_PROJECT" == "$PRODUCTION_PROJECT_REF" ]]
          uuid='^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
          uuid_v4='^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
          [[ "$CONFIRMED_PILOT" =~ $uuid ]]
          [[ "$CONFIRMED_PROOF" =~ $uuid ]]
          [[ "$CONFIRMED_REQUEST" =~ $uuid_v4 ]]
          [[ "$CONFIRMED_OPERATION" == \
             'RECOVER TELEBIRR SHADOW AUTHORITY DEADLINE - 12H NO MONEY' ]]

  recover:
    name: Preserve quarantines and create one 12-hour child proof
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out the exact production contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Require exact passing main CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: node infra/operations/require-production-ci.mjs

      - name: Create only the reviewed append-only no-money replacement
        shell: bash
        env:
          SUPABASE_CA_CERTIFICATE_PEM: ${{ secrets.SUPABASE_CA_CERTIFICATE_PEM }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGHOST: ${{ env.PRODUCTION_DATABASE_POOLER_HOST }}
          PGPORT: ${{ env.PRODUCTION_DATABASE_ADMIN_POOLER_PORT }}
          PGDATABASE: postgres
          PGUSER: postgres.${{ env.PRODUCTION_PROJECT_REF }}
          PGSSLMODE: verify-full
          PGCONNECT_TIMEOUT: '5'
          PGSERVICEFILE: /dev/null
          PGPASSFILE: /dev/null
          PILOT_REVISION_ID: ${{ inputs.confirm_pilot_revision_id }}
          SOURCE_SHADOW_PROOF_REQUEST_ID: ${{ inputs.confirm_source_shadow_proof_request_id }}
          AUTHORITY_DEADLINE_RETRY_REQUEST_KEY: ${{ inputs.confirm_retry_request_key }}
          REVIEWED_MAIN_COMMIT_SHA: ${{ inputs.confirm_main_commit_sha }}
        run: |
          set -euo pipefail
          umask 077
          [[ -n "$PGPASSWORD" && -n "$SUPABASE_CA_CERTIFICATE_PEM" ]]
          ca_file="$RUNNER_TEMP/fetanagent-production-authority-deadline-recovery-ca.crt"
          cleanup() {
            local status=$?
            trap - EXIT INT TERM
            if [[ "$ca_file" == \
                  "$RUNNER_TEMP/fetanagent-production-authority-deadline-recovery-ca.crt" && \
                  -f "$ca_file" && ! -L "$ca_file" ]]; then
              shred --force --remove=unlink --zero "$ca_file" 2>/dev/null || rm --force "$ca_file"
            fi
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          printf '%s\n' "$SUPABASE_CA_CERTIFICATE_PEM" >"$ca_file"
          chmod 0600 "$ca_file"
          openssl x509 -in "$ca_file" -noout -checkend 0 >/dev/null
          export PGSSLROOTCERT="$ca_file"

          preflight="$(
            timeout --signal=TERM --kill-after=5s 60s \
              psql -X --quiet --tuples-only --no-align \
                --file=infra/sql/production-telebirr-shadow-authority-deadline-preflight.sql
          )"
          jq '{
            ready,
            minimumReviewWindowHours,
            proofPresent: .proof_present,
            recoveryPresent: .recovery_present,
            proofShapeExact: .proof_shape_exact,
            proofExpired: .proof_expired,
            sourceRecoveryValid: .source_recovery_valid,
            sourceRecoveryShapeExact: .source_recovery_shape_exact,
            attemptsBounded: .attempts_bounded,
            attemptHistoryPresent: .attempt_history_present,
            everyAttemptQuarantined: .every_attempt_quarantined,
            quarantineHistoryPresent: .quarantine_history_present,
            stagedBindingsValid: .staged_bindings_valid,
            noShadowOutcome: .no_shadow_outcome,
            noProviderEvidence: .no_provider_evidence,
            pilotCurrent: .pilot_current,
            pilotTwelveHours: .pilot_twelve_hours,
            pilotBindingValid: .pilot_binding_valid,
            profileCurrent: .profile_current,
            profileTwelveHours: .profile_twelve_hours,
            profileBindingValid: .profile_binding_valid,
            enrollmentCurrent: .enrollment_current,
            enrollmentTwelveHours: .enrollment_twelve_hours,
            signerCurrent: .signer_current,
            signerTwelveHours: .signer_twelve_hours,
            switchesSafe: .switches_safe,
            companionDisabled: .companion_disabled,
            trustedAuthorityInactive: .trusted_authority_inactive,
            privilegedLoginsDisabled: .privileged_logins_disabled,
            privilegedSessionsAbsent: .privileged_sessions_absent,
            financialBoundary,
            moneyMoved
          }' <<<"$preflight" | tee -a "$GITHUB_STEP_SUMMARY"
          jq -e '
            .schemaVersion == 1 and
            .operation == "telebirr_shadow_authority_deadline_preflight" and
            .deploymentTarget == "production" and
            .minimumReviewWindowHours == 12 and
            .ready == true and
            .financialBoundary == "dry_run" and
            .moneyMoved == false
          ' <<<"$preflight" >/dev/null

          result="$(
            timeout --signal=TERM --kill-after=5s 90s \
              psql -X --quiet --tuples-only --no-align \
                --file=infra/sql/production-telebirr-shadow-authority-deadline-recovery.sql
          )"
          jq -e '
            .schemaVersion == 1 and
            .operation == "telebirr_shadow_authority_deadline_recovery" and
            .deploymentTarget == "production" and
            .retryState == "armed" and
            .reviewWindowHours == 12 and
            .priorEvidencePreserved == true and
            .priorQuarantinePreserved == true and
            .financialBoundary == "dry_run" and
            .kemerBetExecutionEnabled == false and
            .moneyMoved == false
          ' <<<"$result" >/dev/null
          echo '::notice::One append-only 12-hour shadow review request is armed; all prior quarantines remain immutable and no money authority was enabled.'
