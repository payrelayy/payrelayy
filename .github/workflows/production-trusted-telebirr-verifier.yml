name: Production trusted TeleBirr verifier

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Plan, stage a disabled release, inspect the inert boundary, or emergency-disable
        required: true
        default: plan
        type: choice
        options:
          - plan
          - stage-disabled
          - status
          - emergency-disable
      confirm_production_project_ref:
        description: Type the exact production Supabase project ref
        required: true
        type: string
      confirm_main_commit_sha:
        description: Type the exact full reviewed main commit SHA
        required: true
        type: string
      confirm_droplet_id:
        description: Type the exact production DigitalOcean droplet ID
        required: true
        type: string
      confirm_pin_manifest_sha256:
        description: For staging type the reviewed sha256 digest; otherwise type not-applicable
        required: true
        type: string
      confirm_operation:
        description: Type the exact operation phrase documented in the verifier runbook
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fetanagent-production-trusted-telebirr-verifier
  # Emergency intent cancels an older run in this exact lifecycle before its two independent kill
  # jobs run. Other operations remain serialized and never cancel each other.
  cancel-in-progress: ${{ inputs.mode == 'emergency-disable' }}

env:
  STAGING_PROJECT_REF: spzpiyxheappsfyswewl
  PRODUCTION_PROJECT_REF: xzztugbgtulptnbpoelr
  PRODUCTION_DROPLET_ID: '593344964'
  PRODUCTION_DATABASE_DIRECT_HOST: db.xzztugbgtulptnbpoelr.supabase.co
  PRODUCTION_DATABASE_TUNNEL_PORT: '25432'
  VERIFIER_RUNTIME_ROLE: fetanagent_trusted_telebirr_verifier_runtime

jobs:
  validate-target:
    name: Validate exact production verifier operation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require main, exact target, source, and action-time operation phrase
        shell: bash
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          CONFIRMED_PROJECT: ${{ inputs.confirm_production_project_ref }}
          CONFIRMED_COMMIT: ${{ inputs.confirm_main_commit_sha }}
          CONFIRMED_DROPLET: ${{ inputs.confirm_droplet_id }}
          CONFIRMED_PIN_DIGEST: ${{ inputs.confirm_pin_manifest_sha256 }}
          CONFIRMED_OPERATION: ${{ inputs.confirm_operation }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$CONFIRMED_COMMIT" == "$GITHUB_SHA" ]]
          [[ "$CONFIRMED_PROJECT" == "$PRODUCTION_PROJECT_REF" ]]
          [[ "$CONFIRMED_PROJECT" != "$STAGING_PROJECT_REF" ]]
          [[ "$CONFIRMED_DROPLET" == "$PRODUCTION_DROPLET_ID" ]]
          case "$REQUESTED_MODE:$CONFIRMED_OPERATION" in
            'plan:PLAN PRODUCTION VERIFIER'|'stage-disabled:STAGE DISABLED PRODUCTION VERIFIER'|'status:STATUS PRODUCTION VERIFIER'|'emergency-disable:EMERGENCY DISABLE PRODUCTION VERIFIER') ;;
            *)
              echo '::error::The verifier operation confirmation does not match the selected mode.'
              exit 1
              ;;
          esac
          if [[ "$REQUESTED_MODE" == 'stage-disabled' ]]; then
            [[ "$CONFIRMED_PIN_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          else
            [[ "$CONFIRMED_PIN_DIGEST" == 'not-applicable' ]]
          fi

  validate-ci:
    name: Require exact production commit CI
    if: inputs.mode == 'stage-disabled'
    needs: validate-target
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Require latest passing main push CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: node infra/operations/require-production-ci.mjs

  build:
    name: Build sealed verifier image without production inputs
    if: >-
      always() && !cancelled() && needs.validate-target.result == 'success' &&
      (inputs.mode == 'plan' ||
       (inputs.mode == 'stage-disabled' && needs.validate-ci.result == 'success'))
    needs: [validate-target, validate-ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify production verifier contracts
        shell: bash
        run: |
          set -euo pipefail
          node infra/verify-trusted-telebirr-verifier-deployment.mjs
          bash -n infra/operations/fetanagent-production-trusted-telebirr-verifier-helper.sh
          bash -n infra/operations/fetanagent-production-direct-database-tunnel.sh
      - name: Build and inspect exact commit image
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_SHA:0:12}"
          image="fetanagent-trusted-telebirr-verifier:$tag"
          docker build --pull=false --target trusted-telebirr-verifier \
            --build-arg "VCS_REF=$GITHUB_SHA" --tag "$image" .
          [[ "$(docker image inspect "$image" --format '{{.Config.User}}')" == '10001:10001' ]]
          [[ "$(docker image inspect "$image" \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" == "$GITHUB_SHA" ]]
          [[ "$(docker image inspect "$image" --format '{{json .Config.ExposedPorts}}')" == 'null' ]]
      - name: Save sealed image bundle
        if: inputs.mode == 'stage-disabled'
        shell: bash
        run: |
          set -euo pipefail
          docker save --output "$RUNNER_TEMP/fetanagent-trusted-telebirr-verifier-image.tar" \
            "fetanagent-trusted-telebirr-verifier:${GITHUB_SHA:0:12}"
      - name: Upload one-use sealed image bundle
        if: inputs.mode == 'stage-disabled'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-trusted-telebirr-verifier-${{ github.sha }}
          path: ${{ runner.temp }}/fetanagent-trusted-telebirr-verifier-image.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  stage-disabled:
    name: Stage exact stopped production verifier release
    if: inputs.mode == 'stage-disabled'
    needs: [validate-target, validate-ci, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    steps:
      - name: Check out deployment contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Recheck latest main push CI before protected inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: node infra/operations/require-production-ci.mjs
      - name: Download sealed image bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: production-trusted-telebirr-verifier-${{ github.sha }}
          path: ${{ runner.temp }}/release
      - name: Validate and prepare protected release inputs
        id: protected
        shell: bash
        env:
          PIN_MANIFEST_BASE64: ${{ vars.TRUSTED_TELEBIRR_VERIFIER_PIN_MANIFEST_V1_BASE64 }}
          SUPABASE_CA_CERTIFICATE_PEM: ${{ secrets.SUPABASE_CA_CERTIFICATE_PEM }}
          PRODUCTION_VM_HOST: ${{ secrets.PRODUCTION_VM_HOST }}
          PRODUCTION_VM_KNOWN_HOSTS: ${{ secrets.PRODUCTION_VM_KNOWN_HOSTS }}
          PRODUCTION_VM_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_VM_SSH_PRIVATE_KEY }}
          CONFIRMED_PIN_DIGEST: ${{ inputs.confirm_pin_manifest_sha256 }}
        run: |
          set -euo pipefail
          umask 077
          protected="$RUNNER_TEMP/production-verifier-protected"
          install -d -m 0700 "$protected"
          [[ "$PRODUCTION_VM_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          disabled_password="$(openssl rand -hex 32)"
          [[ "$disabled_password" =~ ^[0-9a-f]{64}$ ]]
          printf '%s\n' "$PRODUCTION_VM_SSH_PRIVATE_KEY" >"$protected/deploy-key"
          printf '%s\n' "$PRODUCTION_VM_KNOWN_HOSTS" >"$protected/known-hosts"
          printf '%s\n' "$SUPABASE_CA_CERTIFICATE_PEM" >"$protected/supabase-ca.crt"
          printf '%s' "$PIN_MANIFEST_BASE64" | base64 --decode >"$protected/trusted-telebirr-verifier-pins.v1.json"
          printf 'postgresql://%s:%s@%s:5432/postgres?sslmode=verify-full' \
            "$VERIFIER_RUNTIME_ROLE" "$disabled_password" "$PRODUCTION_DATABASE_DIRECT_HOST" \
            >"$protected/trusted-telebirr-verifier-database-url"
          unset disabled_password
          chmod 0600 "$protected"/*
          ssh-keygen -y -f "$protected/deploy-key" >/dev/null
          ssh-keygen -F "$PRODUCTION_VM_HOST" -f "$protected/known-hosts" >/dev/null
          openssl x509 -in "$protected/supabase-ca.crt" -noout -checkend 0 >/dev/null
          [[ "sha256:$(sha256sum "$protected/trusted-telebirr-verifier-pins.v1.json" | cut -d ' ' -f 1)" == \
            "$CONFIRMED_PIN_DIGEST" ]]
          node --input-type=module - "$protected/trusted-telebirr-verifier-pins.v1.json" <<'NODE'
          import { createHash, createPublicKey } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          const text = readFileSync(process.argv[2], 'utf8');
          const manifest = JSON.parse(text);
          if (JSON.stringify(manifest) !== text ||
              Object.keys(manifest).join(',') !== 'contractVersion,assignmentSigners,devices' ||
              manifest.contractVersion !== 1) process.exit(1);
          const pins = [...manifest.assignmentSigners, ...manifest.devices];
          if (!Array.isArray(manifest.assignmentSigners) || !Array.isArray(manifest.devices) ||
              manifest.assignmentSigners.length < 1 || manifest.assignmentSigners.length > 16 ||
              manifest.devices.length < 1 || manifest.devices.length > 16) process.exit(1);
          const ids = new Set();
          const digests = new Set();
          for (const pin of pins) {
            if (Object.keys(pin).join(',') !== 'keyId,publicKeySpkiDerBase64' ||
                !/^[A-Za-z0-9][A-Za-z0-9_-]{7,127}$/.test(pin.keyId) || ids.has(pin.keyId)) process.exit(1);
            const bytes = Buffer.from(pin.publicKeySpkiDerBase64, 'base64');
            const key = createPublicKey({ key: bytes, format: 'der', type: 'spki' });
            const canonical = Buffer.from(key.export({ format: 'der', type: 'spki' }));
            const digest = createHash('sha256').update(bytes).digest('hex');
            if (bytes.toString('base64') !== pin.publicKeySpkiDerBase64 || bytes.length !== 91 ||
                !bytes.equals(canonical) || key.asymmetricKeyType !== 'ec' ||
                key.asymmetricKeyDetails?.namedCurve !== 'prime256v1' || digests.has(digest)) process.exit(1);
            ids.add(pin.keyId); digests.add(digest); bytes.fill(0); canonical.fill(0);
          }
          NODE
          echo "protected=$protected" >>"$GITHUB_OUTPUT"
          echo "vm_host=$PRODUCTION_VM_HOST" >>"$GITHUB_OUTPUT"
          echo "helper_sha=$(sha256sum infra/operations/fetanagent-production-trusted-telebirr-verifier-helper.sh | cut -d ' ' -f 1)" >>"$GITHUB_OUTPUT"
      - name: Stage sealed release without starting or enabling it
        shell: bash
        env:
          PROTECTED: ${{ steps.protected.outputs.protected }}
          VM_HOST: ${{ steps.protected.outputs.vm_host }}
          HELPER_SHA: ${{ steps.protected.outputs.helper_sha }}
          PIN_DIGEST: ${{ inputs.confirm_pin_manifest_sha256 }}
        run: |
          set -euo pipefail
          incoming="/tmp/fetanagent-production-trusted-telebirr-verifier-$GITHUB_SHA"
          image_tar="$RUNNER_TEMP/release/fetanagent-trusted-telebirr-verifier-image.tar"
          bytes="$(stat -c %s "$image_tar")"
          ssh_opts=(-F /dev/null -i "$PROTECTED/deploy-key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$PROTECTED/known-hosts" \
            -o ConnectTimeout=8 -o ConnectionAttempts=1 -o ServerAliveInterval=5 \
            -o ServerAliveCountMax=1)
          remote="fetanagent-admin@$VM_HOST"
          helper='/usr/local/sbin/fetanagent-production-trusted-telebirr-verifier-helper'

          cleanup_incoming() {
            local cleanup_status=0
            timeout --signal=TERM --kill-after=10s 60s \
              ssh "${ssh_opts[@]}" "$remote" \
                "sudo -n '$helper' cleanup-incoming '$GITHUB_SHA'" || cleanup_status=$?
            if [[ "$cleanup_status" -ne 0 ]]; then
              echo '::error::The bounded remote incoming cleanup failed; the next stage retries it before creating a release.' >&2
            fi
            return "$cleanup_status"
          }
          finish_stage() {
            local command_status=$? cleanup_status=0
            trap - EXIT
            cleanup_incoming || cleanup_status=$?
            if [[ "$command_status" -ne 0 ]]; then exit "$command_status"; fi
            exit "$cleanup_status"
          }
          trap finish_stage EXIT

          timeout --signal=TERM --kill-after=10s 60s \
            ssh "${ssh_opts[@]}" "$remote" \
              "sudo -n '$helper' verify '$HELPER_SHA' && sudo -n '$helper' preflight '$bytes' && sudo -n '$helper' cleanup-incoming '$GITHUB_SHA' && sudo -n '$helper' prepare-incoming '$GITHUB_SHA'"
          timeout --signal=TERM --kill-after=30s 10m \
            scp "${ssh_opts[@]}" \
            "$image_tar" \
            infra/compose.production-trusted-telebirr-verifier.yaml \
            "$PROTECTED/supabase-ca.crt" \
            "$PROTECTED/trusted-telebirr-verifier-database-url" \
            "$PROTECTED/trusted-telebirr-verifier-pins.v1.json" \
            "$remote:$incoming/"
          timeout --signal=TERM --kill-after=10s 90s \
            ssh "${ssh_opts[@]}" "$remote" \
              "chmod 0600 '$incoming'/* && sudo -n '$helper' install '$GITHUB_SHA' '${GITHUB_SHA:0:12}' '$PIN_DIGEST' '$incoming'"
          echo 'The immutable production verifier release is staged with all process gates fixed off and a random unprovisioned database credential. No login, service, or financial switch changed.' >>"$GITHUB_STEP_SUMMARY"
      - name: Remove runner-local protected material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          protected="$RUNNER_TEMP/production-verifier-protected"
          if [[ -e "$protected" || -L "$protected" ]]; then
            [[ -d "$protected" && ! -L "$protected" && "$(realpath -- "$protected")" == "$protected" ]]
            find "$protected" -mindepth 1 -maxdepth 1 -type f -delete
            rmdir -- "$protected"
          fi

  status:
    name: Prove the production verifier remains inert
    if: always() && needs.validate-target.result == 'success' && inputs.mode == 'status'
    needs: validate-target
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    steps:
      - name: Check out exact inspection contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up bounded read-only inspection connection
        id: protected
        shell: bash
        env:
          PRODUCTION_VM_HOST: ${{ secrets.PRODUCTION_VM_HOST }}
          PRODUCTION_VM_KNOWN_HOSTS: ${{ secrets.PRODUCTION_VM_KNOWN_HOSTS }}
          PRODUCTION_VM_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_VM_SSH_PRIVATE_KEY }}
          SUPABASE_CA_CERTIFICATE_PEM: ${{ secrets.SUPABASE_CA_CERTIFICATE_PEM }}
        run: |
          set -euo pipefail
          umask 077
          protected="$RUNNER_TEMP/production-verifier-status"
          install -d -m 0700 "$protected"
          [[ "$PRODUCTION_VM_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          printf '%s\n' "$PRODUCTION_VM_SSH_PRIVATE_KEY" >"$protected/deploy-key"
          printf '%s\n' "$PRODUCTION_VM_KNOWN_HOSTS" >"$protected/known-hosts"
          printf '%s\n' "$SUPABASE_CA_CERTIFICATE_PEM" >"$protected/supabase-ca.crt"
          chmod 0600 "$protected"/*
          ssh-keygen -y -f "$protected/deploy-key" >/dev/null
          ssh-keygen -F "$PRODUCTION_VM_HOST" -f "$protected/known-hosts" >/dev/null
          openssl x509 -in "$protected/supabase-ca.crt" -noout -checkend 0 >/dev/null
          echo "protected=$protected" >>"$GITHUB_OUTPUT"
          echo "vm_host=$PRODUCTION_VM_HOST" >>"$GITHUB_OUTPUT"
      - name: Require no exact verifier service container
        shell: bash
        env:
          PROTECTED: ${{ steps.protected.outputs.protected }}
          VM_HOST: ${{ steps.protected.outputs.vm_host }}
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 60s \
            ssh -F /dev/null -i "$PROTECTED/deploy-key" -o BatchMode=yes -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$PROTECTED/known-hosts" \
              -o ConnectTimeout=8 -o ConnectionAttempts=1 -o ServerAliveInterval=5 \
              -o ServerAliveCountMax=1 "fetanagent-admin@$VM_HOST" \
              "sudo -n /usr/local/sbin/fetanagent-production-trusted-telebirr-verifier-helper status-inert"
      - name: Require the verifier database login and sessions disabled
        shell: bash
        env:
          PROTECTED: ${{ steps.protected.outputs.protected }}
          VM_HOST: ${{ steps.protected.outputs.vm_host }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGHOST: ${{ env.PRODUCTION_DATABASE_DIRECT_HOST }}
          PGHOSTADDR: 127.0.0.1
          PGPORT: ${{ env.PRODUCTION_DATABASE_TUNNEL_PORT }}
          PGDATABASE: postgres
          PGUSER: postgres
          PGSSLMODE: verify-full
          PGSSLROOTCERT: ${{ steps.protected.outputs.protected }}/supabase-ca.crt
          PGCONNECT_TIMEOUT: '5'
          PGSERVICEFILE: /dev/null
          PGPASSFILE: /dev/null
        run: |
          set -euo pipefail
          source infra/operations/fetanagent-production-direct-database-tunnel.sh
          fetanagent_open_production_direct_database_tunnel \
            "$PROTECTED" "$VM_HOST" "$PGHOST" "$PGPORT"
          trap fetanagent_close_production_direct_database_tunnel EXIT
          result="$(timeout --signal=TERM --kill-after=5s 45s \
            psql -X --quiet --tuples-only --no-align \
              --file=infra/sql/production-trusted-telebirr-verifier-inspect.sql)"
          jq -e '
            .schemaVersion == 1 and .operation == "verifier_status_inspect" and
            .deploymentTarget == "production" and .verifierLogin == "disabled" and
            .activeVerifierSessions == 0 and .executorLogin == "disabled" and
            (.financialBoundary == "disabled" or .financialBoundary == "dry_run" or
             .financialBoundary == "live_verification")
          ' <<<"$result" >/dev/null
      - name: Remove runner-local inspection material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          protected="$RUNNER_TEMP/production-verifier-status"
          if [[ -e "$protected" || -L "$protected" ]]; then
            [[ -d "$protected" && ! -L "$protected" && "$(realpath -- "$protected")" == "$protected" ]]
            find "$protected" -mindepth 1 -maxdepth 1 -type f -delete
            rmdir -- "$protected"
          fi

  emergency-host-stop:
    name: Emergency-remove the exact verifier container
    if: >-
      always() && needs.validate-target.result == 'success' &&
      inputs.mode == 'emergency-disable'
    needs: validate-target
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    steps:
      - name: Set up host-only emergency connection
        id: host
        shell: bash
        env:
          PRODUCTION_VM_HOST: ${{ secrets.PRODUCTION_VM_HOST }}
          PRODUCTION_VM_KNOWN_HOSTS: ${{ secrets.PRODUCTION_VM_KNOWN_HOSTS }}
          PRODUCTION_VM_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_VM_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          protected="$RUNNER_TEMP/production-verifier-emergency-host"
          install -d -m 0700 "$protected"
          [[ "$PRODUCTION_VM_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          printf '%s\n' "$PRODUCTION_VM_SSH_PRIVATE_KEY" >"$protected/deploy-key"
          printf '%s\n' "$PRODUCTION_VM_KNOWN_HOSTS" >"$protected/known-hosts"
          chmod 0600 "$protected"/*
          ssh-keygen -y -f "$protected/deploy-key" >/dev/null
          ssh-keygen -F "$PRODUCTION_VM_HOST" -f "$protected/known-hosts" >/dev/null
          echo "protected=$protected" >>"$GITHUB_OUTPUT"
          echo "vm_host=$PRODUCTION_VM_HOST" >>"$GITHUB_OUTPUT"
      - name: Directly force-remove every exact labeled container
        if: always()
        shell: bash
        env:
          PROTECTED: ${{ steps.host.outputs.protected }}
          VM_HOST: ${{ steps.host.outputs.vm_host }}
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 110s \
            ssh -F /dev/null -i "$PROTECTED/deploy-key" -o BatchMode=yes -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$PROTECTED/known-hosts" \
              -o ConnectTimeout=8 -o ConnectionAttempts=1 -o ServerAliveInterval=5 \
              -o ServerAliveCountMax=1 "fetanagent-admin@$VM_HOST" \
              "sudo -n /usr/local/sbin/fetanagent-production-trusted-telebirr-verifier-helper emergency-stop"
      - name: Remove runner-local host material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          protected="$RUNNER_TEMP/production-verifier-emergency-host"
          if [[ -e "$protected" || -L "$protected" ]]; then
            [[ -d "$protected" && ! -L "$protected" && "$(realpath -- "$protected")" == "$protected" ]]
            find "$protected" -mindepth 1 -maxdepth 1 -type f -delete
            rmdir -- "$protected"
          fi

  emergency-database-revoke:
    name: Emergency-revoke verifier login and sessions
    if: >-
      always() && needs.validate-target.result == 'success' &&
      inputs.mode == 'emergency-disable'
    needs: validate-target
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    steps:
      - name: Check out exact database kill-switch contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up database emergency connection
        id: database
        if: always()
        shell: bash
        env:
          PRODUCTION_VM_HOST: ${{ secrets.PRODUCTION_VM_HOST }}
          PRODUCTION_VM_KNOWN_HOSTS: ${{ secrets.PRODUCTION_VM_KNOWN_HOSTS }}
          PRODUCTION_VM_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_VM_SSH_PRIVATE_KEY }}
          SUPABASE_CA_CERTIFICATE_PEM: ${{ secrets.SUPABASE_CA_CERTIFICATE_PEM }}
        run: |
          set -euo pipefail
          umask 077
          protected="$RUNNER_TEMP/production-verifier-emergency-database"
          install -d -m 0700 "$protected"
          [[ "$PRODUCTION_VM_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          printf '%s\n' "$PRODUCTION_VM_SSH_PRIVATE_KEY" >"$protected/deploy-key"
          printf '%s\n' "$PRODUCTION_VM_KNOWN_HOSTS" >"$protected/known-hosts"
          printf '%s\n' "$SUPABASE_CA_CERTIFICATE_PEM" >"$protected/supabase-ca.crt"
          chmod 0600 "$protected"/*
          ssh-keygen -y -f "$protected/deploy-key" >/dev/null
          ssh-keygen -F "$PRODUCTION_VM_HOST" -f "$protected/known-hosts" >/dev/null
          openssl x509 -in "$protected/supabase-ca.crt" -noout -checkend 0 >/dev/null
          echo "protected=$protected" >>"$GITHUB_OUTPUT"
          echo "vm_host=$PRODUCTION_VM_HOST" >>"$GITHUB_OUTPUT"
      - name: Always attempt the database kill switch
        if: always()
        shell: bash
        env:
          PROTECTED: ${{ steps.database.outputs.protected }}
          VM_HOST: ${{ steps.database.outputs.vm_host }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGHOST: ${{ env.PRODUCTION_DATABASE_DIRECT_HOST }}
          PGHOSTADDR: 127.0.0.1
          PGPORT: ${{ env.PRODUCTION_DATABASE_TUNNEL_PORT }}
          PGDATABASE: postgres
          PGUSER: postgres
          PGSSLMODE: verify-full
          PGSSLROOTCERT: ${{ steps.database.outputs.protected }}/supabase-ca.crt
          PGCONNECT_TIMEOUT: '5'
          PGSERVICEFILE: /dev/null
          PGPASSFILE: /dev/null
        run: |
          set -euo pipefail
          source infra/operations/fetanagent-production-direct-database-tunnel.sh
          fetanagent_open_production_direct_database_tunnel \
            "$PROTECTED" "$VM_HOST" "$PGHOST" "$PGPORT"
          trap fetanagent_close_production_direct_database_tunnel EXIT
          result="$(timeout --signal=TERM --kill-after=5s 45s \
            psql -X --quiet --tuples-only --no-align \
              --file=infra/sql/production-trusted-telebirr-verifier-disable.sql)"
          jq -e '
            .operation == "verifier_emergency_disable" and .deploymentTarget == "production" and
            .verifierLogin == "disabled" and .financialSwitchesChanged == false
          ' <<<"$result" >/dev/null
      - name: Remove runner-local database material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          protected="$RUNNER_TEMP/production-verifier-emergency-database"
          if [[ -e "$protected" || -L "$protected" ]]; then
            [[ -d "$protected" && ! -L "$protected" && "$(realpath -- "$protected")" == "$protected" ]]
            find "$protected" -mindepth 1 -maxdepth 1 -type f -delete
            rmdir -- "$protected"
          fi
