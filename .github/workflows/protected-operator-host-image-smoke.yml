name: Protected operator host image smoke

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  protected-operator-host-image-smoke:
    name: Build and smoke dormant protected operator host
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the one-shot host entry point without running it
        shell: bash
        run: bash -n infra/operations/fetanagent-production-operator-host-launch.sh

      - name: Check exact sudo contract and launch renderer
        shell: bash
        run: |
          set -euo pipefail
          digest="$(sha256sum infra/operations/fetanagent-production-operator-host-launch.sh | cut -d' ' -f1)"
          grep -Fx "fetanagent-admin ALL=(root) NOPASSWD: sha256:$digest /usr/local/sbin/fetanagent-production-operator-host-launch *" \
            infra/operations/fetanagent-production-operator-host.sudoers
          sudo visudo -cf infra/operations/fetanagent-production-operator-host.sudoers
          node --test infra/operations/render-production-operator-launch.test.mjs

      - name: Build credential-free one-shot image
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull=false -f infra/Dockerfile.protected-operator-host \
            --build-arg "VCS_REF=$GITHUB_SHA" \
            -t fetanagent-protected-operator-host:ci .
          test "$(docker image inspect fetanagent-protected-operator-host:ci \
            --format '{{.Config.User}}')" = '10001:10001'
          # The pinned PostgreSQL client base declares this inert image
          # metadata; the entry point never starts PostgreSQL or publishes it.
          test "$(docker image inspect fetanagent-protected-operator-host:ci \
            --format '{{json .Config.ExposedPorts}}')" = '{"5432/tcp":{}}'
          test "$(docker image inspect fetanagent-protected-operator-host:ci \
            --format '{{json .Config.Entrypoint}}')" = \
            '["/usr/local/bin/node","/workspace/packages/agent-platform-companion-operator-host/dist/index.js"]'
          test "$(docker image inspect fetanagent-protected-operator-host:ci \
            --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = \
            "$GITHUB_SHA"

      - name: Refuse missing and malformed launch material without a listener
        shell: bash
        run: |
          set -euo pipefail
          for payload in '' '{"version":1}' ; do
            set +e
            output="$(printf '%s' "$payload" | timeout 15s docker run --rm -i \
              --network none --read-only \
              --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m,uid=10001,gid=10001,mode=700 \
              --cap-drop ALL --security-opt no-new-privileges \
              fetanagent-protected-operator-host:ci 2>&1)"
            status=$?
            set -e
            test "$status" -eq 1
            test "$output" = 'Protected operator host unavailable; reconcile before activation.'
          done

      - name: Seal the inert image for the production host
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          docker save fetanagent-protected-operator-host:ci |
            gzip -1 >"$RUNNER_TEMP/fetanagent-protected-operator-host.tar.gz"
          cd "$RUNNER_TEMP"
          sha256sum fetanagent-protected-operator-host.tar.gz \
            >fetanagent-protected-operator-host.tar.gz.sha256

      - name: Publish the checked main image without starting it
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: protected-operator-host-image-${{ github.sha }}
          path: |
            ${{ runner.temp }}/fetanagent-protected-operator-host.tar.gz
            ${{ runner.temp }}/fetanagent-protected-operator-host.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
