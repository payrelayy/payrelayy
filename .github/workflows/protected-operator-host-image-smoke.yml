name: Protected operator host image smoke

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  protected-operator-host-image-smoke:
    name: Build and smoke dormant protected operator host
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the one-shot host entry point without running it
        shell: bash
        run: bash -n infra/operations/fetanagent-production-operator-host-launch.sh

      - name: Check exact sudo contract and launch renderer
        shell: bash
        run: |
          set -euo pipefail
          digest="$(sha256sum infra/operations/fetanagent-production-operator-host-launch.sh | cut -d' ' -f1)"
          grep -Fx "fetanagent-admin ALL=(root) NOPASSWD: sha256:$digest /usr/local/sbin/fetanagent-production-operator-host-launch *" \
            infra/operations/fetanagent-production-operator-host.sudoers
          sudo visudo -cf infra/operations/fetanagent-production-operator-host.sudoers
          node --test infra/operations/render-production-operator-launch.test.mjs \
            infra/operations/protected-operator-bind-contract.test.mjs

      - name: Build credential-free one-shot image
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull=false -f infra/Dockerfile.protected-operator-host \
            --build-arg "VCS_REF=$GITHUB_SHA" \
            -t fetanagent-protected-operator-host:ci .
          test "$(docker image inspect fetanagent-protected-operator-host:ci \
            --format '{{.Config.User}}')" = '10001:10001'
          # The pinned PostgreSQL client base declares this inert image
          # metadata; the entry point never starts PostgreSQL or publishes it.
          test "$(docker image inspect fetanagent-protected-operator-host:ci \
            --format '{{json .Config.ExposedPorts}}')" = '{"5432/tcp":{}}'
          test "$(docker image inspect fetanagent-protected-operator-host:ci \
            --format '{{json .Config.Entrypoint}}')" = \
            '["/usr/local/bin/node","/workspace/packages/agent-platform-companion-operator-host/dist/index.js"]'
          test "$(docker image inspect fetanagent-protected-operator-host:ci \
            --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = \
            "$GITHUB_SHA"

      - name: Refuse missing and malformed launch material without a listener
        shell: bash
        run: |
          set -euo pipefail
          for payload in '' '{"version":1}' ; do
            set +e
            output="$(printf '%s' "$payload" | timeout 15s docker run --rm -i \
              --network none --read-only \
              --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m,uid=10001,gid=10001,mode=700 \
              --cap-drop ALL --cap-add NET_BIND_SERVICE --security-opt no-new-privileges \
              fetanagent-protected-operator-host:ci 2>&1)"
            status=$?
            set -e
            test "$status" -eq 1
            test "$output" = 'Protected operator host unavailable; reconcile before activation.'
          done

      - name: Classify a non-executing diagnostic before any database access
        shell: bash
        run: |
          set -euo pipefail
          payload="$(node -e 'process.stdout.write(JSON.stringify({
            version: 1,
            requestKey: "00000000-0000-4000-8000-000000000001",
            databaseUrl: "postgresql://postgres:synthetic@db.xzztugbgtulptnbpoelr.supabase.co:5432/postgres?sslmode=verify-full",
            databaseCaPem: "-----BEGIN CERTIFICATE-----\n" + "A".repeat(64) + "\n-----END CERTIFICATE-----\n",
            releaseTag: "windows-companion-v0.1.14"
          }))')"
          set +e
          output="$(printf '%s' "$payload" | timeout 15s docker run --rm -i \
            --network none --read-only --log-driver none \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=16m,uid=10001,gid=10001,mode=700 \
            --cap-drop ALL --cap-add NET_BIND_SERVICE --security-opt no-new-privileges \
            --user 10001:10001 fetanagent-protected-operator-host:ci --diagnose 2>&1)"
          status=$?
          set -e
          test "$status" -eq 1
          test "$output" = 'protected_operator_diagnostic=independent_psql'

      - name: Refuse activation diagnosis without network or valid stdin
        shell: bash
        run: |
          set -euo pipefail
          payload="$(node -e 'const fs=require("node:fs");
            const host=fs.readFileSync("packages/agent-platform-companion-operator-host/src/launch-document.ts","utf8").match(/const DIRECT_HOST = (.+);/)[1].slice(1,-1);
            process.stdout.write(JSON.stringify({ version:1,
              requestKey:"00000000-0000-4000-8000-000000000001",
              databaseUrl:"postgresql://postgres:synthetic@"+host+":5432/postgres?sslmode=verify-full",
              databaseCaPem:"-----BEGIN CERTIFICATE-----\n"+"A".repeat(64)+"\n-----END CERTIFICATE-----\n",
              releaseTag:"windows-companion-v0.1.17" }))')"
          for expected in input_validation node_database ; do
            input='{"version":1}'
            if test "$expected" = node_database ; then input="$payload"; fi
            set +e
            output="$(printf '%s' "$input" | timeout 15s docker run --rm -i \
              --network none --read-only --log-driver none \
              --cap-drop ALL --cap-add NET_BIND_SERVICE \
              --security-opt no-new-privileges --user 10001:10001 \
              fetanagent-protected-operator-host:ci --diagnose-activation 2>&1)"
            status=$?
            set -e
            test "$status" -eq 1
            printf '%s' "$output" | EXPECTED_STAGE="$expected" node -e '
              let raw=""; process.stdin.on("data",p=>raw+=p); process.stdin.on("end",()=>{
                const wanted={ component:"fetanagent_operator_activation_diagnostic",result:"stopped",
                  stage:process.env.EXPECTED_STAGE,inspectionMode:"historical_reconstruction",
                  liveReadinessProven:false,requestCreated:false,handoffSigned:false,
                  executionEnabled:false,moneyMoved:false,identifiersRedacted:true };
                if(raw.trim()!==JSON.stringify(wanted)) process.exit(1);
              });'
          done

      - name: Prove only the non-root loopback bind capability is effective
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only \
            --cap-drop ALL --cap-add NET_BIND_SERVICE \
            --security-opt no-new-privileges --user 10001:10001 \
            --entrypoint /usr/local/bin/node fetanagent-protected-operator-host:ci \
            -e 'const fs=require("node:fs"); const s=fs.readFileSync("/proc/self/status","utf8"); const get=(k)=>s.match(new RegExp("^"+k+":\\s*(\\S+)","m"))?.[1]; if(get("Uid")!=="10001" || get("NoNewPrivs")!=="1" || BigInt("0x"+get("CapEff"))!==1024n || BigInt("0x"+get("CapBnd"))!==1024n) process.exit(1);'
      - name: Seal the inert image for the production host
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          docker save fetanagent-protected-operator-host:ci |
            gzip -1 >"$RUNNER_TEMP/fetanagent-protected-operator-host.tar.gz"
          cd "$RUNNER_TEMP"
          sha256sum fetanagent-protected-operator-host.tar.gz \
            >fetanagent-protected-operator-host.tar.gz.sha256

      - name: Publish the checked main image without starting it
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: protected-operator-host-image-${{ github.sha }}
          path: |
            ${{ runner.temp }}/fetanagent-protected-operator-host.tar.gz
            ${{ runner.temp }}/fetanagent-protected-operator-host.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
