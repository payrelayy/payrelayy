name: Quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Build, test, and format
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Enable Corepack and verify pnpm
        shell: bash
        run: |
          corepack enable
          test "$(pnpm --version)" = '11.16.0'

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify FetanAgent branding
        run: pnpm verify:brand

      - name: Check formatting
        run: pnpm lint

      - name: Verify staging beta infrastructure contract
        shell: bash
        run: |
          pnpm test:infra
          bash -n infra/operations/fetanagent-telebirr-device-pilot-helper.sh
          bash -n infra/operations/fetanagent-staging-direct-database-tunnel.sh
          FETANAGENT_IMAGE_TAG=ci \
          FETANAGENT_VCS_REF="${GITHUB_SHA}" \
          FETANAGENT_STAGING_OWNER_CONTROL_DATABASE_URL_FILE=/dev/null \
          FETANAGENT_STAGING_OWNER_CONTROL_SUPABASE_PUBLISHABLE_KEY_FILE=/dev/null \
          FETANAGENT_STAGING_CUSTOMER_WEB_DATABASE_URL_FILE=/dev/null \
          FETANAGENT_STAGING_CUSTOMER_WEB_SUPABASE_PUBLISHABLE_KEY_FILE=/dev/null \
          FETANAGENT_STAGING_CUSTOMER_WEB_RATE_LIMIT_HMAC_FILE=/dev/null \
          FETANAGENT_STAGING_BETA_ADMISSION_DATABASE_URL_FILE=/dev/null \
          FETANAGENT_STAGING_BETA_ADMISSION_TRANSPORT_HMAC_FILE=/dev/null \
          FETANAGENT_STAGING_BETA_ADMISSION_PAYLOAD_HMAC_FILE=/dev/null \
          FETANAGENT_STAGING_PLAYER_ACTION_DATABASE_URL_FILE=/dev/null \
          FETANAGENT_STAGING_API_PLAYER_ACTION_TRANSPORT_HMAC_FILE=/dev/null \
          FETANAGENT_STAGING_API_PLAYER_ACTION_PAYLOAD_HMAC_FILE=/dev/null \
          FETANAGENT_STAGING_API_PLAYER_ACTION_CAPABILITY_HMAC_FILE=/dev/null \
          FETANAGENT_STAGING_API_PLAYER_ACTION_SEMANTIC_HMAC_FILE=/dev/null \
          FETANAGENT_STAGING_CBE_DEPOSIT_REFERENCE_ENCRYPTION_KEY_FILE=/dev/null \
          FETANAGENT_STAGING_CBE_DEPOSIT_REFERENCE_FINGERPRINT_KEY_FILE=/dev/null \
          FETANAGENT_STAGING_CBE_DEPOSIT_REFERENCE_KEY_PROFILE_FILE=/dev/null \
          FETANAGENT_STAGING_DEPOSIT_PROOF_REFERENCE_ENCRYPTION_MASTER_FILE=/dev/null \
          FETANAGENT_STAGING_DEPOSIT_PROOF_REFERENCE_FINGERPRINT_MASTER_FILE=/dev/null \
          FETANAGENT_STAGING_DEPOSIT_PROOF_REFERENCE_PROFILE_FILE=/dev/null \
          FETANAGENT_STAGING_SUPABASE_CA_CERTIFICATE_FILE=/dev/null \
          FETANAGENT_STAGING_BOT_TOKEN_FILE=/dev/null \
          FETANAGENT_STAGING_BOT_TRANSPORT_HMAC_FILE=/dev/null \
          FETANAGENT_STAGING_BOT_PLAYER_ACTION_TRANSPORT_HMAC_FILE=/dev/null \
            docker compose --env-file /dev/null --file infra/compose.staging-beta.yaml \
              --profile staging-manual --profile public-domain config --quiet
          FETANAGENT_IMAGE_TAG=ci \
          FETANAGENT_VCS_REF="${GITHUB_SHA}" \
          FETANAGENT_TELEBIRR_SUPABASE_CA_CERTIFICATE_FILE=/dev/null \
          FETANAGENT_TELEBIRR_ASSIGNMENT_SIGNER_PUBLIC_KEY_FILE=/dev/null \
          FETANAGENT_TELEBIRR_DEVICE_BRIDGE_RUNTIME_MANIFEST_FILE=/dev/null \
          FETANAGENT_TELEBIRR_ASSIGNMENT_DATABASE_URL_FILE=/dev/null \
          FETANAGENT_TELEBIRR_REFERENCE_OPENING_KEY_FILE=/dev/null \
          FETANAGENT_TELEBIRR_ASSIGNMENT_RUNTIME_MANIFEST_FILE=/dev/null \
          FETANAGENT_TELEBIRR_ASSIGNMENT_SIGNER_PRIVATE_KEY_FILE=/dev/null \
          FETANAGENT_TELEBIRR_DEVICE_STATE_DATABASE_URL_FILE=/dev/null \
          FETANAGENT_TELEBIRR_DEVICE_BRIDGE_SERVER_SIGNER_PRIVATE_KEY_FILE=/dev/null \
            docker compose --env-file /dev/null \
              --file infra/compose.telebirr-device-pilot.yaml \
              --profile telebirr-device-pilot config --quiet
          FETANAGENT_IMAGE_TAG=ci \
          FETANAGENT_VCS_REF="${GITHUB_SHA}" \
          FETANAGENT_COMPANION_SUPABASE_CA_CERTIFICATE_FILE=/dev/null \
          FETANAGENT_COMPANION_DEVICE_BRIDGE_RUNTIME_MANIFEST_FILE=/dev/null \
          FETANAGENT_COMPANION_DEVICE_BRIDGE_DATABASE_URL_FILE=/dev/null \
          FETANAGENT_COMPANION_DEVICE_BRIDGE_SIGNER_PRIVATE_KEY_FILE=/dev/null \
            docker compose --env-file /dev/null \
              --file infra/compose.companion-device-pairing.yaml \
              --profile companion-device-pairing config --quiet

      - name: Build and validate the public HTTPS gateway
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --target gateway \
            --build-arg "VCS_REF=$GITHUB_SHA" \
            --tag fetanagent-gateway:ci \
            .
          docker run --rm --read-only fetanagent-gateway:ci caddy validate --config /etc/caddy/Caddyfile

      - name: Build and test
        run: pnpm test
