name: Quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Build, test, and format
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Enable Corepack and verify pnpm
        shell: bash
        run: |
          corepack enable
          test "$(pnpm --version)" = '11.16.0'

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm lint

      - name: Verify staging beta infrastructure contract
        shell: bash
        run: |
          pnpm test:infra
          PAYREPLAYY_IMAGE_TAG=ci \
          PAYREPLAYY_VCS_REF="${GITHUB_SHA}" \
          PAYREPLAYY_STAGING_BETA_ADMISSION_DATABASE_URL_FILE=/dev/null \
          PAYREPLAYY_STAGING_BETA_ADMISSION_TRANSPORT_HMAC_FILE=/dev/null \
          PAYREPLAYY_STAGING_BETA_ADMISSION_PAYLOAD_HMAC_FILE=/dev/null \
          PAYREPLAYY_STAGING_SUPABASE_CA_CERTIFICATE_FILE=/dev/null \
          PAYREPLAYY_STAGING_BOT_TOKEN_FILE=/dev/null \
          PAYREPLAYY_STAGING_BOT_TRANSPORT_HMAC_FILE=/dev/null \
            docker compose --env-file /dev/null --file infra/compose.staging-beta.yaml \
              --profile staging-manual config --quiet

      - name: Build and test
        run: pnpm test
