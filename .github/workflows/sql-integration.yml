name: Disposable SQL integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  sql-integration:
    name: Disposable SQL integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Enable Corepack and verify pnpm
        shell: bash
        run: |
          corepack enable
          test "$(pnpm --version)" = '11.16.0'

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run disposable SQL integration suite
        shell: bash
        run: |
          unset DATABASE_URL DOCKER_CONTEXT DOCKER_HOST NONCE_RETENTION_DATABASE_URL
          unset PGDATABASE PGHOST PGPASSWORD PGPORT PGSERVICE PGSERVICEFILE PGUSER
          pnpm test:sql
