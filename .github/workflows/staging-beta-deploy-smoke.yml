name: Staging beta deploy and smoke

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Build, unban and check staging once, deploy and smoke, or stop staging
        required: true
        default: plan
        type: choice
        options:
          - plan
          - unban-and-connectivity-check
          - deploy-and-smoke
          - stop-and-disable
      confirm_staging_project_ref:
        description: Type the exact staging project ref
        required: true
        type: string
      confirm_main_commit_sha:
        description: Type the exact full reviewed main commit SHA
        required: true
        type: string
      confirm_droplet_id:
        description: Type the exact staging DigitalOcean droplet ID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fetanagent-staging-beta-deploy
  cancel-in-progress: false

env:
  STAGING_PROJECT_REF: spzpiyxheappsfyswewl
  PRODUCTION_PROJECT_REF: xzztugbgtulptnbpoelr
  STAGING_DROPLET_ID: '590666364'
  STAGING_POOLER_HOST: aws-1-eu-west-1.pooler.supabase.com
  STAGING_DIRECT_DATABASE_HOST: db.spzpiyxheappsfyswewl.supabase.co
  STAGING_BANNED_IP: 2a05:d018:135e:1602:5210:739d:5667:fee4
  SUPABASE_CLI_VERSION: 2.113.0
  BETA_RUNTIME_ROLE: fetanagent_beta_admission_runtime
  OWNER_RUNTIME_ROLE: fetanagent_owner_control_runtime
  PLAYER_ACTION_RUNTIME_ROLE: fetanagent_player_actions_runtime

jobs:
  validate-target:
    name: Validate exact staging target
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CONFIRMED_COMMIT: ${{ inputs.confirm_main_commit_sha }}
      CONFIRMED_DROPLET: ${{ inputs.confirm_droplet_id }}
      CONFIRMED_PROJECT: ${{ inputs.confirm_staging_project_ref }}
      REQUESTED_MODE: ${{ inputs.mode }}
    steps:
      - name: Reject every non-staging target
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$CONFIRMED_COMMIT" =~ ^[0-9a-f]{40}$ && "$CONFIRMED_COMMIT" == "$GITHUB_SHA" ]]
          [[ "$CONFIRMED_PROJECT" == "$STAGING_PROJECT_REF" ]]
          [[ "$CONFIRMED_PROJECT" != "$PRODUCTION_PROJECT_REF" ]]
          [[ "$CONFIRMED_DROPLET" == "$STAGING_DROPLET_ID" ]]
          [[ "$REQUESTED_MODE" =~ ^(plan|unban-and-connectivity-check|deploy-and-smoke|stop-and-disable)$ ]]

  build:
    name: Build reviewed staging images
    if: inputs.mode == 'plan' || inputs.mode == 'deploy-and-smoke'
    needs: validate-target
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Verify the locked staging contract
        run: node infra/verify-staging-beta.mjs

      - name: Build commit-labelled images without runtime secrets
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_SHA:0:12}"
          docker build --pull=false --target admin \
            --build-arg "VCS_REF=$GITHUB_SHA" -t "fetanagent-owner-control:$tag" .
          docker build --pull=false --target api \
            --build-arg "VCS_REF=$GITHUB_SHA" -t "fetanagent-api:$tag" .
          docker build --pull=false --target beta-admission \
            --build-arg "VCS_REF=$GITHUB_SHA" -t "fetanagent-beta-admission:$tag" .
          docker build --pull=false --target bot \
            --build-arg "VCS_REF=$GITHUB_SHA" -t "fetanagent-bot:$tag" .
          docker build --pull=false --target gateway \
            --build-arg "VCS_REF=$GITHUB_SHA" -t "fetanagent-gateway:$tag" .
          for image in owner-control api beta-admission bot gateway; do
            test "$(docker image inspect "fetanagent-$image:$tag" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GITHUB_SHA"
          done

      - name: Save sealed images for the deployment job
        if: inputs.mode == 'deploy-and-smoke'
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_SHA:0:12}"
          docker save --output "$RUNNER_TEMP/fetanagent-staging-images.tar" \
            "fetanagent-owner-control:$tag" \
            "fetanagent-api:$tag" \
            "fetanagent-beta-admission:$tag" \
            "fetanagent-bot:$tag" \
            "fetanagent-gateway:$tag"

      - name: Upload sealed image bundle
        if: inputs.mode == 'deploy-and-smoke'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fetanagent-staging-images-${{ github.sha }}
          path: ${{ runner.temp }}/fetanagent-staging-images.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  connectivity:
    name: Unban exact staging IP and check connectivity once
    if: inputs.mode == 'unban-and-connectivity-check'
    needs: validate-target
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: staging
    permissions:
      contents: read
    steps:
      - name: Set up the pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: 2.113.0

      - name: Remove only the approved staging network ban
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$SUPABASE_ACCESS_TOKEN" ]]
          supabase --version | grep -Fx "$SUPABASE_CLI_VERSION"
          supabase network-bans remove --help >/dev/null
          current_bans="$(supabase network-bans get \
            --project-ref "$STAGING_PROJECT_REF" --experimental)"
          if grep -Fq "$STAGING_BANNED_IP" <<<"$current_bans"; then
            supabase network-bans remove --db-unban-ip "$STAGING_BANNED_IP" \
              --project-ref "$STAGING_PROJECT_REF" --experimental
          else
            echo 'The approved staging IP is no longer banned; no ban was removed.'
          fi

      - name: Verify one protected admin connection without changing database state
        shell: bash
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGHOST: ${{ env.STAGING_POOLER_HOST }}
          PGPORT: '5432'
          PGDATABASE: postgres
          PGUSER: postgres.${{ env.STAGING_PROJECT_REF }}
          PGSSLMODE: verify-full
          PGSSLROOTCERT: ${{ runner.temp }}/supabase-ca.crt
          PGCONNECT_TIMEOUT: '5'
          PGSERVICEFILE: /dev/null
          PGPASSFILE: /dev/null
          SUPABASE_CA_CERTIFICATE_PEM: ${{ secrets.SUPABASE_CA_CERTIFICATE_PEM }}
        run: |
          set -euo pipefail
          [[ -n "$PGPASSWORD" && -n "$SUPABASE_CA_CERTIFICATE_PEM" ]]
          umask 077
          trap 'rm -f "$PGSSLROOTCERT"' EXIT
          printf '%s\n' "$SUPABASE_CA_CERTIFICATE_PEM" > "$PGSSLROOTCERT"
          openssl x509 -in "$PGSSLROOTCERT" -noout -checkend 0 >/dev/null
          psql -X --set=ON_ERROR_STOP=1 \
            --command='select 1 as staging_database_reachable;'

  deploy:
    name: Deploy and smoke exact staging release
    if: inputs.mode == 'deploy-and-smoke'
    needs: [validate-target, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: staging
    permissions:
      contents: read
    steps:
      - name: Check out deployment contract
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download sealed image bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fetanagent-staging-images-${{ github.sha }}
          path: ${{ runner.temp }}/release

      - name: Validate protected deploy inputs
        id: protected
        shell: bash
        env:
          BETA_ADMISSION_PAYLOAD_HMAC_SECRET: ${{ secrets.BETA_ADMISSION_PAYLOAD_HMAC_SECRET }}
          BETA_ADMISSION_RUNTIME_PASSWORD: ${{ secrets.BETA_ADMISSION_RUNTIME_PASSWORD }}
          BOT_TO_API_ACTION_HMAC_SECRET: ${{ secrets.BOT_TO_API_ACTION_HMAC_SECRET }}
          BOT_TO_BETA_ADMISSION_HMAC_SECRET: ${{ secrets.BOT_TO_BETA_ADMISSION_HMAC_SECRET }}
          API_TELEGRAM_PLAYER_ACTION_PAYLOAD_HMAC_SECRET: ${{ secrets.API_TELEGRAM_PLAYER_ACTION_PAYLOAD_HMAC_SECRET }}
          API_TELEGRAM_CAPABILITY_HMAC_SECRET: ${{ secrets.API_TELEGRAM_CAPABILITY_HMAC_SECRET }}
          API_TELEGRAM_ACTION_SEMANTIC_HMAC_SECRET: ${{ secrets.API_TELEGRAM_ACTION_SEMANTIC_HMAC_SECRET }}
          API_DEPOSIT_REFERENCE_PROTECTION_SECRET: ${{ secrets.API_DEPOSIT_REFERENCE_PROTECTION_SECRET }}
          OWNER_CONTROL_RUNTIME_PASSWORD: ${{ secrets.OWNER_CONTROL_RUNTIME_PASSWORD }}
          PLAYER_ACTION_RUNTIME_PASSWORD: ${{ secrets.PLAYER_ACTION_RUNTIME_PASSWORD }}
          STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          STAGING_TELEGRAM_BOT_TOKEN: ${{ secrets.STAGING_TELEGRAM_BOT_TOKEN }}
          STAGING_VM_HOST: ${{ secrets.STAGING_VM_HOST }}
          STAGING_VM_KNOWN_HOSTS: ${{ secrets.STAGING_VM_KNOWN_HOSTS }}
          STAGING_VM_SSH_PRIVATE_KEY: ${{ secrets.STAGING_VM_SSH_PRIVATE_KEY }}
          SUPABASE_CA_CERTIFICATE_PEM: ${{ secrets.SUPABASE_CA_CERTIFICATE_PEM }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$BETA_ADMISSION_RUNTIME_PASSWORD" =~ ^[0-9a-f]{64}$ ]]
          [[ "$OWNER_CONTROL_RUNTIME_PASSWORD" =~ ^[0-9a-f]{64}$ ]]
          [[ "$BOT_TO_BETA_ADMISSION_HMAC_SECRET" =~ ^[0-9a-f]{64}$ ]]
          [[ "$BETA_ADMISSION_PAYLOAD_HMAC_SECRET" =~ ^[0-9a-f]{64}$ ]]
          [[ "$PLAYER_ACTION_RUNTIME_PASSWORD" =~ ^[0-9a-f]{64}$ ]]
          [[ "$BOT_TO_API_ACTION_HMAC_SECRET" =~ ^[0-9a-f]{64}$ ]]
          [[ "$API_TELEGRAM_PLAYER_ACTION_PAYLOAD_HMAC_SECRET" =~ ^[0-9a-f]{64}$ ]]
          [[ "$API_TELEGRAM_CAPABILITY_HMAC_SECRET" =~ ^[0-9a-f]{64}$ ]]
          [[ "$API_TELEGRAM_ACTION_SEMANTIC_HMAC_SECRET" =~ ^[0-9a-f]{64}$ ]]
          [[ "$API_DEPOSIT_REFERENCE_PROTECTION_SECRET" =~ ^[0-9a-f]{64}$ ]]
          distinct_count="$(printf '%s\n' \
            "$BETA_ADMISSION_RUNTIME_PASSWORD" "$OWNER_CONTROL_RUNTIME_PASSWORD" \
            "$PLAYER_ACTION_RUNTIME_PASSWORD" "$BOT_TO_BETA_ADMISSION_HMAC_SECRET" \
            "$BETA_ADMISSION_PAYLOAD_HMAC_SECRET" "$BOT_TO_API_ACTION_HMAC_SECRET" \
            "$API_TELEGRAM_PLAYER_ACTION_PAYLOAD_HMAC_SECRET" \
            "$API_TELEGRAM_CAPABILITY_HMAC_SECRET" \
            "$API_TELEGRAM_ACTION_SEMANTIC_HMAC_SECRET" \
            "$API_DEPOSIT_REFERENCE_PROTECTION_SECRET" | sort -u | wc -l)"
          [[ "$distinct_count" -eq 10 ]]
          [[ "$STAGING_TELEGRAM_BOT_TOKEN" =~ ^[0-9]{6,12}:[A-Za-z0-9_-]{30,80}$ ]]
          [[ -n "$SUPABASE_DB_PASSWORD" ]]
          [[ "$STAGING_SUPABASE_PUBLISHABLE_KEY" =~ ^sb_publishable_[A-Za-z0-9_-]{20,}$ ]]
          [[ "$STAGING_VM_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ -n "$STAGING_VM_KNOWN_HOSTS" && -n "$STAGING_VM_SSH_PRIVATE_KEY" ]]

          secret_dir="$RUNNER_TEMP/protected"
          install -d -m 0700 "$secret_dir"
          umask 077
          printf '%s\n' "$STAGING_VM_SSH_PRIVATE_KEY" > "$secret_dir/deploy-key"
          printf '%s\n' "$STAGING_VM_KNOWN_HOSTS" > "$secret_dir/known-hosts"
          printf '%s\n' "$SUPABASE_CA_CERTIFICATE_PEM" > "$secret_dir/supabase-ca.crt"
          printf 'postgresql://%s:%s@%s:5432/postgres?sslmode=verify-full\n' \
            "$BETA_RUNTIME_ROLE" "$BETA_ADMISSION_RUNTIME_PASSWORD" "$STAGING_DIRECT_DATABASE_HOST" \
            > "$secret_dir/beta-database-url"
          printf 'postgresql://%s:%s@%s:5432/postgres?sslmode=verify-full\n' \
            "$OWNER_RUNTIME_ROLE" "$OWNER_CONTROL_RUNTIME_PASSWORD" "$STAGING_DIRECT_DATABASE_HOST" \
            > "$secret_dir/owner-database-url"
          printf 'postgresql://%s:%s@%s:5432/postgres?sslmode=verify-full\n' \
            "$PLAYER_ACTION_RUNTIME_ROLE" "$PLAYER_ACTION_RUNTIME_PASSWORD" "$STAGING_DIRECT_DATABASE_HOST" \
            > "$secret_dir/player-action-database-url"
          printf '%s\n' "$BOT_TO_BETA_ADMISSION_HMAC_SECRET" > "$secret_dir/beta-transport-hmac"
          printf '%s\n' "$BOT_TO_BETA_ADMISSION_HMAC_SECRET" > "$secret_dir/bot-transport-hmac"
          printf '%s\n' "$BETA_ADMISSION_PAYLOAD_HMAC_SECRET" > "$secret_dir/beta-payload-hmac"
          printf '%s\n' "$BOT_TO_API_ACTION_HMAC_SECRET" > "$secret_dir/api-action-transport-hmac"
          printf '%s\n' "$BOT_TO_API_ACTION_HMAC_SECRET" > "$secret_dir/bot-action-transport-hmac"
          printf '%s\n' "$API_TELEGRAM_PLAYER_ACTION_PAYLOAD_HMAC_SECRET" > "$secret_dir/api-action-payload-hmac"
          printf '%s\n' "$API_TELEGRAM_CAPABILITY_HMAC_SECRET" > "$secret_dir/api-action-capability-hmac"
          printf '%s\n' "$API_TELEGRAM_ACTION_SEMANTIC_HMAC_SECRET" > "$secret_dir/api-action-semantic-hmac"
          printf '%s\n' "$API_DEPOSIT_REFERENCE_PROTECTION_SECRET" > "$secret_dir/api-deposit-reference-protection"
          printf '%s\n' "$STAGING_TELEGRAM_BOT_TOKEN" > "$secret_dir/bot-token"
          printf '%s\n' "$STAGING_SUPABASE_PUBLISHABLE_KEY" > "$secret_dir/publishable-key"
          chmod 0600 "$secret_dir/deploy-key" "$secret_dir/known-hosts" "$secret_dir"/*
          openssl x509 -in "$secret_dir/supabase-ca.crt" -noout -checkend 0 >/dev/null
          ssh-keygen -y -f "$secret_dir/deploy-key" >/dev/null
          helper_sha="$(sha256sum infra/operations/fetanagent-staging-deploy-helper.sh | awk '{print $1}')"
          echo "secret_dir=$secret_dir" >> "$GITHUB_OUTPUT"
          echo "helper_sha=$helper_sha" >> "$GITHUB_OUTPUT"
          echo "vm_host=$STAGING_VM_HOST" >> "$GITHUB_OUTPUT"

      - name: Stop any prior staging project and disable old logins
        shell: bash
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGHOST: ${{ env.STAGING_POOLER_HOST }}
          PGPORT: '5432'
          PGDATABASE: postgres
          PGUSER: postgres.${{ env.STAGING_PROJECT_REF }}
          PGSSLMODE: verify-full
          PGSSLROOTCERT: ${{ steps.protected.outputs.secret_dir }}/supabase-ca.crt
          PGSERVICEFILE: /dev/null
          PGPASSFILE: /dev/null
        run: |
          set -euo pipefail
          ssh=(ssh -F /dev/null -i '${{ steps.protected.outputs.secret_dir }}/deploy-key' -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile='${{ steps.protected.outputs.secret_dir }}/known-hosts')
          remote_status=0
          "${ssh[@]}" "fetanagent-admin@${{ steps.protected.outputs.vm_host }}" \
            "test \"\$(id -u)\" -ne 0 && sudo -n /usr/local/sbin/fetanagent-staging-deploy-helper verify '${{ steps.protected.outputs.helper_sha }}' && sudo -n /usr/local/sbin/fetanagent-staging-deploy-helper stop" || remote_status=$?
          psql -X --file=infra/sql/staging-runtimes-disable.sql
          if [[ "$remote_status" -ne 0 ]]; then
            echo '::error::The prior staging containers could not be stopped; database logins were disabled.'
            exit "$remote_status"
          fi

      - name: Verify the VM has direct IPv6 database readiness
        shell: bash
        env:
          SECRET_DIR: ${{ steps.protected.outputs.secret_dir }}
          VM_HOST: ${{ steps.protected.outputs.vm_host }}
        run: |
          set -euo pipefail
          ssh_opts=(-F /dev/null -i "$SECRET_DIR/deploy-key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SECRET_DIR/known-hosts")
          ssh "${ssh_opts[@]}" "fetanagent-admin@$VM_HOST" \
            "test \"\$(id -u)\" -ne 0 && sudo -n /usr/local/sbin/fetanagent-staging-deploy-helper verify '${{ steps.protected.outputs.helper_sha }}' && sudo -n /usr/local/sbin/fetanagent-staging-deploy-helper network-ready"

      - name: Provision three narrow 24-hour staging logins
        id: provision
        shell: bash
        env:
          BETA_ADMISSION_RUNTIME_PASSWORD: ${{ secrets.BETA_ADMISSION_RUNTIME_PASSWORD }}
          OWNER_CONTROL_RUNTIME_PASSWORD: ${{ secrets.OWNER_CONTROL_RUNTIME_PASSWORD }}
          PLAYER_ACTION_RUNTIME_PASSWORD: ${{ secrets.PLAYER_ACTION_RUNTIME_PASSWORD }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGHOST: ${{ env.STAGING_POOLER_HOST }}
          PGPORT: '5432'
          PGDATABASE: postgres
          PGUSER: postgres.${{ env.STAGING_PROJECT_REF }}
          PGSSLMODE: verify-full
          PGSSLROOTCERT: ${{ steps.protected.outputs.secret_dir }}/supabase-ca.crt
          PGSERVICEFILE: /dev/null
          PGPASSFILE: /dev/null
        run: |
          set -euo pipefail
          echo 'attempted=true' >> "$GITHUB_OUTPUT"
          psql -X --file=infra/sql/staging-runtimes-provision-for-deploy.sql

      - name: Transfer and install sealed release inputs
        shell: bash
        env:
          SECRET_DIR: ${{ steps.protected.outputs.secret_dir }}
          VM_HOST: ${{ steps.protected.outputs.vm_host }}
        run: |
          set -euo pipefail
          incoming="/tmp/fetanagent-$GITHUB_SHA"
          ssh_opts=(-F /dev/null -i "$SECRET_DIR/deploy-key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SECRET_DIR/known-hosts")
          ssh "${ssh_opts[@]}" "fetanagent-admin@$VM_HOST" "install -d -m 0700 '$incoming'"
          scp "${ssh_opts[@]}" "$RUNNER_TEMP/release/fetanagent-staging-images.tar" \
            infra/compose.staging-beta.yaml "$SECRET_DIR/supabase-ca.crt" \
            "$SECRET_DIR/beta-database-url" "$SECRET_DIR/owner-database-url" \
            "$SECRET_DIR/player-action-database-url" \
            "$SECRET_DIR/beta-transport-hmac" "$SECRET_DIR/bot-transport-hmac" \
            "$SECRET_DIR/api-action-transport-hmac" "$SECRET_DIR/bot-action-transport-hmac" \
            "$SECRET_DIR/api-action-payload-hmac" "$SECRET_DIR/api-action-capability-hmac" \
            "$SECRET_DIR/api-action-semantic-hmac" \
            "$SECRET_DIR/api-deposit-reference-protection" \
            "$SECRET_DIR/beta-payload-hmac" "$SECRET_DIR/bot-token" \
            "$SECRET_DIR/publishable-key" "fetanagent-admin@$VM_HOST:$incoming/"
          ssh "${ssh_opts[@]}" "fetanagent-admin@$VM_HOST" \
            "test \"\$(id -u)\" -ne 0 && sudo -n /usr/local/sbin/fetanagent-staging-deploy-helper verify '${{ steps.protected.outputs.helper_sha }}' && sudo -n /usr/local/sbin/fetanagent-staging-deploy-helper install '$GITHUB_SHA' '${GITHUB_SHA:0:12}' '$incoming'"

      - name: Start the private staging profile and smoke readiness
        id: activate
        shell: bash
        env:
          SECRET_DIR: ${{ steps.protected.outputs.secret_dir }}
          VM_HOST: ${{ steps.protected.outputs.vm_host }}
        run: |
          set -euo pipefail
          ssh_opts=(-F /dev/null -i "$SECRET_DIR/deploy-key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SECRET_DIR/known-hosts")
          ssh "${ssh_opts[@]}" "fetanagent-admin@$VM_HOST" \
            "test \"\$(id -u)\" -ne 0 && sudo -n /usr/local/sbin/fetanagent-staging-deploy-helper verify '${{ steps.protected.outputs.helper_sha }}' && sudo -n /usr/local/sbin/fetanagent-staging-deploy-helper start '$GITHUB_SHA' '${GITHUB_SHA:0:12}'"
          ssh "${ssh_opts[@]}" "fetanagent-admin@$VM_HOST" \
            "curl --fail --silent --show-error --max-time 5 http://127.0.0.1:3002/readyz >/dev/null"
          echo 'started=true' >> "$GITHUB_OUTPUT"

      - name: Capture bounded Owner-control startup diagnostics
        if: failure() && steps.activate.outcome == 'failure'
        shell: bash
        env:
          SECRET_DIR: ${{ steps.protected.outputs.secret_dir }}
          VM_HOST: ${{ steps.protected.outputs.vm_host }}
        run: |
          set -euo pipefail
          ssh_opts=(-F /dev/null -i "$SECRET_DIR/deploy-key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SECRET_DIR/known-hosts")
          ssh "${ssh_opts[@]}" "fetanagent-admin@$VM_HOST" \
            "test \"\$(id -u)\" -ne 0 && sudo -n /usr/local/sbin/fetanagent-staging-deploy-helper verify '${{ steps.protected.outputs.helper_sha }}' && sudo -n /usr/local/sbin/fetanagent-staging-deploy-helper diagnose-owner-startup '$GITHUB_SHA' '${GITHUB_SHA:0:12}'"

      - name: Capture count-only runtime session diagnostics after failed activation
        if: failure() && steps.provision.outputs.attempted == 'true'
        shell: bash
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGHOST: ${{ env.STAGING_POOLER_HOST }}
          PGPORT: '5432'
          PGDATABASE: postgres
          PGUSER: postgres.${{ env.STAGING_PROJECT_REF }}
          PGSSLMODE: verify-full
          PGSSLROOTCERT: ${{ steps.protected.outputs.secret_dir }}/supabase-ca.crt
          PGCONNECT_TIMEOUT: '5'
          PGSERVICEFILE: /dev/null
          PGPASSFILE: /dev/null
        run: psql -X --file=infra/sql/staging-runtime-session-diagnostics.sql

      - name: Roll back failed activation
        if: failure() && steps.activate.outputs.started != 'true'
        shell: bash
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGHOST: ${{ env.STAGING_POOLER_HOST }}
          PGPORT: '5432'
          PGDATABASE: postgres
          PGUSER: postgres.${{ env.STAGING_PROJECT_REF }}
          PGSSLMODE: verify-full
          PGSSLROOTCERT: ${{ steps.protected.outputs.secret_dir }}/supabase-ca.crt
          PGSERVICEFILE: /dev/null
          PGPASSFILE: /dev/null
        run: |
          set -euo pipefail
          secret_dir='${{ steps.protected.outputs.secret_dir }}'
          vm_host='${{ steps.protected.outputs.vm_host }}'
          if [[ -n "$secret_dir" && -n "$vm_host" ]]; then
            ssh -F /dev/null -i "$secret_dir/deploy-key" -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$secret_dir/known-hosts" \
              "fetanagent-admin@$vm_host" \
              "sudo -n /usr/local/sbin/fetanagent-staging-deploy-helper verify '${{ steps.protected.outputs.helper_sha }}' && sudo -n /usr/local/sbin/fetanagent-staging-deploy-helper stop && sudo -n /usr/local/sbin/fetanagent-staging-deploy-helper discard '$GITHUB_SHA'" || true
          fi
          cleanup_status=1
          for attempt in 1 2 3 4; do
            if psql -X --file=infra/sql/staging-runtimes-disable.sql; then
              cleanup_status=0
              break
            else
              cleanup_status=$?
            fi
            if [[ "$attempt" -lt 4 ]]; then
              echo "::warning::Staging runtime cleanup connection failed on attempt $attempt of 4; waiting 15 seconds."
              sleep 15
            fi
          done
          if [[ "$cleanup_status" -ne 0 ]]; then
            echo '::error::Staging runtime logins could not be disabled after four bounded attempts.'
            exit "$cleanup_status"
          fi

  stop:
    name: Stop staging and disable runtime logins
    if: inputs.mode == 'stop-and-disable'
    needs: validate-target
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: staging
    permissions:
      contents: read
    steps:
      - name: Check out cleanup SQL
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Stop containers and disable all staging database logins
        shell: bash
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGHOST: ${{ env.STAGING_POOLER_HOST }}
          PGPORT: '5432'
          PGDATABASE: postgres
          PGUSER: postgres.${{ env.STAGING_PROJECT_REF }}
          PGSSLMODE: verify-full
          PGSSLROOTCERT: ${{ runner.temp }}/supabase-ca.crt
          PGSERVICEFILE: /dev/null
          PGPASSFILE: /dev/null
          STAGING_VM_HOST: ${{ secrets.STAGING_VM_HOST }}
          STAGING_VM_KNOWN_HOSTS: ${{ secrets.STAGING_VM_KNOWN_HOSTS }}
          STAGING_VM_SSH_PRIVATE_KEY: ${{ secrets.STAGING_VM_SSH_PRIVATE_KEY }}
          SUPABASE_CA_CERTIFICATE_PEM: ${{ secrets.SUPABASE_CA_CERTIFICATE_PEM }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$STAGING_VM_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/deploy-key"
          printf '%s\n' "$STAGING_VM_KNOWN_HOSTS" > "$RUNNER_TEMP/known-hosts"
          printf '%s\n' "$SUPABASE_CA_CERTIFICATE_PEM" > "$PGSSLROOTCERT"
          openssl x509 -in "$PGSSLROOTCERT" -noout -checkend 0 >/dev/null
          helper_sha="$(sha256sum infra/operations/fetanagent-staging-deploy-helper.sh | awk '{print $1}')"
          remote_status=0
          ssh -F /dev/null -i "$RUNNER_TEMP/deploy-key" -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/known-hosts" \
            "fetanagent-admin@$STAGING_VM_HOST" \
            "test \"\$(id -u)\" -ne 0 && sudo -n /usr/local/sbin/fetanagent-staging-deploy-helper verify '$helper_sha' && sudo -n /usr/local/sbin/fetanagent-staging-deploy-helper stop && sudo -n /usr/local/sbin/fetanagent-staging-deploy-helper discard '$GITHUB_SHA'" || remote_status=$?
          psql -X --file=infra/sql/staging-runtimes-disable.sql
          if [[ "$remote_status" -ne 0 ]]; then
            echo '::error::Database logins were disabled, but the VM cleanup requires operator review.'
            exit "$remote_status"
          fi
