          test "$(stat --format='%s' "$remote_bundle/fetanagent-owner-control-canonical-h14.tar")" = "$tar_size"
          test "$(sha256sum "$remote_bundle/fetanagent-owner-control-canonical-h14.tar" | awk '{print $1}')" = "$tar_sha"
          test "$(sha256sum "$remote_bundle/compose.staging-beta.yaml" | awk '{print $1}')" = "$compose_sha"
          test "$(sha256sum "$remote_bundle/manifest-v1" | awk '{print $1}')" = "$manifest_sha"
