      - name: Stage only the no-secret archive-recovery bundle
        id: stage
        shell: bash
        env:
          SCRIPT_SHA: ${{ steps.bundle.outputs.script_sha }}
          VALIDATOR_SHA: ${{ steps.bundle.outputs.validator_sha }}
          SCRIPT_SIZE: ${{ steps.bundle.outputs.script_size }}
          VALIDATOR_SIZE: ${{ steps.bundle.outputs.validator_size }}
          MANIFEST: ${{ steps.bundle.outputs.manifest }}
          MANIFEST_SHA: ${{ steps.bundle.outputs.manifest_sha }}
          MANIFEST_SIZE: ${{ steps.bundle.outputs.manifest_size }}
          CUSTOMER_ARCHIVE: ${{ steps.bundle.outputs.customer_archive }}
          CUSTOMER_ARCHIVE_SHA: ${{ steps.bundle.outputs.customer_archive_sha }}
          CUSTOMER_ARCHIVE_SIZE: ${{ steps.bundle.outputs.customer_archive_size }}
          CUSTOMER_IMAGE_ID: ${{ steps.bundle.outputs.customer_image_id }}
        run: |
          set -euo pipefail
          secret_dir="$(mktemp -d "$RUNNER_TEMP/h14-owner-archive-recovery-ssh.XXXXXX")"
          trap 'rm -rf "$secret_dir"' EXIT
          printf '%s\n' "$STAGING_VM_SSH_PRIVATE_KEY" >"$secret_dir/key"
          printf '%s\n' "$STAGING_VM_KNOWN_HOSTS" >"$secret_dir/known"
          chmod 0600 "$secret_dir/key" "$secret_dir/known"
          ssh-keygen -F "$STAGING_VM_HOST" -f "$secret_dir/known" >/dev/null
          opts=(-F /dev/null -i "$secret_dir/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$secret_dir/known")
          remote="fetanagent-admin@$STAGING_VM_HOST"
          bundle="/tmp/fetanagent-h14-owner-runtime-bridge-archive-recovery-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_SHA"
          [[ "$bundle" =~ ^/tmp/fetanagent-h14-owner-runtime-bridge-archive-recovery-[1-9][0-9]*-[1-9][0-9]*-[0-9a-f]{40}$ ]]
          ssh "${opts[@]}" "$remote" "test \"\$(id -u)\" -ne 0 && test ! -e '$bundle' && install -d -m 0700 '$bundle'"
          scp "${opts[@]}" infra/operations/fetanagent-kemerbet-quarantine-recovery-v14-owner-runtime-bridge-archive-recovery.sh infra/operations/fetanagent-owner-archive-validator.py "$MANIFEST" "$CUSTOMER_ARCHIVE" "$remote:$bundle/"
          ssh "${opts[@]}" "$remote" "mv '$bundle/h14-owner-archive-recovery-manifest-v1' '$bundle/manifest-v1'"
          ssh "${opts[@]}" "$remote" bash -s -- "$bundle" "$SCRIPT_SHA" "$SCRIPT_SIZE" "$VALIDATOR_SHA" "$VALIDATOR_SIZE" "$MANIFEST_SHA" "$MANIFEST_SIZE" "$CUSTOMER_ARCHIVE_SHA" "$CUSTOMER_ARCHIVE_SIZE" <<'REMOTE'
          set -euo pipefail
          bundle="$1"; script_sha="$2"; script_size="$3"; validator_sha="$4"; validator_size="$5"; manifest_sha="$6"; manifest_size="$7"; customer_sha="$8"; customer_size="$9"
          test "$(id -u)" -ne 0
          chmod 0600 "$bundle"/*
          test "$(find -P "$bundle" -mindepth 1 -maxdepth 1 -printf '%f:%y\n' | LC_ALL=C sort)" = "fetanagent-customer-web-self-recovery.tar:f
          fetanagent-kemerbet-quarantine-recovery-v14-owner-runtime-bridge-archive-recovery.sh:f
          fetanagent-owner-archive-validator.py:f
          manifest-v1:f"
          test "$(sha256sum "$bundle/fetanagent-kemerbet-quarantine-recovery-v14-owner-runtime-bridge-archive-recovery.sh" | awk '{print $1}')" = "$script_sha"
          test "$(stat -c %s "$bundle/fetanagent-kemerbet-quarantine-recovery-v14-owner-runtime-bridge-archive-recovery.sh")" = "$script_size"
          test "$(sha256sum "$bundle/fetanagent-owner-archive-validator.py" | awk '{print $1}')" = "$validator_sha"
          test "$(stat -c %s "$bundle/fetanagent-owner-archive-validator.py")" = "$validator_size"
          test "$(sha256sum "$bundle/manifest-v1" | awk '{print $1}')" = "$manifest_sha"
          test "$(stat -c %s "$bundle/manifest-v1")" = "$manifest_size"
          test "$(sha256sum "$bundle/fetanagent-customer-web-self-recovery.tar" | awk '{print $1}')" = "$customer_sha"
          test "$(stat -c %s "$bundle/fetanagent-customer-web-self-recovery.tar")" = "$customer_size"
          REMOTE
          echo "remote_bundle=$bundle" >>"$GITHUB_OUTPUT"

