            echo "  [[ ! -L '$root_script' && -f '$root_script' && \"\$(realpath -- '$root_script')\" == '$root_script' ]]"
            echo "  [[ \"\$(stat --format='%U:%G:%a:%h' '$root_script')\" == 'root:root:600:1' ]]"
            echo 'fi'
            echo "[[ \"\$(stat --format='%s' '$root_script')\" == '$SCRIPT_SIZE' ]]"
            echo "[[ \"\$(sha256sum '$root_script' | awk '{print \$1}')\" == '$SCRIPT_SHA' ]]"
            echo "$invocation"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  h14-owner-runtime-bridge-archive-recovery-stage:
    name: Stage release-pinned H14 Owner archive recovery
    if: inputs.mode == 'h14-owner-runtime-bridge-archive-recovery-stage'
    needs: validate-target
    runs-on: ubuntu-24.04
    environment: staging
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    env:
      CONFIRMED_RECOVERY_RELEASE: ${{ inputs.confirm_repair_implementation_sha }}
      CONFIRMED_H14_AUTHORIZATION: ${{ inputs.confirm_quarantine_recovery_authorization_sha256 }}
      CONFIRMED_OWNER_ONLY: ${{ inputs.confirm_owner_only_no_provider_action }}
      STAGING_VM_HOST: ${{ secrets.STAGING_VM_HOST }}
      STAGING_VM_KNOWN_HOSTS: ${{ secrets.STAGING_VM_KNOWN_HOSTS }}
      STAGING_VM_SSH_PRIVATE_KEY: ${{ secrets.STAGING_VM_SSH_PRIVATE_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Re-prove exact recovery pull request and immutable source release
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" =~ ^refs/heads/[A-Za-z0-9._/-]+$ && "$GITHUB_REF" != refs/heads/main ]]
          [[ "$GITHUB_SHA" == "$CONFIRMED_RECOVERY_RELEASE" && "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CONFIRMED_H14_AUTHORIZATION" == "$H14_RECOVERY_AUTHORIZATION_SHA256" ]]
          [[ "$CONFIRMED_OWNER_ONLY" == owner-unchanged-customer-web-only-no-provider-action-no-money ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" == "$CANONICAL_H14_COMMIT" ]]
          branch_name="${GITHUB_REF#refs/heads/}"
          mapfile -t pulls < <(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq ".[] | select(.state == \"open\" and .base.ref == \"main\" and .base.sha == \"$CANONICAL_H14_COMMIT\" and .head.sha == \"$GITHUB_SHA\" and .head.ref == \"$branch_name\" and .head.repo.full_name == \"$GITHUB_REPOSITORY\") | .number")
          [[ "${#pulls[@]}" == 1 && "${pulls[0]}" =~ ^[1-9][0-9]*$ ]]

      - name: Check out exact archive-recovery implementation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ inputs.confirm_repair_implementation_sha }}

      - name: Verify immutable predecessor and recovery syntax
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$CONFIRMED_RECOVERY_RELEASE" ]]
          git fetch --no-tags --depth=1 origin 001316f1f65dc7a9976244e8fc01f90aec665a70
          git fetch --no-tags --depth=1 origin 911758fa1407093bee700918d5a663a7735f1658
          git fetch --no-tags --depth=1 origin ff989bc5e1a0488ffa34bfa7c2c49ec3225bc51b
          git fetch --no-tags --depth=1 origin fa35244c8e8e2b9f10fe7abb2cd2341864b43471
          git fetch --no-tags --depth=1 origin 0a2adc0bf3591fe2449379ac2bf76c21538fadf5
          git fetch --no-tags --depth=1 origin 04f51a521280fed43cd1504107c702940e523688
          git fetch --no-tags --depth=1 origin 51e5170488d720fd04decd1896971ab72cfe9603
          git fetch --no-tags --depth=1 origin 8f1ef460a231fe2c21e2df2d986749400d08c38c
          git fetch --no-tags --depth=1 origin 0202304e3c606d2a7927a5b027d76926c0117189
          git fetch --no-tags --depth=1 origin 0110d1965d7efdc0436abda8c0bc686fb33c084b
          git cat-file -e 001316f1f65dc7a9976244e8fc01f90aec665a70^{commit}
          git cat-file -e 911758fa1407093bee700918d5a663a7735f1658^{commit}
          git cat-file -e ff989bc5e1a0488ffa34bfa7c2c49ec3225bc51b^{commit}
          git cat-file -e fa35244c8e8e2b9f10fe7abb2cd2341864b43471^{commit}
          git cat-file -e 0a2adc0bf3591fe2449379ac2bf76c21538fadf5^{commit}
          git cat-file -e 04f51a521280fed43cd1504107c702940e523688^{commit}
          git cat-file -e 51e5170488d720fd04decd1896971ab72cfe9603^{commit}
          git cat-file -e 8f1ef460a231fe2c21e2df2d986749400d08c38c^{commit}
          git cat-file -e 0202304e3c606d2a7927a5b027d76926c0117189^{commit}
