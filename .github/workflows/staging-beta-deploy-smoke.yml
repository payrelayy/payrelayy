  connectivity:
    name: Unban exact staging IP and check connectivity once
    if: inputs.mode == 'unban-and-connectivity-check'
    needs: validate-target
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: staging
    permissions:
      contents: read
    steps:
      - name: Set up the pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: 2.113.0

      - name: Remove only the approved staging network ban
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$SUPABASE_ACCESS_TOKEN" ]]
          supabase --version | grep -Fx "$SUPABASE_CLI_VERSION"
          supabase network-bans get --help >/dev/null
          supabase network-bans remove --help >/dev/null
          command -v jq >/dev/null
          current_bans="$(supabase network-bans get \
            --project-ref "$STAGING_PROJECT_REF" --experimental --output json)"
          if ! ban_status="$(jq -er --arg ip "$STAGING_BANNED_IP" '
            if type == "array" and all(.[]; type == "string") then
              if index($ip) == null then "clear" else "banned" end
            else
              error("unexpected network-ban response")
            end
          ' <<<"$current_bans" 2>/dev/null)"; then
            echo '::error::The staging network-ban check returned an unexpected response; no ban was removed.'
            exit 1
          fi
          case "$ban_status" in
            banned)
              supabase network-bans remove --db-unban-ip "$STAGING_BANNED_IP" \
                --project-ref "$STAGING_PROJECT_REF" --experimental
              ;;
            clear)
              echo 'The approved staging IP is no longer banned; no ban was removed.'
              ;;
            *)
              echo '::error::The staging network-ban check returned an unexpected response; no ban was removed.'
              exit 1
              ;;
          esac

      - name: Verify one protected admin connection without changing database state
        shell: bash
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGHOST: ${{ env.STAGING_POOLER_HOST }}
          PGPORT: '5432'
          PGDATABASE: postgres
          PGUSER: postgres.${{ env.STAGING_PROJECT_REF }}
          PGSSLMODE: verify-full
          PGSSLROOTCERT: ${{ runner.temp }}/supabase-ca.crt
          PGCONNECT_TIMEOUT: '5'
          PGSERVICEFILE: /dev/null
          PGPASSFILE: /dev/null
          SUPABASE_CA_CERTIFICATE_PEM: ${{ secrets.SUPABASE_CA_CERTIFICATE_PEM }}
        run: |
          set -euo pipefail
          [[ -n "$PGPASSWORD" && -n "$SUPABASE_CA_CERTIFICATE_PEM" ]]
          umask 077
          trap 'rm -f "$PGSSLROOTCERT"' EXIT
          printf '%s\n' "$SUPABASE_CA_CERTIFICATE_PEM" > "$PGSSLROOTCERT"
          openssl x509 -in "$PGSSLROOTCERT" -noout -checkend 0 >/dev/null
          psql -X --set=ON_ERROR_STOP=1 \
            --command='select 1 as staging_database_reachable;'

  transition-ssh-verify:
    name: Verify prepared transition SSH access read-only
    if: inputs.mode == 'transition-ssh-verify'
    needs: validate-target
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: staging
    permissions:
      contents: read
    steps:
      - name: Check out the exact helper contract
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify non-root SSH and the exact installed helper
        shell: bash
        env:
          CONFIRMED_COMMIT: ${{ inputs.confirm_main_commit_sha }}
          CONFIRMED_DROPLET: ${{ inputs.confirm_droplet_id }}
          CONFIRMED_PROJECT: ${{ inputs.confirm_staging_project_ref }}
          REQUESTED_MODE: ${{ inputs.mode }}
          STAGING_VM_HOST: ${{ secrets.STAGING_VM_HOST }}
          STAGING_VM_KNOWN_HOSTS: ${{ secrets.STAGING_VM_KNOWN_HOSTS }}
          STAGING_VM_SSH_PRIVATE_KEY: ${{ secrets.STAGING_VM_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$CONFIRMED_COMMIT" == "$GITHUB_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$CONFIRMED_PROJECT" == "$STAGING_PROJECT_REF" ]]
          [[ "$CONFIRMED_PROJECT" != "$PRODUCTION_PROJECT_REF" ]]
          [[ "$CONFIRMED_DROPLET" == "$STAGING_DROPLET_ID" ]]
          [[ "$REQUESTED_MODE" == 'transition-ssh-verify' ]]
          [[ "$STAGING_VM_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ -n "$STAGING_VM_KNOWN_HOSTS" && -n "$STAGING_VM_SSH_PRIVATE_KEY" ]]

          secret_dir="$RUNNER_TEMP/transition-ssh-verify"
          umask 077
          install -d -m 0700 "$secret_dir"
          trap 'rm -f "$secret_dir/deploy-key" "$secret_dir/known-hosts"' EXIT
          printf '%s\n' "$STAGING_VM_SSH_PRIVATE_KEY" > "$secret_dir/deploy-key"
          printf '%s\n' "$STAGING_VM_KNOWN_HOSTS" > "$secret_dir/known-hosts"
          chmod 0600 "$secret_dir/deploy-key" "$secret_dir/known-hosts"
          ssh-keygen -y -f "$secret_dir/deploy-key" >/dev/null
          ssh-keygen -F "$STAGING_VM_HOST" -f "$secret_dir/known-hosts" >/dev/null

          helper_sha="$(sha256sum infra/operations/fetanagent-staging-deploy-helper.sh | awk '{print $1}')"
          [[ "$helper_sha" =~ ^[0-9a-f]{64}$ ]]
          ssh_opts=(
            -F /dev/null
            -i "$secret_dir/deploy-key"
            -o BatchMode=yes
            -o ClearAllForwardings=yes
            -o ConnectTimeout=10
            -o ConnectionAttempts=1
            -o IdentitiesOnly=yes
            -o RequestTTY=no
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$secret_dir/known-hosts"
          )
          remote_command="test \"\$(id -u)\" -ne 0 && test \"\$(id -un)\" = 'fetanagent-admin' && sudo -n /usr/local/sbin/fetanagent-staging-deploy-helper verify '$helper_sha'"
          ssh "${ssh_opts[@]}" "fetanagent-admin@$STAGING_VM_HOST" "$remote_command"
          echo 'transition_ssh_verification=pass'

  transition-stop-legacy:
    name: Stop the exact legacy runtime through its original boundary
    if: inputs.mode == 'transition-stop-legacy'
    needs: validate-target
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: staging
    permissions:
      contents: read
    steps:
      - name: Check out the exact acknowledged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify and stop only the exact legacy runtime
        shell: bash
        env:
          CONFIRMED_COMMIT: ${{ inputs.confirm_main_commit_sha }}
          CONFIRMED_DROPLET: ${{ inputs.confirm_droplet_id }}
          CONFIRMED_LEGACY_STOP: ${{ inputs.confirm_legacy_stop }}
          CONFIRMED_PROJECT: ${{ inputs.confirm_staging_project_ref }}
          REQUESTED_MODE: ${{ inputs.mode }}
          STAGING_VM_HOST: ${{ secrets.STAGING_VM_HOST }}
          STAGING_VM_KNOWN_HOSTS: ${{ secrets.STAGING_VM_KNOWN_HOSTS }}
          STAGING_VM_SSH_PRIVATE_KEY: ${{ secrets.STAGING_VM_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$CONFIRMED_COMMIT" == "$GITHUB_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$CONFIRMED_PROJECT" == "$STAGING_PROJECT_REF" ]]
          [[ "$CONFIRMED_PROJECT" != "$PRODUCTION_PROJECT_REF" ]]
          [[ "$CONFIRMED_DROPLET" == "$STAGING_DROPLET_ID" ]]
          [[ "$REQUESTED_MODE" == 'transition-stop-legacy' ]]
          [[ "$CONFIRMED_LEGACY_STOP" == 'stop-legacy-staging-runtime' ]]
          [[ "$STAGING_VM_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ -n "$STAGING_VM_KNOWN_HOSTS" && -n "$STAGING_VM_SSH_PRIVATE_KEY" ]]

          secret_dir="$RUNNER_TEMP/transition-stop-legacy"
          umask 077
          install -d -m 0700 "$secret_dir"
          trap 'rm -f "$secret_dir/deploy-key" "$secret_dir/known-hosts"' EXIT
          printf '%s\n' "$STAGING_VM_SSH_PRIVATE_KEY" > "$secret_dir/deploy-key"
          printf '%s\n' "$STAGING_VM_KNOWN_HOSTS" > "$secret_dir/known-hosts"
          chmod 0600 "$secret_dir/deploy-key" "$secret_dir/known-hosts"
          ssh-keygen -y -f "$secret_dir/deploy-key" >/dev/null
          ssh-keygen -F "$STAGING_VM_HOST" -f "$secret_dir/known-hosts" >/dev/null

          ssh_opts=(
            -F /dev/null
            -i "$secret_dir/deploy-key"
            -o BatchMode=yes
            -o ClearAllForwardings=yes
            -o ConnectTimeout=10
            -o ConnectionAttempts=1
            -o IdentitiesOnly=yes
            -o RequestTTY=no
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$secret_dir/known-hosts"
          )
          legacy_brand='pay''replayy'
          legacy_admin="${legacy_brand}-admin"
          legacy_helper="/usr/local/sbin/${legacy_brand}-staging-deploy-helper"
          remote_command="test \"\$(id -u)\" -ne 0 && test \"\$(id -un)\" = '$legacy_admin' && sudo -n '$legacy_helper' verify '4007e616b5d0b8b29b9e8f80de6a86485d60e0fb28ad54028cc2f3b1bb080d69' && sudo -n '$legacy_helper' stop"
          ssh "${ssh_opts[@]}" "$legacy_admin@$STAGING_VM_HOST" "$remote_command"
          echo 'transition_legacy_stop=pass'

  deploy:
    name: Deploy and smoke exact staging release
    if: inputs.mode == 'deploy-and-smoke'
    needs: [validate-target, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: staging
    permissions:
      contents: read
    steps:
      - name: Check out deployment contract
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download sealed image bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fetanagent-staging-images-${{ github.sha }}
          path: ${{ runner.temp }}/release

      - name: Validate protected deploy inputs
        id: protected
        shell: bash
        env:
          BETA_ADMISSION_PAYLOAD_HMAC_SECRET: ${{ secrets.BETA_ADMISSION_PAYLOAD_HMAC_SECRET }}
          BETA_ADMISSION_RUNTIME_PASSWORD: ${{ secrets.BETA_ADMISSION_RUNTIME_PASSWORD }}
          BOT_TO_API_ACTION_HMAC_SECRET: ${{ secrets.BOT_TO_API_ACTION_HMAC_SECRET }}
          BOT_TO_BETA_ADMISSION_HMAC_SECRET: ${{ secrets.BOT_TO_BETA_ADMISSION_HMAC_SECRET }}
          API_TELEGRAM_PLAYER_ACTION_PAYLOAD_HMAC_SECRET: ${{ secrets.API_TELEGRAM_PLAYER_ACTION_PAYLOAD_HMAC_SECRET }}
          API_TELEGRAM_CAPABILITY_HMAC_SECRET: ${{ secrets.API_TELEGRAM_CAPABILITY_HMAC_SECRET }}
          API_TELEGRAM_ACTION_SEMANTIC_HMAC_SECRET: ${{ secrets.API_TELEGRAM_ACTION_SEMANTIC_HMAC_SECRET }}
          CBE_DEPOSIT_REFERENCE_ENCRYPTION_SECRET: ${{ secrets.CBE_DEPOSIT_REFERENCE_ENCRYPTION_SECRET }}
          CBE_DEPOSIT_REFERENCE_FINGERPRINT_SECRET: ${{ secrets.CBE_DEPOSIT_REFERENCE_FINGERPRINT_SECRET }}
          CBE_DEPOSIT_REFERENCE_KEY_PROFILE_V1_JSON: ${{ vars.CBE_DEPOSIT_REFERENCE_KEY_PROFILE_V1_JSON }}
          DEPOSIT_PROOF_REFERENCE_ENCRYPTION_MASTER_SECRET: ${{ secrets.DEPOSIT_PROOF_REFERENCE_ENCRYPTION_MASTER_SECRET }}
          DEPOSIT_PROOF_REFERENCE_FINGERPRINT_MASTER_SECRET: ${{ secrets.DEPOSIT_PROOF_REFERENCE_FINGERPRINT_MASTER_SECRET }}
          DEPOSIT_PROOF_REFERENCE_PROFILE_V2_JSON: ${{ vars.DEPOSIT_PROOF_REFERENCE_PROFILE_V2_JSON }}
          CUSTOMER_WEB_RATE_LIMIT_HMAC_SECRET: ${{ secrets.CUSTOMER_WEB_RATE_LIMIT_HMAC_SECRET }}
          CUSTOMER_WEB_RUNTIME_PASSWORD: ${{ secrets.CUSTOMER_WEB_RUNTIME_PASSWORD }}
          OWNER_CONTROL_RUNTIME_PASSWORD: ${{ secrets.OWNER_CONTROL_RUNTIME_PASSWORD }}
          PLAYER_ACTION_RUNTIME_PASSWORD: ${{ secrets.PLAYER_ACTION_RUNTIME_PASSWORD }}
          STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          STAGING_VM_HOST: ${{ secrets.STAGING_VM_HOST }}
          STAGING_VM_KNOWN_HOSTS: ${{ secrets.STAGING_VM_KNOWN_HOSTS }}
          STAGING_VM_SSH_PRIVATE_KEY: ${{ secrets.STAGING_VM_SSH_PRIVATE_KEY }}
          SUPABASE_CA_CERTIFICATE_PEM: ${{ secrets.SUPABASE_CA_CERTIFICATE_PEM }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$BETA_ADMISSION_RUNTIME_PASSWORD" =~ ^[0-9a-f]{64}$ ]]
          [[ "$OWNER_CONTROL_RUNTIME_PASSWORD" =~ ^[0-9a-f]{64}$ ]]
          [[ "$CUSTOMER_WEB_RUNTIME_PASSWORD" =~ ^[0-9a-f]{64}$ ]]
          [[ "$CUSTOMER_WEB_RATE_LIMIT_HMAC_SECRET" =~ ^[0-9a-f]{64}$ ]]
          [[ "$BOT_TO_BETA_ADMISSION_HMAC_SECRET" =~ ^[0-9a-f]{64}$ ]]
          [[ "$BETA_ADMISSION_PAYLOAD_HMAC_SECRET" =~ ^[0-9a-f]{64}$ ]]
          [[ "$PLAYER_ACTION_RUNTIME_PASSWORD" =~ ^[0-9a-f]{64}$ ]]
          [[ "$BOT_TO_API_ACTION_HMAC_SECRET" =~ ^[0-9a-f]{64}$ ]]
          [[ "$API_TELEGRAM_PLAYER_ACTION_PAYLOAD_HMAC_SECRET" =~ ^[0-9a-f]{64}$ ]]
          [[ "$API_TELEGRAM_CAPABILITY_HMAC_SECRET" =~ ^[0-9a-f]{64}$ ]]
          [[ "$API_TELEGRAM_ACTION_SEMANTIC_HMAC_SECRET" =~ ^[0-9a-f]{64}$ ]]
          [[ "$CBE_DEPOSIT_REFERENCE_ENCRYPTION_SECRET" =~ ^[0-9a-f]{64}$ ]]
          [[ "$CBE_DEPOSIT_REFERENCE_FINGERPRINT_SECRET" =~ ^[0-9a-f]{64}$ ]]
          [[ -n "$CBE_DEPOSIT_REFERENCE_KEY_PROFILE_V1_JSON" ]]
          [[ "$DEPOSIT_PROOF_REFERENCE_ENCRYPTION_MASTER_SECRET" =~ ^[0-9a-f]{64}$ ]]
          [[ "$DEPOSIT_PROOF_REFERENCE_FINGERPRINT_MASTER_SECRET" =~ ^[0-9a-f]{64}$ ]]
          [[ -n "$DEPOSIT_PROOF_REFERENCE_PROFILE_V2_JSON" ]]
          distinct_count="$(printf '%s\n' \
            "$BETA_ADMISSION_RUNTIME_PASSWORD" "$OWNER_CONTROL_RUNTIME_PASSWORD" \
            "$CUSTOMER_WEB_RUNTIME_PASSWORD" "$CUSTOMER_WEB_RATE_LIMIT_HMAC_SECRET" \
            "$PLAYER_ACTION_RUNTIME_PASSWORD" "$BOT_TO_BETA_ADMISSION_HMAC_SECRET" \
            "$BETA_ADMISSION_PAYLOAD_HMAC_SECRET" "$BOT_TO_API_ACTION_HMAC_SECRET" \
            "$API_TELEGRAM_PLAYER_ACTION_PAYLOAD_HMAC_SECRET" \
            "$API_TELEGRAM_CAPABILITY_HMAC_SECRET" \
            "$API_TELEGRAM_ACTION_SEMANTIC_HMAC_SECRET" \
            "$CBE_DEPOSIT_REFERENCE_ENCRYPTION_SECRET" \
            "$CBE_DEPOSIT_REFERENCE_FINGERPRINT_SECRET" \
            "$DEPOSIT_PROOF_REFERENCE_ENCRYPTION_MASTER_SECRET" \
            "$DEPOSIT_PROOF_REFERENCE_FINGERPRINT_MASTER_SECRET" | sort -u | wc -l)"
          [[ "$distinct_count" -eq 15 ]]
          [[ -n "$SUPABASE_DB_PASSWORD" ]]
          [[ "$STAGING_SUPABASE_PUBLISHABLE_KEY" =~ ^sb_publishable_[A-Za-z0-9_-]{20,}$ ]]
          [[ "$STAGING_VM_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ -n "$STAGING_VM_KNOWN_HOSTS" && -n "$STAGING_VM_SSH_PRIVATE_KEY" ]]

          secret_dir="$RUNNER_TEMP/protected"
          install -d -m 0700 "$secret_dir"
          umask 077
          printf '%s\n' "$STAGING_VM_SSH_PRIVATE_KEY" > "$secret_dir/deploy-key"
          printf '%s\n' "$STAGING_VM_KNOWN_HOSTS" > "$secret_dir/known-hosts"
          printf '%s\n' "$SUPABASE_CA_CERTIFICATE_PEM" > "$secret_dir/supabase-ca.crt"
          printf 'postgresql://%s:%s@%s:5432/postgres?sslmode=verify-full\n' \
            "$BETA_RUNTIME_ROLE" "$BETA_ADMISSION_RUNTIME_PASSWORD" "$STAGING_DIRECT_DATABASE_HOST" \
            > "$secret_dir/beta-database-url"
          printf 'postgresql://%s:%s@%s:5432/postgres?sslmode=verify-full\n' \
            "$OWNER_RUNTIME_ROLE" "$OWNER_CONTROL_RUNTIME_PASSWORD" "$STAGING_DIRECT_DATABASE_HOST" \
            > "$secret_dir/owner-database-url"
          printf 'postgresql://%s:%s@%s:5432/postgres?sslmode=verify-full\n' \
            "$CUSTOMER_WEB_RUNTIME_ROLE" "$CUSTOMER_WEB_RUNTIME_PASSWORD" "$STAGING_DIRECT_DATABASE_HOST" \
            > "$secret_dir/customer-web-database-url"
          printf '%s\n' "$CUSTOMER_WEB_RATE_LIMIT_HMAC_SECRET" > "$secret_dir/customer-web-rate-limit-hmac"
          printf 'postgresql://%s:%s@%s:5432/postgres?sslmode=verify-full\n' \
            "$PLAYER_ACTION_RUNTIME_ROLE" "$PLAYER_ACTION_RUNTIME_PASSWORD" "$STAGING_DIRECT_DATABASE_HOST" \
            > "$secret_dir/player-action-database-url"
          printf '%s\n' "$BOT_TO_BETA_ADMISSION_HMAC_SECRET" > "$secret_dir/beta-transport-hmac"
          printf '%s\n' "$BOT_TO_BETA_ADMISSION_HMAC_SECRET" > "$secret_dir/bot-transport-hmac"
          printf '%s\n' "$BETA_ADMISSION_PAYLOAD_HMAC_SECRET" > "$secret_dir/beta-payload-hmac"
          printf '%s\n' "$BOT_TO_API_ACTION_HMAC_SECRET" > "$secret_dir/api-action-transport-hmac"
          printf '%s\n' "$BOT_TO_API_ACTION_HMAC_SECRET" > "$secret_dir/bot-action-transport-hmac"
          printf '%s\n' "$API_TELEGRAM_PLAYER_ACTION_PAYLOAD_HMAC_SECRET" > "$secret_dir/api-action-payload-hmac"
          printf '%s\n' "$API_TELEGRAM_CAPABILITY_HMAC_SECRET" > "$secret_dir/api-action-capability-hmac"
          printf '%s\n' "$API_TELEGRAM_ACTION_SEMANTIC_HMAC_SECRET" > "$secret_dir/api-action-semantic-hmac"
          printf '%s\n' "$CBE_DEPOSIT_REFERENCE_ENCRYPTION_SECRET" > "$secret_dir/cbe-deposit-reference-encryption-key"
          printf '%s\n' "$CBE_DEPOSIT_REFERENCE_FINGERPRINT_SECRET" > "$secret_dir/cbe-deposit-reference-fingerprint-key"
          node --input-type=module <<'NODE'
          const encoded = process.env.CBE_DEPOSIT_REFERENCE_KEY_PROFILE_V1_JSON;
          const keyFingerprint = /^sha256:[0-9a-f]{64}$/u;
          const profile = JSON.parse(encoded);
          if (typeof profile !== 'object' || profile === null || Array.isArray(profile)) {
            throw new Error('the protected CBE deposit-reference key profile is invalid');
          }
          if (
            Object.keys(profile).sort().join(',') !==
              'encryptionKeyFingerprint,fingerprintKeyFingerprint,version' ||
            profile.version !== 1 ||
            typeof profile.encryptionKeyFingerprint !== 'string' ||
            typeof profile.fingerprintKeyFingerprint !== 'string' ||
            !keyFingerprint.test(profile.encryptionKeyFingerprint) ||
            !keyFingerprint.test(profile.fingerprintKeyFingerprint) ||
            profile.encryptionKeyFingerprint === profile.fingerprintKeyFingerprint
          ) {
            throw new Error('the protected CBE deposit-reference key profile is invalid');
          }
          NODE
          printf '%s\n' "$CBE_DEPOSIT_REFERENCE_KEY_PROFILE_V1_JSON" > "$secret_dir/cbe-deposit-reference-key-profile.v1.json"
          printf '%s\n' "$DEPOSIT_PROOF_REFERENCE_ENCRYPTION_MASTER_SECRET" > "$secret_dir/deposit-proof-reference-encryption-master"
          printf '%s\n' "$DEPOSIT_PROOF_REFERENCE_FINGERPRINT_MASTER_SECRET" > "$secret_dir/deposit-proof-reference-fingerprint-master"
          node --input-type=module <<'NODE'
          const encoded = process.env.DEPOSIT_PROOF_REFERENCE_PROFILE_V2_JSON;
          const masterFingerprint = /^sha256:[0-9a-f]{64}$/u;
          const profile = JSON.parse(encoded);
          if (typeof profile !== 'object' || profile === null || Array.isArray(profile)) {
            throw new Error('the protected provider-proof v2 reference profile is invalid');
          }
          if (
            Object.keys(profile).sort().join(',') !==
              'encryptionMasterFingerprint,fingerprintMasterFingerprint,version' ||
            profile.version !== 2 ||
            typeof profile.encryptionMasterFingerprint !== 'string' ||
            typeof profile.fingerprintMasterFingerprint !== 'string' ||
            !masterFingerprint.test(profile.encryptionMasterFingerprint) ||
            !masterFingerprint.test(profile.fingerprintMasterFingerprint) ||
            profile.encryptionMasterFingerprint === profile.fingerprintMasterFingerprint
          ) {
            throw new Error('the protected provider-proof v2 reference profile is invalid');
          }
          NODE
          printf '%s\n' "$DEPOSIT_PROOF_REFERENCE_PROFILE_V2_JSON" > "$secret_dir/deposit-proof-reference-profile.v2.json"
          # The fresh-host profile never starts the Telegram bot. A deliberately
          # invalid sentinel keeps accidental bot startup fail-closed until the
          # separate token-provision and end-to-end smoke gate is approved.
          printf '%s\n' 'telegram-disabled-until-separate-smoke' > "$secret_dir/bot-token"
          printf '%s\n' "$STAGING_SUPABASE_PUBLISHABLE_KEY" > "$secret_dir/publishable-key"
          printf '%s\n' "$STAGING_SUPABASE_PUBLISHABLE_KEY" > "$secret_dir/customer-web-publishable-key"
          chmod 0600 "$secret_dir/deploy-key" "$secret_dir/known-hosts" "$secret_dir"/*
          chmod 0644 "$secret_dir/cbe-deposit-reference-key-profile.v1.json" \
            "$secret_dir/deposit-proof-reference-profile.v2.json"
          openssl x509 -in "$secret_dir/supabase-ca.crt" -noout -checkend 0 >/dev/null
          ssh-keygen -y -f "$secret_dir/deploy-key" >/dev/null
          helper_sha="$(sha256sum infra/operations/fetanagent-staging-deploy-helper.sh | awk '{print $1}')"
          echo "secret_dir=$secret_dir" >> "$GITHUB_OUTPUT"
          echo "helper_sha=$helper_sha" >> "$GITHUB_OUTPUT"
          echo "vm_host=$STAGING_VM_HOST" >> "$GITHUB_OUTPUT"

      - name: Verify the immutable KemerBet overlay and runtime bridge before stopping staging
        shell: bash
        env:
          SECRET_DIR: ${{ steps.protected.outputs.secret_dir }}
          VM_HOST: ${{ steps.protected.outputs.vm_host }}
        run: |
          set -euo pipefail
          ssh_opts=(-F /dev/null -i "$SECRET_DIR/deploy-key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SECRET_DIR/known-hosts")
          ssh "${ssh_opts[@]}" "fetanagent-admin@$VM_HOST" \
            "test \"\$(id -u)\" -ne 0 && sudo -n /usr/local/sbin/fetanagent-staging-deploy-helper verify '${{ steps.protected.outputs.helper_sha }}' && sudo -n /usr/local/sbin/fetanagent-staging-deploy-helper kemerbet-v3-runtime-bridge-ready '${{ steps.protected.outputs.helper_sha }}'"

      - name: Verify enough Docker storage before any staging downtime
        shell: bash
        env:
          SECRET_DIR: ${{ steps.protected.outputs.secret_dir }}
          VM_HOST: ${{ steps.protected.outputs.vm_host }}
        run: |
          set -euo pipefail
          ssh_opts=(-F /dev/null -i "$SECRET_DIR/deploy-key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SECRET_DIR/known-hosts")
          bundle_bytes="$(stat --format='%s' "$RUNNER_TEMP/release/fetanagent-staging-images.tar")"
          [[ "$bundle_bytes" =~ ^[1-9][0-9]*$ ]]
          ssh "${ssh_opts[@]}" "fetanagent-admin@$VM_HOST" \
            "test \"\$(id -u)\" -ne 0 && sudo -n /usr/local/sbin/fetanagent-staging-deploy-helper verify '${{ steps.protected.outputs.helper_sha }}' && sudo -n /usr/local/sbin/fetanagent-staging-deploy-helper docker-storage-ready '$bundle_bytes'"

      - name: Stop any prior staging project and disable old logins
        shell: bash
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGHOST: ${{ env.STAGING_POOLER_HOST }}
          PGPORT: '5432'
          PGDATABASE: postgres
          PGUSER: postgres.${{ env.STAGING_PROJECT_REF }}
          PGSSLMODE: verify-full
          PGSSLROOTCERT: ${{ steps.protected.outputs.secret_dir }}/supabase-ca.crt
          PGSERVICEFILE: /dev/null
          PGPASSFILE: /dev/null
        run: |
          set -euo pipefail
          ssh=(ssh -F /dev/null -i '${{ steps.protected.outputs.secret_dir }}/deploy-key' -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile='${{ steps.protected.outputs.secret_dir }}/known-hosts')
          remote_status=0
          "${ssh[@]}" "fetanagent-admin@${{ steps.protected.outputs.vm_host }}" \
            "test \"\$(id -u)\" -ne 0 && sudo -n /usr/local/sbin/fetanagent-staging-deploy-helper verify '${{ steps.protected.outputs.helper_sha }}' && sudo -n /usr/local/sbin/fetanagent-staging-deploy-helper stop" || remote_status=$?
          psql -X --file=infra/sql/staging-runtimes-disable.sql
          if [[ "$remote_status" -ne 0 ]]; then
            echo '::error::The prior staging containers could not be stopped; database logins were disabled.'
            exit "$remote_status"
          fi

      - name: Verify the fresh-host deployment boundary is empty
        shell: bash
        env:
          SECRET_DIR: ${{ steps.protected.outputs.secret_dir }}
          VM_HOST: ${{ steps.protected.outputs.vm_host }}
        run: |
          set -euo pipefail
          ssh_opts=(-F /dev/null -i "$SECRET_DIR/deploy-key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SECRET_DIR/known-hosts")
          ssh "${ssh_opts[@]}" "fetanagent-admin@$VM_HOST" \
            "test \"\$(id -u)\" -ne 0 && sudo -n /usr/local/sbin/fetanagent-staging-deploy-helper verify '${{ steps.protected.outputs.helper_sha }}' && sudo -n /usr/local/sbin/fetanagent-staging-deploy-helper fresh-host-ready '$GITHUB_SHA'"

      - name: Verify the VM has direct IPv6 database readiness
        shell: bash
        env:
          SECRET_DIR: ${{ steps.protected.outputs.secret_dir }}
          VM_HOST: ${{ steps.protected.outputs.vm_host }}
        run: |
          set -euo pipefail
          ssh_opts=(-F /dev/null -i "$SECRET_DIR/deploy-key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SECRET_DIR/known-hosts")
          ssh "${ssh_opts[@]}" "fetanagent-admin@$VM_HOST" \
            "test \"\$(id -u)\" -ne 0 && sudo -n /usr/local/sbin/fetanagent-staging-deploy-helper verify '${{ steps.protected.outputs.helper_sha }}' && sudo -n /usr/local/sbin/fetanagent-staging-deploy-helper network-ready"

      - name: Set up the pinned Supabase CLI for the read-only ban check
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: 2.113.0

      - name: Check the exact staging network ban before provisioning
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$SUPABASE_ACCESS_TOKEN" ]]
          supabase --version | grep -Fx "$SUPABASE_CLI_VERSION"
          supabase network-bans get --help >/dev/null
          command -v jq >/dev/null
          current_bans="$(supabase network-bans get \
            --project-ref "$STAGING_PROJECT_REF" --experimental --output json)"
          if ! ban_status="$(jq -er --arg ip "$STAGING_BANNED_IP" '
            if type == "array" and all(.[]; type == "string") then
              if index($ip) == null then "clear" else "banned" end
            else
              error("unexpected network-ban response")
            end
          ' <<<"$current_bans" 2>/dev/null)"; then
            echo '::error::The staging network-ban check returned an unexpected response; no runtime passwords were provisioned.'
            exit 1
          fi
          case "$ban_status" in
            banned)
              echo '::error::The exact staging VM IP is currently banned; run the explicit unban-and-connectivity-check mode before redeploying.'
              exit 1
              ;;
            clear) ;;
            *)
              echo '::error::The staging network-ban check returned an unexpected response; no runtime passwords were provisioned.'
              exit 1
              ;;
          esac

      - name: Provision four narrow 24-hour staging logins
        id: provision
        shell: bash
        env:
          BETA_ADMISSION_RUNTIME_PASSWORD: ${{ secrets.BETA_ADMISSION_RUNTIME_PASSWORD }}
          CUSTOMER_WEB_RUNTIME_PASSWORD: ${{ secrets.CUSTOMER_WEB_RUNTIME_PASSWORD }}
          OWNER_CONTROL_RUNTIME_PASSWORD: ${{ secrets.OWNER_CONTROL_RUNTIME_PASSWORD }}
          PLAYER_ACTION_RUNTIME_PASSWORD: ${{ secrets.PLAYER_ACTION_RUNTIME_PASSWORD }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGHOST: ${{ env.STAGING_POOLER_HOST }}
          PGPORT: '5432'
          PGDATABASE: postgres
          PGUSER: postgres.${{ env.STAGING_PROJECT_REF }}
          PGSSLMODE: verify-full
          PGSSLROOTCERT: ${{ steps.protected.outputs.secret_dir }}/supabase-ca.crt
          PGSERVICEFILE: /dev/null
          PGPASSFILE: /dev/null
        run: |
          set -euo pipefail
          echo 'attempted=true' >> "$GITHUB_OUTPUT"
          psql -X --file=infra/sql/staging-runtimes-provision-for-deploy.sql

      - name: Derive the automatic stop time from exact database role expiries
        id: expiry
        shell: bash
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGHOST: ${{ env.STAGING_POOLER_HOST }}
          PGPORT: '5432'
          PGDATABASE: postgres
          PGUSER: postgres.${{ env.STAGING_PROJECT_REF }}
          PGSSLMODE: verify-full
          PGSSLROOTCERT: ${{ steps.protected.outputs.secret_dir }}/supabase-ca.crt
          PGSERVICEFILE: /dev/null
          PGPASSFILE: /dev/null
        run: |
          set -euo pipefail
          stop_at="$(psql -X --tuples-only --no-align --set=ON_ERROR_STOP=1 <<'SQL'
          with expected(role_name) as (
            values
              ('fetanagent_beta_admission_runtime'::text),
              ('fetanagent_customer_web_runtime'::text),
              ('fetanagent_owner_control_runtime'::text),
              ('fetanagent_player_actions_runtime'::text)
          ),
          observed as (
            select role.oid,
                   role.rolcanlogin,
                   role.rolvaliduntil
            from expected
            left join pg_catalog.pg_roles role on role.rolname = expected.role_name
          )
          select pg_catalog.to_char(
                   (pg_catalog.min(rolvaliduntil) - interval '2 hours') at time zone 'UTC',
                   'YYYY-MM-DD"T"HH24:MI:SS"Z"'
                 )
          from observed
          having pg_catalog.count(oid) = 4
             and pg_catalog.count(rolvaliduntil) = 4
             and pg_catalog.bool_and(rolcanlogin)
             and pg_catalog.bool_and(pg_catalog.isfinite(rolvaliduntil))
             and pg_catalog.min(rolvaliduntil) > pg_catalog.clock_timestamp() + interval '23 hours 30 minutes'
             and pg_catalog.max(rolvaliduntil) <= pg_catalog.clock_timestamp() + interval '24 hours 5 minutes'
             and pg_catalog.max(rolvaliduntil) - pg_catalog.min(rolvaliduntil) <= interval '10 seconds';
          SQL
          )"
          [[ "$stop_at" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
          stop_epoch="$(date -u -d "$stop_at" +%s)"
          [[ "$(date -u -d "@$stop_epoch" '+%Y-%m-%dT%H:%M:%SZ')" == "$stop_at" ]]
          now_epoch="$(date -u +%s)"
          (( stop_epoch > now_epoch + 21 * 60 * 60 ))
          (( stop_epoch <= now_epoch + 23 * 60 * 60 ))
          echo "stop_at=$stop_at" >> "$GITHUB_OUTPUT"

      - name: Transfer and install sealed release inputs
        shell: bash
        env:
          SECRET_DIR: ${{ steps.protected.outputs.secret_dir }}
          VM_HOST: ${{ steps.protected.outputs.vm_host }}
        run: |
          set -euo pipefail
          incoming="/tmp/fetanagent-$GITHUB_SHA"
          ssh_opts=(-F /dev/null -i "$SECRET_DIR/deploy-key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SECRET_DIR/known-hosts")
          ssh "${ssh_opts[@]}" "fetanagent-admin@$VM_HOST" "install -d -m 0700 '$incoming'"
          scp "${ssh_opts[@]}" "$RUNNER_TEMP/release/fetanagent-staging-images.tar" \
            infra/compose.staging-beta.yaml "$SECRET_DIR/supabase-ca.crt" \
            "$SECRET_DIR/beta-database-url" "$SECRET_DIR/owner-database-url" \
            "$SECRET_DIR/customer-web-database-url" \
            "$SECRET_DIR/customer-web-publishable-key" \
            "$SECRET_DIR/customer-web-rate-limit-hmac" \
            "$SECRET_DIR/player-action-database-url" \
            "$SECRET_DIR/beta-transport-hmac" "$SECRET_DIR/bot-transport-hmac" \
            "$SECRET_DIR/api-action-transport-hmac" "$SECRET_DIR/bot-action-transport-hmac" \
            "$SECRET_DIR/api-action-payload-hmac" "$SECRET_DIR/api-action-capability-hmac" \
            "$SECRET_DIR/api-action-semantic-hmac" \
            "$SECRET_DIR/cbe-deposit-reference-encryption-key" \
            "$SECRET_DIR/cbe-deposit-reference-fingerprint-key" \
            "$SECRET_DIR/cbe-deposit-reference-key-profile.v1.json" \
            "$SECRET_DIR/deposit-proof-reference-encryption-master" \
            "$SECRET_DIR/deposit-proof-reference-fingerprint-master" \
            "$SECRET_DIR/deposit-proof-reference-profile.v2.json" \
            "$SECRET_DIR/beta-payload-hmac" "$SECRET_DIR/bot-token" \
            "$SECRET_DIR/publishable-key" "fetanagent-admin@$VM_HOST:$incoming/"
          ssh "${ssh_opts[@]}" "fetanagent-admin@$VM_HOST" \
            "test \"\$(id -u)\" -ne 0 && sudo -n /usr/local/sbin/fetanagent-staging-deploy-helper verify '${{ steps.protected.outputs.helper_sha }}' && sudo -n /usr/local/sbin/fetanagent-staging-deploy-helper install '$GITHUB_SHA' '${GITHUB_SHA:0:12}' '$incoming'"

      - name: Arm the host-local stop before database credential expiry
        shell: bash
        env:
          SECRET_DIR: ${{ steps.protected.outputs.secret_dir }}
          STOP_AT: ${{ steps.expiry.outputs.stop_at }}
          VM_HOST: ${{ steps.protected.outputs.vm_host }}
        run: |
          set -euo pipefail
          [[ "$STOP_AT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
          ssh_opts=(-F /dev/null -i "$SECRET_DIR/deploy-key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SECRET_DIR/known-hosts")
          ssh "${ssh_opts[@]}" "fetanagent-admin@$VM_HOST" \
            "test \"\$(id -u)\" -ne 0 && sudo -n /usr/local/sbin/fetanagent-staging-deploy-helper verify '${{ steps.protected.outputs.helper_sha }}' && sudo -n /usr/local/sbin/fetanagent-staging-deploy-helper arm-expiry-stop '$GITHUB_SHA' '$STOP_AT'"

      - name: Start the private staging profile and smoke readiness
        id: activate
        shell: bash
        env:
          SECRET_DIR: ${{ steps.protected.outputs.secret_dir }}
          VM_HOST: ${{ steps.protected.outputs.vm_host }}
        run: |
          set -euo pipefail
          ssh_opts=(-F /dev/null -i "$SECRET_DIR/deploy-key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SECRET_DIR/known-hosts")
          ssh "${ssh_opts[@]}" "fetanagent-admin@$VM_HOST" \
            "test \"\$(id -u)\" -ne 0 && sudo -n /usr/local/sbin/fetanagent-staging-deploy-helper verify '${{ steps.protected.outputs.helper_sha }}' && sudo -n /usr/local/sbin/fetanagent-staging-deploy-helper fresh-start '$GITHUB_SHA' '${GITHUB_SHA:0:12}' && sudo -n /usr/local/sbin/fetanagent-staging-deploy-helper bot-disabled-ready '$GITHUB_SHA'"
          ssh "${ssh_opts[@]}" "fetanagent-admin@$VM_HOST" \
            "curl --fail --silent --show-error --max-time 5 http://127.0.0.1:3002/readyz >/dev/null"
          echo 'started=true' >> "$GITHUB_OUTPUT"

      - name: Capture bounded Owner-control startup diagnostics
        if: failure() && steps.activate.outcome == 'failure'
        shell: bash
        env:
          SECRET_DIR: ${{ steps.protected.outputs.secret_dir }}
          VM_HOST: ${{ steps.protected.outputs.vm_host }}
        run: |
          set -euo pipefail
          ssh_opts=(-F /dev/null -i "$SECRET_DIR/deploy-key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SECRET_DIR/known-hosts")
          ssh "${ssh_opts[@]}" "fetanagent-admin@$VM_HOST" \
            "test \"\$(id -u)\" -ne 0 && sudo -n /usr/local/sbin/fetanagent-staging-deploy-helper verify '${{ steps.protected.outputs.helper_sha }}' && sudo -n /usr/local/sbin/fetanagent-staging-deploy-helper diagnose-owner-startup '$GITHUB_SHA' '${GITHUB_SHA:0:12}'"

      - name: Capture count-only runtime session diagnostics after failed activation
        if: failure() && steps.provision.outputs.attempted == 'true'
        shell: bash
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGHOST: ${{ env.STAGING_POOLER_HOST }}
          PGPORT: '5432'
          PGDATABASE: postgres
          PGUSER: postgres.${{ env.STAGING_PROJECT_REF }}
          PGSSLMODE: verify-full
          PGSSLROOTCERT: ${{ steps.protected.outputs.secret_dir }}/supabase-ca.crt
          PGCONNECT_TIMEOUT: '5'
          PGSERVICEFILE: /dev/null
          PGPASSFILE: /dev/null
        run: psql -X --file=infra/sql/staging-runtime-session-diagnostics.sql

      - name: Roll back failed activation
        if: always() && (failure() || cancelled()) && steps.provision.outputs.attempted == 'true'
        shell: bash
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGHOST: ${{ env.STAGING_POOLER_HOST }}
          PGPORT: '5432'
          PGDATABASE: postgres
          PGUSER: postgres.${{ env.STAGING_PROJECT_REF }}
          PGSSLMODE: verify-full
          PGSSLROOTCERT: ${{ steps.protected.outputs.secret_dir }}/supabase-ca.crt
          PGSERVICEFILE: /dev/null
          PGPASSFILE: /dev/null
        run: |
          set -euo pipefail
          secret_dir='${{ steps.protected.outputs.secret_dir }}'
          vm_host='${{ steps.protected.outputs.vm_host }}'
          if [[ -n "$secret_dir" && -n "$vm_host" ]]; then
            ssh -F /dev/null -i "$secret_dir/deploy-key" -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$secret_dir/known-hosts" \
              "fetanagent-admin@$vm_host" \
              "sudo -n /usr/local/sbin/fetanagent-staging-deploy-helper verify '${{ steps.protected.outputs.helper_sha }}' && sudo -n /usr/local/sbin/fetanagent-staging-deploy-helper stop && sudo -n /usr/local/sbin/fetanagent-staging-deploy-helper discard '$GITHUB_SHA'" || true
          fi
          cleanup_status=1
          for attempt in 1 2 3 4; do
            if psql -X --file=infra/sql/staging-runtimes-disable.sql; then
              cleanup_status=0
              break
            else
              cleanup_status=$?
            fi
            if [[ "$attempt" -lt 4 ]]; then
              echo "::warning::Staging runtime cleanup connection failed on attempt $attempt of 4; waiting 15 seconds."
              sleep 15
            fi
          done
          if [[ "$cleanup_status" -ne 0 ]]; then
            echo '::error::Staging runtime logins could not be disabled after four bounded attempts.'
            exit "$cleanup_status"
          fi

  recover-v1-retirement:
    name: Recover exact v1 retirement release after full expiry
    if: inputs.mode == 'recover-v1-retirement-after-expiry'
    needs: validate-target
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: staging
    permissions:
      contents: read
    steps:
      - name: Check out the exact recovery contract
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Restore only the exact same-release secrets and runtime
        shell: bash
        env:
          API_TELEGRAM_ACTION_SEMANTIC_HMAC_SECRET: ${{ secrets.API_TELEGRAM_ACTION_SEMANTIC_HMAC_SECRET }}
          API_TELEGRAM_CAPABILITY_HMAC_SECRET: ${{ secrets.API_TELEGRAM_CAPABILITY_HMAC_SECRET }}
          API_TELEGRAM_PLAYER_ACTION_PAYLOAD_HMAC_SECRET: ${{ secrets.API_TELEGRAM_PLAYER_ACTION_PAYLOAD_HMAC_SECRET }}
          BETA_ADMISSION_PAYLOAD_HMAC_SECRET: ${{ secrets.BETA_ADMISSION_PAYLOAD_HMAC_SECRET }}
          BETA_ADMISSION_RUNTIME_PASSWORD: ${{ secrets.BETA_ADMISSION_RUNTIME_PASSWORD }}
          BOT_TO_API_ACTION_HMAC_SECRET: ${{ secrets.BOT_TO_API_ACTION_HMAC_SECRET }}
          BOT_TO_BETA_ADMISSION_HMAC_SECRET: ${{ secrets.BOT_TO_BETA_ADMISSION_HMAC_SECRET }}
          CBE_DEPOSIT_REFERENCE_ENCRYPTION_SECRET: ${{ secrets.CBE_DEPOSIT_REFERENCE_ENCRYPTION_SECRET }}
          CBE_DEPOSIT_REFERENCE_FINGERPRINT_SECRET: ${{ secrets.CBE_DEPOSIT_REFERENCE_FINGERPRINT_SECRET }}
          CBE_DEPOSIT_REFERENCE_KEY_PROFILE_V1_JSON: ${{ vars.CBE_DEPOSIT_REFERENCE_KEY_PROFILE_V1_JSON }}
          CONFIRMED_V1_RETIREMENT_RECOVERY: ${{ inputs.confirm_v1_retirement_recovery }}
          CONFIRMED_V1_RETIREMENT_RELEASE: ${{ inputs.confirm_v1_retirement_release_sha }}
          CUSTOMER_WEB_RATE_LIMIT_HMAC_SECRET: ${{ secrets.CUSTOMER_WEB_RATE_LIMIT_HMAC_SECRET }}
          CUSTOMER_WEB_RUNTIME_PASSWORD: ${{ secrets.CUSTOMER_WEB_RUNTIME_PASSWORD }}
          DEPOSIT_PROOF_REFERENCE_ENCRYPTION_MASTER_SECRET: ${{ secrets.DEPOSIT_PROOF_REFERENCE_ENCRYPTION_MASTER_SECRET }}
          DEPOSIT_PROOF_REFERENCE_FINGERPRINT_MASTER_SECRET: ${{ secrets.DEPOSIT_PROOF_REFERENCE_FINGERPRINT_MASTER_SECRET }}
          DEPOSIT_PROOF_REFERENCE_PROFILE_V2_JSON: ${{ vars.DEPOSIT_PROOF_REFERENCE_PROFILE_V2_JSON }}
          EXPECTED_TELEGRAM_BOT_TOKEN_SHA256: ${{ vars.STAGING_TELEGRAM_BOT_TOKEN_SHA256 }}
          OWNER_CONTROL_RUNTIME_PASSWORD: ${{ secrets.OWNER_CONTROL_RUNTIME_PASSWORD }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGHOST: ${{ env.STAGING_POOLER_HOST }}
          PGPORT: '5432'
          PGDATABASE: postgres
          PGUSER: postgres.${{ env.STAGING_PROJECT_REF }}
          PGSSLMODE: verify-full
          PGSERVICEFILE: /dev/null
          PGPASSFILE: /dev/null
          PLAYER_ACTION_RUNTIME_PASSWORD: ${{ secrets.PLAYER_ACTION_RUNTIME_PASSWORD }}
          STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          STAGING_TELEGRAM_BOT_TOKEN: ${{ secrets.STAGING_TELEGRAM_BOT_TOKEN }}
          STAGING_VM_HOST: ${{ secrets.STAGING_VM_HOST }}
          STAGING_VM_KNOWN_HOSTS: ${{ secrets.STAGING_VM_KNOWN_HOSTS }}
          STAGING_VM_SSH_PRIVATE_KEY: ${{ secrets.STAGING_VM_SSH_PRIVATE_KEY }}
          SUPABASE_CA_CERTIFICATE_PEM: ${{ secrets.SUPABASE_CA_CERTIFICATE_PEM }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$CONFIRMED_V1_RETIREMENT_RECOVERY" == \
            'I-UNDERSTAND-THIS-RECOVERS-THE-EXACT-V1-RETIREMENT-RELEASE' ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$CONFIRMED_V1_RETIREMENT_RELEASE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          release_sha="$CONFIRMED_V1_RETIREMENT_RELEASE"
          [[ "$(git rev-parse "$release_sha^{commit}")" == "$release_sha" ]]
          git merge-base --is-ancestor "$release_sha" "$GITHUB_SHA"
          [[ "$STAGING_VM_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ -n "$STAGING_VM_KNOWN_HOSTS" && -n "$STAGING_VM_SSH_PRIVATE_KEY" ]]
          [[ -n "$PGPASSWORD" && -n "$SUPABASE_CA_CERTIFICATE_PEM" ]]
          [[ "$BETA_ADMISSION_RUNTIME_PASSWORD" =~ ^[0-9a-f]{64}$ ]]
          [[ "$OWNER_CONTROL_RUNTIME_PASSWORD" =~ ^[0-9a-f]{64}$ ]]
          [[ "$CUSTOMER_WEB_RUNTIME_PASSWORD" =~ ^[0-9a-f]{64}$ ]]
          [[ "$PLAYER_ACTION_RUNTIME_PASSWORD" =~ ^[0-9a-f]{64}$ ]]
          [[ "$CUSTOMER_WEB_RATE_LIMIT_HMAC_SECRET" =~ ^[0-9a-f]{64}$ ]]
          [[ "$BOT_TO_BETA_ADMISSION_HMAC_SECRET" =~ ^[0-9a-f]{64}$ ]]
          [[ "$BETA_ADMISSION_PAYLOAD_HMAC_SECRET" =~ ^[0-9a-f]{64}$ ]]
          [[ "$BOT_TO_API_ACTION_HMAC_SECRET" =~ ^[0-9a-f]{64}$ ]]
          [[ "$API_TELEGRAM_PLAYER_ACTION_PAYLOAD_HMAC_SECRET" =~ ^[0-9a-f]{64}$ ]]
          [[ "$API_TELEGRAM_CAPABILITY_HMAC_SECRET" =~ ^[0-9a-f]{64}$ ]]
          [[ "$API_TELEGRAM_ACTION_SEMANTIC_HMAC_SECRET" =~ ^[0-9a-f]{64}$ ]]
          [[ "$CBE_DEPOSIT_REFERENCE_ENCRYPTION_SECRET" =~ ^[0-9a-f]{64}$ ]]
          [[ "$CBE_DEPOSIT_REFERENCE_FINGERPRINT_SECRET" =~ ^[0-9a-f]{64}$ ]]
          [[ "$DEPOSIT_PROOF_REFERENCE_ENCRYPTION_MASTER_SECRET" =~ ^[0-9a-f]{64}$ ]]
          [[ "$DEPOSIT_PROOF_REFERENCE_FINGERPRINT_MASTER_SECRET" =~ ^[0-9a-f]{64}$ ]]
          [[ "$STAGING_SUPABASE_PUBLISHABLE_KEY" =~ ^sb_publishable_[A-Za-z0-9_-]{20,}$ ]]

          distinct_count="$(printf '%s\n' \
            "$BETA_ADMISSION_RUNTIME_PASSWORD" "$OWNER_CONTROL_RUNTIME_PASSWORD" \
            "$CUSTOMER_WEB_RUNTIME_PASSWORD" "$PLAYER_ACTION_RUNTIME_PASSWORD" \
            "$CUSTOMER_WEB_RATE_LIMIT_HMAC_SECRET" "$BOT_TO_BETA_ADMISSION_HMAC_SECRET" \
            "$BETA_ADMISSION_PAYLOAD_HMAC_SECRET" "$BOT_TO_API_ACTION_HMAC_SECRET" \
            "$API_TELEGRAM_PLAYER_ACTION_PAYLOAD_HMAC_SECRET" \
            "$API_TELEGRAM_CAPABILITY_HMAC_SECRET" \
            "$API_TELEGRAM_ACTION_SEMANTIC_HMAC_SECRET" \
            "$CBE_DEPOSIT_REFERENCE_ENCRYPTION_SECRET" \
            "$CBE_DEPOSIT_REFERENCE_FINGERPRINT_SECRET" \
            "$DEPOSIT_PROOF_REFERENCE_ENCRYPTION_MASTER_SECRET" \
            "$DEPOSIT_PROOF_REFERENCE_FINGERPRINT_MASTER_SECRET" | sort -u | wc -l)"
          [[ "$distinct_count" -eq 15 ]]

          connection_dir="$RUNNER_TEMP/v1-retirement-recovery-session"
          contract_dir="$RUNNER_TEMP/v1-retirement-contract"
          secret_dir="$RUNNER_TEMP/v1-retirement-recovery-bundle"
          incoming="/tmp/fetanagent-kemerbet-v1-retirement-secrets-$release_sha"
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ && "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          remote_bundle_staging="/tmp/fetanagent-kemerbet-v1-retirement-secrets-stage-$release_sha-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          [[ "$connection_dir" == "$RUNNER_TEMP/v1-retirement-recovery-session" ]]
          [[ "$contract_dir" == "$RUNNER_TEMP/v1-retirement-contract" ]]
          [[ "$secret_dir" == "$RUNNER_TEMP/v1-retirement-recovery-bundle" ]]
          [[ "$incoming" =~ ^/tmp/fetanagent-kemerbet-v1-retirement-secrets-[0-9a-f]{40}$ ]]
          [[ "$remote_bundle_staging" =~ ^/tmp/fetanagent-kemerbet-v1-retirement-secrets-stage-[0-9a-f]{40}-[1-9][0-9]*-[1-9][0-9]*$ ]]
          [[ ! -e "$connection_dir" && ! -L "$connection_dir" ]]
          [[ ! -e "$contract_dir" && ! -L "$contract_dir" ]]
          [[ ! -e "$secret_dir" && ! -L "$secret_dir" ]]
          install -d -m 0700 "$connection_dir"
          install -d -m 0700 "$contract_dir"
          umask 077

          cleanup_local_recovery_inputs() {
            local original_status="$1"
            trap - EXIT
            set +e
            for local_path in "$secret_dir" "$connection_dir" "$contract_dir"; do
              case "$local_path" in
                "$RUNNER_TEMP/v1-retirement-recovery-bundle"|\
                "$RUNNER_TEMP/v1-retirement-recovery-session"|\
                "$RUNNER_TEMP/v1-retirement-contract")
                  [[ ! -L "$local_path" && -d "$local_path" ]] && rm -rf -- "$local_path"
                  ;;
              esac
            done
            exit "$original_status"
          }
          trap 'cleanup_local_recovery_inputs "$?"' EXIT

          recovery_contracts=(
            'infra/operations/fetanagent-staging-deploy-helper.sh:fetanagent-staging-deploy-helper.sh'
            'infra/sql/staging-runtimes-provision-for-deploy.sql:staging-runtimes-provision-for-deploy.sql'
            'infra/sql/staging-runtimes-disable.sql:staging-runtimes-disable.sql'
          )
          for contract in "${recovery_contracts[@]}"; do
            source_path="${contract%%:*}"
            target_name="${contract#*:}"
            [[ "$source_path" != "$target_name" && "$target_name" != */* ]]
            [[ "$(git cat-file -t "$release_sha:$source_path")" == 'blob' ]]
            git show "$release_sha:$source_path" >"$contract_dir/$target_name"
          done
          python3 - "$contract_dir/fetanagent-staging-deploy-helper.sh" \
            "$contract_dir/staging-runtimes-provision-for-deploy.sql" \
            "$contract_dir/staging-runtimes-disable.sql" <<'PY'
          import os
          import stat
          import sys

          for path in sys.argv[1:]:
              value = os.lstat(path)
              raw = open(path, 'rb').read()
              if (
                  not stat.S_ISREG(value.st_mode)
                  or value.st_nlink != 1
                  or stat.S_IMODE(value.st_mode) != 0o600
                  or not raw
                  or not raw.endswith(b'\n')
                  or b'\r' in raw
                  or b'\0' in raw
              ):
                  raise SystemExit(1)
              raw.decode('utf-8', errors='strict')
          PY
          bash -n "$contract_dir/fetanagent-staging-deploy-helper.sh"

          printf '%s\n' "$STAGING_VM_SSH_PRIVATE_KEY" >"$connection_dir/deploy-key"
          printf '%s\n' "$STAGING_VM_KNOWN_HOSTS" >"$connection_dir/known-hosts"
          printf '%s\n' "$SUPABASE_CA_CERTIFICATE_PEM" >"$connection_dir/supabase-ca.crt"
          export PGSSLROOTCERT="$connection_dir/supabase-ca.crt"
          openssl x509 -in "$PGSSLROOTCERT" -noout -checkend 0 >/dev/null
          ssh-keygen -y -f "$connection_dir/deploy-key" >/dev/null

          helper_sha="$(sha256sum "$contract_dir/fetanagent-staging-deploy-helper.sh" | awk '{print $1}')"
          [[ "$helper_sha" =~ ^[0-9a-f]{64}$ ]]
          ssh_opts=(
            -F /dev/null -i "$connection_dir/deploy-key" -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$connection_dir/known-hosts"
          )
          remote="fetanagent-admin@$STAGING_VM_HOST"
          remote_prefix="test \"\$(id -u)\" -ne 0 && test \"\$(id -un)\" = 'fetanagent-admin' && sudo -n /usr/local/sbin/fetanagent-staging-deploy-helper verify '$helper_sha'"
          recovery_mutation_attempted='false'
          remote_bundle_dev_ino=''
          remote_bundle_owned_by_run='false'
          roles_disable_attempted='false'
          roles_provision_attempted='false'

          cleanup_recovery_reset() {
            local original_status="$1" stop_status=0 database_status=0
            trap - EXIT
            set +e
            if [[ "$original_status" -ne 0 && "$recovery_mutation_attempted" == 'true' ]]; then
              ssh "${ssh_opts[@]}" "$remote" \
                "$remote_prefix && sudo -n /usr/local/sbin/fetanagent-staging-deploy-helper stop" || \
                stop_status=$?
            fi
            if [[ "$original_status" -ne 0 && "$roles_disable_attempted" == 'true' ]]; then
              psql -X --file="$contract_dir/staging-runtimes-disable.sql" || database_status=$?
            fi
            for local_path in "$secret_dir" "$connection_dir" "$contract_dir"; do
              case "$local_path" in
                "$RUNNER_TEMP/v1-retirement-recovery-bundle"|\
                "$RUNNER_TEMP/v1-retirement-recovery-session"|\
                "$RUNNER_TEMP/v1-retirement-contract")
                  [[ ! -L "$local_path" && -d "$local_path" ]] && rm -rf -- "$local_path"
                  ;;
              esac
            done
            if [[ "$original_status" -ne 0 ]]; then exit "$original_status"; fi
            if [[ "$stop_status" -ne 0 ]]; then exit "$stop_status"; fi
            exit "$database_status"
          }
          trap 'cleanup_recovery_reset "$?"' EXIT

          recovery_preflight_state="$(ssh "${ssh_opts[@]}" "$remote" \
            "$remote_prefix && sudo -n /usr/local/sbin/fetanagent-staging-deploy-helper kemerbet-v1-retirement-recovery-ready '$release_sha'")"
          [[ "$recovery_preflight_state" == 'KemerBet v1 retirement recovery preflight: clean.' || \
            "$recovery_preflight_state" == 'KemerBet v1 retirement recovery preflight: safe-to-reset.' ]]

          recovery_mutation_attempted='true'
          roles_disable_attempted='true'
          psql -X --file="$contract_dir/staging-runtimes-disable.sql"
          ssh "${ssh_opts[@]}" "$remote" \
            "$remote_prefix && sudo -n /usr/local/sbin/fetanagent-staging-deploy-helper stop"
          recovery_clean_state="$(ssh "${ssh_opts[@]}" "$remote" \
            "$remote_prefix && sudo -n /usr/local/sbin/fetanagent-staging-deploy-helper kemerbet-v1-retirement-recovery-ready '$release_sha'")"
          [[ "$recovery_clean_state" == 'KemerBet v1 retirement recovery preflight: clean.' ]]

          [[ ! -e "$secret_dir" && ! -L "$secret_dir" ]]
          install -d -m 0700 "$secret_dir"
          install -m 0600 "$connection_dir/supabase-ca.crt" "$secret_dir/supabase-ca.crt"

          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';

          function requireProfile(encoded, version, fields) {
            const fingerprint = /^sha256:[0-9a-f]{64}$/u;
            const profile = JSON.parse(encoded);
            if (typeof profile !== 'object' || profile === null || Array.isArray(profile)) {
              throw new Error('The protected reference-key profile is invalid.');
            }
            if (
              Object.keys(profile).sort().join(',') !== [...fields, 'version'].sort().join(',') ||
              profile.version !== version ||
              fields.some((field) => typeof profile[field] !== 'string' || !fingerprint.test(profile[field])) ||
              profile[fields[0]] === profile[fields[1]]
            ) {
              throw new Error('The protected reference-key profile is invalid.');
            }
          }

          requireProfile(process.env.CBE_DEPOSIT_REFERENCE_KEY_PROFILE_V1_JSON, 1, [
            'encryptionKeyFingerprint',
            'fingerprintKeyFingerprint',
          ]);
          requireProfile(process.env.DEPOSIT_PROOF_REFERENCE_PROFILE_V2_JSON, 2, [
            'encryptionMasterFingerprint',
            'fingerprintMasterFingerprint',
          ]);

          const token = process.env.STAGING_TELEGRAM_BOT_TOKEN;
          const expected = process.env.EXPECTED_TELEGRAM_BOT_TOKEN_SHA256;
          if (typeof token !== 'string' || !/^[0-9]{8,12}:[A-Za-z0-9_-]{35,}$/u.test(token)) {
            throw new Error('The protected staging Telegram token shape is invalid.');
          }
          if (typeof expected !== 'string' || !/^sha256:[0-9a-f]{64}$/u.test(expected)) {
            throw new Error('The approved staging Telegram token fingerprint is absent.');
          }
          if (`sha256:${createHash('sha256').update(token).digest('hex')}` !== expected) {
            throw new Error('The protected staging Telegram token fingerprint is wrong.');
          }

          async function telegram(method) {
            const response = await fetch(`https://api.telegram.org/bot${token}/${method}`, {
              method: 'POST',
              signal: AbortSignal.timeout(10_000),
            });
            if (!response.ok) throw new Error(`Telegram ${method} returned a non-success status.`);
            const body = await response.json();
            if (body?.ok !== true || typeof body.result !== 'object' || body.result === null) {
              throw new Error(`Telegram ${method} returned an invalid result.`);
            }
            return body.result;
          }

          const identity = await telegram('getMe');
          if (
            identity.is_bot !== true ||
            typeof identity.username !== 'string' ||
            identity.username.toLowerCase() !== 'fetanagentbot'
          ) {
            throw new Error('The protected token does not belong to the exact staging bot.');
          }
          const webhook = await telegram('getWebhookInfo');
          if (
            webhook.url !== '' ||
            !Number.isSafeInteger(webhook.pending_update_count) ||
            webhook.pending_update_count !== 0
          ) {
            throw new Error('The staging bot must have no webhook and no pending updates.');
          }
          NODE

          printf 'postgresql://%s:%s@%s:5432/postgres?sslmode=verify-full\n' \
            "$BETA_RUNTIME_ROLE" "$BETA_ADMISSION_RUNTIME_PASSWORD" \
            "$STAGING_DIRECT_DATABASE_HOST" >"$secret_dir/beta-database-url"
          printf 'postgresql://%s:%s@%s:5432/postgres?sslmode=verify-full\n' \
            "$OWNER_RUNTIME_ROLE" "$OWNER_CONTROL_RUNTIME_PASSWORD" \
            "$STAGING_DIRECT_DATABASE_HOST" >"$secret_dir/owner-database-url"
          printf 'postgresql://%s:%s@%s:5432/postgres?sslmode=verify-full\n' \
            "$CUSTOMER_WEB_RUNTIME_ROLE" "$CUSTOMER_WEB_RUNTIME_PASSWORD" \
            "$STAGING_DIRECT_DATABASE_HOST" >"$secret_dir/customer-web-database-url"
          printf 'postgresql://%s:%s@%s:5432/postgres?sslmode=verify-full\n' \
            "$PLAYER_ACTION_RUNTIME_ROLE" "$PLAYER_ACTION_RUNTIME_PASSWORD" \
            "$STAGING_DIRECT_DATABASE_HOST" >"$secret_dir/player-action-database-url"
          printf '%s\n' "$CUSTOMER_WEB_RATE_LIMIT_HMAC_SECRET" >"$secret_dir/customer-web-rate-limit-hmac"
          printf '%s\n' "$BOT_TO_BETA_ADMISSION_HMAC_SECRET" >"$secret_dir/beta-transport-hmac"
          printf '%s\n' "$BOT_TO_BETA_ADMISSION_HMAC_SECRET" >"$secret_dir/bot-transport-hmac"
          printf '%s\n' "$BETA_ADMISSION_PAYLOAD_HMAC_SECRET" >"$secret_dir/beta-payload-hmac"
          printf '%s\n' "$BOT_TO_API_ACTION_HMAC_SECRET" >"$secret_dir/api-action-transport-hmac"
          printf '%s\n' "$BOT_TO_API_ACTION_HMAC_SECRET" >"$secret_dir/bot-action-transport-hmac"
          printf '%s\n' "$API_TELEGRAM_PLAYER_ACTION_PAYLOAD_HMAC_SECRET" >"$secret_dir/api-action-payload-hmac"
          printf '%s\n' "$API_TELEGRAM_CAPABILITY_HMAC_SECRET" >"$secret_dir/api-action-capability-hmac"
          printf '%s\n' "$API_TELEGRAM_ACTION_SEMANTIC_HMAC_SECRET" >"$secret_dir/api-action-semantic-hmac"
          printf '%s\n' "$CBE_DEPOSIT_REFERENCE_ENCRYPTION_SECRET" >"$secret_dir/cbe-deposit-reference-encryption-key"
          printf '%s\n' "$CBE_DEPOSIT_REFERENCE_FINGERPRINT_SECRET" >"$secret_dir/cbe-deposit-reference-fingerprint-key"
          printf '%s\n' "$CBE_DEPOSIT_REFERENCE_KEY_PROFILE_V1_JSON" >"$secret_dir/cbe-deposit-reference-key-profile.v1.json"
          printf '%s\n' "$DEPOSIT_PROOF_REFERENCE_ENCRYPTION_MASTER_SECRET" >"$secret_dir/deposit-proof-reference-encryption-master"
          printf '%s\n' "$DEPOSIT_PROOF_REFERENCE_FINGERPRINT_MASTER_SECRET" >"$secret_dir/deposit-proof-reference-fingerprint-master"
          printf '%s\n' "$DEPOSIT_PROOF_REFERENCE_PROFILE_V2_JSON" >"$secret_dir/deposit-proof-reference-profile.v2.json"
          printf '%s\n' "$STAGING_TELEGRAM_BOT_TOKEN" >"$secret_dir/bot-token"
          printf '%s\n' "$STAGING_SUPABASE_PUBLISHABLE_KEY" >"$secret_dir/publishable-key"
          printf '%s\n' "$STAGING_SUPABASE_PUBLISHABLE_KEY" >"$secret_dir/customer-web-publishable-key"
          chmod 0600 "$secret_dir"/*

          bundle_files=(
            api-action-capability-hmac
            api-action-payload-hmac
            api-action-semantic-hmac
            api-action-transport-hmac
            beta-database-url
            beta-payload-hmac
            beta-transport-hmac
            bot-action-transport-hmac
            bot-token
            bot-transport-hmac
            cbe-deposit-reference-encryption-key
            cbe-deposit-reference-fingerprint-key
            cbe-deposit-reference-key-profile.v1.json
            customer-web-database-url
            customer-web-publishable-key
            customer-web-rate-limit-hmac
            deposit-proof-reference-encryption-master
            deposit-proof-reference-fingerprint-master
            deposit-proof-reference-profile.v2.json
            owner-database-url
            player-action-database-url
            publishable-key
            supabase-ca.crt
          )
          [[ "${#bundle_files[@]}" -eq 23 ]]
          expected_bundle="$(printf '%s\n' "${bundle_files[@]}" | LC_ALL=C sort)"
          observed_bundle="$(find -P "$secret_dir" -mindepth 1 -maxdepth 1 \
            ! -name deploy-key ! -name known-hosts -printf '%f\n' | LC_ALL=C sort)"
          [[ "$observed_bundle" == "$expected_bundle" ]]

          cleanup_remote_bundle() {
            ssh "${ssh_opts[@]}" "$remote" \
              "bash -s -- '$incoming' '$remote_bundle_staging' '$remote_bundle_dev_ino'" <<'REMOTE_CLEANUP'
          set -euo pipefail
          incoming="$1"
          staging="$2"
          expected_dev_ino="$3"
          [[ "$incoming" =~ ^/tmp/fetanagent-kemerbet-v1-retirement-secrets-[0-9a-f]{40}$ ]]
          [[ "$staging" =~ ^/tmp/fetanagent-kemerbet-v1-retirement-secrets-stage-[0-9a-f]{40}-[1-9][0-9]*-[1-9][0-9]*$ ]]
          [[ "$expected_dev_ino" =~ ^[0-9]+:[0-9]+$ ]]
          allowed_names=(
            api-action-capability-hmac api-action-payload-hmac
            api-action-semantic-hmac api-action-transport-hmac
            beta-database-url beta-payload-hmac beta-transport-hmac
            bot-action-transport-hmac bot-token bot-transport-hmac
            cbe-deposit-reference-encryption-key cbe-deposit-reference-fingerprint-key
            cbe-deposit-reference-key-profile.v1.json customer-web-database-url
            customer-web-publishable-key customer-web-rate-limit-hmac
            deposit-proof-reference-encryption-master deposit-proof-reference-fingerprint-master
            deposit-proof-reference-profile.v2.json owner-database-url
            player-action-database-url publishable-key supabase-ca.crt
          )
          cleanup_failed=0
          present_count=0
          for candidate in "$staging" "$incoming" "$incoming.consumed"; do
            if [[ -e "$candidate" || -L "$candidate" ]]; then
              present_count=$((present_count + 1))
            fi
          done
          if [[ "$present_count" -gt 1 ]]; then cleanup_failed=1; fi
          for candidate in "$staging" "$incoming" "$incoming.consumed"; do
            if [[ ! -e "$candidate" && ! -L "$candidate" ]]; then continue; fi
            candidate_safe='true'
            if [[ -L "$candidate" || ! -d "$candidate" ]]; then
              candidate_safe='false'
            elif [[ "$(realpath -- "$candidate")" != "$candidate" ]]; then
              candidate_safe='false'
            elif [[ "$(stat --format='%U:%a' "$candidate")" != 'fetanagent-admin:700' ]]; then
              candidate_safe='false'
            elif [[ "$(stat --format='%d:%i' "$candidate")" != "$expected_dev_ino" ]]; then
              candidate_safe='false'
            elif [[ -n "$(find -P "$candidate" -mindepth 1 -maxdepth 1 \
              ! \( -name api-action-capability-hmac -o -name api-action-payload-hmac \
              -o -name api-action-semantic-hmac -o -name api-action-transport-hmac \
              -o -name beta-database-url -o -name beta-payload-hmac \
              -o -name beta-transport-hmac -o -name bot-action-transport-hmac \
              -o -name bot-token -o -name bot-transport-hmac \
              -o -name cbe-deposit-reference-encryption-key \
              -o -name cbe-deposit-reference-fingerprint-key \
              -o -name cbe-deposit-reference-key-profile.v1.json \
              -o -name customer-web-database-url -o -name customer-web-publishable-key \
              -o -name customer-web-rate-limit-hmac \
              -o -name deposit-proof-reference-encryption-master \
              -o -name deposit-proof-reference-fingerprint-master \
              -o -name deposit-proof-reference-profile.v2.json \
              -o -name owner-database-url -o -name player-action-database-url \
              -o -name publishable-key -o -name supabase-ca.crt \) -print -quit)" ]]; then
              candidate_safe='false'
            else
              for name in "${allowed_names[@]}"; do
                target="$candidate/$name"
                if [[ ! -e "$target" && ! -L "$target" ]]; then continue; fi
                if [[ -L "$target" || ! -f "$target" || \
                  "$(stat --format='%U:%a:%h' "$target")" != 'fetanagent-admin:600:1' ]]; then
                  candidate_safe='false'
                  break
                fi
              done
            fi
            if [[ "$candidate_safe" == 'true' ]]; then
              rm -rf -- "$candidate"
            else
              cleanup_failed=1
            fi
          done
          for candidate in "$staging" "$incoming" "$incoming.consumed"; do
            if [[ -e "$candidate" || -L "$candidate" ]]; then cleanup_failed=1; fi
          done
          [[ "$cleanup_failed" -eq 0 ]]
          REMOTE_CLEANUP
          }

          cleanup() {
            local original_status="$1" cleanup_status=0 stop_status=0 database_status=0
            trap - EXIT
            set +e
            if [[ "$original_status" -ne 0 && "$recovery_mutation_attempted" == 'true' ]]; then
              ssh "${ssh_opts[@]}" "$remote" \
                "$remote_prefix && sudo -n /usr/local/sbin/fetanagent-staging-deploy-helper stop" || \
                stop_status=$?
            fi
            if [[ "$remote_bundle_owned_by_run" == 'true' ]]; then
              cleanup_remote_bundle || cleanup_status=$?
            fi
            if [[ "$original_status" -ne 0 && \
              ( "$roles_disable_attempted" == 'true' || "$roles_provision_attempted" == 'true' ) ]]; then
              psql -X --file="$contract_dir/staging-runtimes-disable.sql" || database_status=$?
            fi
            [[ "$secret_dir" == "$RUNNER_TEMP/v1-retirement-recovery-bundle" && \
              ! -L "$secret_dir" && -d "$secret_dir" ]] && rm -rf -- "$secret_dir"
            [[ "$connection_dir" == "$RUNNER_TEMP/v1-retirement-recovery-session" && \
              ! -L "$connection_dir" && -d "$connection_dir" ]] && rm -rf -- "$connection_dir"
            [[ "$contract_dir" == "$RUNNER_TEMP/v1-retirement-contract" && \
              ! -L "$contract_dir" && -d "$contract_dir" ]] && rm -rf -- "$contract_dir"
            if [[ "$original_status" -ne 0 ]]; then exit "$original_status"; fi
            if [[ "$cleanup_status" -ne 0 ]]; then exit "$cleanup_status"; fi
            if [[ "$stop_status" -ne 0 ]]; then exit "$stop_status"; fi
            exit "$database_status"
          }
          trap 'cleanup "$?"' EXIT

          remote_bundle_dev_ino="$(ssh "${ssh_opts[@]}" "$remote" \
            "set -euo pipefail; staging='$remote_bundle_staging'; incoming='$incoming';
             [[ ! -e \"\$staging\" && ! -L \"\$staging\" ]];
             [[ ! -e \"\$incoming\" && ! -L \"\$incoming\" ]];
             [[ ! -e \"\$incoming.consumed\" && ! -L \"\$incoming.consumed\" ]];
             install -d -m 0700 \"\$staging\";
             [[ ! -L \"\$staging\" && -d \"\$staging\" && \"\$(realpath -- \"\$staging\")\" == \"\$staging\" ]];
             [[ \"\$(stat --format='%U:%a' \"\$staging\")\" == 'fetanagent-admin:700' ]];
             stat --format='%d:%i' \"\$staging\"")"
          [[ "$remote_bundle_dev_ino" =~ ^[0-9]+:[0-9]+$ ]]
          remote_bundle_owned_by_run='true'
          scp "${ssh_opts[@]}" "${bundle_files[@]/#/$secret_dir/}" "$remote:$remote_bundle_staging/"
          ssh "${ssh_opts[@]}" "$remote" \
            "set -euo pipefail; staging='$remote_bundle_staging'; chmod 0600 \"\$staging\"/*;
             [[ \"\$(find -P \"\$staging\" -mindepth 1 -maxdepth 1 -type f | wc -l)\" -eq 23 ]];
             [[ -z \"\$(find -P \"\$staging\" -mindepth 1 -maxdepth 1 ! -type f -print -quit)\" ]]"
          ssh "${ssh_opts[@]}" "$remote" \
            "python3 -I - '$remote_bundle_staging' '$incoming' '$remote_bundle_dev_ino'" <<'REMOTE_PUBLISH'
          import ctypes
          import errno
          import os
          import re
          import stat
          import sys

          def reject():
              raise RuntimeError()

          try:
              if len(sys.argv) != 4:
                  reject()
              staging, incoming, expected_dev_ino = sys.argv[1:]
              if (
                  re.fullmatch(r'/tmp/fetanagent-kemerbet-v1-retirement-secrets-stage-[0-9a-f]{40}-[1-9][0-9]*-[1-9][0-9]*', staging) is None
                  or re.fullmatch(r'/tmp/fetanagent-kemerbet-v1-retirement-secrets-[0-9a-f]{40}', incoming) is None
                  or re.fullmatch(r'[0-9]+:[0-9]+', expected_dev_ino) is None
              ):
                  reject()
              parent = '/tmp'
              staging_name = os.path.basename(staging)
              incoming_name = os.path.basename(incoming)
              flags = os.O_RDONLY | os.O_DIRECTORY | os.O_CLOEXEC
              if hasattr(os, 'O_NOFOLLOW'):
                  flags |= os.O_NOFOLLOW
              parent_fd = os.open(parent, flags)
              try:
                  parent_before = os.fstat(parent_fd)
                  staged = os.stat(staging_name, dir_fd=parent_fd, follow_symlinks=False)
                  if (
                      not stat.S_ISDIR(staged.st_mode)
                      or staged.st_uid != os.getuid()
                      or stat.S_IMODE(staged.st_mode) != 0o700
                      or f'{staged.st_dev}:{staged.st_ino}' != expected_dev_ino
                  ):
                      reject()
                  for absent_name in (incoming_name, incoming_name + '.consumed'):
                      try:
                          os.stat(absent_name, dir_fd=parent_fd, follow_symlinks=False)
                          reject()
                      except FileNotFoundError:
                          pass
                  libc = ctypes.CDLL(None, use_errno=True)
                  renameat2 = libc.renameat2
                  renameat2.argtypes = [ctypes.c_int, ctypes.c_char_p, ctypes.c_int, ctypes.c_char_p, ctypes.c_uint]
                  renameat2.restype = ctypes.c_int
                  if renameat2(parent_fd, os.fsencode(staging_name), parent_fd, os.fsencode(incoming_name), 1) != 0:
                      error = ctypes.get_errno()
                      if error in (errno.EEXIST, errno.ENOTEMPTY):
                          reject()
                      raise OSError(error, os.strerror(error))
                  os.fsync(parent_fd)
                  published = os.stat(incoming_name, dir_fd=parent_fd, follow_symlinks=False)
                  if (
                      not stat.S_ISDIR(published.st_mode)
                      or published.st_uid != os.getuid()
                      or stat.S_IMODE(published.st_mode) != 0o700
                      or (published.st_dev, published.st_ino) != (staged.st_dev, staged.st_ino)
                  ):
                      reject()
                  try:
                      os.stat(staging_name, dir_fd=parent_fd, follow_symlinks=False)
                      reject()
                  except FileNotFoundError:
                      pass
                  parent_after = os.fstat(parent_fd)
                  if (
                      parent_after.st_mode != parent_before.st_mode
                      or parent_after.st_uid != parent_before.st_uid
                      or parent_after.st_gid != parent_before.st_gid
                      or (parent_after.st_dev, parent_after.st_ino) != (parent_before.st_dev, parent_before.st_ino)
                  ):
                      reject()
              finally:
                  os.close(parent_fd)
          except Exception:
              raise SystemExit(1)
          REMOTE_PUBLISH

          roles_provision_attempted='true'
          psql -X --file="$contract_dir/staging-runtimes-provision-for-deploy.sql"
          stop_at="$(psql -X --tuples-only --no-align --set=ON_ERROR_STOP=1 <<'SQL'
          with expected(role_name) as (
            values
              ('fetanagent_beta_admission_runtime'::text),
              ('fetanagent_customer_web_runtime'::text),
              ('fetanagent_owner_control_runtime'::text),
              ('fetanagent_player_actions_runtime'::text)
          ),
          observed as (
            select role.oid, role.rolcanlogin, role.rolvaliduntil
            from expected
            left join pg_catalog.pg_roles role on role.rolname = expected.role_name
          )
          select pg_catalog.to_char(
                   (pg_catalog.min(rolvaliduntil) - interval '2 hours') at time zone 'UTC',
                   'YYYY-MM-DD"T"HH24:MI:SS"Z"'
                 )
          from observed
          having pg_catalog.count(oid) = 4
             and pg_catalog.count(rolvaliduntil) = 4
             and pg_catalog.bool_and(rolcanlogin)
             and pg_catalog.bool_and(pg_catalog.isfinite(rolvaliduntil))
             and pg_catalog.min(rolvaliduntil) > pg_catalog.clock_timestamp() + interval '23 hours 30 minutes'
             and pg_catalog.max(rolvaliduntil) <= pg_catalog.clock_timestamp() + interval '24 hours 5 minutes'
             and pg_catalog.max(rolvaliduntil) - pg_catalog.min(rolvaliduntil) <= interval '10 seconds';
          SQL
          )"
          [[ "$stop_at" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
          stop_epoch="$(date -u -d "$stop_at" +%s)"
          [[ "$(date -u -d "@$stop_epoch" '+%Y-%m-%dT%H:%M:%SZ')" == "$stop_at" ]]
          now_epoch="$(date -u +%s)"
          (( stop_epoch > now_epoch + 21 * 60 * 60 ))
          (( stop_epoch <= now_epoch + 23 * 60 * 60 ))

          ssh "${ssh_opts[@]}" "$remote" \
            "$remote_prefix && sudo -n /usr/local/sbin/fetanagent-staging-deploy-helper reinstall-kemerbet-v1-retirement-secrets '$release_sha' '$incoming'"
          ssh "${ssh_opts[@]}" "$remote" \
            "$remote_prefix && sudo -n /usr/local/sbin/fetanagent-staging-deploy-helper start '$release_sha' '${release_sha:0:12}'"
          ssh "${ssh_opts[@]}" "$remote" \
            "$remote_prefix && sudo -n /usr/local/sbin/fetanagent-staging-deploy-helper arm-expiry-stop '$release_sha' '$stop_at'"
          ssh "${ssh_opts[@]}" "$remote" \
            "$remote_prefix && sudo -n /usr/local/sbin/fetanagent-staging-deploy-helper start-bot '$release_sha' '${release_sha:0:12}'"
          bot_ready='false'
          for attempt in {1..12}; do
            if ssh "${ssh_opts[@]}" "$remote" \
              "$remote_prefix && sudo -n /usr/local/sbin/fetanagent-staging-deploy-helper bot-ready '$release_sha'"; then
              bot_ready='true'
              break
            fi
            if [[ "$attempt" -lt 12 ]]; then sleep 5; fi
          done
          [[ "$bot_ready" == 'true' ]]
          ssh "${ssh_opts[@]}" "$remote" \
            "$remote_prefix && sudo -n /usr/local/sbin/fetanagent-staging-deploy-helper start-public-edge '$release_sha' '${release_sha:0:12}'"
          ssh "${ssh_opts[@]}" "$remote" \
            "$remote_prefix && sudo -n /usr/local/sbin/fetanagent-staging-deploy-helper public-edge-ready '$release_sha'"
          echo 'v1_retirement_same_release_recovery=pass'

  stop:
    name: Stop staging and disable runtime logins
    if: inputs.mode == 'predecessor-stop-and-disable' || inputs.mode == 'ecd47f5d-predecessor-stop-and-disable' || inputs.mode == 'stop-and-disable'
    needs: validate-target
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: staging
    permissions:
      contents: read
    steps:
      - name: Check out cleanup SQL
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Stop containers and disable all staging database logins
        shell: bash
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGHOST: ${{ env.STAGING_POOLER_HOST }}
          PGPORT: '5432'
          PGDATABASE: postgres
          PGUSER: postgres.${{ env.STAGING_PROJECT_REF }}
          PGSSLMODE: verify-full
          PGSSLROOTCERT: ${{ runner.temp }}/supabase-ca.crt
          PGSERVICEFILE: /dev/null
          PGPASSFILE: /dev/null
          REQUESTED_MODE: ${{ inputs.mode }}
          STAGING_VM_HOST: ${{ secrets.STAGING_VM_HOST }}
          STAGING_VM_KNOWN_HOSTS: ${{ secrets.STAGING_VM_KNOWN_HOSTS }}
          STAGING_VM_SSH_PRIVATE_KEY: ${{ secrets.STAGING_VM_SSH_PRIVATE_KEY }}
          SUPABASE_CA_CERTIFICATE_PEM: ${{ secrets.SUPABASE_CA_CERTIFICATE_PEM }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$STAGING_VM_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/deploy-key"
          printf '%s\n' "$STAGING_VM_KNOWN_HOSTS" > "$RUNNER_TEMP/known-hosts"
          printf '%s\n' "$SUPABASE_CA_CERTIFICATE_PEM" > "$PGSSLROOTCERT"
          openssl x509 -in "$PGSSLROOTCERT" -noout -checkend 0 >/dev/null
          helper_sha="$(sha256sum infra/operations/fetanagent-staging-deploy-helper.sh | awk '{print $1}')"
          release_sha="$GITHUB_SHA"
          predecessor_mode='false'
          if [[ "$REQUESTED_MODE" == 'predecessor-stop-and-disable' ]]; then
            test "$(sha256sum infra/sql/staging-runtimes-disable.sql | awk '{print $1}')" = \
              '956f1f76c21e46103f0d5439617b94572f7aad28a214930e25cb799a30399583'
            helper_sha='022a9f10335fb570efb7638e2029ce663525ed742296268471b4c3a444ada714'
            release_sha='8f58ff06425160835c94801e564fa6f9066d0930'
            predecessor_mode='true'
          elif [[ "$REQUESTED_MODE" == 'ecd47f5d-predecessor-stop-and-disable' ]]; then
            test "$(sha256sum infra/sql/staging-runtimes-disable.sql | awk '{print $1}')" = \
              '956f1f76c21e46103f0d5439617b94572f7aad28a214930e25cb799a30399583'
            helper_sha='ecd47f5d6aff8cd955ed8b68d7313b79fde5547a6827743e1e5f1b0d1fca04be'
            release_sha='594ce9656311feabd062b6b6360a90ba5d7ee576'
            predecessor_mode='true'
          else
            [[ "$REQUESTED_MODE" == 'stop-and-disable' ]]
          fi
          remote_command="test \"\$(id -u)\" -ne 0 && sudo -n /usr/local/sbin/fetanagent-staging-deploy-helper verify '$helper_sha' && sudo -n /usr/local/sbin/fetanagent-staging-deploy-helper stop && sudo -n /usr/local/sbin/fetanagent-staging-deploy-helper discard '$release_sha'"
          if [[ "$predecessor_mode" == 'true' ]]; then
            remote_command="test \"\$(id -u)\" -ne 0 || exit 190; sudo -n /usr/local/sbin/fetanagent-staging-deploy-helper verify '$helper_sha' || exit 191; sudo -n /usr/local/sbin/fetanagent-staging-deploy-helper stop || exit 192; sudo -n /usr/local/sbin/fetanagent-staging-deploy-helper discard '$release_sha' || exit 193"
          fi
          remote_status=0
          ssh -F /dev/null -i "$RUNNER_TEMP/deploy-key" -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/known-hosts" \
            "fetanagent-admin@$STAGING_VM_HOST" \
            "$remote_command" || remote_status=$?
          if [[ "$predecessor_mode" == 'true' ]]; then
            case "$remote_status" in
              0|192|193) ;;
              *)
                echo '::error::The exact predecessor proof boundary was not completed; database cleanup was not attempted.'
                exit "$remote_status"
                ;;
            esac
          fi
          psql -X --file=infra/sql/staging-runtimes-disable.sql
          if [[ "$remote_status" -ne 0 ]]; then
            echo '::error::Database logins were disabled, but the VM cleanup requires operator review.'
            exit "$remote_status"
          fi
