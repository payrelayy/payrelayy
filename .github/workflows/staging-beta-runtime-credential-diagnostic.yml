name: Staging beta runtime credential diagnostic

# Temporary staging-only diagnostic. Remove this workflow after the reviewed one-shot run.

on:
  workflow_dispatch:
    inputs:
      confirm_staging_project_ref:
        description: Type the exact staging project ref to confirm the target
        required: true
        type: string
      confirm_main_commit_sha:
        description: Type the exact full main commit SHA to confirm the reviewed source
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: staging-beta-runtime-credential-diagnostic
  cancel-in-progress: false

env:
  STAGING_PROJECT_REF: spzpiyxheappsfyswewl
  PRODUCTION_PROJECT_REF: xzztugbgtulptnbpoelr
  STAGING_POOLER_HOST: aws-1-eu-west-1.pooler.supabase.com
  BETA_RUNTIME_ROLE: payreplayy_beta_admission_runtime

jobs:
  validate-target:
    name: Validate staging diagnostic target
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      CONFIRMED_STAGING_PROJECT_REF: ${{ inputs.confirm_staging_project_ref }}
      CONFIRMED_MAIN_COMMIT_SHA: ${{ inputs.confirm_main_commit_sha }}
    steps:
      - name: Require the reviewed main commit and exact staging ref
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REPOSITORY" != 'payrelayy/payrelayy' ]]; then
            echo '::error::This diagnostic may run only in the canonical PayRelayy repository.'
            exit 1
          fi

          if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo '::error::This diagnostic may run only from the main branch.'
            exit 1
          fi

          if [[ "$STAGING_PROJECT_REF" == "$PRODUCTION_PROJECT_REF" ]]; then
            echo '::error::The configured staging and production refs must be different.'
            exit 1
          fi

          if [[ "$CONFIRMED_STAGING_PROJECT_REF" != "$STAGING_PROJECT_REF" ]]; then
            echo '::error::The staging project confirmation does not match the configured staging ref.'
            exit 1
          fi

          if [[ "$CONFIRMED_STAGING_PROJECT_REF" == "$PRODUCTION_PROJECT_REF" ]]; then
            echo '::error::The production project is never an allowed target.'
            exit 1
          fi

          if [[ ! "$CONFIRMED_MAIN_COMMIT_SHA" =~ ^[0-9a-f]{40}$ || "$CONFIRMED_MAIN_COMMIT_SHA" != "$GITHUB_SHA" ]]; then
            echo '::error::The confirmed commit does not match the exact workflow commit.'
            exit 1
          fi

  diagnose-credential:
    name: Diagnose one staging runtime credential
    needs: validate-target
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: staging
    permissions:
      contents: read
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate protected inputs and create the temporary CA file
        id: protected-inputs
        shell: bash
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_CA_CERTIFICATE_PEM: ${{ secrets.SUPABASE_CA_CERTIFICATE_PEM }}
          BETA_ADMISSION_RUNTIME_PASSWORD: ${{ secrets.BETA_ADMISSION_RUNTIME_PASSWORD }}
        run: |
          set -euo pipefail

          if ! command -v psql >/dev/null 2>&1; then
            echo '::error::The pinned GitHub runner does not provide the PostgreSQL client.'
            exit 1
          fi

          if [[ -z "$SUPABASE_DB_PASSWORD" || -z "$SUPABASE_CA_CERTIFICATE_PEM" ]]; then
            echo '::error::The protected staging environment is missing an administrator credential or CA certificate.'
            exit 1
          fi

          if [[ ! "$BETA_ADMISSION_RUNTIME_PASSWORD" =~ ^[0-9a-f]{64}$ ]]; then
            echo '::error::The beta-admission runtime password is missing or malformed.'
            exit 1
          fi

          ca_file="$RUNNER_TEMP/payreplayy-staging-supabase-ca.crt"
          umask 077
          printf '%s\n' "$SUPABASE_CA_CERTIFICATE_PEM" > "$ca_file"
          openssl x509 -in "$ca_file" -noout -checkend 0 >/dev/null
          echo "ca_file=$ca_file" >> "$GITHUB_OUTPUT"

      - name: Verify the staging administrator connection
        shell: bash
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGHOST: ${{ env.STAGING_POOLER_HOST }}
          PGPORT: '5432'
          PGDATABASE: postgres
          PGUSER: postgres.${{ env.STAGING_PROJECT_REF }}
          PGSSLMODE: verify-full
          PGSSLROOTCERT: ${{ steps.protected-inputs.outputs.ca_file }}
          PGCONNECT_TIMEOUT: '5'
          PGSERVICEFILE: /dev/null
          PGPASSFILE: /dev/null
        run: psql -X --command='select 1' >/dev/null

      - name: Establish a disabled passwordless baseline
        shell: bash
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGHOST: ${{ env.STAGING_POOLER_HOST }}
          PGPORT: '5432'
          PGDATABASE: postgres
          PGUSER: postgres.${{ env.STAGING_PROJECT_REF }}
          PGSSLMODE: verify-full
          PGSSLROOTCERT: ${{ steps.protected-inputs.outputs.ca_file }}
          PGCONNECT_TIMEOUT: '5'
          PGSERVICEFILE: /dev/null
          PGPASSFILE: /dev/null
        run: psql -X --file=infra/sql/staging-beta-runtime-disable.sql

      - name: Provision and attest one temporary SCRAM credential
        id: provision
        shell: bash
        env:
          BETA_ADMISSION_RUNTIME_PASSWORD: ${{ secrets.BETA_ADMISSION_RUNTIME_PASSWORD }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGHOST: ${{ env.STAGING_POOLER_HOST }}
          PGPORT: '5432'
          PGDATABASE: postgres
          PGUSER: postgres.${{ env.STAGING_PROJECT_REF }}
          PGSSLMODE: verify-full
          PGSSLROOTCERT: ${{ steps.protected-inputs.outputs.ca_file }}
          PGCONNECT_TIMEOUT: '5'
          PGSERVICEFILE: /dev/null
          PGPASSFILE: /dev/null
        run: |
          set -euo pipefail
          echo 'attempted=true' >> "$GITHUB_OUTPUT"
          psql -X --file=infra/sql/staging-beta-runtime-provision.sql
          psql -X --file=infra/sql/staging-beta-runtime-credential-attest.sql

      - name: Allow one bounded Supavisor credential propagation interval
        shell: bash
        run: sleep 600

      - name: Attempt the beta runtime pooler login exactly once
        shell: bash
        env:
          PGPASSWORD: ${{ secrets.BETA_ADMISSION_RUNTIME_PASSWORD }}
          PGHOST: ${{ env.STAGING_POOLER_HOST }}
          PGPORT: '5432'
          PGDATABASE: postgres
          PGUSER: ${{ env.BETA_RUNTIME_ROLE }}.${{ env.STAGING_PROJECT_REF }}
          PGSSLMODE: verify-full
          PGSSLROOTCERT: ${{ steps.protected-inputs.outputs.ca_file }}
          PGCONNECT_TIMEOUT: '5'
          PGSERVICEFILE: /dev/null
          PGPASSFILE: /dev/null
        run: |
          set -euo pipefail
          psql -X --set="expected_runtime_role=$BETA_RUNTIME_ROLE" \
            --file=infra/sql/staging-runtime-login-preflight.sql

      - name: Capture count-only session diagnostics after a failed login
        if: failure() && steps.provision.outputs.attempted == 'true'
        shell: bash
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGHOST: ${{ env.STAGING_POOLER_HOST }}
          PGPORT: '5432'
          PGDATABASE: postgres
          PGUSER: postgres.${{ env.STAGING_PROJECT_REF }}
          PGSSLMODE: verify-full
          PGSSLROOTCERT: ${{ steps.protected-inputs.outputs.ca_file }}
          PGCONNECT_TIMEOUT: '5'
          PGSERVICEFILE: /dev/null
          PGPASSFILE: /dev/null
        run: psql -X --file=infra/sql/staging-runtime-session-diagnostics.sql

      - name: Disable and password-clear the beta runtime after every attempt
        if: always() && steps.provision.outputs.attempted == 'true'
        shell: bash
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGHOST: ${{ env.STAGING_POOLER_HOST }}
          PGPORT: '5432'
          PGDATABASE: postgres
          PGUSER: postgres.${{ env.STAGING_PROJECT_REF }}
          PGSSLMODE: verify-full
          PGSSLROOTCERT: ${{ steps.protected-inputs.outputs.ca_file }}
          PGCONNECT_TIMEOUT: '5'
          PGSERVICEFILE: /dev/null
          PGPASSFILE: /dev/null
        run: |
          set -euo pipefail
          cleanup_status=1
          for attempt in 1 2 3 4; do
            if psql -X --file=infra/sql/staging-beta-runtime-disable.sql; then
              cleanup_status=0
              break
            else
              cleanup_status=$?
            fi
            if [[ "$attempt" -lt 4 ]]; then
              echo "::warning::Temporary beta-runtime cleanup failed on attempt $attempt of 4; waiting 15 seconds."
              sleep 15
            fi
          done
          if [[ "$cleanup_status" -ne 0 ]]; then
            echo '::error::The temporary beta runtime could not be disabled after four bounded attempts.'
            exit "$cleanup_status"
          fi

      - name: Remove the temporary CA copy
        if: always()
        shell: bash
        env:
          CA_FILE: ${{ steps.protected-inputs.outputs.ca_file }}
        run: |
          set -euo pipefail
          if [[ -n "${CA_FILE:-}" && -f "$CA_FILE" ]]; then
            rm -f -- "$CA_FILE"
          fi
