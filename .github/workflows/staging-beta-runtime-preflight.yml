name: Staging beta runtime preflight

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect the disabled role or provision and preflight the dedicated staging login
        required: true
        default: inspect
        type: choice
        options:
          - inspect
          - provision-and-preflight
      confirm_staging_project_ref:
        description: Type the exact staging project ref to confirm the target
        required: true
        type: string
      confirm_main_commit_sha:
        description: Type the exact full main commit SHA to confirm the reviewed source
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: staging-beta-runtime-preflight
  cancel-in-progress: false

env:
  STAGING_PROJECT_REF: spzpiyxheappsfyswewl
  PRODUCTION_PROJECT_REF: xzztugbgtulptnbpoelr
  STAGING_POOLER_HOST: aws-1-eu-west-1.pooler.supabase.com
  BETA_RUNTIME_ROLE: payreplayy_beta_admission_runtime

jobs:
  validate-target:
    name: Validate staging target
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      REQUESTED_MODE: ${{ inputs.mode }}
      CONFIRMED_STAGING_PROJECT_REF: ${{ inputs.confirm_staging_project_ref }}
      CONFIRMED_MAIN_COMMIT_SHA: ${{ inputs.confirm_main_commit_sha }}
    steps:
      - name: Require main and the exact staging ref
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo '::error::This workflow may run only from the main branch.'
            exit 1
          fi

          if [[ "$REQUESTED_MODE" != 'inspect' && "$REQUESTED_MODE" != 'provision-and-preflight' ]]; then
            echo '::error::The requested mode is not allowed.'
            exit 1
          fi

          if [[ "$STAGING_PROJECT_REF" == "$PRODUCTION_PROJECT_REF" ]]; then
            echo '::error::The configured staging and production refs must be different.'
            exit 1
          fi

          if [[ "$CONFIRMED_STAGING_PROJECT_REF" != "$STAGING_PROJECT_REF" ]]; then
            echo '::error::The staging project confirmation does not match the configured staging ref.'
            exit 1
          fi

          if [[ "$CONFIRMED_STAGING_PROJECT_REF" == "$PRODUCTION_PROJECT_REF" ]]; then
            echo '::error::The production project is never an allowed target.'
            exit 1
          fi

          if [[ ! "$CONFIRMED_MAIN_COMMIT_SHA" =~ ^[0-9a-f]{40}$ || "$CONFIRMED_MAIN_COMMIT_SHA" != "$GITHUB_SHA" ]]; then
            echo '::error::The confirmed commit does not match the exact workflow commit.'
            exit 1
          fi

  staging-runtime:
    name: Inspect or preflight the staging runtime
    needs: validate-target
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        if: inputs.mode == 'provision-and-preflight'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Validate tooling and protected inputs
        id: protected-inputs
        shell: bash
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_CA_CERTIFICATE_PEM: ${{ secrets.SUPABASE_CA_CERTIFICATE_PEM }}
          BETA_ADMISSION_RUNTIME_PASSWORD: ${{ secrets.BETA_ADMISSION_RUNTIME_PASSWORD }}
          BOT_TO_BETA_ADMISSION_HMAC_SECRET: ${{ secrets.BOT_TO_BETA_ADMISSION_HMAC_SECRET }}
          BETA_ADMISSION_PAYLOAD_HMAC_SECRET: ${{ secrets.BETA_ADMISSION_PAYLOAD_HMAC_SECRET }}
        run: |
          set -euo pipefail

          if ! command -v psql >/dev/null 2>&1; then
            echo '::error::The pinned GitHub runner does not provide the PostgreSQL client.'
            exit 1
          fi

          if [[ -z "$SUPABASE_DB_PASSWORD" || -z "$SUPABASE_CA_CERTIFICATE_PEM" ]]; then
            echo '::error::The protected staging environment is missing an administrator credential or CA certificate.'
            exit 1
          fi

          if [[ "$REQUESTED_MODE" == 'provision-and-preflight' ]]; then
            if [[ ! "$BETA_ADMISSION_RUNTIME_PASSWORD" =~ ^[0-9a-f]{64}$ ]]; then
              echo '::error::The dedicated runtime password is missing or malformed.'
              exit 1
            fi
            if [[ ! "$BOT_TO_BETA_ADMISSION_HMAC_SECRET" =~ ^[0-9a-f]{64}$ ]]; then
              echo '::error::The transport HMAC secret is missing or malformed.'
              exit 1
            fi
            if [[ ! "$BETA_ADMISSION_PAYLOAD_HMAC_SECRET" =~ ^[0-9a-f]{64}$ ]]; then
              echo '::error::The payload HMAC secret is missing or malformed.'
              exit 1
            fi
            if [[ "$BOT_TO_BETA_ADMISSION_HMAC_SECRET" == "$BETA_ADMISSION_PAYLOAD_HMAC_SECRET" ]]; then
              echo '::error::The two beta-admission HMAC secrets must be distinct.'
              exit 1
            fi
          fi

          ca_file="$RUNNER_TEMP/payreplayy-staging-supabase-ca.crt"
          umask 077
          printf '%s\n' "$SUPABASE_CA_CERTIFICATE_PEM" > "$ca_file"
          openssl x509 -in "$ca_file" -noout -checkend 0 >/dev/null
          echo "ca_file=$ca_file" >> "$GITHUB_OUTPUT"

      - name: Inspect the dedicated role without changing it
        shell: bash
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGHOST: ${{ env.STAGING_POOLER_HOST }}
          PGPORT: '5432'
          PGDATABASE: postgres
          PGUSER: postgres.${{ env.STAGING_PROJECT_REF }}
          PGSSLMODE: verify-full
          PGSSLROOTCERT: ${{ steps.protected-inputs.outputs.ca_file }}
          PGCONNECT_TIMEOUT: '5'
          PGSERVICEFILE: /dev/null
          PGPASSFILE: /dev/null
        run: psql -X --file=infra/sql/staging-beta-runtime-inspect.sql

      - name: Enable Corepack and verify pnpm
        if: inputs.mode == 'provision-and-preflight'
        shell: bash
        run: |
          corepack enable
          test "$(pnpm --version)" = '11.16.0'

      - name: Install locked dependencies
        if: inputs.mode == 'provision-and-preflight'
        run: pnpm install --frozen-lockfile

      - name: Provision a one-hour staging login
        if: inputs.mode == 'provision-and-preflight'
        id: provision
        shell: bash
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGHOST: ${{ env.STAGING_POOLER_HOST }}
          PGPORT: '5432'
          PGDATABASE: postgres
          PGUSER: postgres.${{ env.STAGING_PROJECT_REF }}
          PGSSLMODE: verify-full
          PGSSLROOTCERT: ${{ steps.protected-inputs.outputs.ca_file }}
          PGCONNECT_TIMEOUT: '5'
          PGSERVICEFILE: /dev/null
          PGPASSFILE: /dev/null
          BETA_ADMISSION_RUNTIME_PASSWORD: ${{ secrets.BETA_ADMISSION_RUNTIME_PASSWORD }}
        run: |
          set -euo pipefail
          echo 'attempted=true' >> "$GITHUB_OUTPUT"
          psql -X --file=infra/sql/staging-beta-runtime-provision.sql

      - name: Run the dedicated catalog-only preflight
        if: inputs.mode == 'provision-and-preflight'
        shell: bash
        env:
          NODE_ENV: development
          NODE_EXTRA_CA_CERTS: ${{ steps.protected-inputs.outputs.ca_file }}
          INTERNAL_TELEGRAM_BETA_ADMISSION_RUNTIME_ENABLED: 'true'
          BETA_ADMISSION_RUNTIME_PASSWORD: ${{ secrets.BETA_ADMISSION_RUNTIME_PASSWORD }}
          BOT_TO_BETA_ADMISSION_HMAC_SECRET: ${{ secrets.BOT_TO_BETA_ADMISSION_HMAC_SECRET }}
          BETA_ADMISSION_PAYLOAD_HMAC_SECRET: ${{ secrets.BETA_ADMISSION_PAYLOAD_HMAC_SECRET }}
        run: |
          set -euo pipefail

          export BETA_ADMISSION_DATABASE_URL="postgresql://${BETA_RUNTIME_ROLE}.${STAGING_PROJECT_REF}:${BETA_ADMISSION_RUNTIME_PASSWORD}@${STAGING_POOLER_HOST}:5432/postgres?sslmode=verify-full"
          pnpm --filter @payreplayy/config run build
          pnpm --filter @payreplayy/contracts run build
          pnpm --filter @payreplayy/beta-admission run build
          pnpm --filter @payreplayy/beta-admission run db:preflight

      - name: Disable and clear the login after every preflight attempt
        if: always() && steps.provision.outputs.attempted == 'true'
        shell: bash
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGHOST: ${{ env.STAGING_POOLER_HOST }}
          PGPORT: '5432'
          PGDATABASE: postgres
          PGUSER: postgres.${{ env.STAGING_PROJECT_REF }}
          PGSSLMODE: verify-full
          PGSSLROOTCERT: ${{ steps.protected-inputs.outputs.ca_file }}
          PGCONNECT_TIMEOUT: '5'
          PGSERVICEFILE: /dev/null
          PGPASSFILE: /dev/null
        run: psql -X --file=infra/sql/staging-beta-runtime-disable.sql

      - name: Remove the temporary CA copy
        if: always()
        shell: bash
        env:
          CA_FILE: ${{ steps.protected-inputs.outputs.ca_file }}
        run: |
          set -euo pipefail
          if [[ -n "${CA_FILE:-}" && -f "$CA_FILE" ]]; then
            rm -f -- "$CA_FILE"
          fi
