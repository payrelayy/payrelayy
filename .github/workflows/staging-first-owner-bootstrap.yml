name: Staging first Owner bootstrap

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect eligibility or perform the one-time staging Owner bootstrap
        required: true
        default: inspect
        type: choice
        options:
          - inspect
          - bootstrap
      confirm_staging_project_ref:
        description: Type the exact staging project ref
        required: true
        type: string
      confirm_main_commit_sha:
        description: Type the exact full main commit SHA
        required: true
        type: string
      staging_auth_user_id:
        description: Paste only the confirmed staging Supabase Auth user UUID
        required: true
        type: string
      confirm_first_owner_bootstrap:
        description: For bootstrap mode type bootstrap-first-staging-owner; for inspect type inspect-only
        required: true
        default: inspect-only
        type: string

permissions:
  contents: read

concurrency:
  group: staging-first-owner-bootstrap
  cancel-in-progress: false

env:
  STAGING_PROJECT_REF: spzpiyxheappsfyswewl
  PRODUCTION_PROJECT_REF: xzztugbgtulptnbpoelr
  STAGING_POOLER_HOST: aws-1-eu-west-1.pooler.supabase.com

jobs:
  validate-target:
    name: Validate exact first-Owner target
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      REQUESTED_MODE: ${{ inputs.mode }}
      CONFIRMED_STAGING_PROJECT_REF: ${{ inputs.confirm_staging_project_ref }}
      CONFIRMED_MAIN_COMMIT_SHA: ${{ inputs.confirm_main_commit_sha }}
      OWNER_AUTH_USER_ID: ${{ inputs.staging_auth_user_id }}
      OWNER_BOOTSTRAP_CONFIRMATION: ${{ inputs.confirm_first_owner_bootstrap }}
    steps:
      - name: Require main, staging, exact source, and an Auth UUID
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo '::error::This workflow may run only from the main branch.'
            exit 1
          fi

          if [[ "$REQUESTED_MODE" != 'inspect' && "$REQUESTED_MODE" != 'bootstrap' ]]; then
            echo '::error::The requested mode is not allowed.'
            exit 1
          fi

          if [[ "$STAGING_PROJECT_REF" == "$PRODUCTION_PROJECT_REF" ||
                "$CONFIRMED_STAGING_PROJECT_REF" != "$STAGING_PROJECT_REF" ||
                "$CONFIRMED_STAGING_PROJECT_REF" == "$PRODUCTION_PROJECT_REF" ]]; then
            echo '::error::The exact non-production staging target was not confirmed.'
            exit 1
          fi

          if [[ ! "$CONFIRMED_MAIN_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ||
                "$CONFIRMED_MAIN_COMMIT_SHA" != "$GITHUB_SHA" ]]; then
            echo '::error::The confirmed commit does not match this exact main workflow commit.'
            exit 1
          fi

          if [[ ! "$OWNER_AUTH_USER_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]; then
            echo '::error::The staging Auth user ID is not a canonical UUID.'
            exit 1
          fi

          if [[ "$REQUESTED_MODE" == 'bootstrap' &&
                "$OWNER_BOOTSTRAP_CONFIRMATION" != 'bootstrap-first-staging-owner' ]]; then
            echo '::error::The irreversible first-Owner bootstrap phrase is missing.'
            exit 1
          fi

          if [[ "$REQUESTED_MODE" == 'inspect' && "$OWNER_BOOTSTRAP_CONFIRMATION" != 'inspect-only' ]]; then
            echo '::error::Inspect mode requires the inspect-only confirmation.'
            exit 1
          fi

  first-owner:
    name: Inspect or bootstrap the first staging Owner
    needs: validate-target
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: staging
    permissions:
      contents: read
    steps:
      - name: Check out exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate protected staging database inputs
        id: protected-inputs
        shell: bash
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_CA_CERTIFICATE_PEM: ${{ secrets.SUPABASE_CA_CERTIFICATE_PEM }}
        run: |
          set -euo pipefail

          if ! command -v psql >/dev/null 2>&1; then
            echo '::error::The pinned runner does not provide the PostgreSQL client.'
            exit 1
          fi

          if [[ -z "$SUPABASE_DB_PASSWORD" || -z "$SUPABASE_CA_CERTIFICATE_PEM" ]]; then
            echo '::error::The protected staging environment is missing a database credential or CA certificate.'
            exit 1
          fi

          ca_file="$RUNNER_TEMP/payreplayy-staging-first-owner-ca.crt"
          umask 077
          printf '%s\n' "$SUPABASE_CA_CERTIFICATE_PEM" > "$ca_file"
          openssl x509 -in "$ca_file" -noout -checkend 0 >/dev/null
          echo "ca_file=$ca_file" >> "$GITHUB_OUTPUT"

      - name: Inspect Auth user and first-Owner eligibility without writes
        shell: bash
        env:
          OWNER_AUTH_USER_ID: ${{ inputs.staging_auth_user_id }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGHOST: ${{ env.STAGING_POOLER_HOST }}
          PGPORT: '5432'
          PGDATABASE: postgres
          PGUSER: postgres.${{ env.STAGING_PROJECT_REF }}
          PGSSLMODE: verify-full
          PGSSLROOTCERT: ${{ steps.protected-inputs.outputs.ca_file }}
          PGCONNECT_TIMEOUT: '5'
          PGSERVICEFILE: /dev/null
          PGPASSFILE: /dev/null
        run: psql -X --file=infra/sql/staging-first-owner-inspect.sql

      - name: Bootstrap exactly one staging Owner
        if: inputs.mode == 'bootstrap'
        shell: bash
        env:
          OWNER_AUTH_USER_ID: ${{ inputs.staging_auth_user_id }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGHOST: ${{ env.STAGING_POOLER_HOST }}
          PGPORT: '5432'
          PGDATABASE: postgres
          PGUSER: postgres.${{ env.STAGING_PROJECT_REF }}
          PGSSLMODE: verify-full
          PGSSLROOTCERT: ${{ steps.protected-inputs.outputs.ca_file }}
          PGCONNECT_TIMEOUT: '5'
          PGSERVICEFILE: /dev/null
          PGPASSFILE: /dev/null
        run: psql -X --file=infra/sql/staging-first-owner-bootstrap.sql

      - name: Remove the temporary CA copy
        if: always()
        shell: bash
        env:
          CA_FILE: ${{ steps.protected-inputs.outputs.ca_file }}
        run: |
          set -euo pipefail
          if [[ -n "${CA_FILE:-}" && -f "$CA_FILE" ]]; then
            rm -f -- "$CA_FILE"
          fi
