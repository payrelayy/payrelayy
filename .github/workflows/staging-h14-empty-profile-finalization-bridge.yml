name: Stage H14 empty-profile finalization bridge

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Stage the immutable fail-closed bridge only
        required: true
        default: h14-empty-profile-finalization-bridge-stage
        type: choice
        options:
          - h14-empty-profile-finalization-bridge-stage
      confirm_staging_project_ref:
        description: Type the exact staging project ref
        required: true
        type: string
      confirm_main_commit_sha:
        description: Type the canonical H14 main commit
        required: true
        type: string
      confirm_droplet_id:
        description: Type the exact staging droplet ID
        required: true
        type: string
      confirm_bridge_implementation_sha:
        description: Type the exact reviewed pull-request head SHA
        required: true
        type: string
      confirm_quarantine_recovery_authorization_sha256:
        description: Type the exact reviewed H14 authorization digest
        required: true
        type: string
      confirm_no_provider_action:
        description: Type host-retired-profile-finalization-no-provider-action-no-money
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: fetanagent-staging-beta-deploy
  cancel-in-progress: false

env:
  canonical_h14_commit: 06459511d9330a0e1d956c42529b81aa9970e7a2
  h14_authorization_sha256: 6b242ff02a16e885ea87008e60826c5ee333f3fbfcf30ea0f044ce938568c874
  staging_project_ref: spzpiyxheappsfyswewl
  production_project_ref: xzztugbgtulptnbpoelr
  staging_droplet_id: '593344964'

jobs:
  stage:
    name: Stage immutable no-provider finalization bridge
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: staging
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      staging_vm_host: ${{ secrets.STAGING_VM_HOST }}
      staging_vm_known_hosts: ${{ secrets.STAGING_VM_KNOWN_HOSTS }}
      staging_vm_ssh_private_key: ${{ secrets.STAGING_VM_SSH_PRIVATE_KEY }}
    steps:
      - name: Re-prove the exact pull request and staging-only authorization
        shell: bash
        run: |
          set -euo pipefail
          [[ '${{ inputs.mode }}' == h14-empty-profile-finalization-bridge-stage ]]
          [[ '${{ inputs.confirm_staging_project_ref }}' == "$staging_project_ref" ]]
          [[ '${{ inputs.confirm_staging_project_ref }}' != "$production_project_ref" ]]
          [[ '${{ inputs.confirm_main_commit_sha }}' == "$canonical_h14_commit" ]]
          [[ '${{ inputs.confirm_droplet_id }}' == "$staging_droplet_id" ]]
          [[ '${{ inputs.confirm_bridge_implementation_sha }}' == "$GITHUB_SHA" && "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_SHA" != "$canonical_h14_commit" ]]
          [[ '${{ inputs.confirm_quarantine_recovery_authorization_sha256 }}' == "$h14_authorization_sha256" ]]
          [[ '${{ inputs.confirm_no_provider_action }}' == host-retired-profile-finalization-no-provider-action-no-money ]]
          [[ "$GITHUB_REF" =~ ^refs/heads/[A-Za-z0-9._/-]+$ && "$GITHUB_REF" != refs/heads/main ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" == "$canonical_h14_commit" ]]
          branch_name="${GITHUB_REF#refs/heads/}"
          mapfile -t pulls < <(
            gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
              --jq ".[] | select(.state == \"open\" and .base.ref == \"main\" and .base.sha == \"$canonical_h14_commit\" and .head.sha == \"$GITHUB_SHA\" and .head.ref == \"$branch_name\" and .head.repo.full_name == \"$GITHUB_REPOSITORY\") | .number"
          )
          [[ "${#pulls[@]}" -eq 1 && "${pulls[0]}" =~ ^[1-9][0-9]*$ ]]

      - name: Check out the exact bridge release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ inputs.confirm_bridge_implementation_sha }}

      - name: Verify standalone bridge and canonical differential validator
        id: verified
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          script='infra/operations/fetanagent-kemerbet-h14-host-retired-empty-profile-finalization-bridge.sh'
          diagnostic='infra/operations/fetanagent-kemerbet-h14-terminal-differential-validator.py'
          engine='infra/operations/fetanagent-kemerbet-h14-empty-profile-finalization-engine.py'
          installer='infra/operations/fetanagent-kemerbet-h14-empty-profile-finalization-bundle-installer.py'
          bash -n "$script"
          python3 -m py_compile "$diagnostic"
          python3 -m py_compile "$engine"
          python3 -m py_compile "$installer"
          node infra/verify-kemerbet-h14-host-retired-empty-profile-finalization-bridge.mjs
          node infra/verify-kemerbet-h14-terminal-differential-validator.mjs
          script_sha="$(sha256sum "$script" | awk '{print $1}')"
          diagnostic_sha="$(sha256sum "$diagnostic" | awk '{print $1}')"
          engine_sha="$(sha256sum "$engine" | awk '{print $1}')"
          installer_sha="$(sha256sum "$installer" | awk '{print $1}')"
          script_size="$(stat -c %s "$script")"
          diagnostic_size="$(stat -c %s "$diagnostic")"
          engine_size="$(stat -c %s "$engine")"
          installer_size="$(stat -c %s "$installer")"
          manifest="$RUNNER_TEMP/h14-empty-profile-finalization-manifest-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_SHA-v1"
          printf '%s\n' \
            'version=1' \
            'contract=fetanagent-kemerbet-h14-empty-profile-finalization-bundle' \
            "bridge_release=$GITHUB_SHA" \
            "canonical_h14_release=$canonical_h14_commit" \
            "authorization_sha256=$h14_authorization_sha256" \
            "staging_project_ref=$staging_project_ref" \
            "staging_droplet_id=$staging_droplet_id" \
            "script_sha256=$script_sha" \
            "script_size=$script_size" \
            "diagnostic_sha256=$diagnostic_sha" \
            "diagnostic_size=$diagnostic_size" \
            "engine_sha256=$engine_sha" \
            "engine_size=$engine_size" \
            'execute_after_security_recovery_ack=true' \
            'installed_helper_changed=false' \
            'provider_action_enabled=false' \
            'amount_entry_enabled=false' \
            'transfer_enabled=false' \
            'money_moved=false' >"$manifest"
          manifest_sha="$(sha256sum "$manifest" | awk '{print $1}')"
          manifest_size="$(stat -c %s "$manifest")"
          [[ "$script_sha" =~ ^[0-9a-f]{64}$ && "$diagnostic_sha" =~ ^[0-9a-f]{64}$ &&
            "$engine_sha" =~ ^[0-9a-f]{64}$ && "$installer_sha" =~ ^[0-9a-f]{64}$ &&
            "$manifest_sha" =~ ^[0-9a-f]{64}$ ]]
          [[ "$script_size" =~ ^[1-9][0-9]*$ && "$diagnostic_size" =~ ^[1-9][0-9]*$ &&
            "$engine_size" =~ ^[1-9][0-9]*$ && "$installer_size" =~ ^[1-9][0-9]*$ &&
            "$manifest_size" =~ ^[1-9][0-9]*$ ]]
          printf 'script_sha=%s\ndiagnostic_sha=%s\nengine_sha=%s\ninstaller_sha=%s\nmanifest_sha=%s\nscript_size=%s\ndiagnostic_size=%s\nengine_size=%s\ninstaller_size=%s\nmanifest_size=%s\nmanifest_path=%s\n' \
            "$script_sha" "$diagnostic_sha" "$engine_sha" "$installer_sha" "$manifest_sha" \
            "$script_size" "$diagnostic_size" "$engine_size" "$installer_size" "$manifest_size" "$manifest" >>"$GITHUB_OUTPUT"

      - name: Stage four immutable bundle files and the no-secret installer
        id: staged
        shell: bash
        env:
          script_sha: ${{ steps.verified.outputs.script_sha }}
          diagnostic_sha: ${{ steps.verified.outputs.diagnostic_sha }}
          engine_sha: ${{ steps.verified.outputs.engine_sha }}
          installer_sha: ${{ steps.verified.outputs.installer_sha }}
          manifest_sha: ${{ steps.verified.outputs.manifest_sha }}
          script_size: ${{ steps.verified.outputs.script_size }}
          diagnostic_size: ${{ steps.verified.outputs.diagnostic_size }}
          engine_size: ${{ steps.verified.outputs.engine_size }}
          installer_size: ${{ steps.verified.outputs.installer_size }}
          manifest_size: ${{ steps.verified.outputs.manifest_size }}
          manifest_path: ${{ steps.verified.outputs.manifest_path }}
        run: |
          set -euo pipefail
          secret_dir="$(mktemp -d "$RUNNER_TEMP/h14-empty-profile-ssh.XXXXXX")"
          trap 'rm -rf "$secret_dir"' EXIT
          printf '%s\n' "$staging_vm_ssh_private_key" >"$secret_dir/key"
          printf '%s\n' "$staging_vm_known_hosts" >"$secret_dir/known"
          chmod 0600 "$secret_dir/key" "$secret_dir/known"
          ssh-keygen -F "$staging_vm_host" -f "$secret_dir/known" >/dev/null
          opts=(-F /dev/null -i "$secret_dir/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$secret_dir/known")
          remote="fetanagent-admin@$staging_vm_host"
          staging="/tmp/fetanagent-h14-empty-profile-finalization-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_SHA"
          [[ "$staging" =~ ^/tmp/fetanagent-h14-empty-profile-finalization-[1-9][0-9]*-[1-9][0-9]*-[0-9a-f]{40}$ ]]
          ssh "${opts[@]}" "$remote" "test \"\$(id -u)\" -ne 0 && test ! -e '$staging' && install -d -m 0700 '$staging'"
          scp "${opts[@]}" \
            infra/operations/fetanagent-kemerbet-h14-host-retired-empty-profile-finalization-bridge.sh \
            infra/operations/fetanagent-kemerbet-h14-terminal-differential-validator.py \
            infra/operations/fetanagent-kemerbet-h14-empty-profile-finalization-engine.py \
            infra/operations/fetanagent-kemerbet-h14-empty-profile-finalization-bundle-installer.py \
            "$manifest_path" \
            "$remote:$staging/"
          ssh "${opts[@]}" "$remote" "mv '$staging/$(basename "$manifest_path")' '$staging/manifest-v1'"
          ssh "${opts[@]}" "$remote" bash -s -- \
            "$staging" "$script_sha" "$script_size" "$diagnostic_sha" "$diagnostic_size" \
            "$engine_sha" "$engine_size" "$installer_sha" "$installer_size" \
            "$manifest_sha" "$manifest_size" <<'REMOTE'
          set -euo pipefail
          staging="$1"; script_sha="$2"; script_size="$3"; diagnostic_sha="$4"; diagnostic_size="$5"
          engine_sha="$6"; engine_size="$7"; installer_sha="$8"; installer_size="$9"
          manifest_sha="${10}"; manifest_size="${11}"
          test "$(id -u)" -ne 0
          chmod 0600 "$staging"/*
          test "$(find -P "$staging" -mindepth 1 -maxdepth 1 -printf '%f:%y\n' | LC_ALL=C sort)" = "fetanagent-kemerbet-h14-empty-profile-finalization-bundle-installer.py:f
          fetanagent-kemerbet-h14-empty-profile-finalization-engine.py:f
          fetanagent-kemerbet-h14-host-retired-empty-profile-finalization-bridge.sh:f
          fetanagent-kemerbet-h14-terminal-differential-validator.py:f
          manifest-v1:f"
          test "$(sha256sum "$staging/fetanagent-kemerbet-h14-host-retired-empty-profile-finalization-bridge.sh" | awk '{print $1}')" = "$script_sha"
          test "$(stat -c %s "$staging/fetanagent-kemerbet-h14-host-retired-empty-profile-finalization-bridge.sh")" = "$script_size"
          test "$(sha256sum "$staging/fetanagent-kemerbet-h14-terminal-differential-validator.py" | awk '{print $1}')" = "$diagnostic_sha"
          test "$(stat -c %s "$staging/fetanagent-kemerbet-h14-terminal-differential-validator.py")" = "$diagnostic_size"
          test "$(sha256sum "$staging/fetanagent-kemerbet-h14-empty-profile-finalization-engine.py" | awk '{print $1}')" = "$engine_sha"
          test "$(stat -c %s "$staging/fetanagent-kemerbet-h14-empty-profile-finalization-engine.py")" = "$engine_size"
          test "$(sha256sum "$staging/fetanagent-kemerbet-h14-empty-profile-finalization-bundle-installer.py" | awk '{print $1}')" = "$installer_sha"
          test "$(stat -c %s "$staging/fetanagent-kemerbet-h14-empty-profile-finalization-bundle-installer.py")" = "$installer_size"
          test "$(sha256sum "$staging/manifest-v1" | awk '{print $1}')" = "$manifest_sha"
          test "$(stat -c %s "$staging/manifest-v1")" = "$manifest_size"
          REMOTE
          echo "staging=$staging" >>"$GITHUB_OUTPUT"

      - name: Emit exact root-console installation without execution
        shell: bash
        env:
          staging: ${{ steps.staged.outputs.staging }}
          script_sha: ${{ steps.verified.outputs.script_sha }}
          diagnostic_sha: ${{ steps.verified.outputs.diagnostic_sha }}
          engine_sha: ${{ steps.verified.outputs.engine_sha }}
          installer_sha: ${{ steps.verified.outputs.installer_sha }}
          manifest_sha: ${{ steps.verified.outputs.manifest_sha }}
          script_size: ${{ steps.verified.outputs.script_size }}
          diagnostic_size: ${{ steps.verified.outputs.diagnostic_size }}
          engine_size: ${{ steps.verified.outputs.engine_size }}
          installer_size: ${{ steps.verified.outputs.installer_size }}
          manifest_size: ${{ steps.verified.outputs.manifest_size }}
        run: |
          set -euo pipefail
          implementation='${{ inputs.confirm_bridge_implementation_sha }}'
          parent='/var/lib/fetanagent/kemerbet-quarantine-recovery-v14-host-retired-empty-profile-finalization-bridge-bundles'
          root="$parent/$implementation"
          script="$root/fetanagent-kemerbet-h14-host-retired-empty-profile-finalization-bridge.sh"
          diagnostic="$root/fetanagent-kemerbet-h14-terminal-differential-validator.py"
          engine="$root/fetanagent-kemerbet-h14-empty-profile-finalization-engine.py"
          manifest="$root/manifest-v1"
          installer="$staging/fetanagent-kemerbet-h14-empty-profile-finalization-bundle-installer.py"
          {
            echo '### Exact H14 empty-profile finalization root-console block'
            echo
            echo 'Staged only; execute after the Owner security-recovery acknowledgement exists.'
            echo
            echo '```bash'
            echo 'set -euo pipefail'
            echo 'PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin; export PATH'
            echo "implementation='$implementation'"
            echo "staging='$staging'"
            echo "parent='$parent'"
            echo "root='$root'"
            echo "script='$script'"
            echo "diagnostic='$diagnostic'"
            echo "engine='$engine'"
            echo "manifest='$manifest'"
            echo "installer='$installer'"
            echo "script_sha='$script_sha'"
            echo "script_size='$script_size'"
            echo "diagnostic_sha='$diagnostic_sha'"
            echo "diagnostic_size='$diagnostic_size'"
            echo "engine_sha='$engine_sha'"
            echo "engine_size='$engine_size'"
            echo "installer_sha='$installer_sha'"
            echo "installer_size='$installer_size'"
            echo "manifest_sha='$manifest_sha'"
            echo "manifest_size='$manifest_size'"
            echo '[[ ! -L /run && -d /run && "$(realpath -- /run)" == /run && "$(stat -c '''%U:%G:%a''' /run)" == root:root:755 ]]'
            echo 'loader="$(mktemp --tmpdir=/run fetanagent-h14-empty-profile-installer.XXXXXXXX)"'
            echo 'trap '\''rm -f -- "$loader"'\'' EXIT'
            echo '/usr/bin/install -o root -g root -m 0400 -T "$installer" "$loader"'
            echo '[[ ! -L "$loader" && -f "$loader" && "$(realpath -- "$loader")" == "$loader" && "$(stat -c '''%U:%G:%a:%h:%s''' "$loader")" == "root:root:400:1:$installer_size" && "$(sha256sum "$loader" | awk '\''{print $1}'\'')" == "$installer_sha" ]]'
            echo 'sync -f "$loader"; sync -f /run'
            echo 'installed_root="$(/usr/bin/python3 -I "$loader" "$staging" "$parent" "$implementation" "$installer_sha" "$installer_size" "$script_sha" "$script_size" "$diagnostic_sha" "$diagnostic_size" "$engine_sha" "$engine_size" "$manifest_sha" "$manifest_size")"'
            echo '[[ "$installed_root" == "$root" ]]'
            echo '[[ "$(stat -c %s "$script")" == "$script_size" && "$(sha256sum "$script" | awk '\''{print $1}'\'')" == "$script_sha" ]]'
            echo '[[ "$(stat -c %s "$diagnostic")" == "$diagnostic_size" && "$(sha256sum "$diagnostic" | awk '\''{print $1}'\'')" == "$diagnostic_sha" ]]'
            echo '[[ "$(stat -c %s "$engine")" == "$engine_size" && "$(sha256sum "$engine" | awk '\''{print $1}'\'')" == "$engine_sha" ]]'
            echo '[[ "$(stat -c %s "$manifest")" == "$manifest_size" && "$(sha256sum "$manifest" | awk '\''{print $1}'\'')" == "$manifest_sha" ]]'
            echo '[[ "$loader" =~ ^/run/fetanagent-h14-empty-profile-installer\.[A-Za-z0-9]{8}$ && ! -L "$loader" && -f "$loader" && "$(stat -c '''%U:%G:%a:%h:%s''' "$loader")" == "root:root:400:1:$installer_size" && "$(sha256sum "$loader" | awk '\''{print $1}'\'')" == "$installer_sha" ]]'
            echo 'rm -f -- "$loader"; sync -f /run; trap - EXIT'
            echo 'exec bash "$script" "$implementation" "$script_sha" "$diagnostic_sha" "$engine_sha" "$manifest_sha"'
            echo '```'
            echo
            echo 'No Docker lifecycle, Supabase, provider, Amount, Transfer, or money action was executed.'
          } | tee -a "$GITHUB_STEP_SUMMARY"
