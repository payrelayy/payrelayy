name: Staging H14 runtime credential recovery

on:
  workflow_dispatch:
    inputs:
      confirm_staging_project_ref:
        description: Type the exact staging project ref
        required: true
        type: string
      confirm_release_sha:
        description: Type the exact reviewed pull-request head SHA
        required: true
        type: string
      confirm_no_provider_action:
        description: Type H14-RUNTIME-CREDENTIAL-RECOVERY-NO-PROVIDER-ACTION
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: fetanagent-staging-h14-runtime-credential-recovery
  cancel-in-progress: false

env:
  STAGING_PROJECT_REF: spzpiyxheappsfyswewl
  PRODUCTION_PROJECT_REF: xzztugbgtulptnbpoelr
  CANONICAL_MAIN_COMMIT: 06459511d9330a0e1d956c42529b81aa9970e7a2
  STAGING_POOLER_HOST: aws-1-eu-west-1.pooler.supabase.com

jobs:
  recover-staging-runtime-credentials:
    name: Renew only the three non-Owner staging runtime credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: staging
    env:
      GH_TOKEN: ${{ github.token }}
      BETA_ADMISSION_RUNTIME_PASSWORD: ${{ secrets.BETA_ADMISSION_RUNTIME_PASSWORD }}
      CUSTOMER_WEB_RUNTIME_PASSWORD: ${{ secrets.CUSTOMER_WEB_RUNTIME_PASSWORD }}
      PLAYER_ACTION_RUNTIME_PASSWORD: ${{ secrets.PLAYER_ACTION_RUNTIME_PASSWORD }}
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PGHOST: aws-1-eu-west-1.pooler.supabase.com
      PGPORT: '5432'
      PGDATABASE: postgres
      PGUSER: postgres.spzpiyxheappsfyswewl
      PGSSLMODE: verify-full
      PGCONNECT_TIMEOUT: '5'
      PGSERVICEFILE: /dev/null
      PGPASSFILE: /dev/null
      SUPABASE_CA_CERTIFICATE_PEM: ${{ secrets.SUPABASE_CA_CERTIFICATE_PEM }}
    steps:
      - name: Check out the exact reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Prove the exact staging-only pull-request target
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" =~ ^refs/heads/[A-Za-z0-9._/-]+$ && "$GITHUB_REF" != refs/heads/main ]]
          [[ "${{ inputs.confirm_release_sha }}" == "$GITHUB_SHA" && "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "${{ inputs.confirm_staging_project_ref }}" == "$STAGING_PROJECT_REF" ]]
          [[ "${{ inputs.confirm_staging_project_ref }}" != "$PRODUCTION_PROJECT_REF" ]]
          [[ "${{ inputs.confirm_no_provider_action }}" == 'H14-RUNTIME-CREDENTIAL-RECOVERY-NO-PROVIDER-ACTION' ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" == "$CANONICAL_MAIN_COMMIT" ]]
          branch_name="${GITHUB_REF#refs/heads/}"
          mapfile -t pulls < <(
            gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
              --jq ".[] | select(.state == \"open\" and .base.ref == \"main\" and .base.sha == \"$CANONICAL_MAIN_COMMIT\" and .head.sha == \"$GITHUB_SHA\" and .head.ref == \"$branch_name\" and .head.repo.full_name == \"$GITHUB_REPOSITORY\") | .number"
          )
          [[ "${#pulls[@]}" -eq 1 && "${pulls[0]}" =~ ^[1-9][0-9]*$ ]]
          [[ "$BETA_ADMISSION_RUNTIME_PASSWORD" =~ ^[0-9a-f]{64}$ ]]
          [[ "$CUSTOMER_WEB_RUNTIME_PASSWORD" =~ ^[0-9a-f]{64}$ ]]
          [[ "$PLAYER_ACTION_RUNTIME_PASSWORD" =~ ^[0-9a-f]{64}$ ]]
          [[ -n "$PGPASSWORD" && -n "$SUPABASE_CA_CERTIFICATE_PEM" ]]

      - name: Renew the three restricted disposable credentials
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ca_file="$RUNNER_TEMP/supabase-ca.crt"
          trap 'rm -f -- "$ca_file"' EXIT
          printf '%s\n' "$SUPABASE_CA_CERTIFICATE_PEM" >"$ca_file"
          export PGSSLROOTCERT="$ca_file"
          openssl x509 -in "$ca_file" -noout -checkend 0 >/dev/null
          psql -X --file=infra/sql/staging-h14-runtime-credential-recovery.sql
          rm -f -- "$ca_file"
          trap - EXIT
          {
            echo 'staging_project_verified=true'
            echo 'owner_role_changed=false'
            echo 'schema_changed=false'
            echo 'provider_action_enabled=false'
            echo 'transfer_enabled=false'
            echo 'amount_entry_enabled=false'
            echo 'money_moved=false'
          } | tee -a "$GITHUB_STEP_SUMMARY"
