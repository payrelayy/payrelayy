name: Staging TeleBirr operational trust

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect or idempotently provision only the disabled TeleBirr trust binding
        required: true
        default: inspect
        type: choice
        options:
          - inspect
          - provision
      confirm_staging_project_ref:
        description: Type the exact staging project ref
        required: true
        type: string
      confirm_main_commit_sha:
        description: Type the exact full reviewed main commit SHA
        required: true
        type: string
      confirm_no_money_operation:
        description: Type inspect-no-money or provision-trust-only-no-pilot
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: staging-telebirr-operational-trust
  cancel-in-progress: false

env:
  STAGING_PROJECT_REF: spzpiyxheappsfyswewl
  PRODUCTION_PROJECT_REF: xzztugbgtulptnbpoelr
  STAGING_POOLER_HOST: aws-1-eu-west-1.pooler.supabase.com

jobs:
  validate-target:
    name: Validate exact disabled staging target
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      REQUESTED_MODE: ${{ inputs.mode }}
      CONFIRMED_STAGING_PROJECT_REF: ${{ inputs.confirm_staging_project_ref }}
      CONFIRMED_MAIN_COMMIT_SHA: ${{ inputs.confirm_main_commit_sha }}
      CONFIRMED_NO_MONEY_OPERATION: ${{ inputs.confirm_no_money_operation }}
    steps:
      - name: Require main, exact source, staging, and trust-only confirmation
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$REQUESTED_MODE" == 'inspect' || "$REQUESTED_MODE" == 'provision' ]]
          [[ "$STAGING_PROJECT_REF" != "$PRODUCTION_PROJECT_REF" ]]
          [[ "$CONFIRMED_STAGING_PROJECT_REF" == "$STAGING_PROJECT_REF" ]]
          [[ "$CONFIRMED_STAGING_PROJECT_REF" != "$PRODUCTION_PROJECT_REF" ]]
          [[ "$CONFIRMED_MAIN_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CONFIRMED_MAIN_COMMIT_SHA" == "$GITHUB_SHA" ]]
          if [[ "$REQUESTED_MODE" == 'inspect' ]]; then
            [[ "$CONFIRMED_NO_MONEY_OPERATION" == 'inspect-no-money' ]]
          else
            [[ "$CONFIRMED_NO_MONEY_OPERATION" == 'provision-trust-only-no-pilot' ]]
          fi

  apply-trust-only-operation:
    name: Validate keys and apply trust-only operation
    needs: validate-target
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: staging
    permissions:
      contents: read
    steps:
      - name: Check out exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate protected operational material without exposing it
        id: protected-inputs
        shell: bash
        env:
          ASSIGNMENT_PRIVATE_BASE64: ${{ secrets.TELEBIRR_ASSIGNMENT_SIGNER_PKCS8_BASE64 }}
          ASSIGNMENT_SIGNER_ID: ${{ vars.TELEBIRR_ASSIGNMENT_SIGNER_ID }}
          ASSIGNMENT_SIGNER_KEY_ID: ${{ vars.TELEBIRR_ASSIGNMENT_SIGNER_KEY_ID }}
          ASSIGNMENT_PUBLIC_BASE64: ${{ vars.TELEBIRR_ASSIGNMENT_SIGNER_PUBLIC_SPKI_BASE64 }}
          ASSIGNMENT_PUBLIC_SHA256: ${{ vars.TELEBIRR_ASSIGNMENT_SIGNER_PUBLIC_SPKI_SHA256 }}
          ASSIGNMENT_VALID_FROM: ${{ vars.TELEBIRR_ASSIGNMENT_SIGNER_VALID_FROM }}
          ASSIGNMENT_VALID_UNTIL: ${{ vars.TELEBIRR_ASSIGNMENT_SIGNER_VALID_UNTIL }}
          BRIDGE_PRIVATE_BASE64: ${{ secrets.TELEBIRR_BRIDGE_SERVER_SIGNER_PKCS8_BASE64 }}
          BRIDGE_KEY_ID: ${{ vars.TELEBIRR_BRIDGE_SERVER_SIGNER_KEY_ID }}
          BRIDGE_PUBLIC_BASE64: ${{ vars.TELEBIRR_BRIDGE_SERVER_SIGNER_PUBLIC_SPKI_BASE64 }}
          BRIDGE_PUBLIC_SHA256: ${{ vars.TELEBIRR_BRIDGE_SERVER_SIGNER_PUBLIC_SPKI_SHA256 }}
          BRIDGE_MANIFEST_BASE64: ${{ vars.TELEBIRR_DEVICE_BRIDGE_RUNTIME_MANIFEST_V1_BASE64 }}
          REFERENCE_OPENING_BASE64: ${{ secrets.TELEBIRR_REFERENCE_OPENING_KEY_V1_BASE64 }}
          REFERENCE_OPENING_KEY_ID: ${{ vars.TELEBIRR_REFERENCE_OPENING_KEY_ID }}
          ASSIGNMENT_RUNTIME_PASSWORD: ${{ secrets.TELEBIRR_ASSIGNMENT_BROKER_RUNTIME_PASSWORD }}
          DEVICE_STATE_RUNTIME_PASSWORD: ${{ secrets.TELEBIRR_DEVICE_STATE_RUNTIME_PASSWORD }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_CA_CERTIFICATE_PEM: ${{ secrets.SUPABASE_CA_CERTIFICATE_PEM }}
        run: |
          set -euo pipefail
          umask 077

          command -v psql >/dev/null
          command -v openssl >/dev/null
          command -v jq >/dev/null
          command -v xxd >/dev/null
          [[ "$ASSIGNMENT_SIGNER_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]
          [[ "$ASSIGNMENT_SIGNER_KEY_ID" =~ ^[A-Za-z0-9][A-Za-z0-9_-]{7,127}$ ]]
          [[ "$BRIDGE_KEY_ID" =~ ^[A-Za-z0-9][A-Za-z0-9_-]{7,127}$ ]]
          [[ "$ASSIGNMENT_SIGNER_KEY_ID" != "$BRIDGE_KEY_ID" ]]
          [[ "$ASSIGNMENT_PUBLIC_SHA256" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$BRIDGE_PUBLIC_SHA256" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$ASSIGNMENT_PUBLIC_SHA256" != "$BRIDGE_PUBLIC_SHA256" ]]
          [[ "$REFERENCE_OPENING_KEY_ID" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$ASSIGNMENT_VALID_FROM" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
          [[ "$ASSIGNMENT_VALID_UNTIL" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
          [[ "$ASSIGNMENT_RUNTIME_PASSWORD" =~ ^[0-9a-f]{64}$ ]]
          [[ "$DEVICE_STATE_RUNTIME_PASSWORD" =~ ^[0-9a-f]{64}$ ]]
          [[ "$ASSIGNMENT_RUNTIME_PASSWORD" != "$DEVICE_STATE_RUNTIME_PASSWORD" ]]
          [[ -n "$SUPABASE_DB_PASSWORD" && -n "$SUPABASE_CA_CERTIFICATE_PEM" ]]

          protected="$RUNNER_TEMP/fetanagent-telebirr-operational-trust"
          [[ ! -e "$protected" && ! -L "$protected" ]]
          install -d -m 0700 "$protected"
          printf '%s' "$ASSIGNMENT_PRIVATE_BASE64" | base64 --decode > "$protected/assignment.pkcs8.der"
          printf '%s' "$ASSIGNMENT_PUBLIC_BASE64" | base64 --decode > "$protected/assignment.spki.der"
          printf '%s' "$BRIDGE_PRIVATE_BASE64" | base64 --decode > "$protected/bridge.pkcs8.der"
          printf '%s' "$BRIDGE_PUBLIC_BASE64" | base64 --decode > "$protected/bridge.spki.der"
          printf '%s' "$BRIDGE_MANIFEST_BASE64" | base64 --decode > "$protected/bridge-manifest.json"
          printf '%s' "$REFERENCE_OPENING_BASE64" | base64 --decode > "$protected/reference-opening.json"
          printf '%s\n' "$SUPABASE_CA_CERTIFICATE_PEM" > "$protected/supabase-ca.crt"
          chmod 0600 "$protected"/*

          [[ "$(stat -c %s "$protected/assignment.spki.der")" -eq 91 ]]
          [[ "$(stat -c %s "$protected/bridge.spki.der")" -eq 91 ]]
          [[ "$(stat -c %s "$protected/assignment.pkcs8.der")" -le 256 ]]
          [[ "$(stat -c %s "$protected/bridge.pkcs8.der")" -le 256 ]]
          [[ "sha256:$(sha256sum "$protected/assignment.spki.der" | cut -d ' ' -f 1)" == "$ASSIGNMENT_PUBLIC_SHA256" ]]
          [[ "sha256:$(sha256sum "$protected/bridge.spki.der" | cut -d ' ' -f 1)" == "$BRIDGE_PUBLIC_SHA256" ]]

          for purpose in assignment bridge; do
            openssl pkey -inform DER -in "$protected/$purpose.pkcs8.der" -check -noout >/dev/null 2>&1
            openssl pkey -inform DER -in "$protected/$purpose.pkcs8.der" -pubout -outform DER \
              -out "$protected/$purpose.derived.spki.der" >/dev/null 2>&1
            cmp --silent "$protected/$purpose.spki.der" "$protected/$purpose.derived.spki.der"
            openssl pkey -pubin -inform DER -in "$protected/$purpose.spki.der" -text -noout 2>&1 \
              | grep -Eq 'ASN1 OID: (prime256v1|secp256r1)'
          done

          jq -e \
            --arg bridge_key_id "$BRIDGE_KEY_ID" \
            --arg bridge_digest "$BRIDGE_PUBLIC_SHA256" \
            --arg assignment_digest "$ASSIGNMENT_PUBLIC_SHA256" \
            'type == "object" and
             keys == ["assignmentSigningPublicKeySpkiSha256", "contractVersion", "providerCode", "serverSignerKeyId", "serverSigningPublicKeySpkiSha256"] and
             .contractVersion == 1 and
             .providerCode == "telebirr" and
             .serverSignerKeyId == $bridge_key_id and
             .serverSigningPublicKeySpkiSha256 == $bridge_digest and
             .assignmentSigningPublicKeySpkiSha256 == $assignment_digest' \
            "$protected/bridge-manifest.json" >/dev/null

          jq -e \
            --arg key_id "$REFERENCE_OPENING_KEY_ID" \
            'type == "object" and
             keys == ["contractVersion", "keyHex", "keyId", "keyVersion", "providerCode", "purpose"] and
             .contractVersion == 1 and
             .providerCode == "telebirr" and
             .purpose == "private_live_reference_opening" and
             .keyVersion == 1 and
             .keyId == $key_id and
             (.keyHex | test("^[0-9a-f]{64}$"))' \
            "$protected/reference-opening.json" >/dev/null
          reference_key_hex="$(jq -er '.keyHex' "$protected/reference-opening.json")"
          printf '%s' "$reference_key_hex" | xxd -r -p > "$protected/reference-opening.raw"
          unset reference_key_hex
          [[ "sha256:$(sha256sum "$protected/reference-opening.raw" | cut -d ' ' -f 1)" == "$REFERENCE_OPENING_KEY_ID" ]]
          openssl x509 -in "$protected/supabase-ca.crt" -noout -checkend 0 >/dev/null
          echo "protected=$protected" >> "$GITHUB_OUTPUT"

      - name: Inspect or idempotently provision only the assignment trust row
        shell: bash
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          ASSIGNMENT_SIGNER_ID: ${{ vars.TELEBIRR_ASSIGNMENT_SIGNER_ID }}
          ASSIGNMENT_SIGNER_KEY_ID: ${{ vars.TELEBIRR_ASSIGNMENT_SIGNER_KEY_ID }}
          ASSIGNMENT_PUBLIC_SHA256: ${{ vars.TELEBIRR_ASSIGNMENT_SIGNER_PUBLIC_SPKI_SHA256 }}
          ASSIGNMENT_VALID_FROM: ${{ vars.TELEBIRR_ASSIGNMENT_SIGNER_VALID_FROM }}
          ASSIGNMENT_VALID_UNTIL: ${{ vars.TELEBIRR_ASSIGNMENT_SIGNER_VALID_UNTIL }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGHOST: ${{ env.STAGING_POOLER_HOST }}
          PGPORT: '5432'
          PGDATABASE: postgres
          PGUSER: postgres.${{ env.STAGING_PROJECT_REF }}
          PGSSLMODE: verify-full
          PGSSLROOTCERT: ${{ steps.protected-inputs.outputs.protected }}/supabase-ca.crt
          PGCONNECT_TIMEOUT: '5'
          PGAPPNAME: fetanagent_telebirr_operational_trust
          PGSERVICEFILE: /dev/null
          PGPASSFILE: /dev/null
        run: |
          set -euo pipefail
          sql_file='infra/sql/staging-telebirr-operational-signer-inspect.sql'
          expected_operation='inspect_only'
          if [[ "$REQUESTED_MODE" == 'provision' ]]; then
            sql_file='infra/sql/staging-telebirr-operational-signer-provision.sql'
            expected_operation='trust_only'
          fi

          result="$(psql -X --quiet --tuples-only --no-align \
            --set=assignment_signer_id="$ASSIGNMENT_SIGNER_ID" \
            --set=assignment_signer_key_id="$ASSIGNMENT_SIGNER_KEY_ID" \
            --set=assignment_signer_public_spki_sha256="$ASSIGNMENT_PUBLIC_SHA256" \
            --set=assignment_signer_valid_from="$ASSIGNMENT_VALID_FROM" \
            --set=assignment_signer_valid_until="$ASSIGNMENT_VALID_UNTIL" \
            --file="$sql_file")"
          jq -e \
            --arg operation "$expected_operation" \
            'type == "object" and
             .schemaVersion == 1 and
             .operation == $operation and
             .assignmentSigner == "active_unrevoked" and
             .financialFeatures == "disabled" and
             .openPilot == "absent"' <<<"$result" >/dev/null
          echo 'TeleBirr assignment trust is active and unrevoked; financial features remain disabled and no pilot exists.' >> "$GITHUB_STEP_SUMMARY"

      - name: Remove runner-local protected material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          protected="$RUNNER_TEMP/fetanagent-telebirr-operational-trust"
          if [[ -e "$protected" || -L "$protected" ]]; then
            [[ -d "$protected" && ! -L "$protected" ]]
            [[ "$(realpath -- "$protected")" == "$protected" ]]
            rm -f -- "$protected"/*
            rmdir -- "$protected"
          fi
