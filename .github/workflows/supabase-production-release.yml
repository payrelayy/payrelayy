name: Supabase production release

on:
  workflow_dispatch:
    inputs:
      confirm_production_project_ref:
        description: Type the exact production project ref to confirm the target
        required: true
        type: string
      confirm_main_commit_sha:
        description: Type the exact full reviewed main commit SHA
        required: true
        type: string
      confirm_production_apply:
        description: Type APPLY PRODUCTION MIGRATIONS to authorize this release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-production-release
  cancel-in-progress: false

env:
  STAGING_PROJECT_REF: spzpiyxheappsfyswewl
  PRODUCTION_PROJECT_REF: xzztugbgtulptnbpoelr
  SUPABASE_CLI_VERSION: 2.113.0

jobs:
  validate-target:
    name: Validate production target
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      CONFIRMED_PRODUCTION_PROJECT_REF: ${{ inputs.confirm_production_project_ref }}
      CONFIRMED_MAIN_COMMIT_SHA: ${{ inputs.confirm_main_commit_sha }}
      CONFIRMED_PRODUCTION_APPLY: ${{ inputs.confirm_production_apply }}
    steps:
      - name: Require main, exact production target, and explicit apply authorization
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo '::error::This workflow may run only from the main branch.'
            exit 1
          fi

          if [[ "$STAGING_PROJECT_REF" == "$PRODUCTION_PROJECT_REF" ]]; then
            echo '::error::The configured staging and production refs must be different.'
            exit 1
          fi

          if [[ "$CONFIRMED_PRODUCTION_PROJECT_REF" != "$PRODUCTION_PROJECT_REF" ]]; then
            echo '::error::The production project confirmation does not match the configured production ref.'
            exit 1
          fi

          if [[ "$CONFIRMED_PRODUCTION_PROJECT_REF" == "$STAGING_PROJECT_REF" ]]; then
            echo '::error::The staging project is never an allowed target.'
            exit 1
          fi

          if [[ ! "$CONFIRMED_MAIN_COMMIT_SHA" =~ ^[0-9a-f]{40}$ || "$CONFIRMED_MAIN_COMMIT_SHA" != "$GITHUB_SHA" ]]; then
            echo '::error::The confirmed commit does not match the exact workflow commit.'
            exit 1
          fi

          if [[ "$CONFIRMED_PRODUCTION_APPLY" != 'APPLY PRODUCTION MIGRATIONS' ]]; then
            echo '::error::The explicit production apply phrase does not match.'
            exit 1
          fi

  production-migrations:
    name: Apply production migrations
    needs: validate-target
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact checked-out commit
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo '::error::The checked-out source does not match the exact workflow commit.'
            exit 1
          fi

      - name: Set up the pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: 2.113.0

      - name: Verify tooling and production credentials
        shell: bash
        env:
          SUPABASE_HOME: ${{ runner.temp }}/fetanagent-supabase-home
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ "$(supabase --version)" != "$SUPABASE_CLI_VERSION" ]]; then
            echo '::error::The installed Supabase CLI version does not match the pinned version.'
            exit 1
          fi

          if [[ -z "$SUPABASE_ACCESS_TOKEN" || -z "$SUPABASE_DB_PASSWORD" ]]; then
            echo '::error::The production environment is missing a required Supabase credential.'
            exit 1
          fi

      - name: Initialize the local Supabase project if needed
        shell: bash
        env:
          SUPABASE_HOME: ${{ runner.temp }}/fetanagent-supabase-home
        run: |
          set -euo pipefail

          if [[ ! -f 'supabase/config.toml' && ! -f 'supabase/config.json' ]]; then
            supabase init
          fi

      - name: Link only the production project
        shell: bash
        env:
          SUPABASE_HOME: ${{ runner.temp }}/fetanagent-supabase-home
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          supabase link --project-ref "$PRODUCTION_PROJECT_REF"

      - name: Verify the linked production target
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f 'supabase/.temp/project-ref' ]]; then
            echo '::error::The pinned Supabase CLI did not create its linked-project state file.'
            exit 1
          fi

          linked_project_ref="$(tr -d '\r\n' < 'supabase/.temp/project-ref')"

          if [[ "$linked_project_ref" != "$PRODUCTION_PROJECT_REF" || "$linked_project_ref" == "$STAGING_PROJECT_REF" ]]; then
            echo '::error::The linked-project guard rejected the production migration target.'
            exit 1
          fi

      - name: Apply canonical migrations to production
        shell: bash
        env:
          SUPABASE_HOME: ${{ runner.temp }}/fetanagent-supabase-home
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail

          linked_project_ref="$(tr -d '\r\n' < 'supabase/.temp/project-ref')"

          if [[ "$linked_project_ref" != "$PRODUCTION_PROJECT_REF" || "$linked_project_ref" == "$STAGING_PROJECT_REF" ]]; then
            echo '::error::The linked-project guard rejected the production migration target.'
            exit 1
          fi

          supabase migration list --linked
          supabase db push --linked --yes
          supabase migration list --linked
