name: TeleBirr device bridge image smoke

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  telebirr-device-bridge-image-smoke:
    name: Build and smoke database-free TeleBirr device bridge
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and inspect the internal bridge image
        shell: bash
        env:
          BRIDGE_IMAGE: fetanagent-telebirr-device-bridge:ci
        run: |
          set -euo pipefail
          docker build --pull=false --target telebirr-device-bridge \
            --build-arg "VCS_REF=$GITHUB_SHA" \
            --tag "$BRIDGE_IMAGE" .

          test "$(docker image inspect "$BRIDGE_IMAGE" --format '{{.Config.User}}')" = \
            '10001:10001'
          test "$(docker image inspect "$BRIDGE_IMAGE" --format '{{json .Config.Cmd}}')" = \
            '["node","apps/telebirr-device-bridge/dist/telebirr-device-bridge-main.js"]'
          test "$(docker image inspect "$BRIDGE_IMAGE" --format '{{json .Config.ExposedPorts}}')" = \
            'null'
          test "$(docker image inspect "$BRIDGE_IMAGE" \
            --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = \
            "$GITHUB_SHA"
          image_environment="$(
            docker image inspect "$BRIDGE_IMAGE" --format '{{range .Config.Env}}{{println .}}{{end}}'
          )"
          grep -Fx 'NODE_ENV=production' <<<"$image_environment"
          for variable in \
            HTTP_PROXY http_proxy HTTPS_PROXY https_proxy FTP_PROXY ftp_proxy ALL_PROXY all_proxy
          do
            grep -Fx "$variable=" <<<"$image_environment"
          done

      - name: Verify the real entrypoint fails closed without guarded key files
        shell: bash
        env:
          BRIDGE_IMAGE: fetanagent-telebirr-device-bridge:ci
        run: |
          set -euo pipefail
          set +e
          startup_output="$({
            docker run --rm --network none --read-only \
              --tmpfs /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777 \
              --cap-drop ALL --security-opt no-new-privileges \
              --env FINANCIAL_ACTIONS_MODE=dry_run \
              --env INTERNAL_TELEBIRR_DEVICE_BRIDGE_ENABLED=true \
              --env TELEBIRR_DEVICE_BRIDGE_NO_MONEY_PILOT_ENABLED=true \
              --env TELEBIRR_DEVICE_BRIDGE_DEPLOYMENT_TARGET=staging \
              --env TELEBIRR_DEVICE_BRIDGE_LISTEN_HOST=0.0.0.0 \
              --env TELEBIRR_DEVICE_BRIDGE_LISTEN_PORT=8084 \
              --env TELEBIRR_DEVICE_BRIDGE_SERVER_SIGNER_PRIVATE_KEY_FILE=/run/secrets/telebirr_device_bridge_server_signer.pkcs8.der \
              --env TELEBIRR_DEVICE_BRIDGE_ASSIGNMENT_SIGNER_PUBLIC_KEY_FILE=/run/configs/telebirr_device_bridge_assignment_signer.spki.der \
              --env TELEBIRR_DEVICE_BRIDGE_RUNTIME_MANIFEST_FILE=/run/configs/telebirr_device_bridge_runtime_manifest.v1.json \
              "$BRIDGE_IMAGE"
          } 2>&1)"
          startup_status=$?
          set -e

          test "$startup_status" -eq 1
          grep -F "event: 'startup_failed'" <<<"$startup_output"
          grep -F 'detailsRedacted: true' <<<"$startup_output"
          ! grep -Eiq 'private.?key|database.?url|service.?role|credential|manifest' \
            <<<"$startup_output"

      - name: Verify the fixed shared-socket directories and dependency boundary
        shell: bash
        env:
          BRIDGE_IMAGE: fetanagent-telebirr-device-bridge:ci
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            "$BRIDGE_IMAGE" node --input-type=module --eval "
              import { existsSync, lstatSync, readFileSync } from 'node:fs';
              for (const path of [
                '/run/fetanagent-telebirr-assignment-broker',
                '/run/fetanagent-telebirr-device-state',
              ]) {
                const stat = lstatSync(path);
                if (!stat.isDirectory() || stat.isSymbolicLink()) process.exit(1);
                if (stat.uid !== 10001 || stat.gid !== 10001) process.exit(1);
                if ((stat.mode & 0o777) !== 0o700) process.exit(1);
              }
              if (existsSync('/workspace/apps/telebirr-device-bridge/node_modules/pg')) {
                process.exit(1);
              }
              if (existsSync('/workspace/node_modules/pg')) process.exit(1);
              const manifest = readFileSync(
                '/workspace/apps/telebirr-device-bridge/package.json',
                'utf8',
              );
              if (/\"(?:pg|@supabase\/[^\" ]+)\"/iu.test(manifest)) process.exit(1);
            "
