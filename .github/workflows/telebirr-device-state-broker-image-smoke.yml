name: TeleBirr device-state broker image smoke

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  telebirr-device-state-broker-image-smoke:
    name: Build and smoke private TeleBirr device-state broker
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build and inspect the private device-state image
        shell: bash
        env:
          BROKER_IMAGE: fetanagent-telebirr-device-state-broker:ci
        run: |
          set -euo pipefail
          docker build --pull=false --target telebirr-device-state-broker \
            --build-arg "VCS_REF=$GITHUB_SHA" \
            --tag "$BROKER_IMAGE" .

          test "$(docker image inspect "$BROKER_IMAGE" --format '{{.Config.User}}')" = \
            '10001:10001'
          test "$(docker image inspect "$BROKER_IMAGE" --format '{{json .Config.Cmd}}')" = \
            '["node","apps/telebirr-device-state-broker/dist/telebirr-device-state-broker-main.js"]'
          test "$(docker image inspect "$BROKER_IMAGE" --format '{{json .Config.ExposedPorts}}')" = \
            'null'
          test "$(docker image inspect "$BROKER_IMAGE" \
            --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = \
            "$GITHUB_SHA"
          docker image inspect "$BROKER_IMAGE" --format '{{range .Config.Env}}{{println .}}{{end}}' \
            | grep -Fx 'NODE_ENV=production'

      - name: Verify the real entrypoint fails closed without guarded files
        shell: bash
        env:
          BROKER_IMAGE: fetanagent-telebirr-device-state-broker:ci
        run: |
          set -euo pipefail
          set +e
          startup_output="$({
            docker run --rm --network none --read-only \
              --tmpfs /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777 \
              --cap-drop ALL --security-opt no-new-privileges \
              "$BROKER_IMAGE"
          } 2>&1)"
          startup_status=$?
          set -e

          test "$startup_status" -eq 1
          grep -F "event: 'startup_failed'" <<<"$startup_output"
          grep -F 'detailsRedacted: true' <<<"$startup_output"
          ! grep -Eiq 'password|database.?url|service.?role|certificate' <<<"$startup_output"

      - name: Verify the image contains only the fixed private socket directory
        shell: bash
        env:
          BROKER_IMAGE: fetanagent-telebirr-device-state-broker:ci
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            "$BROKER_IMAGE" node --input-type=module --eval "
              import { lstatSync } from 'node:fs';
              const path = '/run/fetanagent-telebirr-device-state';
              const stat = lstatSync(path);
              if (!stat.isDirectory() || stat.isSymbolicLink()) process.exit(1);
              if (stat.uid !== 10001 || stat.gid !== 10001) process.exit(1);
              if ((stat.mode & 0o777) !== 0o700) process.exit(1);
            "
