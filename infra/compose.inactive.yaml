name: payreplayy-inactive

# Stage 14A is an intentionally inactive, API-only container contract. It has no host port,
# credential, bot, worker, executor, reverse proxy, or public ingress. Do not run it as a service.
services:
  api:
    profiles: [inactive]
    build:
      context: ..
      dockerfile: Dockerfile
      target: api
    init: true
    restart: 'no'
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      FINANCIAL_ACTIONS_MODE: dry_run
      API_HOST: 0.0.0.0
      API_PORT: '3000'
      INTERNAL_POSTGRES_RUNTIME_ENABLED: 'false'
      INTERNAL_TELEGRAM_INGRESS_ENABLED: 'false'
      INTERNAL_TELEGRAM_PRIVATE_INGRESS_RUNTIME_ENABLED: 'false'
      INTERNAL_TELEGRAM_ACTION_CAPABILITY_CONTRACT_ENABLED: 'false'
    networks:
      - payreplayy_internal
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

networks:
  payreplayy_internal:
    internal: true
