name: fetanagent-production-trusted-telebirr-verifier

# This production verifier is a separate, explicit-profile-only, disabled stack. The checked-in
# lifecycle can stage and inspect it but has no activation route. All process gates remain fixed
# off until a future atomic database/host activation design is separately reviewed.
services:
  trusted-telebirr-verifier:
    profiles: [production-trusted-telebirr-verifier]
    platform: linux/amd64
    image: ${FETANAGENT_TRUSTED_TELEBIRR_VERIFIER_IMAGE_ID:?set the release-recorded sha256 image ID}
    pull_policy: never
    init: true
    user: '10001:10001'
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.50
    stop_signal: SIGTERM
    stop_grace_period: 20s
    deploy:
      replicas: 1
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    environment:
      NODE_ENV: production
      FINANCIAL_ACTIONS_MODE: dry_run
      INTERNAL_TRUSTED_TELEBIRR_VERIFIER_ENABLED: 'false'
      TRUSTED_TELEBIRR_PRIVATE_LIVE_PILOT_ENABLED: 'false'
      TRUSTED_TELEBIRR_VERIFIER_DEPLOYMENT_TARGET: production
      TRUSTED_TELEBIRR_VERIFIER_DATABASE_URL_FILE: /run/secrets/trusted_telebirr_verifier_database_url
      TRUSTED_TELEBIRR_VERIFIER_PIN_MANIFEST_FILE: /run/configs/trusted_telebirr_verifier_pins.v1.json
      NODE_EXTRA_CA_CERTS: /run/configs/supabase_ca_certificate
      HTTP_PROXY: ''
      http_proxy: ''
      HTTPS_PROXY: ''
      https_proxy: ''
      NO_PROXY: ''
      no_proxy: ''
      FTP_PROXY: ''
      ftp_proxy: ''
      ALL_PROXY: ''
      all_proxy: ''
    secrets:
      - source: trusted_telebirr_verifier_database_url
        target: trusted_telebirr_verifier_database_url
        uid: '10001'
        gid: '10001'
        mode: 0400
    configs:
      - source: trusted_telebirr_verifier_pins
        target: /run/configs/trusted_telebirr_verifier_pins.v1.json
        uid: '10001'
        gid: '10001'
        mode: 0444
      - source: trusted_telebirr_verifier_supabase_ca
        target: /run/configs/supabase_ca_certificate
        uid: '10001'
        gid: '10001'
        mode: 0444
    networks:
      - trusted_telebirr_verifier_database_egress
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8091/readyz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 4

secrets:
  trusted_telebirr_verifier_database_url:
    file: ${FETANAGENT_TRUSTED_TELEBIRR_VERIFIER_DATABASE_URL_SECRET_FILE:?set the release-bound short-lived runtime URL}

configs:
  trusted_telebirr_verifier_pins:
    file: ${FETANAGENT_TRUSTED_TELEBIRR_VERIFIER_PIN_MANIFEST_CONFIG_FILE:?set the digest-attested production pin manifest}
  trusted_telebirr_verifier_supabase_ca:
    file: ${FETANAGENT_TRUSTED_TELEBIRR_VERIFIER_SUPABASE_CA_CONFIG_FILE:?set the reviewed Supabase CA}

networks:
  trusted_telebirr_verifier_database_egress:
    driver: bridge
