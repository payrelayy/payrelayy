# Explicit production transport overlay for the paired Windows one-use execution lane.
# The normal production composition does not load this file. It adds no provider credential and
# the bridge itself cannot call KemerBet or move money; it only signs/validates the database-backed
# assignment, one-use fence, result, and reconciliation protocol.
services:
  production-companion-device-bridge:
    environment:
      INTERNAL_COMPANION_EXECUTION_V2_ENABLED: 'true'
      COMPANION_DEVICE_BRIDGE_EXECUTION_SIGNER_PRIVATE_KEY_FILE: /run/secrets/companion_execution_signer.pkcs8.der
    secrets:
      - source: companion_device_bridge_execution_signer
        target: companion_execution_signer.pkcs8.der
        uid: '10001'
        gid: '10001'
        mode: 0400
    configs:
      - source: companion_device_bridge_runtime_manifest_execution_v3
        target: /run/configs/companion_device_bridge_runtime_manifest.v2.json
        uid: '10001'
        gid: '10001'
        mode: 0444

configs:
  companion_device_bridge_runtime_manifest_execution_v3:
    file: ${FETANAGENT_PRODUCTION_SECRET_DIR:?set the protected production secret directory}/companion-bridge-runtime-manifest.v3.json

secrets:
  companion_device_bridge_execution_signer:
    file: /etc/fetanagent/companion-execution-secrets/production-execution-signer.pkcs8.der
