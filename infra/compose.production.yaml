      PLAYER_ACTION_DEPLOYMENT_TARGET: production
      INTERNAL_TELEGRAM_ACTION_CHANNEL_ENABLED: 'true'
      INTERNAL_TELEGRAM_ACTION_CAPABILITY_CONTRACT_ENABLED: 'true'
      PLAYER_ACTION_DATABASE_URL_FILE: /run/secrets/player_action_database_url
      BOT_TO_API_ACTION_HMAC_SECRET_FILE: /run/secrets/api_player_action_transport_hmac
      API_TELEGRAM_PLAYER_ACTION_PAYLOAD_HMAC_SECRET_FILE: /run/secrets/api_player_action_payload_hmac
      API_TELEGRAM_CAPABILITY_HMAC_SECRET_FILE: /run/secrets/api_player_action_capability_hmac
      API_TELEGRAM_ACTION_SEMANTIC_HMAC_SECRET_FILE: /run/secrets/api_player_action_semantic_hmac
      CBE_DEPOSIT_REFERENCE_ENCRYPTION_SECRET_FILE: /run/secrets/cbe_deposit_reference_encryption_key
      CBE_DEPOSIT_REFERENCE_FINGERPRINT_SECRET_FILE: /run/secrets/cbe_deposit_reference_fingerprint_key
      CBE_DEPOSIT_REFERENCE_KEY_PROFILE_FILE: /etc/fetanagent/cbe-deposit-reference-key-profile.v1.json
      DEPOSIT_PROOF_REFERENCE_ENCRYPTION_MASTER_SECRET_FILE: /run/secrets/deposit_proof_reference_encryption_master
      DEPOSIT_PROOF_REFERENCE_FINGERPRINT_MASTER_SECRET_FILE: /run/secrets/deposit_proof_reference_fingerprint_master
      DEPOSIT_PROOF_REFERENCE_PROFILE_FILE: /etc/fetanagent/deposit-proof-reference-profile.v2.json
      INTERNAL_TELEGRAM_BETA_ADMISSION_PREFLIGHT_ENABLED: 'false'
      INTERNAL_POSTGRES_RUNTIME_ENABLED: 'false'
      INTERNAL_NONCE_RETENTION_RUNTIME_ENABLED: 'false'
      TELEGRAM_BOT_ENABLED: 'false'
      TELEGRAM_BETA_ADMISSION_ENABLED: 'false'
      INTERNAL_TELEGRAM_INGRESS_ENABLED: 'false'
      INTERNAL_TELEGRAM_PRIVATE_INGRESS_RUNTIME_ENABLED: 'false'
      KEMERBET_EXECUTOR_ENABLED: 'false'
      KEMERBET_FINAL_ACTION_ENABLED: 'false'
    secrets:
      - source: player_action_database_url
        target: player_action_database_url
        uid: '10001'
        gid: '10001'
        mode: 0400
      - source: api_player_action_transport_hmac
        target: api_player_action_transport_hmac
        uid: '10001'
        gid: '10001'
        mode: 0400
      - source: api_player_action_payload_hmac
        target: api_player_action_payload_hmac
        uid: '10001'
        gid: '10001'
        mode: 0400
      - source: api_player_action_capability_hmac
        target: api_player_action_capability_hmac
        uid: '10001'
        gid: '10001'
        mode: 0400
      - source: api_player_action_semantic_hmac
        target: api_player_action_semantic_hmac
        uid: '10001'
        gid: '10001'
        mode: 0400
      - source: cbe_deposit_reference_encryption_key
        target: cbe_deposit_reference_encryption_key
        uid: '10001'
        gid: '10001'
        mode: 0400
      - source: cbe_deposit_reference_fingerprint_key
        target: cbe_deposit_reference_fingerprint_key
        uid: '10001'
        gid: '10001'
        mode: 0400
      - source: deposit_proof_reference_encryption_master
        target: deposit_proof_reference_encryption_master
        uid: '10001'
        gid: '10001'
        mode: 0400
      - source: deposit_proof_reference_fingerprint_master
        target: deposit_proof_reference_fingerprint_master
        uid: '10001'
        gid: '10001'
        mode: 0400
    configs:
      - source: supabase_ca_certificate
        target: /run/configs/supabase_ca_certificate
        uid: '10001'
        gid: '10001'
        mode: 0444
      - source: cbe_deposit_reference_key_profile
        target: /etc/fetanagent/cbe-deposit-reference-key-profile.v1.json
        uid: '10001'
        gid: '10001'
        mode: 0444
      - source: deposit_proof_reference_profile
        target: /etc/fetanagent/deposit-proof-reference-profile.v2.json
        uid: '10001'
        gid: '10001'
        mode: 0444
    networks:
      - private_application
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 4

  beta-admission:
    <<: *runtime-defaults
    image: fetanagent-beta-admission:${FETANAGENT_IMAGE_TAG:?set the exact commit-derived image tag}
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      FINANCIAL_ACTIONS_MODE: dry_run
      BETA_ADMISSION_HOST: 0.0.0.0
      BETA_ADMISSION_PORT: '3001'
      BETA_ADMISSION_DEPLOYMENT_TARGET: production
      NODE_EXTRA_CA_CERTS: /run/configs/supabase_ca_certificate
      INTERNAL_TELEGRAM_BETA_ADMISSION_RUNTIME_ENABLED: 'true'
      BETA_ADMISSION_DATABASE_URL_FILE: /run/secrets/beta_admission_database_url
      BOT_TO_BETA_ADMISSION_HMAC_SECRET_FILE: /run/secrets/beta_admission_bot_transport_hmac
      BETA_ADMISSION_PAYLOAD_HMAC_SECRET_FILE: /run/secrets/beta_admission_payload_hmac
      INTERNAL_TELEGRAM_BETA_ADMISSION_PREFLIGHT_ENABLED: 'false'
      INTERNAL_POSTGRES_RUNTIME_ENABLED: 'false'
      INTERNAL_NONCE_RETENTION_RUNTIME_ENABLED: 'false'
      TELEGRAM_BOT_ENABLED: 'false'
      TELEGRAM_BETA_ADMISSION_ENABLED: 'false'
      INTERNAL_TELEGRAM_INGRESS_ENABLED: 'false'
      INTERNAL_TELEGRAM_PRIVATE_INGRESS_RUNTIME_ENABLED: 'false'
      INTERNAL_TELEGRAM_ACTION_CHANNEL_ENABLED: 'false'
      INTERNAL_TELEGRAM_ACTION_CAPABILITY_CONTRACT_ENABLED: 'false'
      INTERNAL_TELEGRAM_PLAYER_ACTION_RUNTIME_ENABLED: 'false'
      KEMERBET_EXECUTOR_ENABLED: 'false'
      KEMERBET_FINAL_ACTION_ENABLED: 'false'
    secrets:
      - source: beta_admission_database_url
        target: beta_admission_database_url
        uid: '10001'
        gid: '10001'
        mode: 0400
      - source: beta_admission_bot_transport_hmac
        target: beta_admission_bot_transport_hmac
        uid: '10001'
        gid: '10001'
        mode: 0400
      - source: beta_admission_payload_hmac
        target: beta_admission_payload_hmac
        uid: '10001'
        gid: '10001'
        mode: 0400
    configs:
      - source: supabase_ca_certificate
        target: /run/configs/supabase_ca_certificate
        uid: '10001'
        gid: '10001'
        mode: 0444
    networks:
      - private_application
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3001/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 4

  bot:
    <<: *runtime-defaults
    image: fetanagent-bot:${FETANAGENT_IMAGE_TAG:?set the exact commit-derived image tag}
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      FINANCIAL_ACTIONS_MODE: dry_run
      TELEGRAM_BOT_ENABLED: 'true'
      TELEGRAM_BETA_ADMISSION_ENABLED: 'true'
      BOT_TO_BETA_ADMISSION_BASE_URL: http://beta-admission:3001/
      INTERNAL_TELEGRAM_ACTION_CHANNEL_ENABLED: 'true'
      BOT_TO_API_ACTION_BASE_URL: http://api:3000/
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      BOT_TO_BETA_ADMISSION_HMAC_SECRET_FILE: /run/secrets/bot_beta_admission_transport_hmac
      BOT_TO_API_ACTION_HMAC_SECRET_FILE: /run/secrets/bot_player_action_transport_hmac
      INTERNAL_TELEGRAM_BETA_ADMISSION_PREFLIGHT_ENABLED: 'false'
      INTERNAL_POSTGRES_RUNTIME_ENABLED: 'false'
      INTERNAL_NONCE_RETENTION_RUNTIME_ENABLED: 'false'
      INTERNAL_TELEGRAM_INGRESS_ENABLED: 'false'
      INTERNAL_TELEGRAM_PRIVATE_INGRESS_RUNTIME_ENABLED: 'false'
      INTERNAL_TELEGRAM_ACTION_CAPABILITY_CONTRACT_ENABLED: 'false'
      INTERNAL_TELEGRAM_PLAYER_ACTION_RUNTIME_ENABLED: 'false'
      KEMERBET_EXECUTOR_ENABLED: 'false'
      KEMERBET_FINAL_ACTION_ENABLED: 'false'
    secrets:
      - source: telegram_bot_token
        target: telegram_bot_token
        uid: '10001'
        gid: '10001'
        mode: 0400
      - source: bot_beta_admission_transport_hmac
        target: bot_beta_admission_transport_hmac
        uid: '10001'
        gid: '10001'
        mode: 0400
      - source: bot_player_action_transport_hmac
        target: bot_player_action_transport_hmac
        uid: '10001'
        gid: '10001'
        mode: 0400
    networks:
      - private_application
    depends_on:
      api:
        condition: service_healthy
        restart: true
      beta-admission:
        condition: service_healthy
        restart: true

  telebirr-assignment-broker:
    <<: *runtime-defaults
    image: fetanagent-telebirr-assignment-broker:${FETANAGENT_IMAGE_TAG:?set the exact commit-derived image tag}
    pids_limit: 96
    mem_limit: 192m
    environment:
      NODE_ENV: production
      FINANCIAL_ACTIONS_MODE: dry_run
      INTERNAL_TELEBIRR_ASSIGNMENT_BROKER_ENABLED: 'true'
      TELEBIRR_ASSIGNMENT_BROKER_NO_MONEY_PILOT_ENABLED: 'true'
      TELEBIRR_ASSIGNMENT_BROKER_ENROLLMENT_ONLY_ENABLED: 'true'
      TELEBIRR_ASSIGNMENT_BROKER_DEPLOYMENT_TARGET: production
      KEMERBET_EXECUTOR_ENABLED: 'false'
      KEMERBET_FINAL_ACTION_ENABLED: 'false'
    network_mode: none
    volumes:
      - type: volume
        source: telebirr_assignment_socket
        target: /run/fetanagent-telebirr-assignment-broker
        volume:
          nocopy: false
    healthcheck:
      test:
        - CMD
        - node
        - --input-type=module
        - --eval
        - "import{lstatSync,realpathSync}from'node:fs';import{connect}from'node:net';const r='/run/fetanagent-telebirr-assignment-broker',p=r+'/assignment.sock',d=lstatSync(r),s=lstatSync(p);if(!d.isDirectory()||d.isSymbolicLink()||d.uid!==10001||(d.mode&0o7777)!==0o700||realpathSync(r)!==r||!s.isSocket()||s.isSymbolicLink()||s.uid!==10001||(s.mode&0o7777)!==0o600||realpathSync(p)!==p)process.exit(1);const c=connect({path:p}),f=()=>process.exit(1);c.setTimeout(1000,f);c.once('error',f);c.once('connect',()=>{c.destroy();process.exit(0)})"
      interval: 15s
      timeout: 3s
      start_period: 30s
      retries: 4

  telebirr-device-state-broker:
    <<: *runtime-defaults
    image: fetanagent-telebirr-device-state-broker:${FETANAGENT_IMAGE_TAG:?set the exact commit-derived image tag}
    pids_limit: 96
    mem_limit: 192m
    environment:
      NODE_ENV: production
      FINANCIAL_ACTIONS_MODE: dry_run
      INTERNAL_TELEBIRR_DEVICE_STATE_BROKER_ENABLED: 'true'
      TELEBIRR_DEVICE_STATE_BROKER_NO_MONEY_PILOT_ENABLED: 'true'
      TELEBIRR_DEVICE_STATE_BROKER_DEPLOYMENT_TARGET: production
      TELEBIRR_DEVICE_STATE_BROKER_DATABASE_URL_FILE: /run/secrets/telebirr_device_state_broker_database_url
      NODE_EXTRA_CA_CERTS: /run/configs/supabase_ca_certificate
      KEMERBET_EXECUTOR_ENABLED: 'false'
      KEMERBET_FINAL_ACTION_ENABLED: 'false'
    volumes:
      - type: volume
        source: telebirr_device_state_socket
        target: /run/fetanagent-telebirr-device-state
        volume:
          nocopy: false
    secrets:
      - source: telebirr_device_state_broker_database_url
        target: telebirr_device_state_broker_database_url
        uid: '10001'
        gid: '10001'
        mode: 0400
    configs:
      - source: supabase_ca_certificate
        target: /run/configs/supabase_ca_certificate
        uid: '10001'
        gid: '10001'
        mode: 0444
    networks:
      - telebirr_device_state_database_egress
    healthcheck:
      test:
        - CMD
        - node
        - --input-type=module
        - --eval
        - "import{lstatSync,realpathSync}from'node:fs';import{connect}from'node:net';const r='/run/fetanagent-telebirr-device-state',p=r+'/state.sock',d=lstatSync(r),s=lstatSync(p);if(!d.isDirectory()||d.isSymbolicLink()||d.uid!==10001||(d.mode&0o7777)!==0o700||realpathSync(r)!==r||!s.isSocket()||s.isSymbolicLink()||s.uid!==10001||(s.mode&0o7777)!==0o600||realpathSync(p)!==p)process.exit(1);const c=connect({path:p}),f=()=>process.exit(1);c.setTimeout(1000,f);c.once('error',f);c.once('connect',()=>{c.destroy();process.exit(0)})"
      interval: 15s
      timeout: 3s
      start_period: 30s
      retries: 4

  telebirr-device-bridge:
    <<: *runtime-defaults
    image: fetanagent-telebirr-device-bridge:${FETANAGENT_IMAGE_TAG:?set the exact commit-derived image tag}
    pids_limit: 96
    mem_limit: 192m
    environment:
      NODE_ENV: production
      HTTP_PROXY: ''
      http_proxy: ''
      HTTPS_PROXY: ''
      https_proxy: ''
      FTP_PROXY: ''
      ftp_proxy: ''
      ALL_PROXY: ''
      all_proxy: ''
      FINANCIAL_ACTIONS_MODE: dry_run
      INTERNAL_TELEBIRR_DEVICE_BRIDGE_ENABLED: 'true'
      TELEBIRR_DEVICE_BRIDGE_NO_MONEY_PILOT_ENABLED: 'true'
      TELEBIRR_DEVICE_BRIDGE_DEPLOYMENT_TARGET: production
      TELEBIRR_DEVICE_BRIDGE_LISTEN_HOST: 0.0.0.0
      TELEBIRR_DEVICE_BRIDGE_LISTEN_PORT: '8084'
      TELEBIRR_DEVICE_BRIDGE_SERVER_SIGNER_PRIVATE_KEY_FILE: /run/secrets/telebirr_device_bridge_server_signer.pkcs8.der
      TELEBIRR_DEVICE_BRIDGE_ASSIGNMENT_SIGNER_PUBLIC_KEY_FILE: /run/configs/telebirr_device_bridge_assignment_signer.spki.der
      TELEBIRR_DEVICE_BRIDGE_RUNTIME_MANIFEST_FILE: /run/configs/telebirr_device_bridge_runtime_manifest.v1.json
      KEMERBET_EXECUTOR_ENABLED: 'false'
      KEMERBET_FINAL_ACTION_ENABLED: 'false'
    volumes:
      - type: volume
        source: telebirr_assignment_socket
        target: /run/fetanagent-telebirr-assignment-broker
        read_only: true
        volume:
          nocopy: false
      - type: volume
        source: telebirr_device_state_socket
        target: /run/fetanagent-telebirr-device-state
        read_only: true
        volume:
          nocopy: false
    secrets:
      - source: telebirr_device_bridge_server_signer
        target: telebirr_device_bridge_server_signer.pkcs8.der
        uid: '10001'
        gid: '10001'
        mode: 0400
    configs:
      - source: telebirr_device_bridge_assignment_signer
        target: /run/configs/telebirr_device_bridge_assignment_signer.spki.der
        uid: '10001'
        gid: '10001'
        mode: 0444
      - source: telebirr_device_bridge_runtime_manifest
        target: /run/configs/telebirr_device_bridge_runtime_manifest.v1.json
        uid: '10001'
        gid: '10001'
        mode: 0444
    networks:
      telebirr_device_ingress:
        aliases:
          - telebirr-device-bridge
    depends_on:
      telebirr-assignment-broker:
        condition: service_healthy
        restart: true
      telebirr-device-state-broker:
        condition: service_healthy
        restart: true
    healthcheck:
      test:
        - CMD
        - node
        - --input-type=module
        - --eval
        - "import{lstatSync,realpathSync}from'node:fs';import{connect}from'node:net';for(const[r,n]of[['/run/fetanagent-telebirr-assignment-broker','assignment.sock'],['/run/fetanagent-telebirr-device-state','state.sock']]){const p=r+'/'+n,d=lstatSync(r),s=lstatSync(p);if(!d.isDirectory()||d.isSymbolicLink()||d.uid!==10001||(d.mode&0o7777)!==0o700||realpathSync(r)!==r||!s.isSocket()||s.isSymbolicLink()||s.uid!==10001||(s.mode&0o7777)!==0o600||realpathSync(p)!==p)process.exit(1)}const c=connect({host:'127.0.0.1',port:8084}),f=()=>process.exit(1);c.setTimeout(1000,f);c.once('error',f);c.once('connect',()=>{c.destroy();process.exit(0)})"
      interval: 15s
      timeout: 3s
      start_period: 30s
      retries: 4

  production-companion-device-bridge:
    <<: *runtime-defaults
    image: fetanagent-companion-device-bridge:${FETANAGENT_IMAGE_TAG:?set the exact commit-derived image tag}
    pids_limit: 96
    mem_limit: 192m
    environment:
      NODE_ENV: production
      HTTP_PROXY: ''
      http_proxy: ''
      HTTPS_PROXY: ''
      https_proxy: ''
      FTP_PROXY: ''
      ftp_proxy: ''
      ALL_PROXY: ''
      all_proxy: ''
      FINANCIAL_ACTIONS_MODE: dry_run
      INTERNAL_COMPANION_DEVICE_BRIDGE_ENABLED: 'true'
      COMPANION_DEVICE_BRIDGE_NO_MONEY_READ_ONLY_LOOKUP_ENABLED: 'true'
      COMPANION_DEVICE_BRIDGE_DEPLOYMENT_TARGET: production
      COMPANION_DEVICE_BRIDGE_DATABASE_URL_FILE: /run/secrets/companion_device_bridge_database_url
      COMPANION_DEVICE_BRIDGE_SIGNER_PRIVATE_KEY_FILE: /run/secrets/companion_device_bridge_server_signer.pkcs8.der
      COMPANION_DEVICE_BRIDGE_RUNTIME_MANIFEST_FILE: /run/configs/companion_device_bridge_runtime_manifest.v2.json
      NODE_EXTRA_CA_CERTS: /run/configs/supabase_ca_certificate
      KEMERBET_EXECUTOR_ENABLED: 'false'
      KEMERBET_FINAL_ACTION_ENABLED: 'false'
    secrets:
      - source: companion_device_bridge_database_url
        target: companion_device_bridge_database_url
        uid: '10001'
        gid: '10001'
        mode: 0400
      - source: companion_device_bridge_server_signer
        target: companion_device_bridge_server_signer.pkcs8.der
        uid: '10001'
        gid: '10001'
        mode: 0400
    configs:
      - source: companion_device_bridge_runtime_manifest
        target: /run/configs/companion_device_bridge_runtime_manifest.v2.json
        uid: '10001'
        gid: '10001'
        mode: 0444
      - source: supabase_ca_certificate
        target: /run/configs/supabase_ca_certificate
        uid: '10001'
        gid: '10001'
        mode: 0444
    networks:
      - companion_device_ingress
      - companion_device_database_egress
    healthcheck:
      test:
        - CMD
        - node
        - --input-type=module
        - --eval
        - "import{connect}from'node:net';const c=connect({host:'127.0.0.1',port:8085}),f=()=>process.exit(1);c.setTimeout(1000,f);c.once('error',f);c.once('connect',()=>{c.destroy();process.exit(0)})"
      interval: 15s
      timeout: 3s
      start_period: 30s
      retries: 4

  gateway:
    <<: *runtime-defaults
    image: fetanagent-gateway:${FETANAGENT_IMAGE_TAG:?set the exact commit-derived image tag}
    mem_limit: 128m
    cpus: 0.25
    environment:
      FETANAGENT_COMPANION_BRIDGE_UPSTREAM: production-companion-device-bridge:8085
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - '80:80/tcp'
      - '443:443/tcp'
    volumes:
      - type: bind
        source: /var/lib/fetanagent-gateway/data
        target: /data
      - type: bind
        source: /var/lib/fetanagent-gateway/config
        target: /config
    networks:
      - public_application
      - companion_device_ingress
      - telebirr_device_ingress
    depends_on:
      customer-web:
        condition: service_healthy
        restart: true
      owner-control:
        condition: service_healthy
        restart: true
      telebirr-device-bridge:
        condition: service_healthy
        restart: true
      production-companion-device-bridge:
        condition: service_healthy
        restart: true
    healthcheck:
      test: [CMD, caddy, validate, --config, /etc/caddy/Caddyfile, --adapter, caddyfile]
      interval: 15s
      timeout: 3s
      start_period: 15s
      retries: 4

