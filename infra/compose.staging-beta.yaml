    external: true
    name: fetanagent-staging-beta-kemerbet-readiness-profile-snapshot-once

# This is the public CA downloaded for the staging Supabase project, verified out of band before
# use. It is mounted only into the four database clients so Node extends (rather than replaces) its
# trust set.
configs:
  supabase_ca_certificate:
    file: ${FETANAGENT_STAGING_SUPABASE_CA_CERTIFICATE_FILE:?set the verified staging Supabase CA file}
  cbe_deposit_reference_key_profile:
    file: ${FETANAGENT_STAGING_CBE_DEPOSIT_REFERENCE_KEY_PROFILE_FILE:?set the immutable CBE deposit-reference key-profile file}
  deposit_proof_reference_profile:
    file: ${FETANAGENT_STAGING_DEPOSIT_PROOF_REFERENCE_PROFILE_FILE:?set the immutable provider-proof v2 reference profile file}

# Every source is an operator-owned file outside the repository. The two transport-HMAC files
# contain the same value but remain separate mounts so neither service can read the other's file.
secrets:
  customer_web_database_url:
    file: ${FETANAGENT_STAGING_CUSTOMER_WEB_DATABASE_URL_FILE:?set an external customer-web database URL file}
