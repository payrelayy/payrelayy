name: fetanagent-staging-beta

# This file is an inert, manually selected beta-only staging contract. A plain
# `docker compose up` starts nothing because every service is profile-gated.
services:
  owner-control:
    profiles: [staging-manual]
    platform: linux/amd64
    image: fetanagent-owner-control:${FETANAGENT_IMAGE_TAG:?set a commit-derived image tag}
    pull_policy: never
    build:
      context: ..
      dockerfile: Dockerfile
      target: admin
      args:
        VCS_REF: ${FETANAGENT_VCS_REF:?set the reviewed full commit SHA}
    init: true
    user: '10001:10001'
    restart: 'no'
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.50
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      FINANCIAL_ACTIONS_MODE: dry_run
      OWNER_CONTROL_HOST: 0.0.0.0
      OWNER_CONTROL_PORT: '3002'
      OWNER_CONTROL_SUPABASE_URL: https://spzpiyxheappsfyswewl.supabase.co
      NODE_EXTRA_CA_CERTS: /run/configs/supabase_ca_certificate
      INTERNAL_OWNER_CONTROL_RUNTIME_ENABLED: 'true'
      OWNER_CONTROL_DATABASE_URL_FILE: /run/secrets/owner_control_database_url
      OWNER_CONTROL_SUPABASE_PUBLISHABLE_KEY_FILE: /run/secrets/owner_control_supabase_publishable_key
      OWNER_RECEIVER_REFERENCE_ENCRYPTION_MASTER_FILE: /run/secrets/owner_receiver_reference_encryption_master
      OWNER_RECEIVER_REFERENCE_FINGERPRINT_MASTER_FILE: /run/secrets/owner_receiver_reference_fingerprint_master
      OWNER_RECEIVER_REFERENCE_PROFILE_FILE: /etc/fetanagent/deposit-proof-reference-profile.v2.json
      INTERNAL_TELEGRAM_BETA_ADMISSION_PREFLIGHT_ENABLED: 'false'
      INTERNAL_POSTGRES_RUNTIME_ENABLED: 'false'
      INTERNAL_NONCE_RETENTION_RUNTIME_ENABLED: 'false'
      TELEGRAM_BOT_ENABLED: 'false'
      TELEGRAM_BETA_ADMISSION_ENABLED: 'false'
      INTERNAL_TELEGRAM_INGRESS_ENABLED: 'false'
      INTERNAL_TELEGRAM_PRIVATE_INGRESS_RUNTIME_ENABLED: 'false'
      INTERNAL_TELEGRAM_ACTION_CHANNEL_ENABLED: 'false'
      INTERNAL_TELEGRAM_ACTION_CAPABILITY_CONTRACT_ENABLED: 'false'
      INTERNAL_TELEGRAM_PLAYER_ACTION_RUNTIME_ENABLED: 'false'
      KEMERBET_EXECUTOR_ENABLED: 'false'
      KEMERBET_FINAL_ACTION_ENABLED: 'false'
    ports:
      - 127.0.0.1:3002:3002
    volumes:
      - type: volume
        source: kemerbet_session_control
        target: /run/fetanagent-kemerbet-session-control
      - type: bind
        source: /var/lib/fetanagent/kemerbet-readiness-cohort-receipts
        target: /run/fetanagent-kemerbet-readiness-cohort-receipts
        read_only: true
        bind:
          create_host_path: false
    secrets:
      - source: owner_control_database_url
        target: owner_control_database_url
        uid: '10001'
        gid: '10001'
        mode: 0400
      - source: owner_control_supabase_publishable_key
        target: owner_control_supabase_publishable_key
        uid: '10001'
        gid: '10001'
        mode: 0400
      - source: deposit_proof_reference_encryption_master
        target: owner_receiver_reference_encryption_master
        uid: '10001'
        gid: '10001'
        mode: 0400
      - source: deposit_proof_reference_fingerprint_master
        target: owner_receiver_reference_fingerprint_master
        uid: '10001'
        gid: '10001'
        mode: 0400
    configs:
      - source: supabase_ca_certificate
        target: /run/configs/supabase_ca_certificate
        uid: '10001'
        gid: '10001'
        mode: 0444
      - source: deposit_proof_reference_profile
        target: /etc/fetanagent/deposit-proof-reference-profile.v2.json
        uid: '10001'
        gid: '10001'
        mode: 0444
    networks:
      - owner_control_service
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3002/readyz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3

  kemerbet-session-provision:
    profiles: [kemerbet-session-provision]
    platform: linux/amd64
    image: fetanagent-deposit-executor:${FETANAGENT_IMAGE_TAG:?set a commit-derived image tag}
    pull_policy: never
    command: ['node', 'apps/executor/dist/kemerbet-session-provision-server.js']
    init: true
    user: '10001:10001'
    # H11 does not attest an automatic Docker retry budget. Keep unexpected exits fail-closed;
    # only the reviewed operator/deployment path may re-establish this coordinator.
    restart: 'no'
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    shm_size: 512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 1536m
    cpus: 2.00
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    environment:
      NODE_ENV: production
      FINANCIAL_ACTIONS_MODE: dry_run
      KEMERBET_NO_TRANSFER_READINESS_SEAL_ENABLED: 'true'
      KEMERBET_EXECUTOR_ENABLED: 'false'
      KEMERBET_FINAL_ACTION_ENABLED: 'false'
      KEMERBET_PRIVATE_LIVE_DEPOSIT_PILOT_ENABLED: 'false'
      INTERNAL_KEMERBET_EXECUTION_RUNTIME_ENABLED: 'false'
    volumes:
      - type: volume
        source: kemerbet_session_control
        target: /run/fetanagent-kemerbet-session-control
      - type: volume
        source: kemerbet_sessions
        target: /var/lib/fetanagent/kemerbet-sessions
      - type: bind
        source: /etc/fetanagent/executor-secrets/kemerbet_agent_identity_hmac_key
        target: /run/secrets/kemerbet_agent_identity_hmac_key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${FETANAGENT_STAGING_KEMERBET_SESSION_BINDING_FILE:-/etc/fetanagent/executor-secrets/kemerbet_agent_identity_bindings}
        target: /run/secrets/kemerbet_agent_identity_bindings
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /etc/fetanagent/executor-config/kemerbet-selector-contract.v2.json
        target: /etc/fetanagent/kemerbet-selector-contract.v2.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /var/lib/fetanagent/kemerbet-readiness-seal-output
        target: /run/fetanagent-kemerbet-readiness-seal-output
        bind:
          create_host_path: false
    networks:
      - owner_control_service
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const http=require('node:http');const request=http.get({socketPath:'/run/fetanagent-kemerbet-session-control/session.sock',path:'/healthz'},response=>process.exit(response.statusCode===200?0:1));request.on('error',()=>process.exit(1));request.setTimeout(2000,()=>request.destroy())"
      interval: 15s
      timeout: 3s
      start_period: 45s
      retries: 3

  kemerbet-no-transfer-readiness:
    profiles: [kemerbet-no-transfer-readiness]
    platform: linux/amd64
    image: fetanagent-deposit-executor:${FETANAGENT_IMAGE_TAG:?set a commit-derived image tag}
    pull_policy: never
    container_name: fetanagent-staging-beta-kemerbet-no-transfer-readiness-once
    command: ['node', 'apps/executor/dist/kemerbet-no-transfer-readiness.js']
    init: true
    user: '10002:10002'
    restart: 'no'
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=33554432,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.50
    stop_grace_period: 15s
    logging:
      driver: none
    dns:
      - 127.0.0.1
    dns_opt:
      - attempts:1
      - timeout:1
      - ndots:0
    environment:
      NODE_ENV: production
      HTTP_PROXY: ''
      http_proxy: ''
      HTTPS_PROXY: ''
      https_proxy: ''
      NO_PROXY: ''
      no_proxy: ''
      FTP_PROXY: ''
      ftp_proxy: ''
      ALL_PROXY: ''
      all_proxy: ''
      FINANCIAL_ACTIONS_MODE: dry_run
      KEMERBET_NO_TRANSFER_READINESS_ENABLED: 'true'
      KEMERBET_READINESS_BROWSER_RPC_ENABLED: 'true'
      KEMERBET_EXECUTOR_ENABLED: 'false'
      KEMERBET_FINAL_ACTION_ENABLED: 'false'
      KEMERBET_PRIVATE_LIVE_DEPOSIT_PILOT_ENABLED: 'false'
      INTERNAL_KEMERBET_EXECUTION_RUNTIME_ENABLED: 'false'
    volumes:
      - type: bind
        source: /etc/fetanagent/executor-secrets/.kemerbet-readiness-recheck-candidate/kemerbet_agent_identity_bindings
        target: /run/secrets/kemerbet_agent_identity_bindings
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /etc/fetanagent/executor-secrets/kemerbet_agent_identity_hmac_key
        target: /run/secrets/kemerbet_agent_identity_hmac_key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /etc/fetanagent/executor-secrets/kemerbet_no_transfer_readiness_player_ids
        target: /run/secrets/kemerbet_no_transfer_readiness_player_ids
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /run/fetanagent-kemerbet-readiness-rpc-v1/controller-capability
        target: /run/secrets/kemerbet_readiness_browser_rpc_capability
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /run/fetanagent-kemerbet-readiness-rpc-v1/layer7-authorizations
        target: /run/secrets/kemerbet_readiness_layer7_authorizations
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /run/fetanagent-kemerbet-readiness-rpc-v1/controller-firewall-release
        target: /run/secrets/kemerbet_readiness_controller_firewall_release
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /run/fetanagent-kemerbet-readiness-rpc-v1/controller-stage-output
        target: /run/fetanagent-kemerbet-readiness-controller-stage-output
        bind:
          create_host_path: false
    networks:
      kemerbet_readiness_control:
        ipv4_address: 172.31.254.2
        ipv6_address: fd5e:7a9e:1::2
    healthcheck:
      disable: true

  kemerbet-readiness-browser:
    profiles: [kemerbet-no-transfer-readiness]
    platform: linux/amd64
    image: fetanagent-deposit-executor:${FETANAGENT_IMAGE_TAG:?set a commit-derived image tag}
