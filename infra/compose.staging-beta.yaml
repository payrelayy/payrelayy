  api_player_action_semantic_hmac:
    file: ${FETANAGENT_STAGING_API_PLAYER_ACTION_SEMANTIC_HMAC_FILE:?set an external API Player-ID semantic HMAC file}
  cbe_deposit_reference_encryption_key:
    file: ${FETANAGENT_STAGING_CBE_DEPOSIT_REFERENCE_ENCRYPTION_KEY_FILE:?set the external CBE deposit-reference encryption key file}
  cbe_deposit_reference_fingerprint_key:
