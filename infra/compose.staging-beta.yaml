    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3003/readyz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3

  gateway:
    profiles: [public-domain]
    platform: linux/amd64
    image: fetanagent-gateway:${FETANAGENT_IMAGE_TAG:?set a commit-derived image tag}
    pull_policy: never
    build:
      context: ..
      dockerfile: Dockerfile
      target: gateway
      args:
        VCS_REF: ${FETANAGENT_VCS_REF:?set the reviewed full commit SHA}
    init: true
    user: '10001:10001'
    restart: 'no'
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 128m
    cpus: 0.25
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    ports:
      - '80:80/tcp'
      - '443:443/tcp'
    volumes:
      - type: bind
        source: /var/lib/fetanagent-gateway/data
        target: /data
      - type: bind
        source: /var/lib/fetanagent-gateway/config
        target: /config
    networks:
      - owner_control_service
    depends_on:
      customer-web:
        condition: service_healthy
        restart: true
      owner-control:
        condition: service_healthy
        restart: true
    healthcheck:
      test:
        - CMD
        - caddy
        - validate
        - --config
        - /etc/caddy/Caddyfile
        - --adapter
        - caddyfile
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

