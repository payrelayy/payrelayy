name: fetanagent-staging-beta

# This file is an inert, manually selected beta-only staging contract. A plain
# `docker compose up` starts nothing because every service is profile-gated.
services:
  owner-control:
    profiles: [staging-manual]
    platform: linux/amd64
    image: fetanagent-owner-control:${FETANAGENT_IMAGE_TAG:?set a commit-derived image tag}
    pull_policy: never
    build:
      context: ..
      dockerfile: Dockerfile
      target: admin
      args:
        VCS_REF: ${FETANAGENT_VCS_REF:?set the reviewed full commit SHA}
    init: true
    user: '10001:10001'
    restart: 'no'
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.50
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      FINANCIAL_ACTIONS_MODE: dry_run
      OWNER_CONTROL_HOST: 0.0.0.0
      OWNER_CONTROL_PORT: '3002'
      OWNER_CONTROL_SUPABASE_URL: https://spzpiyxheappsfyswewl.supabase.co
      NODE_EXTRA_CA_CERTS: /run/configs/supabase_ca_certificate
      INTERNAL_OWNER_CONTROL_RUNTIME_ENABLED: 'true'
      OWNER_CONTROL_DATABASE_URL_FILE: /run/secrets/owner_control_database_url
      OWNER_CONTROL_SUPABASE_PUBLISHABLE_KEY_FILE: /run/secrets/owner_control_supabase_publishable_key
      INTERNAL_TELEGRAM_BETA_ADMISSION_PREFLIGHT_ENABLED: 'false'
      INTERNAL_POSTGRES_RUNTIME_ENABLED: 'false'
      INTERNAL_NONCE_RETENTION_RUNTIME_ENABLED: 'false'
      TELEGRAM_BOT_ENABLED: 'false'
      TELEGRAM_BETA_ADMISSION_ENABLED: 'false'
      INTERNAL_TELEGRAM_INGRESS_ENABLED: 'false'
      INTERNAL_TELEGRAM_PRIVATE_INGRESS_RUNTIME_ENABLED: 'false'
      INTERNAL_TELEGRAM_ACTION_CHANNEL_ENABLED: 'false'
      INTERNAL_TELEGRAM_ACTION_CAPABILITY_CONTRACT_ENABLED: 'false'
      INTERNAL_TELEGRAM_PLAYER_ACTION_RUNTIME_ENABLED: 'false'
      KEMERBET_EXECUTOR_ENABLED: 'false'
      KEMERBET_FINAL_ACTION_ENABLED: 'false'
    ports:
      - 127.0.0.1:3002:3002
    secrets:
      - source: owner_control_database_url
        target: owner_control_database_url
        uid: '10001'
        gid: '10001'
        mode: 0400
      - source: owner_control_supabase_publishable_key
        target: owner_control_supabase_publishable_key
        uid: '10001'
        gid: '10001'
        mode: 0400
    configs:
      - source: supabase_ca_certificate
        target: /run/configs/supabase_ca_certificate
        uid: '10001'
        gid: '10001'
        mode: 0444
    networks:
      - owner_control_service
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3002/readyz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3

  gateway:
    profiles: [public-domain]
    platform: linux/amd64
    image: fetanagent-gateway:${FETANAGENT_IMAGE_TAG:?set a commit-derived image tag}
    pull_policy: never
    build:
      context: ..
      dockerfile: Dockerfile
      target: gateway
      args:
        VCS_REF: ${FETANAGENT_VCS_REF:?set the reviewed full commit SHA}
    init: true
    user: '10001:10001'
    restart: 'no'
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 128m
    cpus: 0.25
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    ports:
      - '80:80/tcp'
      - '443:443/tcp'
    volumes:
      - type: bind
        source: /var/lib/fetanagent-gateway/data
        target: /data
      - type: bind
        source: /var/lib/fetanagent-gateway/config
        target: /config
    networks:
      - owner_control_service
    depends_on:
      owner-control:
        condition: service_healthy
        restart: true
    healthcheck:
      test:
        - CMD
        - caddy
        - validate
        - --config
        - /etc/caddy/Caddyfile
        - --adapter
        - caddyfile
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  api:
    profiles: [staging-manual]
    platform: linux/amd64
    image: fetanagent-api:${FETANAGENT_IMAGE_TAG:?set a commit-derived image tag}
    pull_policy: never
    build:
      context: ..
      dockerfile: Dockerfile
      target: api
      args:
        VCS_REF: ${FETANAGENT_VCS_REF:?set the reviewed full commit SHA}
    init: true
    user: '10001:10001'
    restart: 'no'
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.50
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      FINANCIAL_ACTIONS_MODE: dry_run
      API_HOST: 0.0.0.0
      API_PORT: '3000'
      NODE_EXTRA_CA_CERTS: /run/configs/supabase_ca_certificate
      INTERNAL_TELEGRAM_PLAYER_ACTION_RUNTIME_ENABLED: 'true'
      INTERNAL_TELEGRAM_ACTION_CHANNEL_ENABLED: 'true'
      INTERNAL_TELEGRAM_ACTION_CAPABILITY_CONTRACT_ENABLED: 'true'
      PLAYER_ACTION_DATABASE_URL_FILE: /run/secrets/player_action_database_url
      BOT_TO_API_ACTION_HMAC_SECRET_FILE: /run/secrets/api_player_action_transport_hmac
      API_TELEGRAM_PLAYER_ACTION_PAYLOAD_HMAC_SECRET_FILE: /run/secrets/api_player_action_payload_hmac
      API_TELEGRAM_CAPABILITY_HMAC_SECRET_FILE: /run/secrets/api_player_action_capability_hmac
      API_TELEGRAM_ACTION_SEMANTIC_HMAC_SECRET_FILE: /run/secrets/api_player_action_semantic_hmac
      API_DEPOSIT_REFERENCE_PROTECTION_SECRET_FILE: /run/secrets/api_deposit_reference_protection
      INTERNAL_TELEGRAM_BETA_ADMISSION_PREFLIGHT_ENABLED: 'false'
      INTERNAL_POSTGRES_RUNTIME_ENABLED: 'false'
      INTERNAL_NONCE_RETENTION_RUNTIME_ENABLED: 'false'
      TELEGRAM_BOT_ENABLED: 'false'
      TELEGRAM_BETA_ADMISSION_ENABLED: 'false'
      INTERNAL_TELEGRAM_INGRESS_ENABLED: 'false'
      INTERNAL_TELEGRAM_PRIVATE_INGRESS_RUNTIME_ENABLED: 'false'
      KEMERBET_EXECUTOR_ENABLED: 'false'
      KEMERBET_FINAL_ACTION_ENABLED: 'false'
    secrets:
      - source: player_action_database_url
        target: player_action_database_url
        uid: '10001'
        gid: '10001'
        mode: 0400
      - source: api_player_action_transport_hmac
        target: api_player_action_transport_hmac
        uid: '10001'
        gid: '10001'
        mode: 0400
      - source: api_player_action_payload_hmac
        target: api_player_action_payload_hmac
        uid: '10001'
        gid: '10001'
        mode: 0400
      - source: api_player_action_capability_hmac
        target: api_player_action_capability_hmac
        uid: '10001'
        gid: '10001'
        mode: 0400
      - source: api_player_action_semantic_hmac
        target: api_player_action_semantic_hmac
        uid: '10001'
        gid: '10001'
        mode: 0400
      - source: api_deposit_reference_protection
        target: api_deposit_reference_protection
        uid: '10001'
        gid: '10001'
        mode: 0400
    configs:
      - source: supabase_ca_certificate
        target: /run/configs/supabase_ca_certificate
        uid: '10001'
        gid: '10001'
        mode: 0444
    networks:
      - staging_service
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/readyz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3

  beta-admission:
    profiles: [staging-manual]
    platform: linux/amd64
    image: fetanagent-beta-admission:${FETANAGENT_IMAGE_TAG:?set a commit-derived image tag}
    pull_policy: never
    build:
      context: ..
      dockerfile: Dockerfile
      target: beta-admission
      args:
        VCS_REF: ${FETANAGENT_VCS_REF:?set the reviewed full commit SHA}
    init: true
    user: '10001:10001'
    restart: 'no'
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.50
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      FINANCIAL_ACTIONS_MODE: dry_run
      BETA_ADMISSION_HOST: 0.0.0.0
      BETA_ADMISSION_PORT: '3001'
      NODE_EXTRA_CA_CERTS: /run/configs/supabase_ca_certificate
      INTERNAL_TELEGRAM_BETA_ADMISSION_RUNTIME_ENABLED: 'true'
      BETA_ADMISSION_DATABASE_URL_FILE: /run/secrets/beta_admission_database_url
      BOT_TO_BETA_ADMISSION_HMAC_SECRET_FILE: /run/secrets/beta_admission_bot_transport_hmac
      BETA_ADMISSION_PAYLOAD_HMAC_SECRET_FILE: /run/secrets/beta_admission_payload_hmac
      INTERNAL_TELEGRAM_BETA_ADMISSION_PREFLIGHT_ENABLED: 'false'
      INTERNAL_POSTGRES_RUNTIME_ENABLED: 'false'
      INTERNAL_NONCE_RETENTION_RUNTIME_ENABLED: 'false'
      TELEGRAM_BOT_ENABLED: 'false'
      TELEGRAM_BETA_ADMISSION_ENABLED: 'false'
      INTERNAL_TELEGRAM_INGRESS_ENABLED: 'false'
      INTERNAL_TELEGRAM_PRIVATE_INGRESS_RUNTIME_ENABLED: 'false'
      INTERNAL_TELEGRAM_ACTION_CHANNEL_ENABLED: 'false'
      INTERNAL_TELEGRAM_ACTION_CAPABILITY_CONTRACT_ENABLED: 'false'
      INTERNAL_TELEGRAM_PLAYER_ACTION_RUNTIME_ENABLED: 'false'
      KEMERBET_EXECUTOR_ENABLED: 'false'
      KEMERBET_FINAL_ACTION_ENABLED: 'false'
    secrets:
      - source: beta_admission_database_url
        target: beta_admission_database_url
        uid: '10001'
        gid: '10001'
        mode: 0400
      - source: beta_admission_bot_transport_hmac
        target: beta_admission_bot_transport_hmac
        uid: '10001'
        gid: '10001'
        mode: 0400
      - source: beta_admission_payload_hmac
        target: beta_admission_payload_hmac
        uid: '10001'
        gid: '10001'
        mode: 0400
    configs:
      - source: supabase_ca_certificate
        target: /run/configs/supabase_ca_certificate
        uid: '10001'
        gid: '10001'
        mode: 0444
    networks:
      - staging_service
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/readyz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3

  bot:
    profiles: [staging-manual]
    platform: linux/amd64
    image: fetanagent-bot:${FETANAGENT_IMAGE_TAG:?set a commit-derived image tag}
    pull_policy: never
    build:
      context: ..
      dockerfile: Dockerfile
      target: bot
      args:
        VCS_REF: ${FETANAGENT_VCS_REF:?set the reviewed full commit SHA}
    init: true
    user: '10001:10001'
    restart: 'no'
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.50
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      FINANCIAL_ACTIONS_MODE: dry_run
      TELEGRAM_BOT_ENABLED: 'true'
      TELEGRAM_BETA_ADMISSION_ENABLED: 'true'
      BOT_TO_BETA_ADMISSION_BASE_URL: http://beta-admission:3001/
      INTERNAL_TELEGRAM_ACTION_CHANNEL_ENABLED: 'true'
      BOT_TO_API_ACTION_BASE_URL: http://api:3000/
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      BOT_TO_BETA_ADMISSION_HMAC_SECRET_FILE: /run/secrets/bot_beta_admission_transport_hmac
      BOT_TO_API_ACTION_HMAC_SECRET_FILE: /run/secrets/bot_player_action_transport_hmac
      INTERNAL_TELEGRAM_BETA_ADMISSION_PREFLIGHT_ENABLED: 'false'
      INTERNAL_POSTGRES_RUNTIME_ENABLED: 'false'
      INTERNAL_NONCE_RETENTION_RUNTIME_ENABLED: 'false'
      INTERNAL_TELEGRAM_INGRESS_ENABLED: 'false'
      INTERNAL_TELEGRAM_PRIVATE_INGRESS_RUNTIME_ENABLED: 'false'
      INTERNAL_TELEGRAM_ACTION_CAPABILITY_CONTRACT_ENABLED: 'false'
      INTERNAL_TELEGRAM_PLAYER_ACTION_RUNTIME_ENABLED: 'false'
      KEMERBET_EXECUTOR_ENABLED: 'false'
      KEMERBET_FINAL_ACTION_ENABLED: 'false'
    secrets:
      - source: telegram_bot_token
        target: telegram_bot_token
        uid: '10001'
        gid: '10001'
        mode: 0400
      - source: bot_beta_admission_transport_hmac
        target: bot_beta_admission_transport_hmac
        uid: '10001'
        gid: '10001'
        mode: 0400
      - source: bot_player_action_transport_hmac
        target: bot_player_action_transport_hmac
        uid: '10001'
        gid: '10001'
        mode: 0400
    networks:
      - staging_service
    depends_on:
      api:
        condition: service_healthy
        restart: true
      beta-admission:
        condition: service_healthy
        restart: true

networks:
  owner_control_service:
    driver: bridge
    enable_ipv6: true
    internal: false
    attachable: false
  staging_service:
    driver: bridge
    enable_ipv6: true
    internal: false
    attachable: false

# This is the public CA downloaded for the staging Supabase project, verified out of band before
# use. It is mounted only into the three database clients so Node extends (rather than replaces) its
# trust set.
configs:
  supabase_ca_certificate:
    file: ${FETANAGENT_STAGING_SUPABASE_CA_CERTIFICATE_FILE:?set the verified staging Supabase CA file}

# Every source is an operator-owned file outside the repository. The two transport-HMAC files
# contain the same value but remain separate mounts so neither service can read the other's file.
secrets:
  owner_control_database_url:
    file: ${FETANAGENT_STAGING_OWNER_CONTROL_DATABASE_URL_FILE:?set an external Owner-control database URL file}
  owner_control_supabase_publishable_key:
    file: ${FETANAGENT_STAGING_OWNER_CONTROL_SUPABASE_PUBLISHABLE_KEY_FILE:?set an external staging publishable-key file}
  beta_admission_database_url:
    file: ${FETANAGENT_STAGING_BETA_ADMISSION_DATABASE_URL_FILE:?set an external beta database URL file}
  beta_admission_bot_transport_hmac:
    file: ${FETANAGENT_STAGING_BETA_ADMISSION_TRANSPORT_HMAC_FILE:?set an external beta-service transport HMAC file}
  beta_admission_payload_hmac:
    file: ${FETANAGENT_STAGING_BETA_ADMISSION_PAYLOAD_HMAC_FILE:?set an external beta payload HMAC file}
  player_action_database_url:
    file: ${FETANAGENT_STAGING_PLAYER_ACTION_DATABASE_URL_FILE:?set an external Player-ID action database URL file}
  api_player_action_transport_hmac:
    file: ${FETANAGENT_STAGING_API_PLAYER_ACTION_TRANSPORT_HMAC_FILE:?set an external API Player-ID transport HMAC file}
  api_player_action_payload_hmac:
    file: ${FETANAGENT_STAGING_API_PLAYER_ACTION_PAYLOAD_HMAC_FILE:?set an external API Player-ID payload HMAC file}
  api_player_action_capability_hmac:
    file: ${FETANAGENT_STAGING_API_PLAYER_ACTION_CAPABILITY_HMAC_FILE:?set an external API Player-ID capability HMAC file}
  api_player_action_semantic_hmac:
    file: ${FETANAGENT_STAGING_API_PLAYER_ACTION_SEMANTIC_HMAC_FILE:?set an external API Player-ID semantic HMAC file}
  api_deposit_reference_protection:
    file: ${FETANAGENT_STAGING_API_DEPOSIT_REFERENCE_PROTECTION_FILE:?set an external API deposit-reference protection key file}
  telegram_bot_token:
    file: ${FETANAGENT_STAGING_BOT_TOKEN_FILE:?set an external staging bot token file}
  bot_beta_admission_transport_hmac:
    file: ${FETANAGENT_STAGING_BOT_TRANSPORT_HMAC_FILE:?set an external bot transport HMAC file}
  bot_player_action_transport_hmac:
    file: ${FETANAGENT_STAGING_BOT_PLAYER_ACTION_TRANSPORT_HMAC_FILE:?set an external bot Player-ID transport HMAC file}
