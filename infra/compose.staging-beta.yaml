        bind:
          create_host_path: false
    networks:
      kemerbet_readiness_control:
        ipv4_address: 172.31.254.3
        ipv6_address: fd5e:7a9e:1::3
      kemerbet_readiness_proxy:
        ipv4_address: 172.31.254.11
        ipv6_address: fd5e:7a9e:2::3
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const n=require('node:net');const s=n.connect({host:'172.31.254.3',port:4587});const f=()=>process.exit(1);s.setTimeout(750,f);s.once('connect',()=>{s.destroy();process.exit(0)});s.once('error',f)"
      interval: 1s
      timeout: 1s
      retries: 60
      start_period: 1s

  kemerbet-readiness-egress-proxy:
    profiles: [kemerbet-no-transfer-readiness]
    platform: linux/amd64
    image: fetanagent-deposit-executor:${FETANAGENT_IMAGE_TAG:?set a commit-derived image tag}
    pull_policy: never
    container_name: fetanagent-staging-beta-kemerbet-readiness-egress-proxy-once
    command: ['node', 'apps/executor/dist/kemerbet-readiness-layer7-proxy.js']
    init: true
    user: '10003:10003'
    restart: 'no'
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=33554432,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.50
    stop_grace_period: 15s
    logging:
