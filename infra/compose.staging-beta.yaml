      HTTP_PROXY: ''
      http_proxy: ''
      HTTPS_PROXY: ''
      https_proxy: ''
      NO_PROXY: ''
      no_proxy: ''
      FTP_PROXY: ''
      ftp_proxy: ''
      ALL_PROXY: ''
      all_proxy: ''
      FINANCIAL_ACTIONS_MODE: dry_run
      KEMERBET_EXECUTOR_ENABLED: 'false'
      KEMERBET_FINAL_ACTION_ENABLED: 'false'
      KEMERBET_PRIVATE_LIVE_DEPOSIT_PILOT_ENABLED: 'false'
      INTERNAL_KEMERBET_EXECUTION_RUNTIME_ENABLED: 'false'
    volumes:
      - type: bind
        source: /run/fetanagent-kemerbet-readiness-rpc-v1/proxy-hmac-key
        target: /run/secrets/kemerbet_readiness_proxy_hmac_key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /run/fetanagent-kemerbet-readiness-rpc-v1/proxy-run-nonce
        target: /run/secrets/kemerbet_readiness_proxy_run_nonce
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /run/fetanagent-kemerbet-readiness-rpc-v1/proxy-agent-identity-bindings
        target: /run/secrets/kemerbet_readiness_proxy_agent_identity_bindings
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /run/fetanagent-kemerbet-readiness-rpc-v1/proxy-agent-identity-hmac-key
        target: /run/secrets/kemerbet_readiness_proxy_agent_identity_hmac_key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /run/fetanagent-kemerbet-readiness-rpc-v1/release-sha
        target: /run/secrets/kemerbet_readiness_release_sha
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /run/fetanagent-kemerbet-readiness-rpc-v1/proxy-output
        target: /run/output
        bind:
          create_host_path: false
      - type: bind
        source: /run/fetanagent-kemerbet-readiness-rpc-v1/proxy-stage-output
        target: /run/fetanagent-kemerbet-readiness-proxy-stage-output
        bind:
          create_host_path: false
    networks:
      kemerbet_readiness_proxy:
        ipv4_address: 172.31.254.10
        ipv6_address: fd5e:7a9e:2::2
      kemerbet_readiness_egress: {}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const f=require('node:fs'),p='/tmp/fetanagent-kemerbet-readiness-layer7-proxy.ready',e=Buffer.from('fetanagent-kemerbet-readiness-layer7-proxy-ready-v1\\n');let d=-1;try{const b=f.lstatSync(p,{bigint:true});if(!b.isFile()||b.isSymbolicLink())throw 0;d=f.openSync(p,f.constants.O_RDONLY|f.constants.O_NOFOLLOW);const s=f.fstatSync(d,{bigint:true});if(!s.isFile()||s.uid!==10003n||s.gid!==10003n||(s.mode&0o7777n)!==0o600n||s.nlink!==1n||s.size!==BigInt(e.length)||s.dev!==b.dev||s.ino!==b.ino)throw 0;const v=Buffer.alloc(e.length),x=Buffer.alloc(1);if(f.readSync(d,v,0,v.length,0)!==v.length||!v.equals(e)||f.readSync(d,x,0,1,v.length)!==0)throw 0;const a=f.lstatSync(p,{bigint:true});if(!a.isFile()||a.dev!==s.dev||a.ino!==s.ino||a.uid!==s.uid||a.gid!==s.gid||(a.mode&0o7777n)!==0o600n||a.nlink!==1n||a.size!==s.size)throw 0;f.closeSync(d);process.exit(0)}catch{if(d>=0)try{f.closeSync(d)}catch{}process.exit(1)}"
      interval: 1s
      timeout: 1s
      retries: 120
      start_period: 90s

