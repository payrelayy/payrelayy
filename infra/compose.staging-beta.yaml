    driver: bridge
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
      com.docker.network.bridge.gateway_mode_ipv6: isolated
    enable_ipv6: true
    internal: true
    attachable: false
    ipam:
      config:
        - subnet: 172.31.254.0/29
          gateway: 172.31.254.1
        - subnet: fd5e:7a9e:1::/64
          gateway: fd5e:7a9e:1::1
  kemerbet_readiness_proxy:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
      com.docker.network.bridge.gateway_mode_ipv6: isolated
    enable_ipv6: true
    internal: true
    attachable: false
    ipam:
      config:
        - subnet: 172.31.254.8/29
          gateway: 172.31.254.9
        - subnet: fd5e:7a9e:2::/64
