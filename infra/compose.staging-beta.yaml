      - ndots:0
    environment:
      NODE_ENV: production
      HTTP_PROXY: ''
      http_proxy: ''
      HTTPS_PROXY: ''
      https_proxy: ''
      NO_PROXY: ''
      no_proxy: ''
      FTP_PROXY: ''
      ftp_proxy: ''
      ALL_PROXY: ''
      all_proxy: ''
      FINANCIAL_ACTIONS_MODE: dry_run
      KEMERBET_READINESS_BROWSER_DRIVER_ENABLED: 'true'
      KEMERBET_READINESS_L7_PROXY_IPV4: 172.31.254.10
      KEMERBET_READINESS_L7_PROXY_SPKI_SHA256: Ngu9uL2STHWC7Uton/GYw7d8hDQdhliykEz2XnJZd3M=
      KEMERBET_EXECUTOR_ENABLED: 'false'
      KEMERBET_FINAL_ACTION_ENABLED: 'false'
      KEMERBET_PRIVATE_LIVE_DEPOSIT_PILOT_ENABLED: 'false'
      INTERNAL_KEMERBET_EXECUTION_RUNTIME_ENABLED: 'false'
    volumes:
      - type: volume
        source: kemerbet_readiness_profile_snapshot
        target: /var/lib/fetanagent/kemerbet-sessions
      - type: bind
        source: /etc/fetanagent/executor-config/kemerbet-selector-contract.v2.json
        target: /etc/fetanagent/kemerbet-selector-contract.v2.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /run/fetanagent-kemerbet-readiness-rpc-v1/browser-capability
        target: /run/secrets/kemerbet_readiness_browser_rpc_capability
        read_only: true
        bind:
          create_host_path: false
      - type: bind
