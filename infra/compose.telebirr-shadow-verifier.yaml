name: fetanagent-telebirr-shadow-verifier

# This service is absent from ordinary `docker compose up`. Its exact dry-run and live-gate-off
# environment is part of the no-money boundary. Only the isolated shadow observer is enabled. It
# publishes no port and receives work only from PostgreSQL staging.
services:
  telebirr-shadow-verifier:
    profiles: [telebirr-shadow-verifier]
    platform: linux/amd64
    image: ${FETANAGENT_TELEBIRR_SHADOW_VERIFIER_IMAGE_ID:?set the release-recorded sha256 image ID}
    pull_policy: never
    init: true
    user: '10001:10001'
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.50
    stop_signal: SIGTERM
    stop_grace_period: 20s
    deploy:
      replicas: 1
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    environment:
      NODE_ENV: production
      FINANCIAL_ACTIONS_MODE: dry_run
      INTERNAL_TELEBIRR_SHADOW_VERIFIER_ENABLED: 'true'
      TELEBIRR_SHADOW_VERIFICATION_ENABLED: 'true'
      TRUSTED_TELEBIRR_PRIVATE_LIVE_PILOT_ENABLED: 'false'
      KEMERBET_PRIVATE_LIVE_DEPOSIT_PILOT_ENABLED: 'false'
      TELEBIRR_SHADOW_VERIFIER_DEPLOYMENT_TARGET: staging
      TELEBIRR_SHADOW_VERIFIER_DATABASE_URL_FILE: /run/secrets/telebirr_shadow_verifier_database_url
      TELEBIRR_SHADOW_VERIFIER_PIN_MANIFEST_FILE: /run/configs/telebirr_shadow_verifier_pins.v1.json
      NODE_EXTRA_CA_CERTS: /run/configs/supabase_ca_certificate
      HTTP_PROXY: ''
      http_proxy: ''
      HTTPS_PROXY: ''
      https_proxy: ''
      NO_PROXY: ''
      no_proxy: ''
      FTP_PROXY: ''
      ftp_proxy: ''
      ALL_PROXY: ''
      all_proxy: ''
    secrets:
      - source: telebirr_shadow_verifier_database_url
        target: telebirr_shadow_verifier_database_url
        uid: '10001'
        gid: '10001'
        mode: 0400
    configs:
      - source: telebirr_shadow_verifier_pins
        target: /run/configs/telebirr_shadow_verifier_pins.v1.json
        uid: '10001'
        gid: '10001'
        mode: 0444
      - source: telebirr_shadow_verifier_supabase_ca
        target: /run/configs/supabase_ca_certificate
        uid: '10001'
        gid: '10001'
        mode: 0444
    networks:
      - telebirr_shadow_verifier_egress
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8092/readyz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

secrets:
  telebirr_shadow_verifier_database_url:
    file: ${FETANAGENT_TELEBIRR_SHADOW_VERIFIER_DATABASE_URL_SECRET_FILE:?set the root-managed short-lived shadow runtime database URL file}

configs:
  telebirr_shadow_verifier_pins:
    file: ${FETANAGENT_TELEBIRR_SHADOW_VERIFIER_PIN_MANIFEST_CONFIG_FILE:?set the reviewed public-key pin manifest file}
  telebirr_shadow_verifier_supabase_ca:
    file: ${FETANAGENT_TELEBIRR_SHADOW_VERIFIER_SUPABASE_CA_CONFIG_FILE:?set the reviewed Supabase CA file}

networks:
  telebirr_shadow_verifier_egress:
    driver: bridge
    enable_ipv6: true
    internal: false
    attachable: false
